<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="live">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Global Carbon Cycle (IB ESS 2.3 SL)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./ess-viewer.css">
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-l">
      <span class="hd-badge">Topic 2.3 · SL</span>
      <h1 class="hd-title">The Global Carbon Cycle (Stores &amp; Fluxes)</h1>
    </div>
    <div class="tb">
      <button type="button" id="btn-theme" aria-pressed="false">Dark</button>
      <button type="button" id="btn-motion" aria-pressed="true">Live</button>
      <button type="button" id="btn-export">Export SVG</button>
    </div>
  </header>

  <div class="ctrl-bar" data-forview="carb">
    <div class="ctrl-grp">
      <label>System State:</label>
      <button type="button" class="ctrl-btn on" data-cstate="human">Human Disruption (Anthropocene)</button>
      <button type="button" class="ctrl-btn" data-cstate="pre">Pre-Industrial Equilibrium</button>
    </div>
    <span class="ctrl-read" id="carb-read">Human Disruption: +11.0 GtC/yr emitted -> +4.5 Atmos, +4.2 Land Sink, +2.3 Ocean Sink</span>
  </div>

  <main class="stage" id="stage">
    <svg class="esvg" data-view="carb" viewBox="0 0 920 410" role="img" aria-label="ESS 2.3 Global Carbon Cycle Proportional Stores, Natural Flows, Transformations, and Human Disruption">
      <defs>
        <marker id="ma-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--accent)"/>
        </marker>
        <marker id="ma-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--blue)"/>
        </marker>
        <marker id="ma-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--red)"/>
        </marker>
        <marker id="ma-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--amber)"/>
        </marker>
      </defs>
      <g class="vp">
        <rect x="20" y="16" width="880" height="338" rx="14" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.45"/>
        <text x="460" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">GLOBAL CARBON CYCLE (Closed System for Matter: Stores in GtC, Flows in GtC/yr, T = Transformation)</text>

        <g data-tip="atmos">
          <rect x="330" y="44" width="260" height="56" rx="28" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2.4"/>
          <text x="460" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">Atmosphere (CO2 &amp; CH4)</text>
          <text id="lbl-atm" x="460" y="86" text-anchor="middle" font-size="12.2" font-weight="700" fill="var(--ink)">880 GtC (+4.5 GtC/yr rising)</text>
        </g>

        <g data-tip="biota">
          <rect x="92" y="144" width="166" height="58" rx="10" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="2.4"/>
          <text x="175" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">Land Biota (Forests)</text>
          <text x="175" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">610 GtC</text>
        </g>

        <g data-tip="soil">
          <rect x="266" y="218" width="184" height="60" rx="8" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.2"/>
          <text x="358" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="var(--amber)">Soils &amp; Permafrost</text>
          <text x="358" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">1,580 GtC</text>
        </g>

        <g data-tip="surf_ocean">
          <rect x="572" y="138" width="214" height="68" rx="10" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2.4"/>
          <text x="679" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="var(--blue)">Surface Oceans (0-100 m)</text>
          <text x="679" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">970 GtC</text>
          <text id="lbl-ph" x="679" y="195" text-anchor="middle" font-size="10.8" font-weight="700" fill="var(--red)">pH 8.1 (Ocean acidification)</text>
        </g>

        <g data-tip="deep_ocean">
          <rect x="558" y="232" width="244" height="72" rx="10" fill="var(--warm)" stroke="var(--blue)" stroke-width="2.6"/>
          <text x="680" y="256" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--blue)">Deep Oceans (Huge Sink)</text>
          <text x="680" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">38,000 GtC</text>
          <text x="680" y="293" text-anchor="middle" font-size="10.5" fill="var(--muted)">Slow mixing (~1,000 yr)</text>
        </g>

        <g data-tip="fossil">
          <rect x="58" y="274" width="184" height="58" rx="6" fill="var(--warm)" stroke="var(--ink)" stroke-width="2.2"/>
          <text x="150" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">Fossil Fuels (Coal/Oil/Gas)</text>
          <text x="150" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="var(--red)">~4,000 GtC (Locked store)</text>
        </g>

        <g data-tip="rocks">
          <rect x="276" y="302" width="256" height="42" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.4"/>
          <text x="404" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Sedimentary Rocks &amp; Limestone</text>
          <text x="404" y="336" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">1,000,000+ GtC (Largest Store)</text>
        </g>

        <g data-tip="photo">
          <path class="flow-anim" d="M332,78 C222,86 184,108 168,140" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#ma-g)"/>
          <circle cx="236" cy="94" r="10" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="1.8"/>
          <text x="236" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--accent)">T</text>
          <text x="166" y="108" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)">Photosynthesis</text>
          <text x="166" y="122" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">110 GtC/yr IN</text>
        </g>

        <g data-tip="resp">
          <path class="flow-anim" d="M230,144 C260,120 296,104 344,96" fill="none" stroke="var(--accent2)" stroke-width="2.4" marker-end="url(#ma-g)"/>
          <text x="268" y="130" font-size="10.8" font-weight="700" fill="var(--accent2)">Plant Resp. 50</text>
          <path class="flow-anim" d="M196,204 L262,236" fill="none" stroke="var(--amber)" stroke-width="2.4" marker-end="url(#ma-a)"/>
          <text x="196" y="232" font-size="10.5" font-weight="700" fill="var(--amber)">Litter 60</text>
          <path class="flow-anim" d="M372,216 C388,172 414,136 434,104" fill="none" stroke="var(--amber)" stroke-width="2.4" marker-end="url(#ma-a)"/>
          <circle cx="400" cy="166" r="10" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.8"/>
          <text x="400" y="170" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--amber)">T</text>
          <text x="424" y="168" font-size="10.8" font-weight="700" fill="var(--amber)">Soil Resp. 59.4</text>
        </g>

        <g data-tip="ocean_ex">
          <path class="flow-anim" d="M584,82 C642,92 664,110 670,134" fill="none" stroke="var(--blue)" stroke-width="2.6" marker-end="url(#ma-b)"/>
          <path class="flow-anim" d="M690,136 C686,110 650,90 596,74" fill="none" stroke="var(--blue)" stroke-width="2.4" marker-end="url(#ma-b)"/>
          <text id="lbl-ocex" x="722" y="96" font-size="11" font-weight="700" fill="var(--blue)">Dissolve 92.3 / Outgas 90</text>
          <text id="lbl-ocnet" x="722" y="110" font-size="10.5" font-weight="700" fill="var(--red)">+2.3 Net Sink (pH dropping)</text>

          <path class="flow-anim" d="M679,208 L679,228" fill="none" stroke="var(--blue)" stroke-width="2.4" marker-end="url(#ma-b)"/>
          <text x="692" y="220" text-anchor="start" font-size="10.5" fill="var(--muted)">Downwelling / Biopump</text>

          <path class="flow-anim" d="M452,248 L568,184" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ma-b)"/>
          <text x="502" y="218" font-size="10" fill="var(--muted)">Runoff 0.6</text>

          <path d="M556,284 L534,318" fill="none" stroke="var(--ink)" stroke-width="1.8" marker-end="url(#ma-b)"/>
          <text x="530" y="280" text-anchor="end" font-size="10" fill="var(--muted)">Shells -> Chalk</text>
        </g>

        <g id="human-flows" data-tip="human">
          <path class="flow-anim" d="M66,274 C32,174 36,64 326,56" fill="none" stroke="var(--red)" stroke-width="3.6" marker-end="url(#ma-r)"/>
          <circle cx="44" cy="136" r="10" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2"/>
          <text x="44" y="140" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--red)">T</text>
          <text x="38" y="48" font-size="11.5" font-weight="800" fill="var(--red)">Fossil Fuel Burning: +9.5 GtC/yr</text>

          <path class="flow-anim" d="M260,178 C312,172 346,142 372,104" fill="none" stroke="var(--red)" stroke-width="2.8" marker-end="url(#ma-r)"/>
          <text x="278" y="182" font-size="10.8" font-weight="800" fill="var(--red)">Deforestation +1.5</text>
        </g>
      </g>
    </svg>

    <div class="legend">
      <span class="leg-i"><span class="leg-sw" style="background:var(--accent)"></span>Biotic flux</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--blue)"></span>Ocean flux</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--amber)"></span>Soil flux</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--red)"></span>Human disruption</span>
    </div>

    <div class="zoom-bar">
      <button type="button" id="z-out" aria-label="Zoom out">-</button>
      <span id="z-lbl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div>
  </main>

  <footer class="insp" id="insp" aria-live="polite"></footer>
</div>

<script src="./ess-viewer.js"></script>
<script>
(function () {
  var btns = document.querySelectorAll('[data-cstate]');
  var hf = document.getElementById('human-flows');
  var lblAtm = document.getElementById('lbl-atm');
  var lblPh = document.getElementById('lbl-ph');
  var lblOcEx = document.getElementById('lbl-ocex');
  var lblOcNet = document.getElementById('lbl-ocnet');
  var carbRead = document.getElementById('carb-read');

  function setState(st) {
    btns.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-cstate') === st); });
    var isPre = st === 'pre';
    hf.style.display = isPre ? 'none' : '';
    if (isPre) {
      lblAtm.textContent = '590 GtC (0.0 GtC/yr balanced)';
      lblPh.textContent = 'pH 8.2 (Pre-industrial steady state)';
      lblPh.setAttribute('fill', 'var(--blue)');
      lblOcEx.textContent = 'Dissolve 90 / Outgas 90';
      lblOcNet.textContent = '0.0 Net (Natural equilibrium)';
      lblOcNet.setAttribute('fill', 'var(--accent)');
      carbRead.textContent = 'Natural Equilibrium: 110 IN = 50 + 59.4 + 0.6 OUT | Ocean pH 8.2';
    } else {
      lblAtm.textContent = '880 GtC (+4.5 GtC/yr rising)';
      lblPh.textContent = 'pH 8.1 (Ocean acidification)';
      lblPh.setAttribute('fill', 'var(--red)');
      lblOcEx.textContent = 'Dissolve 92.3 / Outgas 90';
      lblOcNet.textContent = '+2.3 Net Sink (pH dropping)';
      lblOcNet.setAttribute('fill', 'var(--red)');
      carbRead.textContent = 'Human Disruption: +11.0 GtC/yr emitted -> +4.5 Atmos, +4.2 Land Sink, +2.3 Ocean Sink';
    }
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () { setState(b.getAttribute('data-cstate')); });
  });

  window.initEssDiagram({
    slug: 'carbon-cycle',
    defaultView: 'carb',
    defaultTip: 'atmos',
    tips: {
      atmos: {
        code: 'Store · 880 GtC',
        title: 'Atmosphere (CO2 & CH4)',
        body: 'Fast-turnover atmospheric pool. Pre-industrial CO2 sat near 280 ppm (590 GtC) in dynamic equilibrium; fossil fuel burning and land clearing lifted it past 420 ppm (>880 GtC).',
        exam: 'Notice land + ocean sinks absorb ~6.5 GtC/yr, leaving ~4.5 GtC/yr piling up in air.'
      },
      biota: {
        code: 'Store · 610 GtC',
        title: 'Terrestrial Biota (Forests & Plants)',
        body: 'Carbon stored as cellulose and wood. Tropical forests hold huge above-ground biomass, while clearing them releases CO2 fast and shrinks future uptake.',
        exam: 'Reforestation acts as a carbon sink; deforestation acts as a carbon source.'
      },
      soil: {
        code: 'Store · 1,580 GtC',
        title: 'Soils, Humus & Permafrost',
        body: 'Holds more than double the carbon of living land plants. Warming Arctic permafrost melts and decomposes, releasing CO2 and methane in a positive feedback loop.',
        exam: 'Permafrost thaw is a classic positive climate feedback example for Paper 2.'
      },
      surf_ocean: {
        code: 'Store · 970 GtC',
        title: 'Surface Oceans & Ocean Acidification',
        body: 'Absorbs ~25% of human CO2 emissions. Extra dissolved CO2 forms carbonic acid (CO2 + H2O -> H2CO3), cutting pH from ~8.2 to ~8.1 (~30% more H+ ions) and starving calcifying corals/shellfish of carbonate.',
        exam: 'Write the CO2 + H2O -> H2CO3 acidification reaction and link lower carbonate to weaker shells.'
      },
      deep_ocean: {
        code: 'Store · 38,000 GtC',
        title: 'Deep Oceans (Biological & Physical Pump)',
        body: 'Cold dense water sinking and dead marine organisms raining downward lock dissolved carbon away for centuries to ~1,000 years.',
        exam: 'Deep oceans hold nearly 45x more carbon than the atmosphere, buffering warming slowly.'
      },
      fossil: {
        code: 'Store · ~4,000 GtC',
        title: 'Fossil Fuels (Coal, Oil, Natural Gas)',
        body: 'Organic carbon locked underground over hundreds of millions of years. Human extraction burns in ~100 years what geological burial took ~100 million years to sequester.',
        exam: 'Burning fossil fuels moves SLOW geological carbon straight into the FAST atmosphere cycle.'
      },
      rocks: {
        code: 'Store · 10^6 GtC',
        title: 'Sedimentary Rocks (Limestone & Chalk)',
        body: 'Earth largest carbon reservoir (~1,000,000+ GtC), formed from marine CaCO3 shells and skeletons compressed on the ocean floor.',
        exam: 'If asked for the largest global carbon store, name sedimentary carbonate rocks.'
      },
      photo: {
        code: 'T · 110 GtC/yr',
        title: 'Photosynthesis (Transformation)',
        body: 'Plants and phytoplankton transform inorganic CO2 and water into organic glucose using sunlight energy.',
        exam: 'Photosynthesis and respiration are TRANSFORMATIONS (chemical change), not transfers.'
      },
      resp: {
        code: 'T · 50 + 59.4',
        title: 'Cellular Respiration & Decomposition',
        body: 'Plants, animals, and soil microbes oxidize organic carbon back to atmospheric CO2. Notice pre-industrial land fluxes balanced: 110 IN = 50 + 59.4 + 0.6 river runoff.',
        exam: 'Always label T (Transformation) on arrows that change carbon chemical form.'
      },
      ocean_ex: {
        code: 'Transfer · 90↔92',
        title: 'Air-Sea Gas Exchange & Sedimentation',
        body: 'CO2 constantly diffuses both ways between air and sea surface. Cold polar water dissolves more CO2; warm tropical water outgasses it.',
        exam: 'Warmer oceans hold LESS dissolved gas (negative solubility = positive climate feedback).'
      },
      human: {
        code: '+11 GtC/yr',
        title: 'Combustion & Land-Use Disruption',
        body: 'Fossil fuel combustion (+9.5 GtC/yr) plus deforestation and cement (+1.5 GtC/yr) break long-term equilibrium, raising atmospheric radiative forcing and ocean acidity.',
        exam: 'Contrast fast biotic fluxes with anthropogenic release from geological fossil stores.'
      }
    }
  });
})();
</script>
</body>
</html>
