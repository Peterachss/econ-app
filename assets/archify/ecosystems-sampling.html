<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="live">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Population Curves, Sampling &amp; Lincoln Index (IB ESS 2.1 SL)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./ess-viewer.css">
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-l">
      <span class="hd-badge">Topic 2.1 · SL</span>
      <h1 class="hd-title">Populations, Sampling &amp; Lincoln Index</h1>
    </div>
    <div class="vtabs" role="tablist">
      <button type="button" class="on" data-vtab="curves">1. J-Curve vs S-Curve (K)</button>
      <button type="button" data-vtab="samp">2. Quadrats, Transect &amp; Lincoln</button>
    </div>
    <div class="tb">
      <button type="button" id="btn-theme" aria-pressed="false">Dark</button>
      <button type="button" id="btn-motion" aria-pressed="true">Live</button>
      <button type="button" id="btn-export">Export SVG</button>
    </div>
  </header>

  <div class="ctrl-bar" data-forview="curves">
    <div class="ctrl-grp">
      <label for="k-rng">Carrying capacity (K):</label>
      <input type="range" id="k-rng" min="250" max="850" step="25" value="600">
      <output id="k-out">600</output>
    </div>
    <span class="ctrl-read">Logistic S-curve stabilizes via negative feedback around K</span>
  </div>

  <div class="ctrl-bar" data-forview="samp" hidden>
    <div class="ctrl-grp">
      <label for="l-n1">n1:</label><input type="range" id="l-n1" min="20" max="150" step="5" value="80"><output id="lo-n1">80</output>
      <label for="l-n2">n2:</label><input type="range" id="l-n2" min="20" max="150" step="5" value="65"><output id="lo-n2">65</output>
      <label for="l-m2">m2:</label><input type="range" id="l-m2" min="5" max="60" step="1" value="20"><output id="lo-m2">20</output>
    </div>
    <button type="button" class="ctrl-btn" id="l-bias">Simulate visible-mark predation (lower m2)</button>
    <span class="ctrl-read" id="lincoln-read">Estimated N = 260 individuals</span>
  </div>

  <main class="stage" id="stage">
    <svg class="esvg" data-view="curves" viewBox="0 0 920 400" role="img" aria-label="J-curve Exponential vs S-curve Logistic Growth Graph">
      <defs>
        <marker id="c-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--ink)"/>
        </marker>
      </defs>
      <g class="vp">
        <line x1="95" y1="340" x2="860" y2="340" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#c-arr)"/>
        <line x1="95" y1="340" x2="95" y2="32" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#c-arr)"/>
        <text x="480" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Time (Generations)</text>
        <text x="46" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" transform="rotate(-90 46 190)">Population Size (N)</text>

        <line x1="95" y1="265" x2="845" y2="265" stroke="var(--line)" stroke-width="1"/>
        <line x1="95" y1="190" x2="845" y2="190" stroke="var(--line)" stroke-width="1"/>
        <line x1="95" y1="115" x2="845" y2="115" stroke="var(--line)" stroke-width="1"/>
        <text x="86" y="344" text-anchor="end" font-size="11" fill="var(--muted)">0</text>
        <text x="86" y="269" text-anchor="end" font-size="11" fill="var(--muted)">250</text>
        <text x="86" y="194" text-anchor="end" font-size="11" fill="var(--muted)">500</text>
        <text x="86" y="119" text-anchor="end" font-size="11" fill="var(--muted)">750</text>
        <text x="86" y="54" text-anchor="end" font-size="11" fill="var(--muted)">1,000</text>

        <g id="k-line" data-tip="k_cap">
          <line x1="95" y1="160" x2="845" y2="160" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="8 6"/>
          <rect x="650" y="138" width="186" height="22" rx="11" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="1"/>
          <text x="743" y="153" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent)">Carrying Capacity (K = 600)</text>
        </g>

        <path id="j-path" class="flow-anim" d="" fill="none" stroke="var(--red)" stroke-width="3" data-tip="j_curve"/>
        <text id="j-lbl" x="345" y="66" font-size="12" font-weight="700" fill="var(--red)" data-tip="j_curve">J-Curve (Exponential overshoot -&gt; crash)</text>

        <path id="s-path" d="" fill="none" stroke="var(--accent2)" stroke-width="3.6" stroke-linecap="round" data-tip="s_curve"/>
        <text id="s-lbl" x="595" y="196" font-size="12" font-weight="700" fill="var(--accent)" data-tip="s_curve">S-Curve (Logistic equilibrium)</text>

        <g data-tip="env_res">
          <rect x="122" y="44" width="188" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
          <text x="134" y="64" font-size="11.5" font-weight="700" fill="var(--ink)">Density-Dependent Limits</text>
          <text x="134" y="81" font-size="10.5" fill="var(--muted)">Competition, disease &amp; predation</text>
          <text x="134" y="95" font-size="10.5" fill="var(--muted)">pull S-curve down toward K</text>
        </g>
      </g>
    </svg>

    <svg class="esvg" data-view="samp" viewBox="0 0 920 400" hidden role="img" aria-label="Quadrat Grid, Belt Transect Gradient, and Lincoln Index Diagram">
      <defs>
        <linearGradient id="grad-env" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fef3c7"/>
          <stop offset="100%" stop-color="#bae6fd"/>
        </linearGradient>
        <marker id="ln-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--accent)"/>
        </marker>
      </defs>
      <g class="vp">
        <g data-tip="quadrat">
          <rect x="28" y="28" width="265" height="332" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
          <text x="160" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--accent)">Random Quadrat (1 m2 Grid)</text>
          <text x="160" y="72" text-anchor="middle" font-size="10.5" fill="var(--muted)">Stationary plants &amp; limpets (Uniform habitat)</text>
          <g id="q-grid" transform="translate(65,92)"></g>
          <text x="160" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Density = Total Count / Total Area</text>
          <text x="160" y="326" text-anchor="middle" font-size="10.5" fill="var(--muted)">Also measures % Cover &amp; % Frequency</text>
        </g>

        <g data-tip="transect">
          <rect x="312" y="28" width="290" height="332" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
          <text x="457" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--blue)">Belt Transect (Systematic)</text>
          <text x="457" y="72" text-anchor="middle" font-size="10.5" fill="var(--muted)">Samples zonation along abiotic gradient</text>

          <rect x="334" y="102" width="246" height="44" rx="6" fill="url(#grad-env)" stroke="var(--line)" stroke-width="1.2"/>
          <text x="342" y="121" font-size="10" font-weight="700" fill="#b45309">0 m · Sunny / Dry</text>
          <text x="572" y="121" text-anchor="end" font-size="10" font-weight="700" fill="#1d4ed8">15 m · Shade / Moist</text>

          <line x1="338" y1="184" x2="576" y2="184" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 4"/>
          <rect x="344" y="164" width="34" height="40" fill="var(--green-bg)" fill-opacity="0.7" stroke="var(--accent)" stroke-width="1.8"/>
          <rect x="394" y="164" width="34" height="40" fill="var(--green-bg)" fill-opacity="0.7" stroke="var(--accent)" stroke-width="1.8"/>
          <rect x="444" y="164" width="34" height="40" fill="var(--green-bg)" fill-opacity="0.7" stroke="var(--accent)" stroke-width="1.8"/>
          <rect x="494" y="164" width="34" height="40" fill="var(--green-bg)" fill-opacity="0.7" stroke="var(--accent)" stroke-width="1.8"/>
          <rect x="540" y="164" width="34" height="40" fill="var(--green-bg)" fill-opacity="0.7" stroke="var(--accent)" stroke-width="1.8"/>
          <circle cx="361" cy="184" r="7" fill="#b45309"/>
          <circle cx="411" cy="184" r="5" fill="#b45309"/>
          <polygon points="461,174 470,194 452,194" fill="#15803d"/>
          <polygon points="511,172 522,196 500,196" fill="#15803d"/>
          <polygon points="557,172 568,196 546,196" fill="#15803d"/>

          <text x="457" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">Record BOTH species + abiotic values</text>
          <text x="457" y="266" text-anchor="middle" font-size="10.5" fill="var(--muted)">(Light, soil moisture, temperature, pH)</text>
          <text x="457" y="302" text-anchor="middle" font-size="10.5" fill="var(--blue)">Tennis court lab: Chickpeas vs Beans along gradient</text>
        </g>

        <g data-tip="lincoln">
          <rect x="620" y="28" width="272" height="332" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
          <text x="756" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--accent)">Lincoln Index (Mobile Animals)</text>
          <text x="756" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">N = (n1 x n2) / m2</text>

          <circle cx="756" cy="184" r="76" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 4"/>
          <circle cx="756" cy="108" r="24" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="2"/>
          <text x="756" y="106" text-anchor="middle" font-size="11" font-weight="800" fill="var(--accent)">1. n1</text>
          <text x="756" y="119" text-anchor="middle" font-size="9.5" fill="var(--ink)">Mark &amp; release</text>

          <circle cx="832" cy="184" r="24" fill="var(--warm)" stroke="var(--ink)" stroke-width="1.6"/>
          <text x="832" y="182" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">Mix</text>
          <text x="832" y="194" text-anchor="middle" font-size="9" fill="var(--muted)">Randomly</text>

          <circle cx="756" cy="260" r="24" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2"/>
          <text x="756" y="258" text-anchor="middle" font-size="11" font-weight="800" fill="var(--blue)">2. n2</text>
          <text x="756" y="271" text-anchor="middle" font-size="9.5" fill="var(--ink)">Recapture m2</text>

          <path class="flow-anim" d="M782,114 Q822,126 830,158" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#ln-arr)"/>
          <path class="flow-anim" d="M830,210 Q820,244 782,254" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#ln-arr)"/>

          <text x="756" y="180" text-anchor="middle" font-size="11" fill="var(--muted)">Est. Pop N</text>
          <text id="lin-svg-n" x="756" y="200" text-anchor="middle" font-size="20" font-weight="800" fill="var(--accent)">260</text>
          <text id="lin-svg-bias" x="756" y="318" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">Assumes closed pop &amp; harmless marks</text>
        </g>
      </g>
    </svg>

    <div class="zoom-bar">
      <button type="button" id="z-out" aria-label="Zoom out">-</button>
      <span id="z-lbl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div>
  </main>
  <footer class="insp" id="insp" aria-live="polite"></footer>
</div>

<script src="./ess-viewer.js"></script>
<script>
  (function () {
    var g = document.getElementById('q-grid');
    var size = 190, step = 19;
    var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', size); r.setAttribute('height', size);
    r.setAttribute('fill', 'var(--warm)'); r.setAttribute('stroke', 'var(--accent)'); r.setAttribute('stroke-width', '2');
    g.appendChild(r);
    for (var i = 1; i < 10; i++) {
      var v = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      v.setAttribute('x1', i * step); v.setAttribute('y1', 0); v.setAttribute('x2', i * step); v.setAttribute('y2', size);
      v.setAttribute('stroke', 'var(--line)'); v.setAttribute('stroke-width', '1');
      g.appendChild(v);
      var h = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      h.setAttribute('x1', 0); h.setAttribute('y1', i * step); h.setAttribute('x2', size); h.setAttribute('y2', i * step);
      h.setAttribute('stroke', 'var(--line)'); h.setAttribute('stroke-width', '1');
      g.appendChild(h);
    }
    [[2,3],[4,2],[4,3],[6,7],[7,7],[7,8],[2,8],[8,4]].forEach(function (pt) {
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pt[0] * step - 9); c.setAttribute('cy', pt[1] * step - 9); c.setAttribute('r', '6');
      c.setAttribute('fill', '#15803d');
      g.appendChild(c);
    });
  })();

  var kRng = document.getElementById('k-rng');
  var kOut = document.getElementById('k-out');
  function drawCurves() {
    var K = +kRng.value;
    kOut.textContent = K;
    var yOf = function (N) { return 340 - (N / 1000) * 300; };
    var ky = yOf(K);
    var kl = document.getElementById('k-line');
    kl.querySelector('line').setAttribute('y1', ky);
    kl.querySelector('line').setAttribute('y2', ky);
    kl.querySelector('rect').setAttribute('y', ky - 22);
    kl.querySelector('text').setAttribute('y', ky - 7);
    kl.querySelector('text').textContent = 'Carrying Capacity (K = ' + K + ')';

    var sPts = [];
    for (var i = 0; i <= 75; i++) {
      var x = 95 + i * 10;
      var t = i / 12;
      var base = K / (1 + Math.exp(-1.25 * (t - 2.3)));
      var osc = t > 3.2 ? Math.sin((t - 3.2) * 3.1) * 28 * Math.exp(-(t - 3.2) * 0.35) : 0;
      sPts.push((i === 0 ? 'M ' : ' L ') + x + ',' + yOf(base + osc).toFixed(1));
    }
    document.getElementById('s-path').setAttribute('d', sPts.join(''));
    document.getElementById('s-lbl').setAttribute('y', Math.min(325, ky + 36));

    var jPts = [];
    for (var i2 = 0; i2 <= 42; i2++) {
      var x2 = 95 + i2 * 10;
      var val;
      if (i2 <= 28) {
        val = 30 * Math.pow(1.132, i2);
      } else {
        var crash = (i2 - 28) / 14;
        val = 960 * Math.exp(-crash * 1.9);
      }
      jPts.push((i2 === 0 ? 'M ' : ' L ') + x2 + ',' + yOf(Math.min(970, val)).toFixed(1));
    }
    document.getElementById('j-path').setAttribute('d', jPts.join(''));
  }
  kRng.addEventListener('input', drawCurves);
  drawCurves();

  var lN1 = document.getElementById('l-n1'), lN2 = document.getElementById('l-n2'), lM2 = document.getElementById('l-m2');
  var biasOn = false;
  function updateLincoln() {
    var n1 = +lN1.value, n2 = +lN2.value, m2 = +lM2.value;
    document.getElementById('lo-n1').textContent = n1;
    document.getElementById('lo-n2').textContent = n2;
    document.getElementById('lo-m2').textContent = m2;
    var est = Math.round((n1 * n2) / Math.max(1, m2));
    document.getElementById('lin-svg-n').textContent = est;
    document.getElementById('lincoln-read').textContent = 'N = (' + n1 + ' x ' + n2 + ') / ' + m2 + ' = ' + est + ' individuals';
    var biasTxt = document.getElementById('lin-svg-bias');
    biasTxt.textContent = biasOn ? 'BIAS: Smaller m2 OVERESTIMATES true N!' : 'Assumes closed pop & harmless marks';
    biasTxt.setAttribute('fill', biasOn ? 'var(--red)' : 'var(--muted)');
  }
  [lN1, lN2, lM2].forEach(function (inp) {
    inp.addEventListener('input', function () { biasOn = false; document.getElementById('l-bias').classList.remove('on'); updateLincoln(); });
  });
  document.getElementById('l-bias').addEventListener('click', function () {
    biasOn = !biasOn;
    this.classList.toggle('on', biasOn);
    lM2.value = biasOn ? Math.max(5, Math.round(+lM2.value * 0.5)) : 20;
    updateLincoln();
  });
  updateLincoln();

  initEssDiagram({
    slug: 'ecosystems-sampling',
    defaultView: 'curves',
    viewDefaults: { curves: 's_curve', samp: 'lincoln' },
    tips: {
      k_cap: {
        code: '2.1.10',
        title: 'Carrying Capacity (K)',
        body: 'The maximum population size of a species that a given environment can sustainably support over time without habitat degradation.',
        exam: 'Human carrying capacity is hard to pinpoint due to changing technology, imports, and lifestyle footprints (2.1.14).'
      },
      s_curve: {
        code: '2.1.11 / 2.1.12',
        title: 'S-Curve (Logistic Growth & Negative Feedback)',
        body: 'Starts slowly (lag), grows rapidly, then decelerates as density-dependent limiting factors resist growth and stabilize population around K.',
        exam: 'Populations oscillate slightly around K because of time lags in negative feedback.'
      },
      j_curve: {
        code: '2.1.12',
        title: 'J-Curve (Exponential Growth & Crash)',
        body: 'Occurs when resources are temporarily unlimited (e.g. algal blooms or locusts). Often overshoots carrying capacity and crashes sharply when resources run out.',
        exam: 'Reindeer on St. Matthew Island are a classic IB ESS J-curve crash example.'
      },
      env_res: {
        code: '2.1.11',
        title: 'Density-Dependent Limiting Factors',
        body: 'Competition for food/space, parasitism, disease, and predation intensify as population density rises, slowing birth rates and raising death rates.',
        exam: 'Contrast with density-independent abiotic shocks like floods or volcanic eruptions.'
      },
      quadrat: {
        code: '2.1.15 / 2.1.16',
        title: 'Random Quadrat Sampling (Non-Motile Organisms)',
        body: 'Use random coordinates on a grid to estimate population density, percentage cover, or percentage frequency of stationary plants and slow invertebrates.',
        exam: 'Quadrats CANNOT measure fast-moving animals (fish, beetles, birds).'
      },
      transect: {
        code: '2.1.15 / 2.5.2',
        title: 'Belt Transect Along an Environmental Gradient',
        body: 'Samples systematically at intervals across a changing abiotic gradient (e.g. sunny dry court to shaded moist river), measuring species and abiotic variables together.',
        exam: 'Belt transects produce kite diagrams showing spatial zonation (2.5.1-2.5.2).'
      },
      lincoln: {
        code: '2.1.17',
        title: 'Lincoln Index (Capture-Mark-Recapture)',
        body: 'Estimates mobile animal population N = (n1 x n2) / m2. Requires closed population (no births/deaths/migration), non-harmful persistent marks, and random mixing.',
        exam: 'If marks make prey visible to birds or wash off, m2 shrinks, so N is OVERESTIMATED.'
      }
    }
  });
</script>
</body>
</html>
