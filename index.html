{h:'Merit goods and the mask example',html:'<p>Masks protect the wearer and third parties from infection, so consumption creates external benefits. People may undervalue the benefit (information failure), so the free market under-provides them. Merit goods are a normative idea: it is a value judgement that the good is good for people.</p>'}],
q:'Explain why merit goods are under-consumed in a free market. [4]',a:'Consumers underestimate the private benefits (information failure), and the consumption creates positive externalities. Marginal social benefit exceeds marginal private benefit, so the market quantity is below the socially optimal quantity and there is a welfare loss, shown on an MSB/MPB diagram.'});

add({id:'asym',unit:'Unit 2 · Microeconomics',title:'Asymmetric information',hl:true,
what:'Asymmetric information occurs when one party in a transaction has significantly more or better information than the other. It prevents the market from reaching an efficient allocation of resources.',
notes:[{h:'Two problems',html:tbl(['','Adverse selection','Moral hazard'],[['When','Before the contract (hidden characteristics)','After the contract (hidden actions)'],['Problem','The uninformed party cannot tell good from bad, so the price reflects average quality and good sellers leave','One party takes more risk because the other bears the cost'],['Example','Used car "lemons"; unhealthy people buying health insurance','Insured homeowner less careful; banks "too big to fail" take bigger risks'],['Memory aid','Ahead of the deal','Mid-contract behaviour']])},
{h:'The lemon problem step by step',html:'<p>The seller knows the car\'s true quality; the buyer does not. The buyer only pays a price for average quality. Sellers of high-quality cars withdraw. Eventually only lemons remain and the market breaks down (Akerlof, 1970).</p>'},
{h:'Solutions',html:tbl(['Type','Who acts','Examples'],[['Signalling','Informed party','Long warranty on a used car; qualifications such as the IB Diploma'],['Screening','Uninformed party','Insurance deductible (excess); CVs, references and background checks'],['Regulation','Government','Minimum quality standards, compulsory insurance, mandatory disclosure, consumer protection laws'],['Provision of information','Government','Free public credit ratings and property data']])}],
q:'Explain how adverse selection can cause a health insurance market to collapse. [4]',a:'Insurers cannot observe individual health risk, so they set premiums based on average risk. Healthy, low-risk people find this too expensive and do not buy, leaving mainly high-risk people. Claims rise, so premiums rise again, driving out more low-risk customers, and the market can collapse.'});

add({id:'equity',unit:'Unit 2 · Microeconomics',title:'The market\'s inability to achieve equity',hl:true,
what:'Markets allocate resources according to ability to pay, not need, so a free market can produce very unequal outcomes even where it is efficient.',
notes:[{h:'The argument',html:'<p>Free markets reward those with valuable skills or assets and can leave others with little. Strong institutions (laws, property rights, regulation) are needed to limit the excesses of the free market and promote development.</p>'},
{h:'Negative externalities of unrestrained growth',html:'<p>Rapid growth with little regulation, as in parts of China, causes air and water pollution. This is a negative externality: social costs exceed private costs, so output is higher than the socially optimal level and there is a welfare loss (see the negative externality diagram).</p>'},
{h:'Market and intervention together',html:'<p>Living standards are often improved most by a mixture of free markets for efficiency and government intervention for equity and sustainability (progressive taxes, transfers, public provision of education and healthcare).</p>'},
{h:'Evaluating',html:'<p>Equity is normative, so views differ. Intervention can reduce incentives and cause government failure, while no intervention can leave a growing underclass. Use the Lorenz curve and Gini coefficient as evidence.</p>'}],
q:'Explain why high levels of air and water pollution represent a negative externality of unregulated growth. [4]',a:'Firms ignore the cost of pollution to third parties, so private costs are below social costs. The market produces more than the socially optimal output, so marginal social cost exceeds marginal social benefit at the market quantity, creating a welfare loss.'});

add({id:'pricemech',unit:'Unit 2 · Microeconomics',title:'The price mechanism',
what:'The price mechanism is the system in which demand and supply determine prices and so allocate scarce resources without central direction. It has three functions: signalling, incentive and rationing.',
meaning:'Signalling: price changes tell producers and consumers about shortages and surpluses. Incentive: higher prices encourage firms to produce more and lower prices encourage consumers to buy more. Rationing: when a resource is scarce, higher prices ration it to those willing and able to pay.',
draw:['Draw D and S and mark equilibrium Pe, Qe.','Draw a price above Pe: mark Qd and Qs, and show the surplus between them.','Draw a price below Pe: show the shortage, then arrows showing the price moving to Pe.'],
tips:['Always name the function: the price rise signals shortage, incentivises supply, rations demand.','Above Pe means surplus (excess supply). Below Pe means shortage (excess demand).'],
q:'Explain the three functions of the price mechanism.',a:'Signalling: price changes show where resources are needed. Incentive: higher prices increase profit and encourage more production, while lower prices encourage consumers to buy. Rationing: scarce goods go to those willing and able to pay the price.',
ctrl:[sl('p','Market price',10,90,70)],
f(p){const P=p.p,qd=(90-P)/.8,qs=(P-10)/.8;const sur=qs-qd;
 return{curves:[fc(D(90,.8),'c1','D',86),fc(S(10,.8),'c2','S',86),sg([0,P],[100,P],'c3','P',[94,P]),sg([qd,P],[qs,P],'c5')],pts:[dot(50,50,'Qe','Pe'),dot(qd,P,'Qd'),dot(qs,P,'Qs')],
 read:Math.abs(sur)<.5?'The market clears at <b>equilibrium</b>: no surplus or shortage.':sur>0?`Surplus of <b>${f1(sur)}</b> units. Suppliers cut price (signal), consumers buy more (incentive), until the market clears at 50.`:`Shortage of <b>${f1(-sur)}</b> units. Price rises (rationing), firms supply more (incentive) until the market clears at 50.`}}});

add({id:'yed',unit:'Unit 2 · Microeconomics',title:'Income elasticity of demand',
what:'YED measures the responsiveness of quantity demanded to a change in income: YED = %ΔQd ÷ %ΔY. The sign shows the type of good and the size shows how sensitive demand is.',
meaning:'Positive sign: normal good. Between 0 and 1: income inelastic (necessity). Above 1: income elastic (luxury). Negative: inferior good, where demand falls as income rises (bus tickets, instant noodles, second-hand clothes).',
draw:['Draw income on the horizontal axis and quantity demanded on the vertical axis.','Normal good: line rising. Inferior good: line falling.','Steeper rise = higher YED.'],
tips:['Use Y for income. Always show the sign.','Implications: primary-sector goods (food) have low YED, so their producers gain little as the economy grows. Manufactured goods and services often have higher YED.'],
q:'Income rises from $4,000 to $4,400 and monthly purchases of organic coffee beans rise from 150 to 165 units. Calculate the YED and classify the good.',a:'%ΔY = 400 ÷ 4,000 = 10%. %ΔQ = 15 ÷ 150 = 10%. YED = 10 ÷ 10 = +1.0. It is a normal good with unitary income elasticity, on the border between necessity and luxury.',
ctrl:[sl('m','YED of the good',-1,2.5,1.5,.1),sl('x','Income change (%)',-20,20,10)],
f(p){const m=p.m,Y2=50*(1+p.x/100),Q2=50+m*(Y2-50);const cls=m<0?'an <b>inferior good</b>':m<1?'a <b>normal good (necessity)</b>, income inelastic':'a <b>normal good (luxury)</b>, income elastic';
 return{curves:[fc(Y=>50+m*(Y-50),'c1','Qd',90)],pts:[dot(50,50,'Y₀','Q₀'),...(p.x?[dot(Y2,Q2,'Y₁','Q₁')]:[])],xlabel:'Income (Y)',ylabel:'Quantity demanded',
 read:`YED = <b>${f1(m)}</b>: ${cls}. Income changes <b>${p.x}%</b>, so quantity demanded changes <b>${f1(m*p.x)}%</b>.`}}});

add({id:'pes',unit:'Unit 2 · Microeconomics',title:'Price elasticity of supply',
what:'PES measures how responsive quantity supplied is to a change in price: PES = %ΔQs ÷ %ΔP. Remember "Q before P". A price change causes a movement along S, not a shift.',
meaning:'PES > 1 is elastic (flat curve), PES < 1 is inelastic (steep curve), PES = 1 is unitary. Determinants: spare capacity, ability to store stock, mobility of factors, time, and how costs rise with output. Primary products (olives) are usually less elastic than manufactured goods (toys).',
draw:['Elastic supply: a flat curve. Inelastic: steep.','Perfectly inelastic: vertical. Perfectly elastic: horizontal.','Straight lines are simplifications: real supply becomes less elastic at high output as resources get scarcer.'],
tips:['Time matters: PES is greater in the long run, when firms can build capacity.','HL paper 1 favourite: explain why PES for primary commodities is lower than for manufactured products.'],
q:'A firm raises price from $600 to $800 and its weekly output rises from 1 million to 1.1 million. Calculate the PES. In the long run output reaches 1.8 million. Calculate the long-run PES.',a:'%ΔP = 200 ÷ 600 = 33.3%. Short run: %ΔQs = 10%, PES = 0.3 (inelastic). Long run: %ΔQs = 80%, PES = 2.4 (elastic). It is larger in the long run because firms can add capacity and hire and train workers over time.',
ctrl:[sl('b','Steepness of the curve',.25,3,1,.05),sl('x','Price change from $50 (%)',-30,30,10)],
f(p){const s=p.b,P2=50*(1+p.x/100),Q2=Math.max(0,50+(P2-50)/s);const pes=1/s;const cls=pes>1.02?'elastic':pes<.98?'inelastic':'unit elastic';
 return{curves:[fc(q=>50+s*(q-50),'c2','S',90)],pts:[dot(50,50,'50','$50'),...(p.x?[dot(Q2,P2,f1(Q2),'$'+f1(P2))]:[])],
 read:`PES at ($50, 50) = <b>${f1(pes)}</b> (${cls}). Price changes ${p.x}%, quantity supplied changes <b>${f1((Q2-50)/50*100)}%</b>.`}}});

add({id:'veblen',unit:'Unit 2 · Microeconomics',title:'Veblen and speculative goods',
what:'A Veblen good is a super-luxury good whose demand rises as its price rises, because the high price itself gives snob value. This gives a positive price elasticity of demand over part of the range.',
meaning:'At low prices demand follows the normal law of demand. Above a threshold price P₁ the snob effect dominates and quantity demanded rises with price. Speculative goods (gold, prime property) also rise in demand when prices rise because buyers expect further gains. Most luxury goods are YED elastic but do not have a positive PED.',
draw:['Draw a demand curve that slopes down from the vertical axis, then bends and slopes upward above P₁.','Label the kink P₁ and mark the normal and snob-value sections.'],
tips:['Do not confuse luxury goods with Veblen goods. Veblen goods are a small exception to the law of demand.','Link to behavioural economics: conspicuous consumption (Veblen) signals wealth to others, so it is not simply irrational.'],
q:'Explain why the demand curve for a Veblen good may slope upward.',a:'Veblen goods derive value from their prestige and exclusivity. A higher price increases the snob value, so some consumers buy more when the price rises and less when it falls. Above the threshold price the quantity demanded rises as price rises, giving positive PED.',
ctrl:[sl('p','Price',5,90,50)],
f(p){const Qf=P=>P<=30?100-2.5*P:25+(P-30);const pts=[];for(let P=0;P<=90;P+=1)pts.push([Qf(P),P]);const P=p.p,q=Qf(P);
 return{curves:[{pts,cls:'c1',label:'Demand',lbl:[78,90]}],pts:[dot(q,P,'Q','P')],texts:[{x:30,y:20,t:'Normal',c:'lbl'},{x:50,y:52,t:'Snob value',c:'lbl'},{x:18,y:33,t:'P₁',c:'lbl'}],
 read:P<=30?`At <b>$${P}</b> the good follows the <b>normal law of demand</b>: quantity ${f1(q)}. Raise the price past P₁ = 30.`:`At <b>$${P}</b> the <b>snob-value effect</b> dominates: quantity demanded is ${f1(q)} and rises as price rises (positive PED).`}}});

add({id:'advalorem',unit:'Unit 2 · Microeconomics',title:'Ad valorem tax',
what:'An ad valorem tax is a percentage added to the price (for example 15% VAT). A specific tax is a fixed sum per unit. Both are indirect taxes: collected by the seller and passed to the government.',
meaning:'A specific tax shifts S up in parallel. An ad valorem tax rotates S upward: the vertical gap between S and S + tax grows as price rises (15% of $200 is $30, 15% of $20 is only $3). Tax incidence is shared between consumers and producers according to elasticities.',
draw:['Draw S and a new curve that pivots, getting further from S at higher prices.','Mark the price consumers pay (Pc) and the price producers keep (Pp).','Shade the consumer burden, producer burden and deadweight loss.'],
tips:['Total tax revenue = tax per unit × quantity after the tax. Consumer incidence = rise in price × new quantity; producer incidence = fall in producer price × new quantity.','Worked example: price $4.00 to $4.40, quantity 50,000 to 44,000. Consumers pay $0.40 × 44,000 = $17,600. Producers keep $3.80, a fall of $0.20 × 44,000 = $8,800. Revenue = $0.60 × 44,000 = $26,400.'],
q:'Distinguish between a specific tax and an ad valorem tax.',a:'A specific tax is a fixed sum per unit regardless of price, so S shifts up in parallel. An ad valorem tax is a percentage of the price, so the tax per unit rises with the price and S pivots upward.',
ctrl:[sl('r','Tax rate (%)',0,60,25)],
f(p){const r=p.r/100,q=(80-10*r)/(.8*(2+r)),pc=90-.8*q,pp=pc/(1+r);const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),r?'c4':'c2','S',86)];if(r)cv.push(fc(Q=>(10+.8*Q)*(1+r),'c2','S + tax',70));
 const ar=r?[poly([[0,50],[q,50],[q,pc],[0,pc]],'a2'),poly([[0,pp],[q,pp],[q,50],[0,50]],'a1'),poly([[q,pc],[50,50],[q,pp]],'dwl')]:[];
 return{curves:cv,areas:ar,pts:[dot(50,50,'Q₀','P₀'),...(r?[dot(q,pc,'Q₁','Pc')]:[])],

  const rows=items.map(([n,p,q,e])=>{const rev0=p*q;const q1=q*(1+e*.1);const rev1=p*1.1*q1;const q2=q*(1+e*-.1);const rev2=p*.9*q2;t0+=rev0;t1+=rev1;t2+=rev2;return [n,fmt(rev0),fmt(rev1),sg1(pc(rev0,rev1)),fmt(rev2),sg1(pc(rev0,rev2))]});
  rows.push(['Total',fmt(t0),fmt(t1),sg1(pc(t0,t1)),fmt(t2),sg1(pc(t0,t2))]);
  sec('Snack shop: a 10% price rise or cut (Orhan Bufe)',tbl(['Product (TL)','Revenue now','Revenue after +10%','Change','Revenue after −10%','Change'],rows,true)+'<p class="ans">Raising prices helps only the shish kebab (PED −0.6, inelastic). For the hamburger and cheese toastie (elastic) the rise loses revenue and a 10% cut would raise it. A mixed pricing policy works best.</p>');
  const A=[800,840,880,920,960,1000,1040,1080],B=[1700,1980,2520,2800,3080,3360,3640,3920],C=[1000,2000,3000,4000,5000,6000,7000,8000],P=[13,12,11,10,9,8,7,6];
  const best=Q=>{let bi=0;Q.forEach((q,i)=>{if(P[i]*q>P[bi]*Q[bi])bi=i});return '$'+P[bi]+' (TR '+(P[bi]*Q[bi]).toLocaleString()+')'};
  const pd=Q=>n2(Math.abs(pc(Q[2],Q[3])/pc(P[2],P[3])));
  sec('Meal packages: PED from $11 to $10 and revenue-maximising price',tbl(['Package','|PED| ($11 → $10)','Revenue-maximising price'],[['A',pd(A),best(A)],['B',pd(B),best(B)],['C',pd(C),best(C)]],true));
  sec('Cinema tickets (mark scheme)',tbl(['Day','Demand at $10','Demand at $15','PED','Best price'],[['Mon–Thu','100','25','1.5 (elastic)','$10'],['Friday','150','135','0.2 (inelastic)','$15'],['Saturday','150','140','0.13 (inelastic)','$15'],['Sunday','150','100','0.67 (inelastic)','Either: $1,500 at both prices']],true)+'<p class="ans">Weekly revenue: $10 weekdays and $15 weekends = $19,250. $10 every day = $17,000. $15 every day = $14,250. Weekend demand is less elastic because cheaper substitutes are scarcer and a night out is seen more as a need.</p>');
  sec('YED, PES and PED (numbers from your notes)',tbl(['Question','Working','Answer'],[
   ['YED, coffee beans: income $4,000 → $4,400; 150 → 165','10% ÷ 10%','+1.0: normal good, unitary YED'],
   ['PES, computers: $600 → $800; 1.0m → 1.1m (short run)','10% ÷ 33.3%','0.3, inelastic'],
   ['PES, computers: long run output 1.8m','80% ÷ 33.3%','2.4, elastic'],
   ['PES: price 50 → 90 TL; supply 60 → 100','66.7% ÷ 80%','0.83, inelastic'],
   ['PES: price 10 → 50 TL; supply 10 → 20','100% ÷ 400%','0.25, inelastic'],
   ['PES: price 100 → 50; supply unchanged','0% ÷ −50%','0, perfectly inelastic'],
   ['PES: price 100 → 110; supply 10 → 30','200% ÷ 10%','20, elastic']]));
  const cb=[[1.60,350],[0.93,335],[1.45,345],[0.90,325]];
  sec('PES of coffee beans',tbl(['Period','%ΔP','%ΔQs','PES'],cb.slice(1).map((r,i)=>{const a=pc(cb[i][0],r[0]),b=pc(cb[i][1],r[1]);return ['Row '+(i+1)+' → '+(i+2),sg1(a),sg1(b),n2(b/a)]}),true)+'<p class="ans">Every value is below 1, so supply is inelastic: crops take a season to grow and stock is hard to adjust. A small shock to demand or harvest therefore causes large price swings.</p>');
  const hp=[10,15,20,25,30,35,40],hs=[2000,4000,6000,7500,8500,9000,9250],hd=[15000,13000,10000,7500,5500,3500,1500];
  sec('HL table: PES and PED between each price (change from the previous row)',tbl(['Price','Qs','Qd','PES','PED'],hp.map((p,i)=>i?[p,hs[i].toLocaleString(),hd[i].toLocaleString(),n2(pc(hs[i-1],hs[i])/pc(hp[i-1],p)),n2(pc(hd[i-1],hd[i])/pc(hp[i-1],p))]:[p,hs[i].toLocaleString(),hd[i].toLocaleString(),'–','–']),true)+'<p class="ans">Equilibrium is at $25 (Qs = Qd = 7,500). PES falls as price rises (resources get scarcer) and PED grows in size at higher prices, so the straight lines in diagrams are simplifications.</p>');
  const TP=[0,10,30,51,64,75,84,91];
  sec('Marginal product table',tbl(['Workers','TP','AP','MP'],TP.map((t,i)=>i?[i,t,n2(t/i),t-TP[i-1]]:[0,0,'–','–']),true)+'<p class="ans">MP peaks at the 3rd worker (21), where diminishing marginal returns begin. AP peaks at 3 workers (17) and MP cuts it from below afterwards.</p>');
  return '<div class="card notes">'+refCrumb+'<h1>Practice bank</h1><p class="what">Worked calculations from your class sheets, with answers computed from the numbers in them.</p>'+h+'</div>'}

function renderNotes(t){
  const i=T.indexOf(t),id=t.id;
  $('#main').innerHTML='<article class="art notes"><header class="chead">'+crumbHTML(t)+'<p class="meta"><span>Topic '+NUM[id]+'</span><span class="'+(t.hl?'hl':'')+'">'+(t.hl?'HL only':'SL and HL')+'</span><span>Updated: '+SYNC_DATE+'</span></p><h1>'+t.title+'</h1><p class="byline"><a href="#'+T.find(x=>unitNum(x)===unitNum(t)).id+'">'+unitName(t)+'</a>, '+(BAND[id]||'')+'</p><p class="acts"><label class="done"><input type="checkbox" id="chk" '+(studied[id]?'checked':'')+'> Mark as studied</label><a href="#" id="citeb">Cite this topic</a></p></header><section><h3>Summary</h3><p>'+t.what+'</p></section>'+t.notes.map(n=>'<section><h3>'+n.h+'</h3>'+n.html+'</section>').join('')+'<section class="practice"><h3>Exam practice</h3><p class="qtext">'+t.q+'</p><details><summary>Show model answer</summary><p>'+t.a+'</p></details></section><div class="pager"><button id="prev" '+(i===0?'disabled':'')+'>← Previous</button><button id="next" '+(i===T.length-1?'disabled':'')+'>Next →</button></div></article>';
  $('#chk').addEventListener('change',e=>onStudiedChange(id,e));
  $('#prev').onclick=()=>go(T[i-1].id);$('#next').onclick=()=>go(T[i+1].id)}


let quiz={};try{quiz=JSON.parse(localStorage.getItem('econ-quiz')||'{}')}catch(e){}
const saveQ=()=>{try{localStorage.setItem('econ-quiz',JSON.stringify(quiz))}catch(e){}};
const unitNum=t=>(t.unit.match(/Unit \d/)||[''])[0];
const unitName=t=>({'Unit 1':'Introduction','Unit 2':'Microeconomics','Unit 3':'Macroeconomics','Unit 4':'Global economy'}[unitNum(t)]||t.unit);
const crumbHTML=t=>'<p class="crumb"><a href="#welcome">DP Economics</a> › '+unitName(t)+' › '+(BAND[t.id]||'')+(t.hl?' · HL only':'')+'</p>';
const refCrumb='<p class="crumb"><a href="#welcome">DP Economics</a> › Reference</p>';
function setStudied(id,on){if(on)studied[id]=1;else delete studied[id];saveS();buildNav()}
let toastT;
function toast(msg,undo){const el=$('#toast');if(!el)return;el.innerHTML='<span>'+msg+'</span>'+(undo?'<button type="button" id="tu">Undo</button>':'');el.hidden=false;if(el.classList){el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
  if(undo){const b=$('#tu');if(b)b.onclick=()=>{undo();el.hidden=true}}
  clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},4500)}
function onStudiedChange(id,e){const on=e.target.checked;setStudied(id,on);toast(on?'Marked as studied.':'Removed from studied.',()=>{setStudied(id,!on);const c=$('#chk');if(c)c.checked=!on})}
let qfilter='all';
function quizHTML(){
  const list=T.filter(t=>qfilter==='all'||(qfilter==='review'?quiz[t.id]==='review':unitNum(t)===qfilter));
  const got=T.filter(t=>quiz[t.id]==='got').length,rev=T.filter(t=>quiz[t.id]==='review').length;
  const chips=[['all','All'],['Unit 1','Unit 1'],['Unit 2','Unit 2'],['Unit 3','Unit 3'],['Unit 4','Unit 4'],['review','To review']].map(c=>'<button type="button" class="chip'+(qfilter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('');
  const items=list.map(t=>'<details class="qa"><summary><span class="qn">'+NUM[t.id]+'</span> '+t.q+'</summary><p>'+t.a+'</p><div class="qb"><button type="button" data-g="'+t.id+'">I got it</button><button type="button" data-r="'+t.id+'">Review again</button><span class="qs" data-id="'+t.id+'">'+(quiz[t.id]==='got'?'Got it':quiz[t.id]==='review'?'To review':'')+'</span></div></details>').join('');
  return '<div class="card notes">'+refCrumb+'<h1>Self-test</h1><p class="what">Answer each question on paper first, then open the model answer and mark how you did. Your marks are saved on this device.</p><p class="obj" id="qsum"><b>'+got+'</b> got it, <b>'+rev+'</b> to review, <b>'+(T.length-got-rev)+'</b> not tried.</p><div class="chips">'+chips+'</div>'+(items||'<p class="obj">Nothing to review yet. Mark a question with "Review again" and it will appear here.</p>')+'</div>'}
function welcomeHTML(){
  const units=['Unit 1','Unit 2','Unit 3','Unit 4'].map(u=>{const ts=T.filter(t=>unitNum(t)===u);const d=ts.filter(t=>studied[t.id]).length;return '<div class="tile"><div><b>'+unitName(ts[0])+'</b><span>'+ts.length+' topics, '+d+' studied</span></div><a class="pill" href="#'+ts[0].id+'">Study</a></div>'}).join('');
  let last='';try{last=localStorage.getItem('econ-last')||''}catch(e){}
  const lt=T.find(t=>t.id===last);
  const review=T.filter(t=>quiz[t.id]==='review');
  const li=(t,why)=>'<li><a href="#'+t.id+'">'+NUM[t.id]+' '+t.title+'</a><span>'+why+'</span></li>';
  const att=review.map(t=>li(t,'marked to review in the self-test')).concat(T.filter(t=>!studied[t.id]&&!review.includes(t)).slice(0,5).map(t=>li(t,'not studied yet'))).slice(0,6).join('');
  const done=T.filter(t=>studied[t.id]).length;
  return '<div class="art notes"><div class="band"><p class="crumb">All courses › DP Economics</p><h1>DP Economics</h1><p class="stats">'+T.length+' topics · 4 units · HL and SL · '+done+' studied · last synced '+SYNC_DATE+'</p><div class="aboutc"><h3>About this course</h3><p>Every graph in IB Economics for Grades 11 and 12: what it shows, how to draw it, and how to use it in an exam answer. Built from your class materials.</p></div>'+(lt?'<p style="margin:18px 0 0"><a class="pill" href="#'+lt.id+'">Continue with '+NUM[lt.id]+' '+lt.title+'</a></p>':'')+'</div>'
  +'<section><h3>Units</h3><div class="tiles">'+units+'</div></section>'
  +'<section><h3>Needs attention</h3><ul class="att">'+(att||'<li>Everything is studied. Try the <a href="#quiz">self-test</a>.</li>')+'</ul></section>'
  +'<section class="gray"><h3>Resources</h3><p><a href="#quiz">Self-test</a> - every exam question, with model answers</p><p><a href="#practice">Practice bank</a> - worked calculations from your class sheets</p><p><a href="#formulas">Formula sheet</a> - every calculation you need in one place</p><p><a href="#glossary">Key terms</a> - definitions to learn word for word</p><p><a href="#sync">Sync log</a> - which class files are in the app</p></section></div>'}
function show(id){
  const t=T.find(x=>x.id===id);current=id;const main=$('#main');
  if(id==='formulas'){main.innerHTML=`<div class="card">${refCrumb}<h1>Formula sheet</h1><p class="what">The calculations that appear in IB Economics papers. Show your working and state the sign of elasticity results.</p><div class="tw"><table><tr><th>Measure</th><th>Formula</th><th>Reading it</th></tr>${FORMULAS.map(r=>`<tr><td><b>${r[0]}</b></td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`).join('')}</table></div></div>`}
  else if(id==='quiz'){main.innerHTML=quizHTML()}
  else if(id==='welcome'){main.innerHTML=welcomeHTML()}
  else if(id==='practice'){main.innerHTML=practiceHTML()}
  else if(id==='sync'){main.innerHTML=syncHTML()}
  else if(t&&t.notes){renderNotes(t)}
  else if(id==='glossary'){main.innerHTML=`<div class="card">${refCrumb}<h1>Key terms</h1><p class="what">Definitions worth learning word for word. Examiners reward precise definitions.</p><div class="tw"><table><tr><th>Term</th><th>Definition</th><th>Unit</th></tr>${GLOSS.filter(g=>!filter||(g[0]+g[1]).toLowerCase().includes(filter)).map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join('')}</table></div></div>`}
  else{
    const i=T.indexOf(t);
    main.innerHTML=`<article class="art"><header class="chead">${crumbHTML(t)}<p class="meta"><span>Topic ${NUM[id]}</span><span class="${t.hl?'hl':''}">${t.hl?'HL only':'SL and HL'}</span><span>Updated: ${SYNC_DATE}</span></p><h1>${t.title}</h1><p class="byline"><a href="#${T.find(x=>unitNum(x)===unitNum(t)).id}">${unitName(t)}</a>, ${BAND[id]||''}</p><p class="acts"><label class="done"><input type="checkbox" id="chk" ${studied[id]?'checked':''}> Mark as studied</label><a href="#" id="citeb">Cite this topic</a></p></header><section><h3>Summary</h3><p>${t.what}</p></section><figure class="fig" style="margin-left:0;margin-right:0"><p class="ft"><b>Fig. ${NUM[id]}:</b> ${t.title}.</p><div class="chart" id="chart"></div><div class="ctrls" id="ctrls"></div><button type="button" class="reset" id="rs">Reset sliders</button><div class="read" id="read" aria-live="polite"></div><div class="key" id="key"></div><p class="fc">Move the sliders to change the diagram. The result line and the key update as you go.</p></figure><section><h3>Key idea</h3><p>${t.meaning}</p></section><section><h3>Constructing the diagram</h3><ol class="steps">${t.draw.map(d=>`<li>${d}</li>`).join('')}</ol></section><section><h3>Examiner tips</h3><ul>${t.tips.map(d=>`<li>${d}</li>`).join('')}</ul></section><section class="practice"><h3>Exam practice</h3><p class="qtext">${t.q}</p><details><summary>Show model answer</summary><p>${t.a}</p></details></section><div class="pager"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button id="next" ${i===T.length-1?'disabled':''}>Next →</button></div></article>`;
    const vals={};t.ctrl.forEach(c=>vals[c.id]=c.val);
    $('#ctrls').innerHTML=t.ctrl.map(c=>`<div class="ctrl"><label for="r-${c.id}">${c.label}<output id="o-${c.id}">${c.val}</output></label><input type="range" id="r-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}"></div>`).join('');
    const draw=()=>{const s=t.f(vals);s.alt=t.title+' graph';$('#chart').innerHTML=render(s,t.id);$('#key').innerHTML=keyHTML(s,t.id);$('#read').innerHTML=s.read};
    t.ctrl.forEach(c=>$('#r-'+c.id).addEventListener('input',e=>{vals[c.id]=parseFloat(e.target.value);$('#o-'+c.id).textContent=e.target.value;draw()}));
    draw();
    $('#rs').onclick=()=>{t.ctrl.forEach(c=>{vals[c.id]=c.val;$('#r-'+c.id).value=c.val;$('#o-'+c.id).textContent=c.val});draw()};
    $('#chk').addEventListener('change',e=>onStudiedChange(id,e));
    $('#prev').onclick=()=>go(T[i-1].id);$('#next').onclick=()=>go(T[i+1].id)}
  try{localStorage.setItem('econ-last',id)}catch(e){}
  buildNav();const mm=$('#main');const nsec=buildOnPage();setTab(nsec&&!filter?'sections':'contents');if(mm.classList){mm.classList.remove('swap');void mm.offsetWidth;mm.classList.add('swap')}if(mm.focus)mm.focus({preventScroll:true});window.scrollTo({top:0})}
function go(id){if(location.hash==='#'+id)show(id);else location.hash=id}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(ENTRIES.some(e=>e.id===id))show(id)});
$('#sel').addEventListener('change',e=>go(e.target.value));
$('#q').addEventListener('input',e=>{filter=e.target.value.trim().toLowerCase();buildNav();if(current==='glossary')show('glossary')});
if(document.addEventListener){
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;const i=T.findIndex(t=>t.id===current);if(i<0)return;if(e.key==='ArrowRight'&&i<T.length-1)go(T[i+1].id);if(e.key==='ArrowLeft'&&i>0)go(T[i-1].id)});
 document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
  const f=t.closest('[data-f]');if(f){qfilter=f.getAttribute('data-f');show('quiz');return}
  const g=t.closest('[data-g],[data-r]');if(g){const id=g.getAttribute('data-g')||g.getAttribute('data-r');quiz[id]=g.hasAttribute('data-g')?'got':'review';saveQ();
   const sp=document.querySelector('.qs[data-id="'+id+'"]');if(sp)sp.textContent=quiz[id]==='got'?'Got it':'To review';
   const got=T.filter(x=>quiz[x.id]==='got').length,rev=T.filter(x=>quiz[x.id]==='review').length,sm=document.querySelector('#qsum');if(sm)sm.innerHTML='<b>'+got+'</b> got it, <b>'+rev+'</b> to review, <b>'+(T.length-got-rev)+'</b> not tried.'}});
}
if(document.addEventListener)document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;const tb=t.closest('[data-tab]');if(tb){setTab(tb.getAttribute('data-tab'));return}
  const cb=t.closest('#citeb');if(cb){e.preventDefault();const tt=T.find(x=>x.id===current);if(tt){const txt='Econ App. ('+SYNC_DATE.slice(-4)+'). '+tt.title+'. IB Economics HL and SL, topic '+NUM[current]+'. Last synced '+SYNC_DATE+'.';try{navigator.clipboard.writeText(txt).then(()=>toast('Citation copied.'),()=>toast(txt))}catch(err){toast(txt)}}return}
  const a=t.closest('#onpage a');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}});
const start=location.hash.slice(1);show(ENTRIES.some(e=>e.id===start)?start:'welcome');
