không thể được giải tỏa bằng việc giá giảm.","Indirect tax":"Thuế gián thu","A tax on spending on a good (VAT, excise duty). It is a per-unit cost to the seller, so supply shifts up (left) by the amount of the tax.":"Thuế đánh vào chi tiêu cho một hàng hóa (VAT, thuế tiêu thụ đặc biệt). Đây là chi phí trên mỗi đơn vị đối với người bán, nên cung dịch lên (sang trái) đúng bằng mức thuế.","The tax is shared between consumers and producers. The more inelastic the demand, the more the consumer pays. Revenue goes to the government, and there is a deadweight loss because output falls below the efficient level.":"Thuế được chia sẻ giữa người tiêu dùng và nhà sản xuất. Cầu càng kém co giãn thì người tiêu dùng càng chịu nhiều. Doanh thu thuộc về chính phủ, và có tổn thất vô ích vì sản lượng giảm xuống dưới mức hiệu quả.","Draw S and S + tax, a parallel vertical shift up by the tax.":"Vẽ S và S + thuế, dịch chuyển dọc song song lên đúng bằng mức thuế.","Mark the new price paid by consumers (Pc) and received by producers (Pp).":"Đánh dấu giá mới người tiêu dùng trả (Pc) và giá nhà sản xuất nhận (Pp).","Shade: consumer burden, producer burden, and the DWL triangle.":"Tô màu: gánh nặng của người tiêu dùng, gánh nặng của nhà sản xuất và tam giác tổn thất vô ích.","The vertical gap between S and S+tax equals the tax. Pc − Pp = tax.":"Khoảng cách dọc giữa S và S+thuế bằng mức thuế. Pc − Pp = thuế.","Use the demerit goods argument: a tax can correct negative externalities (cigarettes), which makes the DWL a gain in welfare.":"Dùng lập luận về hàng hóa phi khuyến dụng: thuế có thể điều chỉnh ngoại tác tiêu cực (thuốc lá), khiến tổn thất vô ích trở thành lợi ích phúc lợi.","Why is the burden of a tax on cigarettes mostly borne by consumers?":"Vì sao gánh nặng thuế thuốc lá chủ yếu do người tiêu dùng chịu?","Cigarettes are addictive with few substitutes, so demand is price inelastic. Quantity falls little, producers can pass most of the tax on in a higher price, and consumers pay most of it.":"Thuốc lá gây nghiện và ít hàng thay thế, nên cầu kém co giãn theo giá. Lượng giảm ít, nhà sản xuất có thể chuyển phần lớn thuế vào giá bán cao hơn, và người tiêu dùng chịu phần lớn thuế.","An ad valorem tax is a percentage added to the price (for example 15% VAT). A specific tax is a fixed sum per unit. Both are indirect taxes: collected by the seller and passed to the government.":"Thuế theo giá trị là một tỷ lệ phần trăm cộng vào giá (ví dụ VAT 15%). Thuế đặc định là một khoản cố định trên mỗi đơn vị. Cả hai đều là thuế gián thu: người bán thu và nộp cho chính phủ.","A specific tax shifts S up in parallel. An ad valorem tax rotates S upward: the vertical gap between S and S + tax grows as price rises (15% of $200 is $30, 15% of $20 is only $3). Tax incidence is shared between consumers and producers according to elasticities.":"Thuế đặc định làm S dịch lên song song. Thuế theo giá trị làm S xoay lên: khoảng cách dọc giữa S và S + thuế tăng khi giá tăng (15% của 200 đô la là 30 đô la, 15% của 20 đô la chỉ là 3 đô la). Gánh nặng thuế được chia giữa người tiêu dùng và nhà sản xuất theo độ co giãn.","Draw S and a new curve that pivots, getting further from S at higher prices.":"Vẽ S và một đường mới xoay quanh, càng xa S ở mức giá cao hơn.","Mark the price consumers pay (Pc) and the price producers keep (Pp).":"Đánh dấu giá người tiêu dùng trả (Pc) và giá nhà sản xuất giữ lại (Pp).","Shade the consumer burden, producer burden and deadweight loss.":"Tô màu gánh nặng của người tiêu dùng, gánh nặng của nhà sản xuất và tổn thất vô ích.","Total tax revenue = tax per unit × quantity after the tax. Consumer incidence = rise in price × new quantity; producer incidence = fall in producer price × new quantity.":"Tổng thu thuế = thuế trên mỗi đơn vị × lượng sau thuế. Phần người tiêu dùng chịu = mức tăng giá × lượng mới; phần nhà sản xuất chịu = mức giảm giá nhận được × lượng mới.","Worked example: price $4.00 to $4.40, quantity 50,000 to 44,000. Consumers pay $0.40 × 44,000 = $17,600. Producers keep $3.80, a fall of $0.20 × 44,000 = $8,800. Revenue = $0.60 × 44,000 = $26,400.":"Ví dụ tính toán: giá từ 4,00 lên 4,40 đô la, lượng từ 50.000 xuống 44.000. Người tiêu dùng trả 0,40 × 44.000 = 17.600 đô la. Nhà sản xuất giữ 3,80 đô la, giảm 0,20 × 44.000 = 8.800 đô la. Thu thuế = 0,60 × 44.000 = 26.400 đô la.","Distinguish between a specific tax and an ad valorem tax.":"Phân biệt giữa thuế đặc định và thuế theo giá trị.","A specific tax is a fixed sum per unit regardless of price, so S shifts up in parallel. An ad valorem tax is a percentage of the price, so the tax per unit rises with the price and S pivots upward.":"Thuế đặc định là một khoản cố định trên mỗi đơn vị bất kể giá, nên S dịch lên song song. Thuế theo giá trị là một tỷ lệ phần trăm của giá, nên thuế trên mỗi đơn vị tăng theo giá và S xoay lên.","Subsidy":"Trợ cấp","A payment from the government to producers per unit of output. It lowers costs, so supply shifts down (right) by the amount of the subsidy.":"Khoản chính phủ trả cho nhà sản xuất trên mỗi đơn vị sản lượng. Nó làm giảm chi phí, nên cung dịch xuống (sang phải) đúng bằng mức trợ cấp.","Price to consumers falls and quantity rises. The cost to the government is the subsidy × quantity. If the good has no positive externality, the subsidy over-allocates resources and creates a deadweight loss.":"Giá đối với người tiêu dùng giảm và lượng tăng. Chi phí của chính phủ là trợ cấp × lượng. Nếu hàng hóa không có ngoại tác tích cực, trợ cấp phân bổ quá mức nguồn lực và tạo ra tổn thất vô ích.","Draw S and S + subsidy, a parallel shift down.":"Vẽ S và S + trợ cấp, dịch chuyển song song xuống.","Mark the new consumer price and the price producers receive (higher).":"Đánh dấu giá mới của người tiêu dùng và giá nhà sản xuất nhận được (cao hơn).","Shade the government cost rectangle.":"Tô hình chữ nhật chi phí của chính phủ.","Producer receives Pc + subsidy.":"Nhà sản xuất nhận Pc + trợ cấp.","Justifications: merit goods, infant industries, food security. Drawbacks: opportunity cost, dependence, distortion.":"Lý do biện minh: hàng hóa khuyến dụng, ngành công nghiệp non trẻ, an ninh lương thực. Hạn chế: chi phí cơ hội, sự phụ thuộc, méo mó thị trường.","Explain how a subsidy on solar panels affects the market.":"Giải thích trợ cấp cho tấm pin mặt trời ảnh hưởng đến thị trường như thế nào.","The subsidy lowers production costs, so supply shifts right. Price falls, quantity rises. Consumption of a good with positive externalities moves closer to the socially optimal level, at a cost to government.":"Trợ cấp làm giảm chi phí sản xuất nên cung dịch sang phải. Giá giảm, lượng tăng. Tiêu dùng một hàng hóa có ngoại tác tích cực tiến gần hơn đến mức tối ưu xã hội, với chi phí do chính phủ gánh.","Negative externality of production":"Ngoại tác tiêu cực của sản xuất","A cost imposed on a third party that is not reflected in the market price, such as pollution from a factory.":"Chi phí áp lên bên thứ ba mà không được phản ánh trong giá thị trường, chẳng hạn ô nhiễm từ một nhà máy.","The market produces where MPB = MPC (Qm), but society wants MSB = MSC (Qs). The market overproduces, creating a welfare loss. The external cost is the gap between MSC and MPC.":"Thị trường sản xuất tại MPB = MPC (Qm), nhưng xã hội muốn MSB = MSC (Qs). Thị trường sản xuất quá mức, gây ra tổn thất phúc lợi. Chi phí ngoại tác là khoảng cách giữa MSC và MPC.","Draw MPC (= S) and MSB = MPB (= D).":"Vẽ MPC (= S) và MSB = MPB (= D).","Draw MSC above MPC. The vertical gap is the external cost.":"Vẽ MSC phía trên MPC. Khoảng cách dọc là chi phí ngoại tác.","Mark Qm and Qopt; shade the welfare-loss triangle.":"Đánh dấu Qm và Qopt; tô tam giác tổn thất phúc lợi.","Fixes: indirect tax equal to the external cost, regulation, tradable permits, education.":"Giải pháp: thuế gián thu bằng chi phí ngoại tác, quy định, giấy phép có thể giao dịch, giáo dục.","Label correctly: private costs are MPC, social costs MSC = MPC + MEC.":"Ghi nhãn đúng: chi phí tư nhân là MPC, chi phí xã hội MSC = MPC + MEC.","Explain how a carbon tax can correct a negative externality.":"Giải thích thuế carbon có thể điều chỉnh ngoại tác tiêu cực như thế nào.","The tax raises private costs by the value of the external cost, so MPC shifts up to MSC. The firm now internalises the externality, output falls to the socially optimal level where MSB = MSC and the welfare loss is eliminated.":"Thuế làm tăng chi phí tư nhân đúng bằng giá trị chi phí ngoại tác, nên MPC dịch lên thành MSC. Doanh nghiệp giờ đây nội hóa ngoại tác, sản lượng giảm xuống mức tối ưu xã hội tại MSB = MSC và tổn thất phúc lợi được loại bỏ.","Positive externality of consumption":"Ngoại tác tích cực của tiêu dùng","A benefit to a third party that is not reflected in the market price, such as vaccination or education.":"Lợi ích cho bên thứ ba mà không được phản ánh trong giá thị trường, chẳng hạn tiêm chủng hoặc giáo dục.","The market produces at MPB = MPC (Qm), but society wants MSB = MSC (Qopt). The good is underconsumed, creating a welfare loss. These are merit goods.":"Thị trường sản xuất tại MPB = MPC (Qm), nhưng xã hội muốn MSB = MSC (Qopt). Hàng hóa bị tiêu dùng thiếu, gây ra tổn thất phúc lợi. Đây là hàng hóa khuyến dụng.","Draw MPB (= D) and MSC = MPC (= S).":"Vẽ MPB (= D) và MSC = MPC (= S).","Draw MSB above MPB. The gap is the external benefit.":"Vẽ MSB phía trên MPB. Khoảng cách là lợi ích ngoại tác.","Fixes: subsidy equal to the external benefit, direct provision, information campaigns.":"Giải pháp: trợ cấp bằng lợi ích ngoại tác, cung cấp trực tiếp, các chiến dịch thông tin.","Define it precisely: \"benefit to third parties not reflected in price\".":"Định nghĩa chính xác: \"lợi ích cho bên thứ ba không được phản ánh trong giá\".","Explain why education is underprovided by the free market.":"Giải thích vì sao thị trường tự do cung cấp giáo dục không đủ.","Education creates external benefits such as a more productive society. Individuals consider only their private benefit (MPB), so the market quantity is below the social optimum where MSB = MSC, causing a welfare loss.":"Giáo dục tạo ra lợi ích ngoại tác như một xã hội năng suất hơn. Cá nhân chỉ xem xét lợi ích tư nhân (MPB), nên lượng thị trường thấp hơn mức tối ưu xã hội tại MSB = MSC, gây ra tổn thất phúc lợi.","Types of goods and market failure":"Các loại hàng hóa và thất bại thị trường","Goods are classified by rivalry and excludability. A public good is non-rivalrous and non-excludable, so the market underprovides it because of the free-rider problem.":"Hàng hóa được phân loại theo tính cạnh tranh và tính loại trừ. Hàng hóa công cộng không cạnh tranh và không loại trừ, nên thị trường cung cấp thiếu do vấn đề người ăn theo (free-rider).","Explain why merit goods are under-consumed in a free market. [4]":"Giải thích vì sao hàng hóa khuyến dụng bị tiêu dùng thiếu trong thị trường tự do. [4]","Consumers underestimate the private benefits (information failure), and the consumption creates positive externalities. Marginal social benefit exceeds marginal private benefit, so the market quantity is below the socially optimal quantity and there is a welfare loss, shown on an MSB/MPB diagram.":"Người tiêu dùng đánh giá thấp lợi ích tư nhân (thất bại thông tin), và việc tiêu dùng tạo ra ngoại tác tích cực. Lợi ích xã hội cận biên vượt lợi ích tư nhân cận biên, nên lượng thị trường thấp hơn lượng tối ưu xã hội và có tổn thất phúc lợi, thể hiện trên sơ đồ MSB/MPB.","Asymmetric information occurs when one party in a transaction has significantly more or better information than the other. It prevents the market from reaching an efficient allocation of resources.":"Thông tin bất cân xứng xảy ra khi một bên trong giao dịch có thông tin nhiều hơn hoặc tốt hơn đáng kể so với bên kia. Nó ngăn thị trường đạt được sự phân bổ nguồn lực hiệu quả.","Explain how adverse selection can cause a health insurance market to collapse. [4]":"Giải thích lựa chọn bất lợi có thể làm sụp đổ thị trường bảo hiểm y tế như thế nào. [4]","Insurers cannot observe individual health risk, so they set premiums based on average risk. Healthy, low-risk people find this too expensive and do not buy, leaving mainly high-risk people. Claims rise, so premiums rise again, driving out more low-risk customers, and the market can collapse.":"Các công ty bảo hiểm không thể quan sát rủi ro sức khỏe của từng cá nhân, nên họ đặt phí dựa trên rủi ro trung bình. Những người khỏe mạnh, rủi ro thấp thấy mức này quá đắt và không mua, chủ yếu còn lại người rủi ro cao. Số vụ bồi thường tăng nên phí lại tăng, đẩy thêm khách hàng rủi ro thấp ra ngoài, và thị trường có thể sụp đổ.","The market's inability to achieve equity":"Sự bất lực của thị trường trong việc đạt được công bằng","Markets allocate resources according to ability to pay, not need, so a free market can produce very unequal outcomes even where it is efficient.":"Thị trường phân bổ nguồn lực theo khả năng chi trả chứ không theo nhu cầu, nên thị trường tự do có thể tạo ra kết quả rất bất bình đẳng ngay cả khi nó hiệu quả.","Explain why high levels of air and water pollution represent a negative externality of unregulated growth. [4]":"Giải thích vì sao mức ô nhiễm không khí và nước cao là một ngoại tác tiêu cực của tăng trưởng không được quản lý. [4]","Firms ignore the cost of pollution to third parties, so private costs are below social costs. The market produces more than the socially optimal output, so marginal social cost exceeds marginal social benefit at the market quantity, creating a welfare loss.":"Các doanh nghiệp bỏ qua chi phí ô nhiễm đối với bên thứ ba, nên chi phí tư nhân thấp hơn chi phí xã hội. Thị trường sản xuất nhiều hơn sản lượng tối ưu xã hội, nên chi phí xã hội cận biên vượt lợi ích xã hội cận biên tại lượng thị trường, gây ra tổn thất phúc lợi.","Cost curves (short run)":"Đường chi phí (ngắn hạn)","Average total cost (ATC), average variable cost (AVC) and marginal cost (MC) describe how a firm's unit costs change as output rises.":"Tổng chi phí bình quân (ATC), chi phí biến đổi bình quân (AVC) và chi phí cận biên (MC) mô tả cách chi phí đơn vị của doanh nghiệp thay đổi khi sản lượng tăng.","MC falls then rises because of the law of diminishing marginal returns. MC cuts ATC and AVC at their minimum points. The gap between ATC and AVC is average fixed cost, which shrinks as output rises.":"MC giảm rồi tăng do quy luật năng suất cận biên giảm dần. MC cắt ATC và AVC tại điểm thấp nhất của chúng. Khoảng cách giữa ATC và AVC là chi phí cố định bình quân, giảm dần khi sản lượng tăng.","Draw a U-shaped ATC and a lower U-shaped AVC.":"Vẽ ATC hình chữ U và AVC hình chữ U thấp hơn.","Draw MC through the minimum of both.":"Vẽ MC đi qua điểm thấp nhất của cả hai.","Mark the minimum of ATC: productive efficiency.":"Đánh dấu điểm thấp nhất của ATC: hiệu quả sản xuất.","Rule: when MC < average, the average falls. When MC > average, the average rises.":"Quy tắc: khi MC < trung bình, mức trung bình giảm. Khi MC > trung bình, mức trung bình tăng.","Short run: at least one fixed factor. Long run: all factors variable, giving economies and diseconomies of scale.":"Ngắn hạn: ít nhất một yếu tố cố định. Dài hạn: mọi yếu tố biến đổi, tạo ra tính kinh tế và tính phi kinh tế theo quy mô.","Explain why the MC curve cuts the ATC curve at its lowest point.":"Giải thích vì sao đường MC cắt đường ATC tại điểm thấp nhất của nó.","While MC is below ATC, producing one more unit pulls the average down. Once MC rises above ATC, each extra unit pulls the average up. So ATC stops falling and starts rising exactly where MC = ATC.":"Khi MC thấp hơn ATC, sản xuất thêm một đơn vị kéo mức trung bình xuống. Khi MC vượt lên trên ATC, mỗi đơn vị thêm kéo mức trung bình lên. Vì vậy ATC ngừng giảm và bắt đầu tăng đúng tại điểm MC = ATC.","Long-run average cost and economies of scale":"Chi phí bình quân dài hạn và tính kinh tế theo quy mô","The long-run average cost (LRAC) curve shows the lowest average cost of producing each output when all factors, including capital, can be varied.":"Đường chi phí bình quân dài hạn (LRAC) cho biết chi phí bình quân thấp nhất để sản xuất mỗi mức sản lượng khi mọi yếu tố, kể cả vốn, có thể thay đổi.","It is the envelope of all the short-run average cost (SRAC) curves. Falling LRAC means economies of scale (specialisation, bulk buying, spreading fixed costs). The minimum is the minimum efficient scale. Rising LRAC means diseconomies of scale (coordination, communication, motivation problems).":"Nó là đường bao của tất cả các đường chi phí bình quân ngắn hạn (SRAC). LRAC giảm nghĩa là tính kinh tế theo quy mô (chuyên môn hóa, mua số lượng lớn, dàn trải chi phí cố định). Điểm thấp nhất là quy mô hiệu quả tối thiểu. LRAC tăng nghĩa là tính phi kinh tế theo quy mô (vấn đề phối hợp, giao tiếp, động lực).","Draw several U-shaped SRAC curves, each for a different plant size.":"Vẽ nhiều đường SRAC hình chữ U, mỗi đường cho một quy mô nhà máy khác nhau.","Draw a smooth U-shaped curve touching the bottom of each SRAC from beneath: the LRAC.":"Vẽ một đường cong chữ U mượt chạm đáy của mỗi SRAC từ bên dưới: đó là LRAC.","Label the economies-of-scale, minimum efficient scale and diseconomies-of-scale regions.":"Ghi nhãn các vùng tính kinh tế theo quy mô, quy mô hiệu quả tối thiểu và tính phi kinh tế theo quy mô.","Distinguish internal from external economies of scale.":"Phân biệt tính kinh tế theo quy mô nội tại và bên ngoài.","Link to market structure: large minimum efficient scale relative to the market creates natural monopoly.":"Liên hệ với cấu trúc thị trường: quy mô hiệu quả tối thiểu lớn so với thị trường tạo ra độc quyền tự nhiên.","Explain two internal economies of scale.":"Giải thích hai tính kinh tế theo quy mô nội tại.","1) Technical: larger firms use specialised machinery and spread fixed costs over more units. 2) Purchasing: bulk buying of inputs gets discounts, lowering average cost. Both cause LRAC to fall as output rises.":"1) Kỹ thuật: doanh nghiệp lớn dùng máy móc chuyên dụng và dàn trải chi phí cố định trên nhiều đơn vị hơn. 2) Mua hàng: mua nguyên liệu số lượng lớn được chiết khấu, làm giảm chi phí bình quân. Cả hai làm LRAC giảm khi sản lượng tăng.","Production: total, average and marginal product":"Sản xuất: sản phẩm tổng, bình quân và cận biên","Total product (TP) is total output. Average product (AP) = TP ÷ variable input. Marginal product (MP) is the extra output from one more unit of the variable input. In the short run at least one factor is fixed.":"Sản phẩm tổng (TP) là tổng sản lượng. Sản phẩm bình quân (AP) = TP ÷ yếu tố đầu vào biến đổi. Sản phẩm cận biên (MP) là sản lượng thêm từ một đơn vị yếu tố biến đổi nữa. Trong ngắn hạn ít nhất một yếu tố cố định.","The law of diminishing returns: as more of a variable factor is added to a fixed factor, MP and then AP eventually fall; total product may still rise, but more slowly. MP cuts AP at the maximum of AP. This is the origin of the U-shape of MC and ATC.":"Quy luật năng suất cận biên giảm dần: khi thêm nhiều yếu tố biến đổi vào một yếu tố cố định, MP rồi AP cuối cùng sẽ giảm; sản phẩm tổng vẫn có thể tăng nhưng chậm hơn. MP cắt AP tại điểm cực đại của AP. Đây là nguồn gốc hình chữ U của MC và ATC.","Plot labour on the x-axis. MP rises, peaks, then falls.":"Vẽ lao động trên trục hoành. MP tăng, đạt đỉnh rồi giảm.","AP rises, peaks where MP = AP, then falls.":"AP tăng, đạt đỉnh tại MP = AP rồi giảm.","Mark where diminishing marginal returns begin (the peak of MP).":"Đánh dấu nơi năng suất cận biên giảm dần bắt đầu (đỉnh của MP).","Output per worker rises at first because of specialisation, then falls as workers share limited space and equipment.":"Sản lượng mỗi lao động ban đầu tăng nhờ chuyên môn hóa, rồi giảm khi công nhân dùng chung không gian và thiết bị có hạn.","Be precise: diminishing returns is a short-run idea. It is different from diseconomies of scale (long run).":"Hãy chính xác: năng suất cận biên giảm dần là khái niệm ngắn hạn. Nó khác với tính phi kinh tế theo quy mô (dài hạn).","Complete the table: with TP 0, 10, 30, 51, 64, 75, 84, 91 for 0 to 7 workers, calculate MP for the 4th worker and AP for 5 workers.":"Hoàn thành bảng: với TP 0, 10, 30, 51, 64, 75, 84, 91 cho 0 đến 7 lao động, tính MP của lao động thứ 4 và AP khi có 5 lao động.","MP of the 4th worker = 64 − 51 = 13. AP for 5 workers = 75 ÷ 5 = 15.":"MP của lao động thứ 4 = 64 − 51 = 13. AP khi có 5 lao động = 75 ÷ 5 = 15.","Revenue: TR, AR and MR":"Doanh thu: TR, AR và MR","Total revenue (TR) = price × quantity. Average revenue (AR) = TR ÷ Q, which equals price, so the AR curve is the demand curve. Marginal revenue (MR) is the extra revenue from selling one more unit.":"Tổng doanh thu (TR) = giá × lượng. Doanh thu bình quân (AR) = TR ÷ Q, bằng giá, nên đường AR chính là đường cầu. Doanh thu cận biên (MR) là doanh thu thêm từ việc bán thêm một đơn vị.","For a firm facing a downward-sloping demand curve, MR falls twice as fast as AR (twice the slope). MR is positive while demand is elastic, zero at unit elasticity (TR at its maximum) and negative when demand is inelastic. A perfectly competitive firm faces a horizontal D = AR = MR.":"Với doanh nghiệp đối mặt đường cầu dốc xuống, MR giảm nhanh gấp đôi AR (độ dốc gấp đôi). MR dương khi cầu co giãn, bằng không tại co giãn đơn vị (TR cực đại) và âm khi cầu kém co giãn. Doanh nghiệp cạnh tranh hoàn hảo đối mặt D = AR = MR nằm ngang.","Draw a downward-sloping AR (= D) curve.":"Vẽ đường AR (= D) dốc xuống.","Draw MR from the same intercept with twice the slope, cutting the quantity axis halfway.":"Vẽ MR từ cùng điểm cắt trục với độ dốc gấp đôi, cắt trục lượng ở giữa.","TR rises while MR > 0 and peaks where MR = 0.":"TR tăng khi MR > 0 và đạt đỉnh tại MR = 0.","Revenue is not profit: profit = TR − TC.":"Doanh thu không phải lợi nhuận: lợi nhuận = TR − TC.","Link to PED: when demand is elastic, cutting price raises TR; when inelastic, raising price raises TR.":"Liên hệ với PED: khi cầu co giãn, giảm giá làm tăng TR; khi kém co giãn, tăng giá làm tăng TR.","A firm producing a PED elastic good wants to increase sales revenue. What should it do?":"Một doanh nghiệp sản xuất hàng có cầu co giãn muốn tăng doanh thu bán hàng. Nên làm gì?","Lower the price. Because demand is elastic, the percentage rise in quantity is greater than the percentage fall in price, so total revenue increases. If demand is inelastic, it should raise price.":"Giảm giá. Vì cầu co giãn, tỷ lệ phần trăm lượng tăng lớn hơn tỷ lệ phần trăm giá giảm, nên tổng doanh thu tăng. Nếu cầu kém co giãn thì nên tăng giá.","Perfect competition":"Cạnh tranh hoàn hảo","Many small firms sell an identical product, with free entry and exit and perfect information. Each firm is a price taker, so P = AR = MR.":"Nhiều doanh nghiệp nhỏ bán sản phẩm giống hệt nhau, tự do gia nhập và rút lui và thông tin hoàn hảo. Mỗi doanh nghiệp là người chấp nhận giá, nên P = AR = MR.","A firm maximises profit where MC = MR. If P > ATC it earns supernormal profit, which attracts entry until price falls to min ATC (normal profit, long-run equilibrium). If P < AVC the firm shuts down.":"Doanh nghiệp tối đa hóa lợi nhuận tại MC = MR. Nếu P > ATC nó có lợi nhuận siêu ngạch, thu hút gia nhập cho đến khi giá giảm về ATC tối thiểu (lợi nhuận bình thường, cân bằng dài hạn). Nếu P < AVC doanh nghiệp ngừng sản xuất.","Draw the firm: MC, ATC (and AVC) with a horizontal P = MR = AR.":"Vẽ doanh nghiệp: MC, ATC (và AVC) với P = MR = AR nằm ngang.","Find MC = MR to read Q*.":"Tìm MC = MR để đọc Q*.","Profit rectangle: from Q* up to P and down to ATC.":"Hình chữ nhật lợi nhuận: từ Q* lên P và xuống ATC.","Long-run equilibrium: P = MC = min ATC, so allocatively and productively efficient.":"Cân bằng dài hạn: P = MC = ATC tối thiểu, nên hiệu quả phân bổ và hiệu quả sản xuất.","Shut-down rule: short run P < AVC; long run P < ATC.":"Quy tắc ngừng sản xuất: ngắn hạn P < AVC; dài hạn P < ATC.","Illustrate with a diagram why a perfectly competitive firm can still make a loss in the short run while producing at its profit-maximising output. [10]":"Minh họa bằng sơ đồ vì sao một doanh nghiệp cạnh tranh hoàn hảo vẫn có thể thua lỗ trong ngắn hạn khi sản xuất tại mức sản lượng tối đa hóa lợi nhuận. [10]","Draw MC, ATC, AVC and a horizontal P = MR = AR below ATC but above AVC. The firm produces where MC = MR, which minimises the loss. P covers AVC (so it keeps producing short run) but not ATC, so TR < TC and the loss is the rectangle (ATC − P) × Q*. In the long run firms with losses leave, supply falls and price rises to min ATC. Also explain why P = MR = AR for a price taker.":"Vẽ MC, ATC, AVC và P = MR = AR nằm ngang dưới ATC nhưng trên AVC. Doanh nghiệp sản xuất tại MC = MR, mức này giảm thiểu khoản lỗ. P bù đắp được AVC (nên tiếp tục sản xuất ngắn hạn) nhưng không bù được ATC, nên TR < TC và khoản lỗ là hình chữ nhật (ATC − P) × Q*. Trong dài hạn các doanh nghiệp thua lỗ rút lui, cung giảm và giá tăng về ATC tối thiểu. Đồng thời giải thích vì sao P = MR = AR đối với người chấp nhận giá.","A market with many firms selling differentiated products and no barriers to entry or exit (hairdressers, small shops, plumbers). Each firm has some price-making power and faces a downward-sloping, fairly elastic demand curve.":"Thị trường có nhiều doanh nghiệp bán sản phẩm khác biệt và không có rào cản gia nhập hay rút lui (tiệm làm tóc, cửa hàng nhỏ, thợ ống nước). Mỗi doanh nghiệp có chút quyền định giá và đối mặt đường cầu dốc xuống, khá co giãn.","Firms maximise profit where MC = MR (with MC rising) and charge the price on their demand curve. Short run: abnormal profit or loss is possible. Long run: entry or exit shifts demand until AR = ATC and firms earn only normal profit. Neither productive nor allocative efficiency is achieved: P > MC and output is below the minimum ATC.":"Các doanh nghiệp tối đa hóa lợi nhuận tại MC = MR (với MC đang tăng) và định giá trên đường cầu của mình. Ngắn hạn: có thể có lợi nhuận bất thường hoặc thua lỗ. Dài hạn: gia nhập hoặc rút lui làm dịch chuyển cầu cho đến khi AR = ATC và doanh nghiệp chỉ có lợi nhuận bình thường. Không đạt được hiệu quả sản xuất lẫn phân bổ: P > MC và sản lượng thấp hơn ATC tối thiểu.","Draw a downward-sloping AR (= D) with MR below it, and U-shaped MC and ATC.":"Vẽ AR (= D) dốc xuống với MR bên dưới, và MC và ATC hình chữ U.","Find MR = MC, then go up to AR for the price.":"Tìm MR = MC, rồi đi lên AR để lấy giá.","Profit = (AR − ATC) × Q. Long run: AR touches ATC at the profit-maximising output.":"Lợi nhuận = (AR − ATC) × Q. Dài hạn: AR chạm ATC tại mức sản lượng tối đa hóa lợi nhuận.","Difference from perfect competition: differentiated products and downward-sloping demand, so the long-run output is not at the minimum of ATC (excess capacity).":"Khác biệt với cạnh tranh hoàn hảo: sản phẩm khác biệt và cầu dốc xuống, nên sản lượng dài hạn không nằm tại điểm thấp nhất của ATC (công suất dư thừa).","Evaluate: the variety and quality gained by consumers may outweigh the efficiency losses.":"Đánh giá: sự đa dạng và chất lượng mà người tiêu dùng có được có thể lớn hơn những tổn thất về hiệu quả.","Explain why a firm in monopolistic competition earns only normal profit in the long run.":"Giải thích vì sao một doanh nghiệp cạnh tranh độc quyền chỉ có lợi nhuận bình thường trong dài hạn.","Abnormal profit attracts new firms because there are no barriers to entry. Their products are close substitutes, so demand for each existing firm falls (shifts left) until AR equals ATC at the profit-maximising output. Profit is then normal only. If firms make losses, firms leave and demand rises until normal profit is restored.":"Lợi nhuận bất thường thu hút doanh nghiệp mới vì không có rào cản gia nhập. Sản phẩm của họ là hàng thay thế gần gũi, nên cầu đối với mỗi doanh nghiệp hiện có giảm (dịch sang trái) cho đến khi AR bằng ATC tại mức sản lượng tối đa hóa lợi nhuận. Khi đó lợi nhuận chỉ ở mức bình thường. Nếu doanh nghiệp thua lỗ thì họ rút lui và cầu tăng cho đến khi lợi nhuận bình thường được khôi phục.","Monopoly":"Độc quyền","A single seller faces the whole market demand curve and is protected by barriers to entry. It is a price maker, so AR = D and MR lies below it.":"Một người bán duy nhất đối mặt toàn bộ đường cầu thị trường và được bảo vệ bởi các rào cản gia nhập. Đó là người định giá, nên AR = D và MR nằm dưới nó.","The monopolist produces where MC = MR, then charges the price on the demand curve at that quantity. Compared with perfect competition, output is lower and price higher, giving supernormal profit and a deadweight loss.":"Nhà độc quyền sản xuất tại MC = MR, rồi định giá trên đường cầu tại mức lượng đó. So với cạnh tranh hoàn hảo, sản lượng thấp hơn và giá cao hơn, tạo ra lợi nhuận siêu ngạch và tổn thất vô ích.","Draw D (= AR) and MR with twice the slope.":"Vẽ D (= AR) và MR với độ dốc gấp đôi.","Draw MC (and ATC) and mark MR = MC to find Qm.":"Vẽ MC (và ATC) và đánh dấu MR = MC để tìm Qm.","Go up to D for Pm. Shade profit and the DWL triangle.":"Đi lên D để lấy Pm. Tô lợi nhuận và tam giác tổn thất vô ích.","Not allocatively efficient (P > MC). Possibly not productively efficient either.":"Không hiệu quả về phân bổ (P > MC). Có thể cũng không hiệu quả về sản xuất.","Evaluate: economies of scale, dynamic efficiency, natural monopoly, and regulation such as price caps.":"Đánh giá: tính kinh tế theo quy mô, hiệu quả động, độc quyền tự nhiên và các quy định như trần giá.","Explain why a monopolist's MR curve lies below its demand curve.":"Giải thích vì sao đường MR của nhà độc quyền nằm dưới đường cầu.","To sell an extra unit the monopolist must lower the price on all units, not just the last. So the extra revenue (MR) is less than the price of the last unit, and the MR curve lies below D.":"Để bán thêm một đơn vị, nhà độc quyền phải hạ giá trên tất cả các đơn vị, không chỉ đơn vị cuối. Vì vậy doanh thu thêm (MR) nhỏ hơn giá của đơn vị cuối, và đường MR nằm dưới D.","AD–AS (Keynesian)":"AD–AS (Keynes)","Aggregate demand (AD) is total planned spending in the economy. Keynesian aggregate supply (AS) is flat when there is spare capacity and becomes vertical at full employment.":"Tổng cầu (AD) là tổng chi tiêu theo kế hoạch trong nền kinh tế. Tổng cung theo Keynes (AS) nằm ngang khi có công suất dư thừa và trở nên thẳng đứng tại mức toàn dụng.","In the flat range, an increase in AD raises real GDP with almost no inflation. Near full employment the AS curve slopes up. At full capacity (Yf) extra AD only causes inflation. Unemployment can persist in a recession.":"Trong đoạn nằm ngang, AD tăng làm GDP thực tăng mà hầu như không có lạm phát. Gần toàn dụng, đường AS dốc lên. Tại công suất tối đa (Yf), AD tăng thêm chỉ gây ra lạm phát. Thất nghiệp có thể kéo dài trong suy thoái.","Draw an L-shaped (or reverse-L) AS with a flat, an intermediate and a vertical range.":"Vẽ AS hình chữ L (hoặc chữ L ngược) với một đoạn nằm ngang, một đoạn trung gian và một đoạn thẳng đứng.","Draw downward-sloping AD.":"Vẽ AD dốc xuống.","Shift AD right and compare real output and price level.":"Dịch AD sang phải và so sánh sản lượng thực và mức giá.","Explain the AD shift: C, I, G, X−M. Use the multiplier.":"Giải thích sự dịch chuyển của AD: C, I, G, X−M. Dùng số nhân.","Evaluate: Keynesians favour fiscal policy to close a deflationary gap.":"Đánh giá: các nhà Keynes ủng hộ chính sách tài khóa để thu hẹp chênh lệch giảm phát.","Using a Keynesian AD–AS diagram, explain how government spending can reduce unemployment.":"Dùng sơ đồ AD–AS theo Keynes, giải thích chi tiêu chính phủ có thể giảm thất nghiệp như thế nào.","Higher G shifts AD right. With spare capacity on the flat/intermediate AS, real GDP rises, and firms hire more workers, so unemployment falls with little inflation. The multiplier amplifies the effect.":"G cao hơn làm AD dịch sang phải. Với công suất dư thừa trên đoạn AS nằm ngang/trung gian, GDP thực tăng và doanh nghiệp thuê thêm lao động, nên thất nghiệp giảm với ít lạm phát. Số nhân khuếch đại tác động.","AD–AS (Monetarist / neoclassical)":"AD–AS (trọng tiền / tân cổ điển)","The neoclassical model has a vertical long-run aggregate supply (LRAS) at the full-employment output, and an upward-sloping short-run aggregate supply (SRAS).":"Mô hình tân cổ điển có tổng cung dài hạn (LRAS) thẳng đứng tại sản lượng toàn dụng, và tổng cung ngắn hạn (SRAS) dốc lên.","In the long run output depends on factors of production, not the price level. A demand-side boost only causes a short-run rise in output; in the long run the economy returns to LRAS with a higher price level. A supply-side policy shifts LRAS right.":"Trong dài hạn sản lượng phụ thuộc vào các yếu tố sản xuất, không phụ thuộc mức giá. Một cú thúc đẩy từ phía cầu chỉ làm sản lượng tăng ngắn hạn; trong dài hạn nền kinh tế trở về LRAS với mức giá cao hơn. Chính sách phía cung làm LRAS dịch sang phải.","Draw a vertical LRAS at Yf, a rising SRAS and a falling AD.":"Vẽ LRAS thẳng đứng tại Yf, SRAS dốc lên và AD dốc xuống.","Equilibrium left of Yf = recessionary gap; right = inflationary gap.":"Cân bằng bên trái Yf = chênh lệch suy thoái; bên phải = chênh lệch lạm phát.","Show the long-run adjustment back to Yf.":"Thể hiện sự điều chỉnh dài hạn trở về Yf.","SRAS shifts with costs of production (wages, oil). LRAS shifts with quantity or quality of factors (capital, labour, technology).":"SRAS dịch chuyển theo chi phí sản xuất (tiền lương, dầu). LRAS dịch chuyển theo số lượng hoặc chất lượng các yếu tố (vốn, lao động, công nghệ).","Evaluate: self-correction can take a long time (Keynesian critique).":"Đánh giá: tự điều chỉnh có thể mất rất lâu (phê bình của trường phái Keynes).","Explain the effect of falling oil prices in the short run and the long run.":"Giải thích tác động của giá dầu giảm trong ngắn hạn và dài hạn.","Lower costs shift SRAS right: price level falls and real GDP rises in the short run. If output is above full employment, wages and costs rise over time and SRAS returns, so in the long run GDP returns to Yf.":"Chi phí thấp hơn làm SRAS dịch sang phải: mức giá giảm và GDP thực tăng trong ngắn hạn. Nếu sản lượng cao hơn mức toàn dụng, tiền lương và chi phí tăng dần theo thời gian và SRAS quay lại, nên trong dài hạn GDP trở về Yf.","Keynesian multiplier":"Số nhân Keynes","The multiplier shows that an initial change in injections (investment, government spending or exports) leads to a larger final change in real GDP: multiplier k = 1 ÷ (1 − MPC) = 1 ÷ MPW.":"Số nhân cho thấy một thay đổi ban đầu trong các khoản bơm vào (đầu tư, chi tiêu chính phủ hoặc xuất khẩu) dẫn đến thay đổi cuối cùng lớn hơn của GDP thực: số nhân k = 1 ÷ (1 − MPC) = 1 ÷ MPW.","The first round of spending becomes someone else's income, and a fraction (the marginal propensity to consume) is spent again. The rounds shrink until the total change in income is k times the initial injection. The higher the MPC, the bigger the multiplier. Withdrawals (saving, tax, imports) reduce it.":"Vòng chi tiêu đầu tiên trở thành thu nhập của người khác, và một phần (xu hướng tiêu dùng cận biên) lại được chi tiêu. Các vòng nhỏ dần cho đến khi tổng thay đổi thu nhập bằng k lần khoản bơm vào ban đầu. MPC càng cao thì số nhân càng lớn. Các khoản rò rỉ (tiết kiệm, thuế, nhập khẩu) làm giảm nó.","Plot aggregate expenditure (AE) against national income (Y), with the 45° line where AE = Y.":"Vẽ chi tiêu tổng hợp (AE) theo thu nhập quốc dân (Y), với đường 45° nơi AE = Y.","AE has a positive intercept and slope equal to the MPC.":"AE có điểm cắt trục dương và độ dốc bằng MPC.","An injection shifts AE up by ΔI. The new equilibrium Y₁ is further than ΔI to the right.":"Một khoản bơm vào làm AE dịch lên ΔI. Cân bằng mới Y₁ nằm xa hơn ΔI về bên phải.","The multiplier works in both directions: a fall in injections reduces GDP by more than the initial fall.":"Số nhân hoạt động theo cả hai chiều: khoản bơm vào giảm làm GDP giảm nhiều hơn mức giảm ban đầu.","Evaluate: spare capacity needed, crowding out, time lags, leakages through imports and taxes.":"Đánh giá: cần có công suất dư thừa, hiệu ứng lấn át, độ trễ thời gian, rò rỉ qua nhập khẩu và thuế.","The MPC is 0.75 and investment rises by $8bn. Calculate the change in real GDP.":"MPC là 0,75 và đầu tư tăng 8 tỷ đô la. Tính thay đổi của GDP thực.","k = 1 ÷ (1 − 0.75) = 4. Change in GDP = 4 × $8bn = $32bn.":"k = 1 ÷ (1 − 0,75) = 4. Thay đổi GDP = 4 × 8 tỷ đô la = 32 tỷ đô la.","Business cycle":"Chu kỳ kinh doanh","The business cycle shows short-run fluctuations of real GDP around its long-term trend: expansion, peak, contraction (recession), trough.":"Chu kỳ kinh doanh cho thấy những biến động ngắn hạn của GDP thực quanh xu hướng dài hạn: mở rộng, đỉnh, thu hẹp (suy thoái), đáy.","Actual growth is the change in real GDP; potential growth is the trend. Positive output gap = above trend (inflation pressure). Negative output gap = below trend (spare capacity and unemployment). A recession is typically two consecutive quarters of falling GDP.":"Tăng trưởng thực tế là thay đổi của GDP thực; tăng trưởng tiềm năng là xu hướng. Chênh lệch sản lượng dương = trên xu hướng (áp lực lạm phát). Chênh lệch sản lượng âm = dưới xu hướng (công suất dư thừa và thất nghiệp). Suy thoái thường là hai quý liên tiếp GDP giảm.","Draw a dashed upward trend line (long-term growth).":"Vẽ một đường xu hướng đi lên nét đứt (tăng trưởng dài hạn).","Draw a wave around it.":"Vẽ một đường sóng quanh nó.","Label peak, trough, expansion and contraction.":"Ghi nhãn đỉnh, đáy, mở rộng và thu hẹp.","Distinguish actual growth (the cycle) from potential growth (the trend).":"Phân biệt tăng trưởng thực tế (chu kỳ) với tăng trưởng tiềm năng (xu hướng).","Policy goal: smooth the cycle with stabilisers and counter-cyclical policy.":"Mục tiêu chính sách: làm mượt chu kỳ bằng các bộ ổn định và chính sách ngược chu kỳ.","Distinguish between a recession and a depression.":"Phân biệt giữa suy thoái và đại suy thoái.","A recession is a period of falling real GDP, often two consecutive quarters. A depression is a very deep and prolonged slump with severe unemployment, often lasting years.":"Suy thoái là giai đoạn GDP thực giảm, thường là hai quý liên tiếp. Đại suy thoái là sự sụt giảm rất sâu và kéo dài với thất nghiệp nghiêm trọng, thường kéo dài nhiều năm.","Phillips curve":"Đường Phillips","The short-run Phillips curve (SRPC) shows a trade-off between unemployment and inflation. The long-run Phillips curve (LRPC) is vertical at the natural rate of unemployment (NRU).":"Đường Phillips ngắn hạn (SRPC) cho thấy sự đánh đổi giữa thất nghiệp và lạm phát. Đường Phillips dài hạn (LRPC) thẳng đứng tại tỷ lệ thất nghiệp tự nhiên (NRU).","Moving along SRPC: faster AD growth lowers unemployment but raises inflation. If workers expect higher inflation, the SRPC shifts up. In the long run you cannot buy lower unemployment with higher inflation: the LRPC is vertical.":"Di chuyển dọc SRPC: AD tăng nhanh hơn làm giảm thất nghiệp nhưng tăng lạm phát. Nếu người lao động kỳ vọng lạm phát cao hơn, SRPC dịch lên. Trong dài hạn bạn không thể đổi lạm phát cao hơn lấy thất nghiệp thấp hơn: LRPC thẳng đứng.","Draw a downward-sloping curve convex to the origin: SRPC.":"Vẽ một đường cong dốc xuống lồi về phía gốc tọa độ: SRPC.","Draw a vertical LRPC at the NRU.":"Vẽ LRPC thẳng đứng tại NRU.","Show a shift of SRPC when expected inflation changes.":"Thể hiện sự dịch chuyển của SRPC khi lạm phát kỳ vọng thay đổi.","Stagflation (high inflation and high unemployment) in the 1970s showed that the trade-off is not stable.":"Lạm phát đình trệ (lạm phát cao và thất nghiệp cao) những năm 1970 cho thấy sự đánh đổi này không ổn định.","Link it to AD–AS: AD up means lower unemployment and higher inflation.":"Liên hệ với AD–AS: AD tăng nghĩa là thất nghiệp thấp hơn và lạm phát cao hơn.","Explain why the long-run Phillips curve is vertical.":"Giải thích vì sao đường Phillips dài hạn thẳng đứng.","In the long run people adjust their expectations of inflation, so any inflation above expectations disappears. Unemployment returns to the natural rate regardless of the inflation rate, so the curve is vertical.":"Trong dài hạn mọi người điều chỉnh kỳ vọng về lạm phát, nên mọi mức lạm phát vượt kỳ vọng biến mất. Thất nghiệp trở về tỷ lệ tự nhiên bất kể tỷ lệ lạm phát, nên đường này thẳng đứng.","Lorenz curve and Gini":"Đường Lorenz và hệ số Gini","The Lorenz curve plots the cumulative share of income against the cumulative share of households (poorest first). The Gini coefficient measures inequality from it.":"Đường Lorenz biểu diễn tỷ trọng thu nhập lũy kế so với tỷ trọng hộ gia đình lũy kế (từ nghèo nhất). Hệ số Gini đo mức bất bình đẳng từ đó.","The 45° line is perfect equality. The further the curve bows below it, the more unequal the distribution. Gini = area A ÷ (A + B) where A is the area between the line and the curve. Gini 0 = equality; 1 = one person has everything.":"Đường 45° là bình đẳng hoàn toàn. Đường cong càng võng xuống dưới đường đó thì phân phối càng bất bình đẳng. Gini = diện tích A ÷ (A + B) trong đó A là diện tích giữa đường thẳng và đường cong. Gini 0 = bình đẳng; 1 = một người có tất cả.","Draw a square with the 45° line of equality.":"Vẽ một hình vuông với đường bình đẳng 45°.","Draw a curve below it that starts and ends on the diagonal corners.":"Vẽ một đường cong bên dưới, bắt đầu và kết thúc tại các góc của đường chéo.","Shade the area between the line and the curve (A).":"Tô vùng giữa đường thẳng và đường cong (A).","Use it to compare countries or time periods. Lorenz curves can cross, so Gini alone can hide differences.":"Dùng nó để so sánh các quốc gia hoặc các thời kỳ. Các đường Lorenz có thể cắt nhau, nên chỉ riêng Gini có thể che giấu sự khác biệt.","Link to taxation: progressive taxes and transfers move the curve toward the line.":"Liên hệ với thuế: thuế lũy tiến và chuyển giao thu nhập đưa đường cong về gần đường thẳng.","Explain what a Gini coefficient of 0.45 means.":"Giải thích hệ số Gini 0,45 có nghĩa là gì.","Income is quite unequal: the Lorenz curve lies well below the line of equality. A Gini of 0 would be perfect equality and 1 would be perfect inequality, so 0.45 shows considerable income inequality.":"Thu nhập khá bất bình đẳng: đường Lorenz nằm thấp hơn nhiều so với đường bình đẳng. Gini bằng 0 là bình đẳng hoàn toàn và 1 là bất bình đẳng hoàn toàn, nên 0,45 cho thấy mức bất bình đẳng thu nhập đáng kể.","Tariff":"Thuế quan","A tax on imported goods. It raises the domestic price above the world price and protects domestic producers.":"Thuế đánh vào hàng nhập khẩu. Nó nâng giá trong nước lên trên giá thế giới và bảo hộ các nhà sản xuất trong nước.","With free trade the country buys at the world price Pw. A tariff raises the price to Pw + t: domestic output rises, consumption falls, imports fall. The government gains revenue, but there are two deadweight-loss triangles (inefficient production and lost consumption).":"Với thương mại tự do, quốc gia mua ở giá thế giới Pw. Thuế quan nâng giá lên Pw + t: sản lượng trong nước tăng, tiêu dùng giảm, nhập khẩu giảm. Chính phủ có thu nhập, nhưng có hai tam giác tổn thất vô ích (sản xuất kém hiệu quả và tiêu dùng bị mất).","Draw domestic D and S and a horizontal world price Pw.":"Vẽ D và S trong nước và đường giá thế giới Pw nằm ngang.","Draw a second horizontal line Pw + tariff.":"Vẽ đường ngang thứ hai Pw + thuế quan.","Label Q1–Q4. Imports = Qd − Qs. Shade revenue and the two DWL triangles.":"Ghi nhãn Q1–Q4. Nhập khẩu = Qd − Qs. Tô doanh thu và hai tam giác tổn thất vô ích.","Winners: domestic producers, government. Losers: consumers, export industries (retaliation).":"Người được lợi: nhà sản xuất trong nước, chính phủ. Người thiệt: người tiêu dùng, các ngành xuất khẩu (bị trả đũa).","Arguments for: infant industry, jobs, national security, anti-dumping. Against: higher prices, inefficiency, trade wars.":"Lập luận ủng hộ: ngành công nghiệp non trẻ, việc làm, an ninh quốc gia, chống bán phá giá. Lập luận phản đối: giá cao hơn, kém hiệu quả, chiến tranh thương mại.","Explain two effects of a tariff on a country's consumers.":"Giải thích hai tác động của thuế quan đối với người tiêu dùng của một quốc gia.","1) Higher price: the tariff pushes the domestic price above the world price. 2) Lower consumption and consumer surplus: fewer units are bought at the higher price, and the lost surplus partly becomes tariff revenue and partly deadweight loss.":"1) Giá cao hơn: thuế quan đẩy giá trong nước lên trên giá thế giới. 2) Tiêu dùng và thặng dư người tiêu dùng giảm: ít đơn vị được mua hơn ở mức giá cao, và phần thặng dư mất đi một phần thành thu thuế quan, một phần thành tổn thất vô ích.","Import quota":"Hạn ngạch nhập khẩu","A quota is a physical limit on the quantity of a good that can be imported in a given period.":"Hạn ngạch là giới hạn về lượng của một hàng hóa có thể nhập khẩu trong một thời kỳ nhất định.","Like a tariff, a quota raises the domestic price above the world price, protects domestic producers and cuts consumption. Unlike a tariff, the government collects no revenue. The gap between the new price and the world price on the permitted imports is a quota rent, kept by whoever holds the import licences.":"Giống thuế quan, hạn ngạch nâng giá trong nước lên trên giá thế giới, bảo hộ nhà sản xuất trong nước và cắt giảm tiêu dùng. Khác với thuế quan, chính phủ không thu được doanh thu. Phần chênh lệch giữa giá mới và giá thế giới trên lượng nhập khẩu được phép là tô hạn ngạch, thuộc về người nắm giữ giấy phép nhập khẩu.","Draw domestic D and S and the world price Pw.":"Vẽ D và S trong nước và giá thế giới Pw.","Add the quota to domestic supply: S + quota, a kinked curve starting where S meets Pw.":"Thêm hạn ngạch vào cung trong nước: S + hạn ngạch, một đường gấp khúc bắt đầu tại nơi S gặp Pw.","Find the new price where D meets S + quota. Imports = Qd − Qs. Shade the quota rent and the two deadweight-loss triangles.":"Tìm giá mới tại nơi D gặp S + hạn ngạch. Nhập khẩu = Qd − Qs. Tô tô hạn ngạch và hai tam giác tổn thất vô ích.","Compare with a tariff on the same diagram: the price and quantities can be identical, but the rectangle goes to licence holders (often foreign firms), not the government.":"So sánh với thuế quan trên cùng sơ đồ: giá và lượng có thể giống hệt nhau, nhưng hình chữ nhật thuộc về người giữ giấy phép (thường là doanh nghiệp nước ngoài), không phải chính phủ.","Evaluate: retaliation, higher prices for consumers, black-market licences, and the jobs protected.":"Đánh giá: bị trả đũa, giá cao hơn cho người tiêu dùng, giấy phép chợ đen và số việc làm được bảo vệ.","Explain one difference between a tariff and a quota.":"Giải thích một điểm khác nhau giữa thuế quan và hạn ngạch.","A tariff raises revenue for the government because it is a tax on each import. A quota is a quantity limit, so the extra price on imports is a quota rent that goes to the importers or licence holders, not to the government.":"Thuế quan tạo doanh thu cho chính phủ vì là thuế đánh vào mỗi đơn vị nhập khẩu. Hạn ngạch là giới hạn về lượng, nên phần giá tăng thêm trên hàng nhập khẩu là tô hạn ngạch thuộc về nhà nhập khẩu hoặc người giữ giấy phép, không thuộc về chính phủ.","Exchange rate determination":"Xác định tỷ giá hối đoái","The exchange rate is the price of one currency in terms of another. In a floating system it is set by the demand for and supply of the currency.":"Tỷ giá hối đoái là giá của một đồng tiền tính theo đồng tiền khác. Trong chế độ thả nổi, nó được xác định bởi cầu và cung của đồng tiền.","Demand for the currency comes from exports, foreign investment and speculation. Supply comes from imports and outward investment. A rise in value is appreciation; a fall is depreciation. A weaker currency makes exports cheaper and imports dearer.":"Cầu về đồng tiền đến từ xuất khẩu, đầu tư nước ngoài và đầu cơ. Cung đến từ nhập khẩu và đầu tư ra nước ngoài. Giá trị tăng gọi là lên giá (appreciation); giảm gọi là mất giá (depreciation). Đồng tiền yếu hơn làm xuất khẩu rẻ hơn và nhập khẩu đắt hơn.","Label the vertical axis as the price of the currency (for example € per $).":"Ghi nhãn trục tung là giá của đồng tiền (ví dụ € trên mỗi $).","Draw D and S of the currency crossing at the equilibrium rate.":"Vẽ D và S của đồng tiền cắt nhau tại tỷ giá cân bằng.","Shift D or S and label the new rate.":"Dịch D hoặc S và ghi nhãn tỷ giá mới.","Causes of appreciation: higher interest rates (hot money), strong export demand, lower relative inflation.":"Nguyên nhân khiến đồng tiền lên giá: lãi suất cao hơn (dòng tiền nóng), cầu xuất khẩu mạnh, lạm phát tương đối thấp hơn.","Evaluate with the Marshall–Lerner condition: depreciation improves the current account only if PED exports + PED imports > 1.":"Đánh giá bằng điều kiện Marshall–Lerner: giảm giá chỉ cải thiện cán cân vãng lai nếu PED xuất khẩu + PED nhập khẩu > 1.","Explain how higher interest rates can lead to appreciation of a currency.":"Giải thích lãi suất cao hơn có thể dẫn đến việc đồng tiền tăng giá như thế nào.","Higher interest rates attract foreign savers, who need the domestic currency to deposit funds. Demand for the currency rises, D shifts right, and the exchange rate appreciates.":"Lãi suất cao hơn thu hút người gửi tiền nước ngoài, họ cần nội tệ để gửi. Cầu về đồng tiền tăng, D dịch sang phải và đồng tiền lên giá.","The Marshall–Lerner condition and the J-curve":"Điều kiện Marshall–Lerner và đường cong J","The Marshall–Lerner condition says a depreciation improves the current account only if the sum of the price elasticities of demand for exports and imports is greater than 1 (PEDx + PEDm > 1). The J-curve shows the short-run worsening before the improvement.":"Điều kiện Marshall–Lerner nói rằng việc đồng tiền mất giá chỉ cải thiện cán cân vãng lai nếu tổng độ co giãn của cầu theo giá đối với xuất khẩu và nhập khẩu lớn hơn 1 (PEDx + PEDm > 1). Đường cong J cho thấy sự xấu đi ngắn hạn trước khi cải thiện.","After a depreciation, import prices rise at once but quantities adjust slowly because contracts and habits take time to change. In the short run demand is inelastic, so the import bill rises more than export earnings and the current account gets worse. As demand becomes more elastic over time, volumes respond, and if PEDx + PEDm > 1 the balance improves beyond its starting point. If the sum is below 1 it never recovers.":"Sau khi đồng tiền mất giá, giá nhập khẩu tăng ngay nhưng lượng điều chỉnh chậm vì hợp đồng và thói quen cần thời gian để thay đổi. Trong ngắn hạn cầu kém co giãn, nên hóa đơn nhập khẩu tăng nhiều hơn thu nhập xuất khẩu và cán cân vãng lai xấu đi. Khi cầu trở nên co giãn hơn theo thời gian, khối lượng phản ứng, và nếu PEDx + PEDm > 1 thì cán cân cải thiện vượt điểm xuất phát. Nếu tổng nhỏ hơn 1 thì nó không bao giờ phục hồi.","Draw time on the horizontal axis and the current account balance on the vertical axis, with a line at zero.":"Vẽ thời gian trên trục hoành và cán cân vãng lai trên trục tung, với một đường tại mức không.","Start the curve at an existing deficit, dip below it after the depreciation, then rise through the starting level.":"Bắt đầu đường cong tại mức thâm hụt hiện có, lún xuống dưới nó sau khi đồng tiền mất giá, rồi tăng lên qua mức ban đầu.","Label the shape a J and mark the turning point.":"Gọi tên hình dạng là chữ J và đánh dấu điểm ngoặt.","State the condition exactly: PEDx + PEDm > 1.":"Nêu chính xác điều kiện: PEDx + PEDm > 1.","Explain why the short run is worse: inelastic demand and existing contracts. Explain why the long run is better: more elastic demand as consumers and firms switch.":"Giải thích vì sao ngắn hạn tệ hơn: cầu kém co giãn và các hợp đồng hiện có. Giải thích vì sao dài hạn tốt hơn: cầu co giãn hơn khi người tiêu dùng và doanh nghiệp chuyển đổi.","Evaluate with inflation and other changes that can offset the gain, and with how quickly each country adjusts.":"Đánh giá cùng với lạm phát và các thay đổi khác có thể bù đắp lợi ích, và tốc độ điều chỉnh của mỗi quốc gia.","Explain why a currency depreciation may worsen the current account in the short run.":"Giải thích vì sao việc đồng tiền mất giá có thể làm xấu đi cán cân vãng lai trong ngắn hạn.","Import prices rise straight away, but the quantities of imports and exports are slow to change because of existing contracts and habits, so short-run demand is inelastic. The import bill therefore rises by more than export revenue and the balance worsens, giving the first downward part of the J-curve.":"Giá nhập khẩu tăng ngay lập tức, nhưng lượng nhập khẩu và xuất khẩu thay đổi chậm do các hợp đồng và thói quen hiện có, nên cầu ngắn hạn kém co giãn. Vì vậy hóa đơn nhập khẩu tăng nhiều hơn doanh thu xuất khẩu và cán cân xấu đi, tạo ra phần đi xuống đầu tiên của đường cong J.","Sections":"Mục trong trang","Contents":"Mục lục","Next topic":"Chủ đề tiếp theo","Skip to content":"Bỏ qua đến nội dung","Start here":"Bắt đầu tại đây","Course home":"Trang chủ khóa học","done":"xong","No match.":"Không có kết quả.","Search results":"Kết quả tìm kiếm","Marked as studied.":"Đã đánh dấu là đã học.","Removed from studied.":"Đã bỏ khỏi danh sách đã học.","Undo":"Hoàn tác","Citation copied.":"Đã sao chép trích dẫn.","Got it":"Đã làm được","Nothing to review yet. Mark a question with \"Review again\" and it will appear here.":"Chưa có gì cần ôn. Hãy đánh dấu một câu hỏi bằng \"Ôn lại\" và nó sẽ xuất hiện ở đây.","Everything is studied. Try the":"Mọi chủ đề đã được học. Hãy thử","self-test":"bài tự kiểm tra","marked to review in the self-test":"được đánh dấu cần ôn trong bài tự kiểm tra","Quantity":"Lượng","Output":"Sản lượng","Time":"Thời gian","Normal":"Bình thường","Demand":"Cầu","Supply":"Cung","Key":"Chú giải","Equality":"Bình đẳng","Trend":"Xu hướng","Consumers":"Người tiêu dùng","Producers":"Nhà sản xuất","Loss":"Lỗ","Revenue":"Doanh thu","Rent":"Tô","Cost":"Chi phí","econ app":"econ app","Search":"Tìm kiếm","Topic":"Chủ đề","Hide":"Ẩn"};

b>. Consumer surplus = <b>#</b>, producer surplus = <b>#</b>.":"Pe = <b>#</b>, Qe = <b>#</b>. Thặng dư người tiêu dùng = <b>#</b>, thặng dư nhà sản xuất = <b>#</b>.","Qd = <b>#</b>, Qs = <b>#</b>: shortage of <b>#</b>. Hatched area = deadweight loss.":"Qd = <b>#</b>, Qs = <b>#</b>: thiếu hụt <b>#</b>. Vùng gạch chéo = tổn thất vô ích.","The ceiling is at or above equilibrium, so it is <b>non-binding</b>. Move it below #.":"Giá trần ở mức bằng hoặc trên cân bằng, nên nó <b>không ràng buộc</b>. Hãy đặt nó dưới #.","Qd = <b>#</b>, Qs = <b>#</b>: surplus of <b>#</b>. Hatched area = deadweight loss.":"Qd = <b>#</b>, Qs = <b>#</b>: dư thừa <b>#</b>. Vùng gạch chéo = tổn thất vô ích.","The floor is at or below equilibrium, so it is <b>non-binding</b>. Move it above #.":"Giá sàn ở mức bằng hoặc dưới cân bằng, nên nó <b>không ràng buộc</b>. Hãy đặt nó trên #.","Consumers pay <b>#</b>, producers keep <b>#</b>. Consumer burden <b>#</b>, producer burden <b>#</b>, tax revenue <b>#</b>. Quantity falls to <b>#</b>.":"Người tiêu dùng trả <b>#</b>, nhà sản xuất giữ <b>#</b>. Gánh nặng người tiêu dùng <b>#</b>, gánh nặng nhà sản xuất <b>#</b>, thu thuế <b>#</b>. Lượng giảm xuống <b>#</b>.","Increase the tax to see the burden split.":"Hãy tăng thuế để thấy cách chia gánh nặng.","Consumers pay <b>#</b>, producers receive <b>#</b>. Quantity <b># → #</b>. Government cost = <b>#</b>.":"Người tiêu dùng trả <b>#</b>, nhà sản xuất nhận <b>#</b>. Lượng <b># → #</b>. Chi phí của chính phủ = <b>#</b>.","Increase the subsidy to see the effect.":"Hãy tăng trợ cấp để thấy tác động.","Market output <b>#</b> versus socially optimal <b>#</b>: overproduction of <b>#</b>. Welfare loss (hatched) = <b>#</b>.":"Sản lượng thị trường <b>#</b> so với tối ưu xã hội <b>#</b>: sản xuất quá mức <b>#</b>. Tổn thất phúc lợi (gạch chéo) = <b>#</b>.","Raise the external cost to open a gap between MPC and MSC.":"Hãy tăng chi phí ngoại tác để tạo khoảng cách giữa MPC và MSC.","Market output <b>#</b> versus socially optimal <b>#</b>: underconsumption of <b>#</b>. Welfare loss (hatched) = <b>#</b>.":"Sản lượng thị trường <b>#</b> so với tối ưu xã hội <b>#</b>: tiêu dùng thiếu <b>#</b>. Tổn thất phúc lợi (gạch chéo) = <b>#</b>.","Raise the external benefit to open a gap between MPB and MSB.":"Hãy tăng lợi ích ngoại tác để tạo khoảng cách giữa MPB và MSB.","Point C lies <b>outside</b> the PPC. It is <b>unattainable</b> with current resources. A lies inside the curve (unemployed or inefficiently used resources), B lies on it (efficient) and C lies outside it.":"Điểm C nằm <b>ngoài</b> PPC. Nó <b>không thể đạt được</b> với nguồn lực hiện có. A nằm bên trong đường cong (nguồn lực thất nghiệp hoặc sử dụng kém hiệu quả), B nằm trên đường (hiệu quả) và C nằm bên ngoài.","Point C lies <b>inside</b> the PPC. Growth has made it <b>attainable</b>. A lies inside the curve (unemployed or inefficiently used resources), B lies on it (efficient) and C lies outside it.":"Điểm C nằm <b>trong</b> PPC. Tăng trưởng đã làm nó <b>có thể đạt được</b>. A nằm bên trong đường cong (nguồn lực thất nghiệp hoặc sử dụng kém hiệu quả), B nằm trên đường (hiệu quả) và C nằm bên ngoài.","Minimum ATC is <b>#</b> at output <b>#</b>, where MC cuts ATC. More fixed costs push ATC up and move its minimum to the right.":"ATC tối thiểu là <b>#</b> tại sản lượng <b>#</b>, nơi MC cắt ATC. Chi phí cố định cao hơn đẩy ATC lên và dịch điểm thấp nhất của nó sang phải.","Q* = <b>#</b> where MC = MR. ATC = <b>#</b>. Supernormal profit <b>#</b>. New firms enter.":"Q* = <b>#</b> tại MC = MR. ATC = <b>#</b>. Lợi nhuận siêu ngạch <b>#</b>. Các doanh nghiệp mới gia nhập.","The price (#) is below the lowest AVC (#): the firm <b>shuts down</b> in the short run and loses its fixed costs (#).":"Giá (#) thấp hơn AVC thấp nhất (#): doanh nghiệp <b>ngừng sản xuất</b> trong ngắn hạn và mất chi phí cố định của mình (#).","Q* = <b>#</b> where MC = MR. ATC = <b>#</b>. Loss of <b>#</b>, but P covers AVC so it keeps producing short run.":"Q* = <b>#</b> tại MC = MR. ATC = <b>#</b>. Lỗ <b>#</b>, nhưng P bù được AVC nên doanh nghiệp vẫn tiếp tục sản xuất trong ngắn hạn.","Qm = <b>#</b>, Pm = <b>#</b>. Supernormal profit <b>#</b> (green). Competitive output would be <b>#</b>. Hatched = deadweight loss.":"Qm = <b>#</b>, Pm = <b>#</b>. Lợi nhuận siêu ngạch <b>#</b> (màu xanh). Sản lượng cạnh tranh sẽ là <b>#</b>. Gạch chéo = tổn thất vô ích.","Real GDP = <b>#</b> (full employment at #), price level <b>#</b>. There is spare capacity, so a deflationary gap of <b>#</b>.":"GDP thực = <b>#</b> (toàn dụng tại #), mức giá <b>#</b>. Có công suất dư thừa, nên có chênh lệch giảm phát <b>#</b>.","Real GDP = <b>#</b> (full employment at #), price level <b>#</b>. Output fell: recession risk.":"GDP thực = <b>#</b> (toàn dụng tại #), mức giá <b>#</b>. Sản lượng giảm: nguy cơ suy thoái.","Economy is at full employment (Yf = #), price level <b>#</b>.":"Nền kinh tế ở mức toàn dụng (Yf = #), mức giá <b>#</b>.","Real GDP <b>#</b> is below Yf: <b>recessionary (deflationary) gap</b> of #. In the long run the economy returns to Yf at price level ≈ #.":"GDP thực <b>#</b> thấp hơn Yf: <b>chênh lệch suy thoái (giảm phát)</b> #. Trong dài hạn nền kinh tế trở về Yf tại mức giá ≈ #.","Real GDP <b>#</b> is above Yf: <b>inflationary gap</b> of #. Pressure on wages pulls it back to Yf at a price level ≈ #.":"GDP thực <b>#</b> cao hơn Yf: <b>chênh lệch lạm phát</b> #. Áp lực tiền lương kéo nó về Yf tại mức giá ≈ #.","Phase: <b>Expansion (recovery)</b>. Output gap: <b>positive</b> (actual GDP above trend). Inflationary pressure builds.":"Giai đoạn: <b>Mở rộng (phục hồi)</b>. Chênh lệch sản lượng: <b>dương</b> (GDP thực tế trên xu hướng). Áp lực lạm phát tăng.","Phase: <b>Expansion (recovery)</b>. Output gap: <b>negative</b> (actual GDP below trend). Spare capacity and rising unemployment.":"Giai đoạn: <b>Mở rộng (phục hồi)</b>. Chênh lệch sản lượng: <b>âm</b> (GDP thực tế dưới xu hướng). Công suất dư thừa và thất nghiệp tăng.","Phase: <b>Contraction (recession)</b>. Output gap: <b>negative</b> (actual GDP below trend). Spare capacity and rising unemployment.":"Giai đoạn: <b>Thu hẹp (suy thoái)</b>. Chênh lệch sản lượng: <b>âm</b> (GDP thực tế dưới xu hướng). Công suất dư thừa và thất nghiệp tăng.","Phase: <b>Contraction (recession)</b>. Output gap: <b>positive</b> (actual GDP above trend). Inflationary pressure builds.":"Giai đoạn: <b>Thu hẹp (suy thoái)</b>. Chênh lệch sản lượng: <b>dương</b> (GDP thực tế trên xu hướng). Áp lực lạm phát tăng.","At <b>#%</b> unemployment, inflation is <b>#%</b>. Below the NRU: the economy is overheating. Raising expected inflation shifts the whole SRPC up.":"Với thất nghiệp <b>#%</b>, lạm phát là <b>#%</b>. Dưới NRU: nền kinh tế quá nóng. Lạm phát kỳ vọng tăng sẽ dịch cả đường SRPC lên.","At <b>#%</b> unemployment, inflation is <b>#%</b>. Above the NRU: spare capacity holds inflation down. Raising expected inflation shifts the whole SRPC up.":"Với thất nghiệp <b>#%</b>, lạm phát là <b>#%</b>. Trên NRU: công suất dư thừa giữ lạm phát ở mức thấp. Lạm phát kỳ vọng tăng sẽ dịch cả đường SRPC lên.","Gini coefficient = <b>#</b>. The poorest #% hold <b>#%</b> of income.":"Hệ số Gini = <b>#</b>. #% nghèo nhất nắm giữ <b>#%</b> thu nhập.","The currency <b>appreciates</b> from <b>#</b> to <b>#</b>. Exports become dearer, imports cheaper.":"Đồng tiền <b>lên giá</b> từ <b>#</b> lên <b>#</b>. Xuất khẩu trở nên đắt hơn, nhập khẩu rẻ hơn.","The currency <b>depreciates</b> from <b>#</b> to <b>#</b>. Exports become cheaper, imports dearer.":"Đồng tiền <b>mất giá</b> từ <b>#</b> xuống <b>#</b>. Xuất khẩu trở nên rẻ hơn, nhập khẩu đắt hơn.","The exchange rate is unchanged.":"Tỷ giá hối đoái không thay đổi.","Domestic output <b># → #</b>, consumption <b># → #</b>, imports <b># → #</b>. Tariff revenue (green) = <b>#</b>.":"Sản lượng trong nước <b># → #</b>, tiêu dùng <b># → #</b>, nhập khẩu <b># → #</b>. Thu thuế quan (màu xanh) = <b>#</b>.","Free trade at Pw = #: domestic supply #, demand #, imports <b>#</b>. Add a tariff.":"Thương mại tự do tại Pw = #: cung trong nước #, cầu #, nhập khẩu <b>#</b>. Hãy thêm thuế quan.","New domestic price <b>#</b> (world price #). Imports fall <b># → #</b>. Quota rent (green) = <b>#</b>, kept by licence holders. Hatched = deadweight loss.":"Giá trong nước mới <b>#</b> (giá thế giới #). Nhập khẩu giảm <b># → #</b>. Tô hạn ngạch (màu xanh) = <b>#</b>, do người giữ giấy phép nhận. Gạch chéo = tổn thất vô ích.","A quota of # equals free-trade imports, so it has no effect. Lower it.":"Hạn ngạch # bằng lượng nhập khẩu khi thương mại tự do, nên không có tác dụng. Hãy hạ thấp nó.","k = # ÷ (# − #) = <b>#</b>. A rise of <b>#</b> in investment raises income by <b>#</b> (# = # × #).":"k = # ÷ (# − #) = <b>#</b>. Đầu tư tăng <b>#</b> làm thu nhập tăng <b>#</b> (# = # × #).","At output # the firm is in the range of <b>economies of scale</b>: LRAC falls as output rises.":"Tại sản lượng # doanh nghiệp đang ở vùng <b>tính kinh tế theo quy mô</b>: LRAC giảm khi sản lượng tăng.","At output # the firm is in the range of <b>diseconomies of scale</b>: LRAC rises as output rises.":"Tại sản lượng # doanh nghiệp đang ở vùng <b>tính phi kinh tế theo quy mô</b>: LRAC tăng khi sản lượng tăng.","At output # the firm is in the range of the <b>minimum efficient scale</b>: average cost is lowest.":"Tại sản lượng # doanh nghiệp đang ở vùng <b>quy mô hiệu quả tối thiểu</b>: chi phí bình quân thấp nhất.","Surplus of <b>#</b> units. Suppliers cut price (signal), consumers buy more (incentive), until the market clears at #.":"Dư thừa <b>#</b> đơn vị. Người bán giảm giá (tín hiệu), người mua mua nhiều hơn (khuyến khích), cho đến khi thị trường cân bằng tại #.","Shortage of <b>#</b> units. Price rises (rationing), firms supply more (incentive) until the market clears at #.":"Thiếu hụt <b>#</b> đơn vị. Giá tăng (phân phối), doanh nghiệp cung nhiều hơn (khuyến khích) cho đến khi thị trường cân bằng tại #.","The market clears at <b>equilibrium</b>: no surplus or shortage.":"Thị trường cân bằng tại <b>điểm cân bằng</b>: không có dư thừa hay thiếu hụt.","YED = <b>#</b>: a <b>normal good (luxury)</b>, income elastic. Income changes <b>#%</b>, so quantity demanded changes <b>#%</b>.":"YED = <b>#</b>: <b>hàng thông thường (xa xỉ)</b>, co giãn theo thu nhập. Thu nhập thay đổi <b>#%</b>, nên lượng cầu thay đổi <b>#%</b>.","YED = <b>#</b>: an <b>inferior good</b>. Income changes <b>#%</b>, so quantity demanded changes <b>#%</b>.":"YED = <b>#</b>: <b>hàng hóa thứ cấp</b>. Thu nhập thay đổi <b>#%</b>, nên lượng cầu thay đổi <b>#%</b>.","YED = <b>#</b>: a <b>normal good (necessity)</b>, income inelastic. Income changes <b>#%</b>, so quantity demanded changes <b>#%</b>.":"YED = <b>#</b>: <b>hàng thông thường (thiết yếu)</b>, kém co giãn theo thu nhập. Thu nhập thay đổi <b>#%</b>, nên lượng cầu thay đổi <b>#%</b>.","PES at ($#, #) = <b>#</b> (unit elastic). Price changes #%, quantity supplied changes <b>#%</b>.":"PES tại ($#, #) = <b>#</b> (co giãn đơn vị). Giá thay đổi #%, lượng cung thay đổi <b>#%</b>.","PES at ($#, #) = <b>#</b> (elastic). Price changes #%, quantity supplied changes <b>#%</b>.":"PES tại ($#, #) = <b>#</b> (co giãn). Giá thay đổi #%, lượng cung thay đổi <b>#%</b>.","PES at ($#, #) = <b>#</b> (inelastic). Price changes #%, quantity supplied changes <b>#%</b>.":"PES tại ($#, #) = <b>#</b> (kém co giãn). Giá thay đổi #%, lượng cung thay đổi <b>#%</b>.","At <b>$#</b> the <b>snob-value effect</b> dominates: quantity demanded is # and rises as price rises (positive PED).":"Tại <b>$#</b>, <b>hiệu ứng giá trị phô trương</b> chiếm ưu thế: lượng cầu là # và tăng khi giá tăng (PED dương).","At <b>$#</b> the good follows the <b>normal law of demand</b>: quantity #. Raise the price past P₁ = #.":"Tại <b>$#</b>, hàng hóa tuân theo <b>luật cầu thông thường</b>: lượng #. Hãy tăng giá vượt quá P₁ = #.","Consumers pay <b>#</b>, producers keep <b>#</b>. Tax per unit = <b>#</b>, revenue = <b>#</b>, quantity falls to <b>#</b>.":"Người tiêu dùng trả <b>#</b>, nhà sản xuất giữ <b>#</b>. Thuế trên mỗi đơn vị = <b>#</b>, thu thuế = <b>#</b>, lượng giảm xuống <b>#</b>.","Raise the tax rate. The gap between S and S + tax widens at higher prices.":"Hãy tăng thuế suất. Khoảng cách giữa S và S + thuế rộng ra ở mức giá cao hơn.","Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Demand here is elastic (MR positive).":"Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Cầu tại đây co giãn (MR dương).","Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Demand here is inelastic (MR negative).":"Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Cầu tại đây kém co giãn (MR âm).","Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Demand here is unit elastic (MR = #, TR maximum).":"Q = <b>#</b>, AR = <b>#</b>, TR = <b>#</b>, MR = <b>#</b>. Cầu tại đây co giãn đơn vị (MR = #, TR cực đại).","Q* = <b>#</b> where MR = MC, price <b>#</b>, ATC <b>#</b>. <b>Abnormal profit</b> of #: new firms enter and demand shifts left. Long run: entry or exit shifts demand until AR just touches ATC (at about # on this slider).":"Q* = <b>#</b> tại MR = MC, giá <b>#</b>, ATC <b>#</b>. <b>Lợi nhuận bất thường</b> #: doanh nghiệp mới gia nhập và cầu dịch sang trái. Dài hạn: gia nhập hoặc rút lui làm dịch chuyển cầu cho đến khi AR vừa chạm ATC (khoảng # trên thanh trượt này).","Q* = <b>#</b> where MR = MC, price <b>#</b>, ATC <b>#</b>. <b>Loss</b> of #: firms leave and demand shifts right. Long run: entry or exit shifts demand until AR just touches ATC (at about # on this slider).":"Q* = <b>#</b> tại MR = MC, giá <b>#</b>, ATC <b>#</b>. <b>Lỗ</b> #: doanh nghiệp rút lui và cầu dịch sang phải. Dài hạn: gia nhập hoặc rút lui làm dịch chuyển cầu cho đến khi AR vừa chạm ATC (khoảng # trên thanh trượt này).","# workers: TP = <b>#</b>, AP = <b>#</b>, MP = <b>#</b>: <b>increasing marginal returns</b> (MP rising). MP is above AP, so AP is rising.":"# lao động: TP = <b>#</b>, AP = <b>#</b>, MP = <b>#</b>: <b>năng suất cận biên tăng dần</b> (MP đang tăng). MP cao hơn AP, nên AP đang tăng.","# workers: TP = <b>#</b>, AP = <b>#</b>, MP = <b>#</b>: <b>diminishing marginal returns</b> (MP falling). MP is below AP, so AP is falling.":"# lao động: TP = <b>#</b>, AP = <b>#</b>, MP = <b>#</b>: <b>năng suất cận biên giảm dần</b> (MP đang giảm). MP thấp hơn AP, nên AP đang giảm.","# workers: TP = <b>undefined</b>, AP = <b>NaN</b>, MP = <b>NaN</b>: <b>diminishing marginal returns</b> (MP falling). MP is above AP, so AP is rising.":"# lao động: TP = <b>#</b>, AP = <b>#</b>, MP = <b>#</b>: <b>năng suất cận biên giảm dần</b> (MP đang giảm). MP cao hơn AP, nên AP đang tăng.","PEDx + PEDm = <b>#</b>: the Marshall–Lerner condition <b>holds</b>. The balance is now better than its starting level.":"PEDx + PEDm = <b>#</b>: điều kiện Marshall–Lerner <b>được thỏa mãn</b>. Cán cân hiện đã tốt hơn mức ban đầu.","PEDx + PEDm = <b>#</b>: the Marshall–Lerner condition <b>does not hold</b>. Volumes do not respond enough, so the balance stays worse than before the depreciation.":"PEDx + PEDm = <b>#</b>: điều kiện Marshall–Lerner <b>không được thỏa mãn</b>. Khối lượng phản ứng không đủ, nên cán cân vẫn tệ hơn trước khi đồng tiền mất giá.","PEDx + PEDm = <b>#</b>: the Marshall–Lerner condition <b>holds</b>. The balance is now still below its starting level.":"PEDx + PEDm = <b>#</b>: điều kiện Marshall–Lerner <b>được thỏa mãn</b>. Cán cân hiện vẫn thấp hơn mức ban đầu.","PEDx + PEDm = <b>#</b>: the Marshall–Lerner condition <b>holds</b>. Early on the balance is still getting worse (the downward part of the J).":"PEDx + PEDm = <b>#</b>: điều kiện Marshall–Lerner <b>được thỏa mãn</b>. Ban đầu cán cân vẫn đang xấu đi (phần đi xuống của chữ J)."};

function trPat(k){let m;
 if(m=k.match(/^Topic (\S+)$/))return 'Chủ đề '+m[1];
 if(m=k.match(/^Fig\. (\S+):$/))return 'Hình '+m[1]+':';
 if(m=k.match(/^Updated: (.+)$/))return 'Cập nhật: '+vdate(m[1]);
 if(m=k.match(/^Last synced with class materials: (.+)$/))return 'Đồng bộ lần cuối với tài liệu của lớp: '+vdate(m[1]);
 if(m=k.match(/^(\d+) of (\d+) studied$/))return m[1]+'/'+m[2]+' đã học';
 if(m=k.match(/^(\d+) topics, (\d+) studied$/))return m[1]+' chủ đề, '+m[2]+' đã học';
 if(m=k.match(/^(\d+) topics · (\d+) units · HL and SL · (\d+) studied · last synced (.+)$/))return m[1]+' chủ đề · '+m[2]+' phần · HL và SL · '+m[3]+' đã học · đồng bộ lần cuối '+vdate(m[4]);
 if(m=k.match(/^Next: (.+)$/))return 'Tiếp theo: '+tv(m[1]);
 if(m=k.match(/^Continue with (\d+\.\d+) (.+)$/))return 'Tiếp tục với '+m[1]+' '+tv(m[2]);
 if(k.charAt(0)==='›')return '› '+k.slice(1).split('›').map(p=>{p=p.trim();const hl=/ · HL only$/.test(p);const b=hl?p.replace(/ · HL only$/,''):p;return tv(b)+(hl?' · chỉ HL':'')}).join(' › ');
 if(m=k.match(/^, (.+)$/))return ', '+tv(m[1]);
 if((m=k.match(/^(\d+\.\d+) (.+)$/))&&VIDICT[m[2]])return m[1]+' '+VIDICT[m[2]];
 if((m=k.match(/^(.+)\.$/))&&VIDICT[m[1]])return VIDICT[m[1]]+'.';
 return undefined}
function trStr(base){const k=base.trim();if(!k)return base;let v=VIDICT[k];if(v===undefined)v=trPat(k);if(v===undefined)return base;return base.replace(k,()=>v)}

function render(s,uid){
  let o=`<svg viewBox="0 0 460 340" role="img" aria-label="${s.alt||'Economics graph'}"><defs><pattern id="h${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0a3324" stroke-width="2" opacity=".85"/></pattern></defs>`;
  (s.areas||[]).forEach(a=>{const p=a.pts.map(t=>X(t[0]).toFixed(1)+','+Y(t[1]).toFixed(1)).join(' ');
    if(a.cls==='dwl')o+=`<polygon points="${p}" fill="url(#h${uid})" stroke="#0a3324" stroke-width="1"/>`;else o+=`<polygon points="${p}" class="${a.cls}"/>`});
  o+=`<path class="ax" d="M50 18 V300 H442"/>`;
  (s.ticks&&s.ticks.x||[]).forEach(t=>o+=`<line x1="${X(t[0])}" x2="${X(t[0])}" y1="300" y2="305" class="ax"/><text class="lbl" x="${X(t[0])}" y="320" text-anchor="middle">${t[1]}</text>`);
  (s.ticks&&s.ticks.y||[]).forEach(t=>o+=`<line x1="45" x2="50" y1="${Y(t[0])}" y2="${Y(t[0])}" class="ax"/><text class="lbl" x="41" y="${Y(t[0])+4}" text-anchor="end">${t[1]}</text>`);
  (s.curves||[]).forEach(c=>{if(c.pts.length<2)return;
    o+=`<path class="${c.cls}" d="M${c.pts.map(t=>X(t[0]).toFixed(1)+' '+Y(t[1]).toFixed(1)).join(' L')}"/>`;
    if(c.label){let p;if(c.lbl)p=c.lbl;else{const q=c.at==null?c.pts[c.pts.length-1][0]:c.at;let best=c.pts[0];c.pts.forEach(t=>{if(Math.abs(t[0]-q)<Math.abs(best[0]-q))best=t});p=best}
      o+=`<text x="${X(p[0])+6}" y="${Y(p[1])-5}">${c.label}</text>`}});
  (s.pts||[]).forEach(p=>{
    if(!p.nodrop)o+=`<line class="drop" x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.y)}" y2="300"/><line class="drop" x1="50" x2="${X(p.x)}" y1="${Y(p.y)}" y2="${Y(p.y)}"/>`;
    if(p.xl)o+=`<text x="${X(p.x)}" y="318" text-anchor="middle">${p.xl}</text>`;
    if(p.yl)o+=`<text x="44" y="${Y(p.y)+4}" text-anchor="end">${p.yl}</text>`;
    o+=`<circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5"/>`;
    if(p.t)o+=`<text x="${X(p.x)+8}" y="${Y(p.y)-8}">${p.t}</text>`});
  (s.texts||[]).forEach(t=>o+=`<text class="${t.c||''}" x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.a||'start'}">${t.t}</text>`);
  {const ak=AKEY[uid];if(ak)(s.areas||[]).forEach(a=>{const k=ak[a.cls];if(!k||!k[0])return;const xs=a.pts.map(t=>X(t[0])),ys=a.pts.map(t=>Y(t[1]));const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);const cx=xs.reduce((m,v)=>m+v,0)/xs.length,cy=ys.reduce((m,v)=>m+v,0)/ys.length;if(w>=k[0].length*7+8&&h>=18)o+='<text class="alab" x="'+cx.toFixed(1)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="middle">'+k[0]+'</text>'})}
  o+=`<text class="lbl" x="${s.xt?s.xt[0]:445}" y="${s.xt?s.xt[1]:334}" text-anchor="end">${s.xlabel||'Quantity'}</text>`;
  o+=`<text class="lbl" x="56" y="14">${s.ylabel||'Price'}</text></svg>`;
  return o}
