<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="live">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESS Systems Notation, Feedback &amp; Tipping Points (IB ESS 1.2 SL)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./ess-viewer.css">
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-l">
      <span class="hd-badge">Topic 1.2 · SL</span>
      <h1 class="hd-title">Systems Notation, Feedback &amp; Tipping Points</h1>
    </div>
    <div class="vtabs" role="tablist">
      <button type="button" class="on" data-vtab="sym">1. ESS Symbols</button>
      <button type="button" data-vtab="fb">2. Feedback Loops</button>
      <button type="button" data-vtab="tp">3. Tipping Point &amp; Hysteresis</button>
    </div>
    <div class="tb">
      <button type="button" id="btn-theme" aria-pressed="false">Dark</button>
      <button type="button" id="btn-motion" aria-pressed="true">Live</button>
      <button type="button" id="btn-export">Export SVG</button>
    </div>
  </header>

  <div class="ctrl-bar" data-forview="sym">
    <div class="ctrl-grp">
      <label>System type:</label>
      <button type="button" class="ctrl-btn on" data-systype="open">Open System (Forest Ecosystem)</button>
      <button type="button" class="ctrl-btn" data-systype="closed">Closed System (Earth / Biosphere 2)</button>
    </div>
    <span class="ctrl-read" id="sys-read">Exchanges BOTH energy &amp; matter across boundary</span>
  </div>

  <div class="ctrl-bar" data-forview="tp" hidden>
    <div class="ctrl-grp">
      <label for="stress-rng">External Stress (Deforestation / Warming):</label>
      <input type="range" id="stress-rng" min="0" max="100" value="25">
      <output id="stress-out">25%</output>
    </div>
    <button type="button" class="ctrl-btn" id="stress-reset">Reset to Basin 1</button>
    <span class="ctrl-read" id="tp-read">Stable Rainforest (Negative feedback holding)</span>
  </div>

  <main class="stage" id="stage">
    <svg class="esvg" data-view="sym" viewBox="0 0 920 400" role="img" aria-label="ESS 1.2.3 Systems Symbols Open vs Closed">
      <defs>
        <marker id="ma-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--accent2)"/>
        </marker>
        <marker id="ma-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--blue)"/>
        </marker>
        <marker id="ma-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--amber)"/>
        </marker>
        <marker id="ma-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--red)"/>
        </marker>
      </defs>
      <g class="vp">
        <rect x="200" y="34" width="520" height="316" rx="14" fill="var(--surface)" fill-opacity="0.7" stroke="var(--ink)" stroke-width="2" stroke-dasharray="8 6" data-tip="boundary"/>
        <text x="460" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">SYSTEM BOUNDARY (Dashed line separates system from surroundings)</text>

        <g data-tip="energy_in">
          <circle cx="80" cy="115" r="24" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2"/>
          <path d="M80,82 L80,75 M80,155 L80,148 M47,115 L40,115 M120,115 L113,115" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"/>
          <text x="80" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="var(--amber)">SUN</text>
          <path class="flow-anim" d="M108,115 L254,115" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#ma-a)"/>
          <text x="155" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="var(--amber)">Light Energy IN</text>
        </g>

        <g id="matter-in" data-tip="matter_io">
          <path class="flow-anim" d="M75,260 L254,260" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#ma-b)"/>
          <text x="142" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="var(--blue)">Matter IN (Rain / N)</text>
          <g id="block-in" hidden>
            <circle cx="200" cy="260" r="13" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2"/>
            <text x="200" y="264" text-anchor="middle" font-size="12" font-weight="800" fill="var(--red)">X</text>
          </g>
        </g>

        <g data-tip="storage">
          <rect x="264" y="84" width="210" height="86" rx="4" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="2.5"/>
          <text x="369" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent)">Producers (Biomass)</text>
          <text x="369" y="138" text-anchor="middle" font-size="11.5" fill="var(--ink)">STORAGE (Stock Box)</text>
          <text x="369" y="154" text-anchor="middle" font-size="10.5" fill="var(--muted)">Box size scales with magnitude</text>
        </g>

        <g data-tip="storage">
          <rect x="284" y="228" width="170" height="72" rx="4" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2.2"/>
          <text x="369" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--blue)">Soil &amp; Water Store</text>
          <text x="369" y="278" text-anchor="middle" font-size="11" fill="var(--ink)">STORAGE (Matter Pool)</text>
        </g>

        <g data-tip="storage">
          <rect x="540" y="148" width="142" height="68" rx="4" fill="var(--warm)" stroke="var(--ink)" stroke-width="2"/>
          <text x="611" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Consumers</text>
          <text x="611" y="196" text-anchor="middle" font-size="11" fill="var(--muted)">Smaller Storage</text>
        </g>

        <g data-tip="transformation">
          <path class="flow-anim" d="M369,226 L369,176" fill="none" stroke="var(--accent2)" stroke-width="2.6" marker-end="url(#ma-g)"/>
          <polygon points="369,188 380,199 369,210 358,199" fill="var(--surface)" stroke="var(--accent2)" stroke-width="2"/>
          <text x="390" y="203" font-size="11" font-weight="700" fill="var(--accent)">Transformation: Photosynthesis</text>
        </g>

        <g data-tip="transfer">
          <path class="flow-anim" d="M476,132 C520,132 548,136 580,145" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ma-g)"/>
          <text x="546" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Transfer: Feeding</text>
          <path class="flow-anim" d="M565,218 C525,252 486,260 458,260" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#ma-b)"/>
          <text x="530" y="256" font-size="10.5" font-weight="600" fill="var(--muted)">Litter fall / decay</text>
        </g>

        <g data-tip="heat_out">
          <path class="flow-anim" d="M684,166 L810,115" fill="none" stroke="var(--red)" stroke-width="2.6" marker-end="url(#ma-r)"/>
          <line x1="825" y1="98" x2="865" y2="98" stroke="var(--red)" stroke-width="2.5"/>
          <line x1="831" y1="106" x2="859" y2="106" stroke="var(--red)" stroke-width="2"/>
          <line x1="838" y1="114" x2="852" y2="114" stroke="var(--red)" stroke-width="2"/>
          <text x="845" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="var(--red)">Respiration Heat OUT</text>
          <text x="845" y="149" text-anchor="middle" font-size="10" fill="var(--muted)">(2nd Law)</text>
        </g>

        <g id="matter-out" data-tip="matter_io">
          <path class="flow-anim" d="M456,282 L810,282" fill="none" stroke="var(--blue)" stroke-width="2.8" marker-end="url(#ma-b)"/>
          <text x="815" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="var(--blue)">Matter OUT (Runoff)</text>
          <g id="block-out" hidden>
            <circle cx="720" cy="282" r="13" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2"/>
            <text x="720" y="286" text-anchor="middle" font-size="12" font-weight="800" fill="var(--red)">X</text>
          </g>
        </g>
      </g>
    </svg>

    <svg class="esvg" data-view="fb" viewBox="0 0 920 400" hidden role="img" aria-label="ESS 1.2.8 Negative vs 1.2.10 Positive Feedback Loops">
      <defs>
        <marker id="fb-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--accent2)"/>
        </marker>
        <marker id="fb-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--red)"/>
        </marker>
      </defs>
      <g class="vp">
        <g data-tip="neg_fb">
          <rect x="34" y="28" width="405" height="330" rx="14" fill="var(--surface)" fill-opacity="0.7" stroke="var(--accent2)" stroke-width="1.8"/>
          <text x="236" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--accent)">NEGATIVE FEEDBACK (Stabilizing)</text>

          <circle cx="236" cy="198" r="34" fill="var(--green-bg)" stroke="var(--accent2)" stroke-width="2.5"/>
          <text x="236" y="196" text-anchor="middle" font-size="20" font-weight="800" fill="var(--accent)">B</text>
          <text x="236" y="213" text-anchor="middle" font-size="8.2" font-weight="700" fill="var(--accent)">BALANCING</text>

          <ellipse cx="236" cy="96" rx="84" ry="24" fill="var(--warm)" stroke="var(--accent)" stroke-width="2"/>
          <text x="236" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Prey Population</text>

          <ellipse cx="236" cy="300" rx="88" ry="24" fill="var(--warm)" stroke="var(--accent)" stroke-width="2"/>
          <text x="236" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Predator Population</text>

          <path class="flow-anim" d="M322,102 C386,130 386,266 326,294" fill="none" stroke="var(--accent2)" stroke-width="3" marker-end="url(#fb-g)"/>
          <circle cx="366" cy="194" r="14" fill="var(--green-bg)" stroke="var(--accent2)" stroke-width="2"/>
          <text x="366" y="199" text-anchor="middle" font-size="16" font-weight="800" fill="var(--accent)">+</text>
          <text x="366" y="226" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">More food</text>

          <path class="flow-anim" d="M146,294 C86,266 86,130 150,102" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#fb-g)"/>
          <circle cx="106" cy="194" r="14" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2"/>
          <text x="106" y="199" text-anchor="middle" font-size="18" font-weight="800" fill="var(--blue)">-</text>
          <text x="106" y="226" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">More hunting</text>

          <text x="236" y="346" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--muted)">Maintains steady-state equilibrium around K</text>
        </g>

        <g data-tip="pos_fb">
          <rect x="480" y="28" width="406" height="330" rx="14" fill="var(--surface)" fill-opacity="0.7" stroke="var(--red)" stroke-width="1.8"/>
          <text x="683" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--red)">POSITIVE FEEDBACK (Destabilizing)</text>

          <circle cx="683" cy="198" r="34" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/>
          <text x="683" y="196" text-anchor="middle" font-size="20" font-weight="800" fill="var(--red)">R</text>
          <text x="683" y="213" text-anchor="middle" font-size="8" font-weight="700" fill="var(--red)">REINFORCING</text>

          <ellipse cx="683" cy="96" rx="88" ry="24" fill="var(--warm)" stroke="var(--red)" stroke-width="2"/>
          <text x="683" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Global Temperature</text>

          <ellipse cx="810" cy="198" rx="64" ry="23" fill="var(--warm)" stroke="var(--red)" stroke-width="2"/>
          <text x="810" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Sea Ice Melts</text>

          <ellipse cx="683" cy="300" rx="82" ry="24" fill="var(--warm)" stroke="var(--red)" stroke-width="2"/>
          <text x="683" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Surface Albedo</text>

          <ellipse cx="556" cy="198" rx="66" ry="23" fill="var(--warm)" stroke="var(--red)" stroke-width="2"/>
          <text x="556" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Heat Absorbed</text>

          <path class="flow-anim" d="M760,110 C795,122 812,144 812,170" fill="none" stroke="var(--red)" stroke-width="2.6" marker-end="url(#fb-r)"/>
          <text x="802" y="136" font-size="14" font-weight="800" fill="var(--red)">+</text>

          <path class="flow-anim" d="M812,224 C812,254 790,278 762,290" fill="none" stroke="var(--red)" stroke-width="2.6" marker-end="url(#fb-r)"/>
          <text x="804" y="268" font-size="14" font-weight="800" fill="var(--red)">-</text>

          <path class="flow-anim" d="M604,290 C576,278 556,254 556,224" fill="none" stroke="var(--red)" stroke-width="2.6" marker-end="url(#fb-r)"/>
          <text x="560" y="268" font-size="14" font-weight="800" fill="var(--red)">-</text>

          <path class="flow-anim" d="M556,170 C556,142 574,120 604,108" fill="none" stroke="var(--red)" stroke-width="2.6" marker-end="url(#fb-r)"/>
          <text x="560" y="136" font-size="14" font-weight="800" fill="var(--red)">+</text>

          <text x="683" y="346" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--red)">Amplifies disturbance toward a tipping point (- x - = +)</text>
        </g>
      </g>
    </svg>

    <svg class="esvg" data-view="tp" viewBox="0 0 920 400" hidden role="img" aria-label="ESS 1.2.12 Regime Shift Potential Well & Hysteresis">
      <defs>
        <marker id="tp-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="var(--red)"/>
        </marker>
      </defs>
      <g class="vp">
        <rect x="438" y="30" width="24" height="310" fill="var(--amber-bg)" opacity="0.65" data-tip="tip_ridge"/>
        <line x1="450" y1="30" x2="450" y2="340" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/>
        <text x="450" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="var(--amber)">TIPPING POINT THRESHOLD</text>

        <path d="M85,84 Q175,305 268,295 Q360,285 450,148 Q535,148 640,322 Q745,338 835,96" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

        <g data-tip="basin1">
          <text x="255" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--accent)">Basin 1: Rainforest Equilibrium</text>
          <text x="255" y="348" text-anchor="middle" font-size="11" fill="var(--muted)">Deep valley = high resilience (large biodiversity &amp; storages)</text>
        </g>

        <g data-tip="basin2">
          <text x="655" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--red)">Basin 2: Savanna (Alternative State)</text>
          <text x="655" y="370" text-anchor="middle" font-size="11" fill="var(--muted)">Once flipped, reversing takes much lower stress (Hysteresis)</text>
        </g>

        <g id="tp-ball" data-tip="basin1">
          <circle cx="268" cy="276" r="18" fill="var(--accent2)" stroke="#ffffff" stroke-width="3"/>
          <text x="268" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">SYS</text>
        </g>

        <path class="flow-anim" d="M298,256 L402,178" fill="none" stroke="var(--red)" stroke-width="2.4" marker-end="url(#tp-r)"/>
        <text x="366" y="172" text-anchor="end" font-size="11" font-weight="700" fill="var(--red)">Stress pushes up ridge</text>
      </g>
    </svg>

    <div class="legend">
      <span class="leg-i"><span class="leg-sw" style="background:var(--accent2)"></span>Natural / Stabilizing</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--red)"></span>Heat Loss / Amplifying</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--blue)"></span>Matter Flow</span>
    </div>
    <div class="zoom-bar">
      <button type="button" id="z-out" aria-label="Zoom out">-</button>
      <span id="z-lbl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div>
  </main>
  <footer class="insp" id="insp" aria-live="polite"></footer>
</div>

<script src="./ess-viewer.js"></script>
<script>
  var ctrl = initEssDiagram({
    slug: 'systems-feedback',
    defaultView: 'sym',
    viewDefaults: { sym: 'storage', fb: 'neg_fb', tp: 'tip_ridge' },
    tips: {
      boundary: {
        code: '1.2.3 / 1.2.5',
        title: 'Dashed System Boundary (Open vs Closed)',
        body: 'In IB ESS diagrams, a dashed line marks where the system stops and its environment begins. Ecosystems are open (matter + energy cross); Earth overall is closed (energy only).',
        exam: 'If asked to label an open vs closed system, state explicitly which cross the boundary: both matter and energy vs energy alone.'
      },
      storage: {
        code: '1.2.3 / 1.2.17',
        title: 'Rectangular Storage Box (Stocks)',
        body: 'Boxes represent accumulations (storages) of matter or energy. Larger storages increase resilience and create time lags before a system reacts.',
        exam: 'Draw bigger boxes for bigger stores (e.g. ocean carbon larger than atmosphere carbon).'
      },
      transfer: {
        code: '1.2.4',
        title: 'Transfer Flow (No Change in Form/State)',
        body: 'Transfers move energy or matter from one place or storage to another without altering its chemical nature (e.g. herbivores eating plants, river runoff).',
        exam: 'Key phrase: "location changes, chemical state/energy form does NOT change".'
      },
      transformation: {
        code: '1.2.4',
        title: 'Transformation Flow (Change of Chemical State / Energy Form)',
        body: 'Transformations change chemical state, physical state, or energy type (e.g. light + CO2 + H2O transformed into glucose by photosynthesis).',
        exam: 'Examples to memorize: photosynthesis, cellular respiration, evaporation, burning fossil fuels.'
      },
      energy_in: {
        code: '1.2.5 / 2.2.1',
        title: 'Solar Energy Input',
        body: 'Light energy enters both open and closed planetary systems, driving photosynthesis and global weather.',
        exam: 'Energy flows linearly IN as sunlight and OUT as heat; it is NOT recycled.'
      },
      heat_out: {
        code: '1.2.5 / 2.2.7',
        title: 'Heat Dissipation Sink (2nd Law)',
        body: 'Every energy transformation loses heat to the surroundings (respiration, decomposition), leaving through the boundary even in closed systems.',
        exam: 'Show respiration heat leaving upward or out to a heat sink.'
      },
      matter_io: {
        code: '1.2.5 / 1.2.9',
        title: 'Matter Crossing Boundary (Open vs Closed)',
        body: 'Forests gain nitrogen/water and lose runoff (Open). In a sealed bottle garden, Biosphere 2, or Earth as a whole (Closed), matter cycles strictly inside.',
        exam: 'Earth receives negligible meteorite mass compared to its cycles, so IB classifies Earth as a closed system.'
      },
      neg_fb: {
        code: '1.2.8 / 1.2.9',
        title: 'Negative Feedback Loop (Balancing B)',
        body: 'Output counteracts the initial change. One (-) link reverses the loop: more prey -> more predators -> fewer prey -> pulls system back to equilibrium.',
        exam: 'Odd number of negative (-) arrows = Negative/Balancing feedback = stabilizes.'
      },
      pos_fb: {
        code: '1.2.10 / 1.2.11',
        title: 'Positive Feedback Loop (Reinforcing R)',
        body: 'Disturbance amplifies itself: warming melts white ice -> lower albedo -> darker sea absorbs more heat -> even more warming. Notice (- x - = +)!',
        exam: 'Even number (0, 2, ...) of negative (-) arrows = Positive/Reinforcing feedback = drives toward tipping point.'
      },
      tip_ridge: {
        code: '1.2.12',
        title: 'Tipping Point Threshold (Irreversible Shift Risk)',
        body: 'Once external stress exceeds the ridge height, negative feedback can no longer hold the ball in Basin 1 and positive feedback accelerates a sudden regime shift.',
        exam: 'Real ESS examples: Amazon rainforest dieback to savanna, Greenland ice sheet collapse, lake eutrophication.'
      },
      basin1: {
        code: '1.2.16 / 1.2.17',
        title: 'Original Stable State (High Resilience)',
        body: 'A deep, wide valley represents high resilience from large storages and biodiversity: it takes big disturbances to knock the system out.',
        exam: 'Clearing trees shrinks the depth of Basin 1, making a tipping point easier to reach.'
      },
      basin2: {
        code: '1.2.12',
        title: 'Alternative Stable State & Hysteresis',
        body: 'Once flipped into Savanna (Basin 2), cutting stress back to the original tipping level does NOT restore rainforest. Conditions must drop much further to recover.',
        exam: 'This asymmetric recovery path is called HYSTERESIS (1.2.12).'
      }
    }
  });

  document.querySelectorAll('[data-systype]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-systype]').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      var isClosed = btn.getAttribute('data-systype') === 'closed';
      ['block-in', 'block-out'].forEach(function (bid) {
        var bel = document.getElementById(bid);
        if (isClosed) bel.removeAttribute('hidden');
        else bel.setAttribute('hidden', '');
      });
      document.getElementById('matter-in').style.opacity = isClosed ? '0.42' : '1';
      document.getElementById('matter-out').style.opacity = isClosed ? '0.42' : '1';
      document.getElementById('sys-read').textContent = isClosed
        ? 'Closed System: Energy (sunlight & heat) crosses; MATTER stays inside'
        : 'Open System: BOTH energy & matter cross boundary freely';
      ctrl.showTip(isClosed ? 'matter_io' : 'boundary');
    });
  });

  var flipped = false;
  var stressRng = document.getElementById('stress-rng');
  var stressOut = document.getElementById('stress-out');
  var tpBall = document.getElementById('tp-ball');
  var tpRead = document.getElementById('tp-read');

  function updateBall() {
    var v = +stressRng.value;
    stressOut.textContent = v + '%';
    if (!flipped && v >= 70) flipped = true;
    if (flipped && v <= 20) flipped = false;

    var cx, cy, label, fill;
    if (!flipped) {
      var t = v / 70;
      cx = 268 + t * (445 - 268);
      cy = 276 - Math.pow(t, 1.35) * (276 - 134);
      fill = v > 52 ? '#b45309' : '#1b6b4f';
      label = v > 52
        ? 'Near Tipping Point! (' + v + '%, Negative feedback straining)'
        : 'Stable Rainforest in Basin 1 (' + v + '% stress)';
    } else {
      var t2 = Math.max(0, (v - 20) / 80);
      cx = 520 + t2 * (640 - 520);
      cy = 228 + Math.sin(t2 * Math.PI * 0.7) * 76;
      fill = '#b91c1c';
      label = v < 70
        ? 'HYSTERESIS: Stress dropped to ' + v + '%, still stuck in Savanna! (Drop <= 20% to recover)'
        : 'TIPPED! Positive feedback locked Savanna (Basin 2)';
    }
    var cir = tpBall.querySelector('circle');
    var txt = tpBall.querySelector('text');
    cir.setAttribute('cx', cx.toFixed(1));
    cir.setAttribute('cy', cy.toFixed(1));
    cir.setAttribute('fill', fill);
    txt.setAttribute('x', cx.toFixed(1));
    txt.setAttribute('y', (cy + 4).toFixed(1));
    tpRead.textContent = label;
  }

  stressRng.addEventListener('input', updateBall);
  document.getElementById('stress-reset').addEventListener('click', function () {
    flipped = false;
    stressRng.value = 25;
    updateBall();
  });
</script>
</body>
</html>
