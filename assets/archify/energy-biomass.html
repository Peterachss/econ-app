<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="live">
<head>

  <title>Energy Flow, Productivity &amp; 10% Rule (IB ESS 2.2 SL)</title>
  <link rel="icon" href="data:,">

</head>
<body>
<div class="app">
  <header class="hd">

      <span class="hd-badge">Topic 2.2 · SL</span>
      <h1 class="hd-title">Energy Flow, Productivity &amp; 10% Rule</h1>
    </div>
    <div class="vtabs" role="tablist">
      <button type="button" class="on" data-vtab="pyr">1. 10% Energy Pyramid</button>
      <button type="button" data-vtab="types">2. Pyramid Types</button>
      <button type="button" data-vtab="tox">3. Biomagnification</button>
    </div>
    <div class="tb">
      <button type="button" id="btn-theme" aria-pressed="false">Dark</button>
      <button type="button" id="btn-motion" aria-pressed="true">Live</button>
      <button type="button" id="btn-export">Export SVG</button>
    </div>
  </header>

  <div class="ctrl-bar" data-forview="pyr">
    <div class="ctrl-grp">
      <label for="gpp-rng">Producer GPP:</label>
      <input type="range" id="gpp-rng" min="5000" max="25000" step="500" value="12000">
      <output id="gpp-out">12,000</output>
    </div>
    <div class="ctrl-grp">
      <label for="eff-rng">Transfer Efficiency:</label>
      <input type="range" id="eff-rng" min="5" max="20" step="1" value="10">
      <output id="eff-out">10%</output>
    </div>
    <span class="ctrl-read" id="pyr-read">NPP 8,400 -> T2 840 -> T3 84 -> T4 8.4 kJ/m2/yr</span>
  </div>

          <text x="786" y="233" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--ink)">100+ ppm</text>
          <circle cx="742" cy="252" r="3.8" fill="var(--red)"/><circle cx="754" cy="252" r="3.8" fill="var(--red)"/><circle cx="766" cy="252" r="3.8" fill="var(--red)"/><circle cx="778" cy="252" r="3.8" fill="var(--red)"/><circle cx="790" cy="252" r="3.8" fill="var(--red)"/><circle cx="802" cy="252" r="3.8" fill="var(--red)"/><circle cx="814" cy="252" r="3.8" fill="var(--red)"/><circle cx="826" cy="252" r="3.8" fill="var(--red)"/>
          <circle cx="742" cy="264" r="3.8" fill="var(--red)"/><circle cx="754" cy="264" r="3.8" fill="var(--red)"/><circle cx="766" cy="264" r="3.8" fill="var(--red)"/><circle cx="778" cy="264" r="3.8" fill="var(--red)"/><circle cx="790" cy="264" r="3.8" fill="var(--red)"/><circle cx="802" cy="264" r="3.8" fill="var(--red)"/><circle cx="814" cy="264" r="3.8" fill="var(--red)"/><circle cx="826" cy="264" r="3.8" fill="var(--red)"/>
          <circle cx="754" cy="276" r="3.8" fill="var(--red)"/><circle cx="766" cy="276" r="3.8" fill="var(--red)"/><circle cx="778" cy="276" r="3.8" fill="var(--red)"/><circle cx="790" cy="276" r="3.8" fill="var(--red)"/><circle cx="802" cy="276" r="3.8" fill="var(--red)"/><circle cx="814" cy="276" r="3.8" fill="var(--red)"/>
          <text x="786" y="296" text-anchor="middle" font-size="9.8" font-weight="700" fill="var(--red)">Thin eggshells / toxicity</text>

        <text x="460" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--muted)">Top predators (raptors, sharks, humans) face highest fat-soluble toxin doses.</text>

    <div class="legend">
      <span class="leg-i"><span class="leg-sw" style="background:var(--amber)"></span>Solar IN</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--accent)"></span>Biomass energy (~10%)</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--blue)"></span>Heat loss (~90%)</span>

<script src="./ess-viewer.js"></script>
<script>
(function () {
  var gppRng = document.getElementById('gpp-rng');
  var effRng = document.getElementById('eff-rng');
  var gppOut = document.getElementById('gpp-out');
  var effOut = document.getElementById('eff-out');
  var pyrRead = document.getElementById('pyr-read');
  var barT2 = document.getElementById('bar-t2');
  var barT3 = document.getElementById('bar-t3');
  var barT4 = document.getElementById('bar-t4');
  var lblT1 = document.getElementById('lbl-t1');
  var lblT2 = document.getElementById('lbl-t2');
  var lblT3 = document.getElementById('lbl-t3');
  var lblT4 = document.getElementById('lbl-t4');
  var lblH1 = document.getElementById('lbl-heat1');
  var lblH2 = document.getElementById('lbl-heat2');
  var lblH3 = document.getElementById('lbl-heat3');

  function fmt(n) {
    if (n >= 100) return Math.round(n).toLocaleString('en-US');
    return (Math.round(n * 10) / 10).toString();
  }

  function updatePyr() {
    var gpp = Number(gppRng.value);
    var eff = Number(effRng.value) / 100;
    var pct = effRng.value;
    gppOut.textContent = fmt(gpp);
    effOut.textContent = pct + '%';

    var resp1 = Math.round(gpp * 0.30);
    var t1 = Math.round(gpp - resp1);
    var t2 = t1 * eff;
    var t3 = t2 * eff;
    var t4 = t3 * eff;

    lblT1.textContent = 'NPP = ' + fmt(t1) + ' kJ/m2/yr (GPP ' + fmt(gpp) + ' - R ' + fmt(resp1) + ')';
    lblT2.textContent = fmt(t2) + ' kJ (' + pct + '%)';
    lblT3.textContent = fmt(t3) + ' kJ';
    lblT4.textContent = fmt(t4);

    lblH3.textContent = 'T1 -> T2: -' + fmt(t1 - t2) + ' kJ';
    lblH2.textContent = 'T2 -> T3: -' + fmt(t2 - t3) + ' kJ';
    lblH1.textContent = 'T3 -> T4: -' + fmt(t3 - t4) + ' kJ';

    var w2 = Math.max(116, Math.min(196, Math.round(350 * Math.pow(eff, 0.36))));
    var w3 = Math.max(70, Math.min(130, Math.round(w2 * Math.pow(eff, 0.32))));
    var w4 = Math.max(42, Math.min(82, Math.round(w3 * Math.pow(eff, 0.28))));
    barT2.setAttribute('width', w2);
    barT2.setAttribute('x', 465 - w2 / 2);
    barT3.setAttribute('width', w3);
    barT3.setAttribute('x', 465 - w3 / 2);
    barT4.setAttribute('width', w4);
    barT4.setAttribute('x', 465 - w4 / 2);

    pyrRead.textContent = 'NPP ' + fmt(t1) + ' -> T2 ' + fmt(t2) + ' -> T3 ' + fmt(t3) + ' -> T4 ' + fmt(t4) + ' kJ/m2/yr';
  }

  gppRng.addEventListener('input', updatePyr);
  effRng.addEventListener('input', updatePyr);

  window.initEssDiagram({
    slug: 'energy-biomass',
    defaultView: 'pyr',
    defaultTip: 't1',
    viewDefaults: { pyr: 't1', types: 'p_energy', tox: 'biomag' },
    tips: {
      solar: {
        code: '1st Law',
        title: 'Solar Insolation & Capture Efficiency',
        body: 'About 1 to 2% of incoming sunlight is captured as chemical energy by photosynthesis. The rest is reflected, warms Earth, drives evaporation, or misses chlorophyll.',
        exam: 'Total ecosystem energy is conserved (1st Law), never created or destroyed.'
      },
      t1: {
        code: 'NPP = GPP - R',
        title: 'Producers (Trophic Level 1)',
        body: 'Gross Primary Productivity (GPP) is total chemical energy fixed by photosynthesis. Plants use ~30% for respiration (R); Net Primary Productivity (NPP) is what herbivores can eat.',
        exam: 'Always subtract Respiration (R) before calculating energy available to T2.'
      },
      t2: {
        code: 'NSP = GSP - R',
        title: 'Primary Consumers (T2)',
        body: 'Herbivores obtain ~10% of T1 NPP. Gross Secondary Productivity (GSP) equals food eaten minus fecal waste; Net Secondary Productivity (NSP) equals GSP minus respiration.',
        exam: 'Remember herbivores cannot digest all plant cellulose, so fecal loss is high.'
      },
      t3: {
        code: '~10% Rule',
        title: 'Secondary Consumers (T3)',
        body: 'Carnivores assimilate a higher fraction of meat than herbivores digest plants, yet total energy still drops by ~90% per trophic link.',
        exam: 'State why food chains rarely exceed 4 or 5 trophic levels: insufficient energy left.'
      },
      t4: {
        code: 'Apex Limits',
        title: 'Tertiary Consumers (T4)',
        body: 'Very little energy reaches T4 (~0.1% of NPP), forcing apex predators to keep large hunting ranges and small populations.',
        exam: 'Eating lower down the food chain (plants over beef) feeds more humans per hectare.'
      },
      transfer: {
        code: '2.2.3 Flow',
        title: 'Trophic Energy Transfer',
        body: 'Energy flows one-way through ecosystems (solar -> chemical -> heat) and NEVER recycles back to the sun, unlike carbon or water.',
        exam: 'Distinguish energy FLOW (one-way open system) from matter CYCLING (closed).'
      },
      heat: {
        code: '2nd Law',
        title: 'Respiration & Entropy Heat Loss (~90%)',
        body: 'By the 2nd Law of Thermodynamics, every metabolic conversion loses useful energy as heat via cellular respiration, alongside uneaten parts and feces.',
        exam: 'Mention both respiration heat loss AND unconsumed/egested biomass for full marks.'
      },
      prodbox: {
        code: 'Formulas',
        title: 'SL Productivity Formulas',
        body: 'Plants use NPP = GPP - R. Consumers use GSP = Food eaten - Fecal loss, then NSP = GSP - R. Units must include area and time (e.g. kJ m-2 yr-1 or g m-2 yr-1).',
        exam: 'Always check whether a Paper 2 table gives GPP or NPP before subtracting R!'
      },
      decomp: {
        code: 'Saprotrophs',
        title: 'Decomposers (Detritivores & Saprotrophs)',
        body: 'Bacteria and fungi break down dead organic matter from every trophic level, releasing mineral nutrients back to soil and heat to the atmosphere.',
        exam: 'Decomposers recycle MATTER across every level; they do not recycle energy back to T1.'
      },
      p_energy: {
        code: 'Always Upright',
        title: 'Pyramid of Energy (kJ/m2/yr)',
        body: 'Measures rate of energy flow over a full year. Because the 2nd Law dictates energy loss at every step, a Pyramid of Energy can NEVER be inverted.',
        exam: 'If asked which pyramid is always pyramid-shaped, choose Pyramid of Energy.'
      },
      p_biomass: {
        code: 'Can Invert',
        title: 'Pyramid of Biomass (g/m2)',
        body: 'Shows dry organic mass present at one instant (standing crop). Ocean pyramids can invert because tiny phytoplankton reproduce rapidly before dying, feeding heavier long-lived zooplankton.',
        exam: 'Compare turnover rate vs standing crop to explain why aquatic biomass pyramids invert.'
      },
      p_numbers: {
        code: 'Can Invert',
        title: 'Pyramid of Numbers (individuals/m2)',
        body: 'Counts individual organisms regardless of body size. One huge oak tree counts as 1 bar at T1 while supporting thousands of caterpillars at T2.',
        exam: 'Parasitic chains or single large trees produce inverted pyramids of numbers.'
      },
      bioacc: {
        code: 'Bioaccumulation',
        title: 'Bioaccumulation (Within One Organism)',
        body: 'Gradual build-up of a persistent synthetic chemical (like DDT, PCBs, or methylmercury) inside ONE organism over its lifetime because absorption exceeds excretion.',
        exam: 'Contrast time-based buildup inside ONE individual vs trophic-level jump.'
      },
      biomag: {
        code: 'Biomagnification',
        title: 'Biomagnification (Up Trophic Levels)',
        body: 'Increase in concentration of a non-biodegradable, fat-soluble pollutant at higher trophic levels because predators eat many contaminated prey while respiring away ~90% of biomass.',
        exam: 'Use DDT eggshell thinning in raptors or Minamata mercury as named case studies.'
      },
      tox_water: {
        code: 'Background',
        title: 'Ambient Water Concentration',
        body: 'Dissolved DDT or mercury in river/lake water often sits below acute toxic levels (0.0001 ppm), hiding risk until organisms absorb it.',
        exam: 'State why dilution fails for fat-soluble persistent pollutants.'
      },
      tox_t1: {
        code: 'Uptake',
        title: 'Plankton Absorb & Concentrate Toxins',
        body: 'Producers concentrate lipophilic toxins hundreds of times higher than surrounding water by binding them into cell lipids.',
        exam: 'Key phrase: non-biodegradable and lipid-soluble (fat-soluble).'
      },
      tox_t2: {
        code: '10x Step',
        title: 'Grazers Accumulate Multiple Meals',
        body: 'Each zooplankton consumes hundreds of plankton cells over its life, retaining persistent pollutants in fatty tissue.',
        exam: 'Link concentration jump directly to the 10% energy transfer inefficiency.'
      },
      tox_t3: {
        code: 'Top Prey',
        title: 'Secondary Consumers (Large Fish)',
        body: 'Long-lived predatory fish concentrate toxins thousands of times above water levels, passing the full load to apex birds or humans.',
        exam: 'Note chronic sub-lethal effects (nervous system or reproductive failure).'
      }
    }
  });
  updatePyr();
})();
</script>
</body>
