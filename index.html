ev:['Ưu điểm: giải thích hình dạng của đường chi phí ngắn hạn.','Hạn chế: giả định các lao động giống nhau và công nghệ không đổi.','Hạn chế: chỉ áp dụng trong ngắn hạn khi ít nhất một yếu tố cố định.'],
ex:'Một quán cà phê có một máy pha: vài nhân viên đầu tiên làm tăng mạnh sản lượng, nhưng người pha chế thứ năm chỉ vướng chỗ nên sản phẩm cận biên giảm.',
q:['Giải thích quy luật năng suất cận biên giảm dần. [3 điểm]','Trong ngắn hạn, với ít nhất một yếu tố cố định, thêm yếu tố biến đổi cuối cùng chỉ làm sản lượng tăng ngày càng ít. Sản phẩm cận biên bắt đầu giảm, đó là lý do MC cuối cùng tăng lên.']});

E('revenue',['tr','perfcomp','monopoly','costs'],
{t:[['Total revenue (TR)','Price × quantity.'],['Average revenue (AR)','TR ÷ quantity; equals price and is the demand curve.'],['Marginal revenue (MR)','The extra revenue from selling one more unit.'],['Profit maximisation','Producing where MC = MR, with MC cutting MR from below.']],
ev:['Strength: gives the standard rule for choosing output.','Limitation: assumes firms try to maximise profit and know their MR and MC.','Limitation: in perfect competition AR = MR, while in other markets MR lies below AR.'],
ex:'A price-taking wheat farmer faces a horizontal AR = MR line; a monopoly faces a falling AR with MR below it, since selling more requires lowering the price on all units.',
q:['Explain why MR is below AR for a firm with a downward-sloping demand curve. [3 marks]','To sell an extra unit the firm must cut the price on all units, not just the last one. The extra revenue from the new unit is therefore less than its price, so MR < AR.']},
{t:[['Tổng doanh thu (TR)','Giá × lượng.'],['Doanh thu trung bình (AR)','TR ÷ lượng; bằng giá và chính là đường cầu.'],['Doanh thu cận biên (MR)','Doanh thu tăng thêm khi bán thêm một đơn vị.'],['Tối đa hóa lợi nhuận','Sản xuất tại nơi MC = MR, với MC cắt MR từ phía dưới.']],
ev:['Ưu điểm: cho quy tắc chuẩn để chọn sản lượng.','Hạn chế: giả định doanh nghiệp tối đa hóa lợi nhuận và biết MR, MC của mình.','Hạn chế: trong cạnh tranh hoàn hảo AR = MR, còn ở các thị trường khác MR nằm dưới AR.'],
ex:'Người nông dân trồng lúa mì chấp nhận giá có AR = MR là đường ngang; doanh nghiệp độc quyền đối mặt AR dốc xuống với MR nằm dưới, vì bán thêm đòi hỏi giảm giá cho mọi đơn vị.',
q:['Giải thích vì sao MR thấp hơn AR đối với doanh nghiệp có đường cầu dốc xuống. [3 điểm]','Để bán thêm một đơn vị, doanh nghiệp phải giảm giá cho mọi đơn vị chứ không chỉ đơn vị cuối. Doanh thu tăng thêm từ đơn vị mới vì thế nhỏ hơn giá của nó, nên MR < AR.']});

E('perfcomp',['moncomp','monopoly','revenue','costs'],
{t:[['Assumptions','Many buyers and sellers, identical products, free entry and exit, perfect information, price takers.'],['Short-run profit','Abnormal profit if P > ATC; loss if P < ATC.'],['Long-run equilibrium','Entry or exit pushes price to the minimum of ATC; firms earn normal profit.'],['Efficiency','Allocatively efficient (P = MC) and productively efficient (minimum ATC) in the long run.']],
ev:['Strength: a benchmark for efficiency against which other market structures are judged.','Limitation: assumptions (identical goods, perfect information) are unrealistic; closest examples are agricultural markets.','Limitation: little scope for innovation since firms earn only normal profit.'],
ex:'Small rice farmers sell almost identical output at the market price; if profits are high, new farmers enter until abnormal profit disappears.',
q:['Explain why a firm in perfect competition earns only normal profit in the long run. [4 marks]','If firms earn abnormal profit, new firms enter, which shifts supply right and lowers price. Entry continues until price equals minimum ATC, where profit is normal. If firms make losses, they exit and the reverse happens.']},
{t:[['Giả định','Nhiều người mua và người bán, sản phẩm giống hệt, tự do gia nhập và rút lui, thông tin hoàn hảo, người chấp nhận giá.'],['Lợi nhuận ngắn hạn','Lợi nhuận siêu ngạch nếu P > ATC; lỗ nếu P < ATC.'],['Cân bằng dài hạn','Gia nhập hoặc rút lui đẩy giá xuống mức ATC tối thiểu; doanh nghiệp có lợi nhuận bình thường.'],['Hiệu quả','Hiệu quả phân bổ (P = MC) và hiệu quả sản xuất (ATC tối thiểu) trong dài hạn.']],
ev:['Ưu điểm: là chuẩn mực về hiệu quả để đánh giá các cấu trúc thị trường khác.','Hạn chế: các giả định (hàng giống hệt, thông tin hoàn hảo) không thực tế; ví dụ gần nhất là thị trường nông sản.','Hạn chế: ít chỗ cho đổi mới vì doanh nghiệp chỉ có lợi nhuận bình thường.'],
ex:'Nông dân trồng lúa nhỏ bán sản phẩm gần như giống hệt ở giá thị trường; nếu lợi nhuận cao, nông dân mới gia nhập cho đến khi lợi nhuận siêu ngạch biến mất.',
q:['Giải thích vì sao doanh nghiệp cạnh tranh hoàn hảo chỉ có lợi nhuận bình thường trong dài hạn. [4 điểm]','Nếu doanh nghiệp có lợi nhuận siêu ngạch, doanh nghiệp mới gia nhập, làm cung dịch sang phải và giá giảm. Gia nhập tiếp tục cho đến khi giá bằng ATC tối thiểu, tại đó lợi nhuận là bình thường. Nếu lỗ, doanh nghiệp rút lui và diễn ra điều ngược lại.']});

E('moncomp',['perfcomp','monopoly','revenue'],
{t:[['Features','Many firms, differentiated products, low barriers to entry, some price-setting power.'],['Product differentiation','Branding, quality or location makes products imperfect substitutes, giving a downward-sloping demand curve.'],['Long-run equilibrium','Entry shifts each firm\'s demand left until the demand curve is tangent to ATC; normal profit.'],['Excess capacity','Output below the minimum-ATC level; firms are not productively efficient.']],
ev:['Strength: variety and choice for consumers.','Limitation: higher prices and excess capacity compared with perfect competition.','Limitation: advertising and branding costs raise average costs.'],
ex:'Restaurants, hair salons and clothing shops sell differentiated products and compete on brand, quality and location.',
q:['Explain why firms in monopolistic competition earn normal profit in the long run. [4 marks]','Abnormal profit attracts new firms because barriers to entry are low. This reduces each firm\'s demand until price equals ATC, giving normal profit.']},
{t:[['Đặc điểm','Nhiều doanh nghiệp, sản phẩm khác biệt, rào cản gia nhập thấp, có chút quyền định giá.'],['Khác biệt hóa sản phẩm','Thương hiệu, chất lượng hoặc vị trí làm sản phẩm thay thế không hoàn hảo, tạo đường cầu dốc xuống.'],['Cân bằng dài hạn','Gia nhập làm cầu của mỗi doanh nghiệp dịch sang trái cho đến khi đường cầu tiếp xúc với ATC; lợi nhuận bình thường.'],['Công suất dư thừa','Sản lượng thấp hơn mức ATC tối thiểu; doanh nghiệp không hiệu quả về sản xuất.']],
ev:['Ưu điểm: người tiêu dùng có nhiều lựa chọn đa dạng.','Hạn chế: giá cao hơn và có công suất dư thừa so với cạnh tranh hoàn hảo.','Hạn chế: chi phí quảng cáo và thương hiệu làm tăng chi phí trung bình.'],
ex:'Nhà hàng, tiệm làm tóc và cửa hàng quần áo bán sản phẩm khác biệt và cạnh tranh về thương hiệu, chất lượng và vị trí.',
q:['Giải thích vì sao doanh nghiệp trong cạnh tranh độc quyền chỉ có lợi nhuận bình thường trong dài hạn. [4 điểm]','Lợi nhuận siêu ngạch thu hút doanh nghiệp mới vì rào cản gia nhập thấp. Điều này làm giảm cầu của mỗi doanh nghiệp cho đến khi giá bằng ATC, cho lợi nhuận bình thường.']});

E('monopoly',['perfcomp','moncomp','lrac','surplus'],
{t:[['Monopoly','A single seller with significant market power, protected by barriers to entry.'],['Barriers to entry','Patents, high start-up costs, economies of scale, control of resources, legal licences.'],['Profit-maximising output','Where MC = MR; price is read from the demand curve above that quantity.'],['Natural monopoly','Economies of scale so large that one firm can supply the whole market at lowest cost (water, rail).']],
ev:['Strength: abnormal profits can fund research and innovation; economies of scale may give lower costs.','Limitation: higher price and lower output than perfect competition, with a deadweight loss.','Limitation: lack of competition may cause X-inefficiency and poor service.'],
ex:'A pharmaceutical company with a patent can charge a high price for a new drug, which funds research but makes the drug less affordable.',
q:['Explain, using a diagram, why a monopoly produces less than a competitive market. [4 marks]','A monopoly produces at MC = MR, which is lower than the quantity where P = MC under perfect competition. It charges a price above MC at the demand curve, leading to a loss of consumer surplus and a deadweight loss.']},
{t:[['Độc quyền','Một người bán duy nhất có quyền lực thị trường đáng kể, được bảo vệ bởi rào cản gia nhập.'],['Rào cản gia nhập','Bằng sáng chế, chi phí khởi đầu cao, tính kinh tế theo quy mô, kiểm soát nguồn lực, giấy phép hợp pháp.'],['Sản lượng tối đa hóa lợi nhuận','Tại nơi MC = MR; giá lấy từ đường cầu phía trên sản lượng đó.'],['Độc quyền tự nhiên','Tính kinh tế theo quy mô lớn đến mức một doanh nghiệp cung ứng cho cả thị trường với chi phí thấp nhất (nước, đường sắt).']],
ev:['Ưu điểm: lợi nhuận siêu ngạch có thể tài trợ nghiên cứu và đổi mới; tính kinh tế theo quy mô có thể giảm chi phí.','Hạn chế: giá cao hơn và sản lượng thấp hơn cạnh tranh hoàn hảo, kèm tổn thất vô ích.','Hạn chế: thiếu cạnh tranh có thể gây phi hiệu quả X và dịch vụ kém.'],
ex:'Công ty dược có bằng sáng chế có thể định giá cao cho thuốc mới, giúp tài trợ nghiên cứu nhưng làm thuốc khó tiếp cận hơn.',
q:['Giải thích, dùng sơ đồ, vì sao độc quyền sản xuất ít hơn thị trường cạnh tranh. [4 điểm]','Độc quyền sản xuất tại MC = MR, thấp hơn sản lượng tại P = MC của cạnh tranh hoàn hảo. Nó định giá cao hơn MC trên đường cầu, dẫn đến mất thặng dư tiêu dùng và tổn thất vô ích.']});

E('adas-k',['adas-n','multiplier','cycle','phillips'],
{t:[['Aggregate demand','Total planned spending: AD = C + I + G + (X − M).'],['Aggregate supply','Total output firms are willing to supply at each price level; Keynesian AS is horizontal at low output and vertical at full employment.'],['Spare capacity','When output is below full employment, a rise in AD raises output with little change in the price level.'],['Full employment output','The vertical part of AS; extra AD only raises the price level (inflation).']],
ev:['Strength: explains why demand-side policy can end recessions without inflation.','Limitation: the sharp kink is a simplification; in reality prices start rising before full employment.','Limitation: policy takes time, and higher spending may crowd out private investment or raise debt.'],
ex:'During a recession, the government increases infrastructure spending; with unemployed workers and idle factories, real GDP rises with little price pressure.',
q:['Using a Keynesian AD/AS diagram, explain the effect of an increase in government spending during a recession. [4 marks]','AD shifts right along the horizontal section of AS. Real GDP rises toward full employment and unemployment falls, with little or no rise in the price level.']},
{t:[['Tổng cầu','Tổng chi tiêu dự kiến: AD = C + I + G + (X − M).'],['Tổng cung','Tổng sản lượng doanh nghiệp sẵn sàng cung ở mỗi mức giá chung; AS Keynes nằm ngang ở sản lượng thấp và thẳng đứng ở toàn dụng.'],['Công suất nhàn rỗi','Khi sản lượng thấp hơn toàn dụng, AD tăng làm sản lượng tăng mà mức giá thay đổi rất ít.'],['Sản lượng toàn dụng','Đoạn thẳng đứng của AS; AD tăng thêm chỉ làm tăng mức giá (lạm phát).']],
ev:['Ưu điểm: giải thích vì sao chính sách phía cầu có thể chấm dứt suy thoái mà không gây lạm phát.','Hạn chế: điểm gãy sắc nét là sự đơn giản hóa; thực tế giá bắt đầu tăng trước khi đạt toàn dụng.','Hạn chế: chính sách cần thời gian, và chi tiêu cao hơn có thể chèn ép đầu tư tư nhân hoặc tăng nợ.'],
ex:'Trong suy thoái, chính phủ tăng chi tiêu hạ tầng; với lao động thất nghiệp và nhà máy nhàn rỗi, GDP thực tăng mà gần như không có áp lực giá.',
q:['Dùng sơ đồ AD/AS Keynes, giải thích tác động của việc tăng chi tiêu chính phủ trong suy thoái. [4 điểm]','AD dịch sang phải dọc theo đoạn nằm ngang của AS. GDP thực tăng về phía toàn dụng và thất nghiệp giảm, mức giá chung tăng rất ít hoặc không tăng.']});

E('adas-n',['adas-k','phillips','cycle'],
{t:[['Long-run aggregate supply (LRAS)','Vertical at the full-employment level, set by the quantity and quality of resources and technology.'],['Short-run aggregate supply (SRAS)','Upward-sloping because wages and other costs are sticky in the short run.'],['Supply-side policy','Aims to shift LRAS right: education, deregulation, infrastructure, lower taxes on business.'],['Neutrality of money','In the neoclassical view, a rise in AD only raises prices in the long run, with no effect on real output.']],
ev:['Strength: explains why demand management cannot raise output permanently.','Limitation: the long run may be very long, and recessions cause real harm in the meantime.','Limitation: supply-side policies take years to work and may widen inequality.'],
ex:'Investment in vocational training and ports raises productive capacity, shifting LRAS right and raising potential output without inflation.',
q:['Explain, using a neoclassical diagram, the long-run effect of an increase in AD. [4 marks]','AD shifts right. In the short run output and price level both rise. Over time, wages and costs adjust, SRAS shifts left, and output returns to full employment with a permanently higher price level.']},
{t:[['Tổng cung dài hạn (LRAS)','Thẳng đứng tại mức toàn dụng, được xác định bởi số lượng và chất lượng nguồn lực và công nghệ.'],['Tổng cung ngắn hạn (SRAS)','Dốc lên vì tiền lương và chi phí khác cứng nhắc trong ngắn hạn.'],['Chính sách phía cung','Nhằm dịch LRAS sang phải: giáo dục, bãi bỏ quy định, hạ tầng, giảm thuế doanh nghiệp.'],['Tính trung lập của tiền','Theo quan điểm tân cổ điển, AD tăng chỉ làm tăng giá trong dài hạn, không ảnh hưởng sản lượng thực.']],
ev:['Ưu điểm: giải thích vì sao quản lý cầu không thể nâng sản lượng vĩnh viễn.','Hạn chế: dài hạn có thể rất dài, và suy thoái gây thiệt hại thực trong thời gian đó.','Hạn chế: chính sách phía cung cần nhiều năm mới có tác dụng và có thể làm bất bình đẳng thêm.'],
ex:'Đầu tư vào đào tạo nghề và cảng biển làm tăng năng lực sản xuất, dịch LRAS sang phải và nâng sản lượng tiềm năng mà không gây lạm phát.',
q:['Giải thích, dùng sơ đồ tân cổ điển, tác động dài hạn của việc tăng AD. [4 điểm]','AD dịch sang phải. Trong ngắn hạn cả sản lượng và mức giá đều tăng. Theo thời gian, tiền lương và chi phí điều chỉnh, SRAS dịch sang trái và sản lượng trở lại toàn dụng với mức giá cao hơn vĩnh viễn.']});

E('multiplier',['adas-k','cycle','tax'],
{t:[['Multiplier','The ratio of the final change in real GDP to the initial change in spending: 1 ÷ (1 − MPC) or 1 ÷ MPW.'],['Marginal propensity to consume (MPC)','The fraction of extra income that is spent.'],['Marginal propensity to withdraw (MPW)','MPS + MPT + MPM: the fraction of extra income saved, taxed or spent on imports.'],['Injections and withdrawals','Spending added to or leaked from the circular flow; the multiplier arises from repeated rounds of spending.']],
ev:['Strength: shows why a small rise in spending can have a larger effect on GDP.','Limitation: the multiplier is hard to estimate and falls when the economy is near full employment.','Limitation: crowding out and imports reduce the effect.'],
ex:'If the MPC is 0.75, the multiplier is 4. A $10m road project raises income by $40m in total as workers and suppliers spend their new income.',
q:['Calculate the multiplier when MPC is 0.8 and explain its meaning. [3 marks]','Multiplier = 1 ÷ (1 − 0.8) = 5. An initial rise of $1m in injections increases real GDP by $5m in total.']},
{t:[['Số nhân','Tỷ lệ giữa thay đổi cuối cùng của GDP thực và thay đổi chi tiêu ban đầu: 1 ÷ (1 − MPC) hoặc 1 ÷ MPW.'],['Xu hướng tiêu dùng cận biên (MPC)','Phần thu nhập tăng thêm được đem chi tiêu.'],['Xu hướng rò rỉ cận biên (MPW)','MPS + MPT + MPM: phần thu nhập tăng thêm được tiết kiệm, nộp thuế hoặc chi cho hàng nhập khẩu.'],['Bơm vào và rò rỉ','Chi tiêu thêm vào hoặc thoát ra khỏi dòng chu chuyển; số nhân phát sinh từ các vòng chi tiêu lặp lại.']],
ev:['Ưu điểm: cho thấy vì sao một mức tăng chi tiêu nhỏ có thể tác động lớn hơn lên GDP.','Hạn chế: số nhân khó ước tính và giảm khi nền kinh tế gần toàn dụng.','Hạn chế: hiệu ứng chèn ép và nhập khẩu làm giảm tác động.'],
ex:'Nếu MPC là 0,75, số nhân là 4. Một dự án đường 10 triệu đô la làm thu nhập tăng tổng cộng 40 triệu đô la khi công nhân và nhà cung cấp chi tiêu thu nhập mới.',
q:['Tính số nhân khi MPC là 0,8 và giải thích ý nghĩa. [3 điểm]','Số nhân = 1 ÷ (1 − 0,8) = 5. Mức tăng ban đầu 1 triệu đô la trong các khoản bơm vào làm GDP thực tăng tổng cộng 5 triệu đô la.']});

E('cycle',['adas-k','adas-n','phillips','multiplier'],
{t:[['Business cycle','Short-term fluctuations of real GDP around its long-term trend.'],['Phases','Boom (peak), recession/slowdown, trough, recovery.'],['Recession','Two consecutive quarters of negative real GDP growth.'],['Output gap','Actual GDP minus potential GDP. A negative gap means spare capacity, a positive gap means overheating.']],
ev:['Strength: helps governments time fiscal and monetary policy.','Limitation: turning points are only clear in hindsight, and forecasts are often wrong.','Limitation: the causes (shocks, expectations, credit) are disputed between schools of thought.'],
ex:'Vietnam\'s growth slowed in 2020 as COVID-19 closed borders and then recovered sharply in 2021–2022: a trough followed by a recovery.',
q:['Distinguish between a recession and a recovery. [3 marks]','A recession is a period of falling real GDP, usually two quarters in a row, with rising unemployment. A recovery is the phase after the trough, when real GDP grows again and unemployment starts to fall.']},
{t:[['Chu kỳ kinh doanh','Những dao động ngắn hạn của GDP thực quanh xu hướng dài hạn.'],['Các giai đoạn','Bùng nổ (đỉnh), suy thoái/chậm lại, đáy, phục hồi.'],['Suy thoái','Hai quý liên tiếp tăng trưởng GDP thực âm.'],['Chênh lệch sản lượng','GDP thực tế trừ GDP tiềm năng. Chênh lệch âm nghĩa là công suất nhàn rỗi, dương là kinh tế quá nóng.']],
ev:['Ưu điểm: giúp chính phủ chọn thời điểm cho chính sách tài khóa và tiền tệ.','Hạn chế: các điểm ngoặt chỉ rõ khi nhìn lại, và dự báo thường sai.','Hạn chế: nguyên nhân (cú sốc, kỳ vọng, tín dụng) còn gây tranh cãi giữa các trường phái.'],
ex:'Tăng trưởng của Việt Nam chậm lại năm 2020 khi COVID-19 đóng cửa biên giới rồi phục hồi mạnh năm 2021–2022: đáy sau đó là phục hồi.',
q:['Phân biệt suy thoái và phục hồi. [3 điểm]','Suy thoái là giai đoạn GDP thực giảm, thường hai quý liên tiếp, kèm thất nghiệp tăng. Phục hồi là giai đoạn sau đáy, khi GDP thực tăng trở lại và thất nghiệp bắt đầu giảm.']});

E('phillips',['adas-k','adas-n','cycle'],
{t:[['Short-run Phillips curve (SRPC)','Shows a trade-off between inflation and unemployment: lower unemployment comes with higher inflation.'],['Long-run Phillips curve (LRPC)','Vertical at the natural rate of unemployment; no trade-off in the long run.'],['Natural rate of unemployment','The unemployment rate when the economy is at full employment (frictional and structural unemployment only).'],['Stagflation','High inflation and high unemployment at the same time, shown by an outward shift of the SRPC.']],
ev:['Strength: shows policy trade-offs between inflation and unemployment.','Limitation: the 1970s stagflation broke the stable trade-off.','Limitation: expectations shift the curve, so policymakers cannot permanently lower unemployment.'],
ex:'If the central bank stimulates demand, unemployment falls and inflation rises along the SRPC. Once workers expect higher prices, the SRPC shifts up and unemployment returns to the natural rate.',
q:['Explain why there is no long-run trade-off between inflation and unemployment. [4 marks]','In the long run, expectations of inflation adjust. Workers demand higher wages to match expected inflation, shifting the SRPC upward. Unemployment returns to the natural rate whatever the inflation rate, so the LRPC is vertical.']},
{t:[['Đường Phillips ngắn hạn (SRPC)','Cho thấy đánh đổi giữa lạm phát và thất nghiệp: thất nghiệp thấp hơn đi kèm lạm phát cao hơn.'],['Đường Phillips dài hạn (LRPC)','Thẳng đứng tại tỷ lệ thất nghiệp tự nhiên; không có đánh đổi trong dài hạn.'],['Tỷ lệ thất nghiệp tự nhiên','Tỷ lệ thất nghiệp khi nền kinh tế ở toàn dụng (chỉ còn thất nghiệp tạm thời và cơ cấu).'],['Đình lạm','Lạm phát cao và thất nghiệp cao cùng lúc, thể hiện bằng SRPC dịch ra ngoài.']],
ev:['Ưu điểm: cho thấy sự đánh đổi chính sách giữa lạm phát và thất nghiệp.','Hạn chế: đình lạm thập niên 1970 phá vỡ mối đánh đổi ổn định.','Hạn chế: kỳ vọng làm đường cong dịch chuyển, nên nhà hoạch định không thể giảm thất nghiệp vĩnh viễn.'],
ex:'Nếu ngân hàng trung ương kích cầu, thất nghiệp giảm và lạm phát tăng dọc theo SRPC. Khi người lao động kỳ vọng giá cao hơn, SRPC dịch lên và thất nghiệp quay về mức tự nhiên.',
q:['Giải thích vì sao không có đánh đổi dài hạn giữa lạm phát và thất nghiệp. [4 điểm]','Trong dài hạn, kỳ vọng lạm phát điều chỉnh. Người lao động đòi lương cao hơn để theo kịp lạm phát kỳ vọng, làm SRPC dịch lên. Thất nghiệp trở về mức tự nhiên dù lạm phát ở mức nào, nên LRPC thẳng đứng.']});

E('lorenz',['equity','tax'],
{t:[['Lorenz curve','Plots the cumulative share of income against the cumulative share of households (from poorest to richest).'],['Line of equality','The 45° line where every group gets its fair share.'],['Gini coefficient','Area between the line of equality and the Lorenz curve ÷ the whole area under the line of equality; from 0 (equal) to 1 (one person has all).'],['Limitations','Does not show why inequality exists, and ignores wealth, regional differences and non-monetary factors.']],
ev:['Strength: a simple visual comparison of income distribution across countries or over time.','Limitation: two different Lorenz curves can have the same Gini coefficient.','Limitation: data on income are often unreliable, especially in informal economies.'],
ex:'A country with a Gini of 0.25 (such as Slovenia) has far more equal income than one with 0.55 (such as South Africa).',
q:['Explain what a Lorenz curve that moves further from the line of equality shows. [3 marks]','A Lorenz curve farther from the line of equality shows a more unequal distribution of income: the poorest households receive a smaller share of total income. The Gini coefficient rises.']},
{t:[['Đường Lorenz','Biểu diễn tỷ lệ thu nhập tích lũy theo tỷ lệ hộ gia đình tích lũy (từ nghèo nhất đến giàu nhất).'],['Đường bình đẳng','Đường 45° nơi mỗi nhóm nhận phần công bằng.'],['Hệ số Gini','Diện tích giữa đường bình đẳng và đường Lorenz ÷ toàn bộ diện tích dưới đường bình đẳng; từ 0 (bình đẳng) đến 1 (một người có tất cả).'],['Hạn chế','Không cho biết vì sao bất bình đẳng tồn tại, và bỏ qua của cải, khác biệt vùng miền và các yếu tố phi tiền tệ.']],
ev:['Ưu điểm: cách so sánh trực quan đơn giản về phân phối thu nhập giữa các nước hoặc theo thời gian.','Hạn chế: hai đường Lorenz khác nhau có thể có cùng hệ số Gini.','Hạn chế: số liệu thu nhập thường không đáng tin, nhất là ở nền kinh tế phi chính thức.'],
ex:'Một nước có Gini 0,25 (như Slovenia) có thu nhập bình đẳng hơn nhiều so với nước có 0,55 (như Nam Phi).',
q:['Giải thích đường Lorenz dịch xa dần khỏi đường bình đẳng cho thấy điều gì. [3 điểm]','Đường Lorenz xa đường bình đẳng hơn cho thấy phân phối thu nhập bất bình đẳng hơn: các hộ nghèo nhất nhận phần nhỏ hơn trong tổng thu nhập. Hệ số Gini tăng.']});

E('fx',['jcurve','tariff','quota'],
{t:[['Floating exchange rate','Determined by demand for and supply of the currency in the foreign exchange market.'],['Appreciation','A rise in the value of a currency; imports become cheaper and exports dearer.'],['Depreciation','A fall in the value of a currency; exports become cheaper and imports dearer.'],['Determinants','Interest rates, inflation, relative growth, speculation, investment flows, demand for exports.']],
ev:['Strength: floating rates adjust automatically to restore balance in the current account.','Limitation: volatility creates uncertainty for traders and investors.','Limitation: depreciation can raise inflation through costlier imports.'],
ex:'If US interest rates rise, global investors buy dollars to earn higher returns, demand for the dollar increases and it appreciates.',
q:['Using a diagram, explain how higher interest rates affect the exchange rate. [4 marks]','Higher interest rates attract foreign financial investment. Demand for the currency shifts right and the equilibrium exchange rate rises: the currency appreciates.']},
{t:[['Tỷ giá thả nổi','Được xác định bởi cầu và cung tiền tệ trên thị trường ngoại hối.'],['Lên giá','Giá trị đồng tiền tăng; hàng nhập khẩu rẻ hơn và hàng xuất khẩu đắt hơn.'],['Mất giá','Giá trị đồng tiền giảm; hàng xuất khẩu rẻ hơn và hàng nhập khẩu đắt hơn.'],['Các yếu tố quyết định','Lãi suất, lạm phát, tăng trưởng tương đối, đầu cơ, dòng vốn đầu tư, cầu hàng xuất khẩu.']],
ev:['Ưu điểm: tỷ giá thả nổi tự điều chỉnh để khôi phục cân bằng cán cân vãng lai.','Hạn chế: biến động gây bất định cho nhà thương mại và nhà đầu tư.','Hạn chế: mất giá có thể làm tăng lạm phát qua hàng nhập khẩu đắt hơn.'],
ex:'Nếu lãi suất Mỹ tăng, nhà đầu tư toàn cầu mua đô la để hưởng lợi suất cao hơn, cầu đô la tăng và đồng đô la lên giá.',
q:['Dùng sơ đồ, giải thích lãi suất cao hơn ảnh hưởng thế nào đến tỷ giá. [4 điểm]','Lãi suất cao thu hút đầu tư tài chính nước ngoài. Cầu về đồng tiền dịch sang phải và tỷ giá cân bằng tăng: đồng tiền lên giá.']});

E('jcurve',['fx','tariff'],
{t:[['Marshall–Lerner condition','Depreciation improves the current account only if PED for exports + PED for imports > 1.'],['J-curve','After depreciation, the trade balance first worsens, then improves, because demand responds slowly.'],['Why it worsens first','Contracts are fixed in the short run and import prices rise immediately while volumes barely change.'],['Time lag','It can take months or even a year or more for quantities to adjust.']],
ev:['Strength: explains why currency devaluation does not give instant improvement.','Limitation: the shape and size depend on elasticities that are hard to estimate.','Limitation: other factors (inflation, retaliation, input costs) also affect the outcome.'],
ex:'After the pound fell in 2016, the UK trade deficit did not shrink immediately: import costs rose first, while export volumes took time to expand.',
q:['Explain why the trade balance may worsen first after a depreciation. [3 marks]','In the short run, demand for imports and exports is inelastic because contracts and habits take time to change. Imports cost more in domestic currency while volumes are almost unchanged, so the deficit widens before improving.']},
{t:[['Điều kiện Marshall–Lerner','Mất giá chỉ cải thiện cán cân vãng lai nếu PED xuất khẩu + PED nhập khẩu > 1.'],['Đường J','Sau mất giá, cán cân thương mại xấu đi trước rồi mới cải thiện, vì cầu phản ứng chậm.'],['Vì sao xấu đi trước','Hợp đồng cố định trong ngắn hạn và giá nhập khẩu tăng ngay trong khi khối lượng gần như không đổi.'],['Độ trễ thời gian','Có thể mất vài tháng hoặc hơn một năm để khối lượng điều chỉnh.']],
ev:['Ưu điểm: giải thích vì sao phá giá tiền tệ không cải thiện tức thì.','Hạn chế: hình dạng và quy mô phụ thuộc vào độ co giãn khó ước tính.','Hạn chế: các yếu tố khác (lạm phát, trả đũa, chi phí đầu vào) cũng ảnh hưởng đến kết quả.'],
ex:'Sau khi đồng bảng Anh giảm năm 2016, thâm hụt thương mại của Anh không thu hẹp ngay: chi phí nhập khẩu tăng trước, còn khối lượng xuất khẩu cần thời gian mở rộng.',
q:['Giải thích vì sao cán cân thương mại có thể xấu đi trước sau khi mất giá. [3 điểm]','Trong ngắn hạn, cầu nhập khẩu và xuất khẩu kém co giãn vì hợp đồng và thói quen cần thời gian để đổi. Hàng nhập khẩu đắt hơn theo nội tệ trong khi khối lượng gần như không đổi, nên thâm hụt rộng ra trước khi cải thiện.']});

E('tariff',['quota','fx','surplus'],
{t:[['Tariff','A tax on imports; raises the domestic price and cuts imports.'],['Revenue','Tariff per unit × quantity of imports after the tariff.'],['Deadweight loss','Two triangles: over-production by domestic firms and under-consumption by consumers.'],['Protectionism','Policies that shield domestic industries from foreign competition (tariffs, quotas, subsidies).']],
ev:['Strength: protects infant industries and jobs in the short run; raises government revenue.','Limitation: consumers pay higher prices and less efficient firms survive.','Limitation: trading partners may retaliate, starting a trade war.'],
ex:'A tariff on imported steel raises the price of steel, helping domestic producers but raising costs for car makers and builders.',
q:['Using a diagram, explain the effects of a tariff on consumers and producers. [4 marks]','The tariff raises the domestic price above the world price. Consumer surplus falls; domestic producers gain because they produce more; the government earns revenue; and there is a deadweight loss.']},
{t:[['Thuế quan','Thuế đánh vào hàng nhập khẩu; làm tăng giá trong nước và giảm nhập khẩu.'],['Số thu','Thuế mỗi đơn vị × lượng nhập khẩu sau thuế.'],['Tổn thất vô ích','Hai tam giác: sản xuất quá mức của doanh nghiệp trong nước và tiêu dùng thiếu của người tiêu dùng.'],['Chủ nghĩa bảo hộ','Các chính sách bảo vệ ngành trong nước khỏi cạnh tranh nước ngoài (thuế quan, hạn ngạch, trợ cấp).']],
ev:['Ưu điểm: bảo vệ ngành non trẻ và việc làm trong ngắn hạn; tăng thu ngân sách.','Hạn chế: người tiêu dùng trả giá cao hơn và doanh nghiệp kém hiệu quả tồn tại.','Hạn chế: đối tác thương mại có thể trả đũa, dẫn đến chiến tranh thương mại.'],
ex:'Thuế quan đối với thép nhập khẩu làm tăng giá thép, giúp nhà sản xuất trong nước nhưng làm tăng chi phí của hãng xe và nhà xây dựng.',
q:['Dùng sơ đồ, giải thích tác động của thuế quan đến người tiêu dùng và nhà sản xuất. [4 điểm]','Thuế quan đẩy giá trong nước lên cao hơn giá thế giới. Thặng dư tiêu dùng giảm; nhà sản xuất trong nước được lợi vì sản xuất nhiều hơn; chính phủ có thêm thu ngân sách; và có tổn thất vô ích.']});

E('quota',['tariff','fx'],
{t:[['Import quota','A physical limit on the quantity of a good that can be imported.'],['Quota rent','Extra profit earned by whoever holds the import licence, as the price rises above the world price.'],['Difference from tariff','A tariff gives the government revenue; a quota gives the extra revenue to importers or foreign firms.'],['Effect','Domestic price rises, domestic output rises, consumption falls.']],
ev:['Strength: gives certainty over import quantity.','Limitation: no government revenue (unless licences are auctioned) and a deadweight loss.','Limitation: encourages corruption in the allocation of licences.'],
ex:'Limits on the quantity of imported sugar raise sugar prices for consumers, while the licence holders earn a premium.',
q:['Compare a quota with a tariff. [4 marks]','Both raise domestic prices and reduce imports, and both create a deadweight loss. A tariff gives the government revenue; a quota gives the extra revenue (quota rent) to importers or foreign producers. A quota gives certainty over the quantity, a tariff over the tax rate.']},
{t:[['Hạn ngạch nhập khẩu','Giới hạn vật lý về lượng hàng được phép nhập khẩu.'],['Tô hạn ngạch','Lợi nhuận thêm của người nắm giấy phép nhập khẩu khi giá tăng cao hơn giá thế giới.'],['Khác thuế quan','Thuế quan mang lại thu ngân sách; hạn ngạch trao khoản thu thêm cho nhà nhập khẩu hoặc doanh nghiệp nước ngoài.'],['Tác động','Giá trong nước tăng, sản lượng trong nước tăng, tiêu dùng giảm.']],
ev:['Ưu điểm: bảo đảm chắc chắn về lượng nhập khẩu.','Hạn chế: không có thu ngân sách (trừ khi đấu giá giấy phép) và có tổn thất vô ích.','Hạn chế: khuyến khích tham nhũng trong việc phân bổ giấy phép.'],
ex:'Giới hạn lượng đường nhập khẩu làm tăng giá đường cho người tiêu dùng, trong khi người giữ giấy phép nhận phần lợi nhuận thêm.',
q:['So sánh hạn ngạch với thuế quan. [4 điểm]','Cả hai làm tăng giá trong nước và giảm nhập khẩu, đều gây tổn thất vô ích. Thuế quan mang lại thu ngân sách; hạn ngạch trao khoản thu thêm (tô hạn ngạch) cho nhà nhập khẩu hoặc nhà sản xuất nước ngoài. Hạn ngạch chắc chắn về lượng, thuế quan chắc chắn về mức thuế.']});

E('nine',['method','thought','fop'],
{t:[['Scarcity','Limited resources against unlimited wants; the basic economic problem.'],['Choice and opportunity cost','Scarcity forces choices, and every choice has an opportunity cost.'],['Efficiency and equity','Using resources to get the most output (efficiency) versus a fair distribution (equity).'],['Sustainability and well-being','Meeting present needs without harming future generations, and raising living standards beyond income.']],
ev:['Strength: the nine concepts give a common language for every unit of the course.','Limitation: the concepts overlap, so a question may require several at once.','Limitation: some (well-being, equity) are normative and hard to measure.'],
ex:'Deciding to build a metro line rather than a road is a choice with an opportunity cost, affects efficiency, equity (who benefits) and sustainability (emissions).',
q:['Explain how scarcity leads to choice and opportunity cost. [3 marks]','Because resources are limited, not every want can be met, so people, firms and governments must choose. The next best alternative given up is the opportunity cost.']},
{t:[['Khan hiếm','Nguồn lực hữu hạn so với nhu cầu vô hạn; vấn đề kinh tế cơ bản.'],['Lựa chọn và chi phí cơ hội','Khan hiếm buộc phải lựa chọn, và mọi lựa chọn đều có chi phí cơ hội.'],['Hiệu quả và công bằng','Dùng nguồn lực để có nhiều sản lượng nhất (hiệu quả) so với phân phối công bằng.'],['Bền vững và phúc lợi','Đáp ứng nhu cầu hiện tại mà không gây hại cho thế hệ sau, và nâng mức sống vượt ra ngoài thu nhập.']],
ev:['Ưu điểm: chín khái niệm cho một ngôn ngữ chung cho mọi phần của môn học.','Hạn chế: các khái niệm chồng lấn nên một câu hỏi có thể cần nhiều khái niệm cùng lúc.','Hạn chế: một số khái niệm (phúc lợi, công bằng) mang tính chuẩn tắc và khó đo.'],
ex:'Quyết định xây tuyến tàu điện thay vì đường bộ là một lựa chọn có chi phí cơ hội, ảnh hưởng đến hiệu quả, công bằng (ai được lợi) và bền vững (khí thải).',
q:['Giải thích khan hiếm dẫn đến lựa chọn và chi phí cơ hội như thế nào. [3 điểm]','Vì nguồn lực hữu hạn, không thể đáp ứng mọi nhu cầu, nên cá nhân, doanh nghiệp và chính phủ phải lựa chọn. Phương án tốt nhất tiếp theo bị bỏ qua là chi phí cơ hội.']});

E('method',['nine','thought'],
{t:[['Positive statement','A statement of fact that can be tested with evidence (the unemployment rate is 3%).'],['Normative statement','A value judgement about what ought to be (unemployment should be lower).'],['Ceteris paribus','Holding other things constant to isolate one relationship.'],['Model','A simplified representation of reality used to make predictions and test theories.']],
ev:['Strength: separating facts from values makes debates clearer.','Limitation: the line is blurry because choices of what to measure can reflect values.','Limitation: economists cannot run controlled experiments like natural scientists.'],
ex:'"Raising the minimum wage reduces employment" is positive (it can be tested). "The minimum wage should be raised" is normative.',
q:['Distinguish between a positive and a normative statement, with one example of each. [4 marks]','A positive statement can be proved true or false with evidence: "inflation was 3% last year". A normative statement expresses an opinion or value judgement: "inflation should be lower".']},
{t:[['Phát biểu thực chứng','Phát biểu về sự kiện có thể kiểm chứng bằng bằng chứng (tỷ lệ thất nghiệp là 3%).'],['Phát biểu chuẩn tắc','Phán đoán giá trị về điều nên có (thất nghiệp nên thấp hơn).'],['Các yếu tố khác không đổi','Giữ các yếu tố khác không đổi để tách riêng một mối quan hệ.'],['Mô hình','Biểu diễn đơn giản hóa của thực tế dùng để dự đoán và kiểm định lý thuyết.']],
ev:['Ưu điểm: tách sự kiện khỏi giá trị làm cuộc tranh luận rõ ràng hơn.','Hạn chế: ranh giới mờ vì việc chọn đo cái gì có thể phản ánh giá trị.','Hạn chế: nhà kinh tế không thể làm thí nghiệm có kiểm soát như các nhà khoa học tự nhiên.'],
ex:'"Tăng lương tối thiểu làm giảm việc làm" là thực chứng (có thể kiểm chứng). "Nên tăng lương tối thiểu" là chuẩn tắc.',
q:['Phân biệt phát biểu thực chứng và chuẩn tắc, mỗi loại cho một ví dụ. [4 điểm]','Phát biểu thực chứng có thể được chứng minh đúng hoặc sai bằng bằng chứng: "lạm phát năm ngoái là 3%". Phát biểu chuẩn tắc thể hiện quan điểm hay phán đoán giá trị: "lạm phát nên thấp hơn".']});

E('thought',['nine','method'],
{t:[['Classical','Markets self-correct; free markets and limited government (Adam Smith).'],['Keynesian','Demand drives output, and government spending can end recessions (John Maynard Keynes).'],['Monetarist','Control of the money supply is the key to stable prices (Milton Friedman).'],['Behavioural','People are not fully rational; habits and biases shape decisions (Kahneman and Thaler).']],
ev:['Strength: knowing different schools helps to evaluate policy from several angles.','Limitation: schools often disagree because they use different assumptions and time frames.','Limitation: real-world policy mixes ideas, so the labels are only approximate.'],
ex:'After the 2008 crisis, many governments used Keynesian stimulus, then moved to austerity, reflecting a shift in views.',
q:['Contrast the Keynesian and classical views of how the economy returns to full employment. [4 marks]','Classical economists say wages and prices adjust so the economy returns to full employment by itself. Keynesians argue wages are sticky so recessions may last, which justifies government spending to raise demand.']},
{t:[['Cổ điển','Thị trường tự điều chỉnh; thị trường tự do và chính phủ hạn chế (Adam Smith).'],['Keynes','Cầu quyết định sản lượng, chi tiêu chính phủ có thể chấm dứt suy thoái (John Maynard Keynes).'],['Chủ nghĩa tiền tệ','Kiểm soát cung tiền là chìa khóa của ổn định giá (Milton Friedman).'],['Hành vi','Con người không hoàn toàn duy lý; thói quen và định kiến tác động đến quyết định (Kahneman và Thaler).']],
ev:['Ưu điểm: hiểu các trường phái giúp đánh giá chính sách từ nhiều góc độ.','Hạn chế: các trường phái thường bất đồng vì dùng giả định và khung thời gian khác nhau.','Hạn chế: chính sách thực tế pha trộn các ý tưởng nên các nhãn chỉ mang tính tương đối.'],
ex:'Sau khủng hoảng năm 2008, nhiều chính phủ dùng kích thích kiểu Keynes rồi chuyển sang thắt lưng buộc bụng, phản ánh sự thay đổi quan điểm.',
q:['So sánh quan điểm Keynes và cổ điển về cách nền kinh tế quay lại toàn dụng. [4 điểm]','Các nhà kinh tế cổ điển cho rằng lương và giá điều chỉnh nên nền kinh tế tự quay lại toàn dụng. Trường phái Keynes cho rằng lương cứng nhắc nên suy thoái có thể kéo dài, do đó cần chi tiêu chính phủ để tăng cầu.']});

E('fop',['nine','ppc'],
{t:[['Land','Natural resources; reward is rent.'],['Labour','Human effort, physical and mental; reward is wages.'],['Capital','Man-made goods used to produce other goods (machines, buildings); reward is interest.'],['Enterprise','Risk-taking and organising the other factors; reward is profit.']],
ev:['Strength: a useful way to classify the inputs to any production process.','Limitation: some modern inputs (data, knowledge) are hard to fit in the four categories.','Limitation: factors differ in quality and mobility.'],
ex:'A farm uses land (fields), labour (workers), capital (tractors) and enterprise (the farmer who takes the risk and organises production).',
q:['Distinguish between capital and land as factors of production. [3 marks]','Land is a natural resource that is not made by humans, such as soil, minerals or water. Capital is man-made and used to produce other goods, for example machinery. Their rewards are rent and interest.']},
{t:[['Đất đai','Tài nguyên thiên nhiên; phần thưởng là tô.'],['Lao động','Nỗ lực của con người, thể chất và trí óc; phần thưởng là tiền lương.'],['Vốn','Hàng hóa do con người làm ra dùng để sản xuất hàng hóa khác (máy móc, nhà xưởng); phần thưởng là lãi suất.'],['Tinh thần kinh doanh','Chấp nhận rủi ro và tổ chức các yếu tố khác; phần thưởng là lợi nhuận.']],
ev:['Ưu điểm: cách phân loại hữu ích cho đầu vào của mọi quá trình sản xuất.','Hạn chế: một số đầu vào hiện đại (dữ liệu, tri thức) khó xếp vào bốn loại.','Hạn chế: các yếu tố khác nhau về chất lượng và tính linh hoạt.'],
ex:'Một trang trại dùng đất đai (ruộng), lao động (công nhân), vốn (máy kéo) và tinh thần kinh doanh (người nông dân chấp nhận rủi ro và tổ chức sản xuất).',
q:['Phân biệt vốn và đất đai là các yếu tố sản xuất. [3 điểm]','Đất đai là tài nguyên thiên nhiên không do con người làm ra, như đất, khoáng sản hay nước. Vốn do con người tạo ra và dùng để sản xuất hàng hóa khác, ví dụ máy móc. Phần thưởng của chúng là tô và lãi suất.']});


E('imperfect',['perfcomp','moncomp','oligopoly','monopoly'],
{t:[['Market power','The ability of a firm to influence the price of its product.'],['Price maker','A firm that can set its own price because it faces a downward-sloping demand curve.'],['Barriers to entry','Obstacles that stop new firms entering a market, which protect abnormal profit.'],['Contestable market','A market with low barriers to entry and exit, where the threat of new entrants keeps firms efficient.']],
ev:['Strength: the comparison table links each market structure to its demand curve, profit and efficiency.','Limitation: real markets sit on a spectrum, and the four structures are simplified models.','Limitation: market power is not always harmful, since it can bring economies of scale and innovation.'],
ex:"Vietnam's mobile networks are dominated by a few firms (an oligopoly), while street food stalls compete on location and taste (monopolistic competition).",
q:['Compare the long-run profit of a monopolist with a firm in monopolistic competition. [4 marks]','A monopolist is protected by high barriers to entry so it can keep abnormal profit in the long run. A firm in monopolistic competition faces low barriers, so new firms enter when profit is abnormal and its demand curve shifts left until only normal profit remains.']},
{t:[['Quyền lực thị trường','Khả năng của một doanh nghiệp tác động đến giá sản phẩm của mình.'],['Người định giá','Doanh nghiệp có thể tự đặt giá vì đối mặt đường cầu dốc xuống.'],['Rào cản gia nhập','Trở ngại ngăn doanh nghiệp mới vào thị trường, bảo vệ lợi nhuận siêu ngạch.'],['Thị trường có thể cạnh tranh','Thị trường có rào cản gia nhập và rút lui thấp, nơi nguy cơ doanh nghiệp mới gia nhập giữ cho các hãng hoạt động hiệu quả.']],
ev:['Ưu điểm: bảng so sánh liên kết mỗi cấu trúc thị trường với đường cầu, lợi nhuận và hiệu quả.','Hạn chế: thị trường thực nằm trên một dải liên tục, và bốn cấu trúc chỉ là các mô hình đơn giản hóa.','Hạn chế: quyền lực thị trường không phải lúc nào cũng có hại, vì có thể mang lại tính kinh tế theo quy mô và đổi mới.'],

  const todo=[['Intro to supply and demand; Shifts-v-Movements; 2.7 Government intervention by graphical analysis','Overlaps topics already covered; not read line by line'],['Multiple-choice sets: What is a market; 2.7 Maximum and Minimum Prices; Perfect Competition MCQ','Question banks; could become a quiz'],['Enquiry question PED; Market for cinema tickets Elasticities; YED Laundrette question; Price controls Venezuela','Activity sheets and a case study; not yet turned into questions'],['Introduction to Economics','Scanned or image-only, no text to read'],['Summative Information','History (World War 1) assessment, not economics'],['QC - HƯỚNG DẪN VĐTC','Vietnamese advertising assignment, not economics']];
  return '<div class="card notes">'+refCrumb+'<h1>Sync log</h1><p class="what">Last synced with your ECON folder on <b>'+SYNC_DATE+'</b>. Material for next year goes in a later sync.</p><section><h3>Synced into the app</h3>'+tbl(['Class file','Used in'],used)+'</section><section><h3>Not synced yet</h3>'+tbl(['Class file','Why'],todo)+'</section></div>'}
function renderNotes(t){
  const i=T.indexOf(t),id=t.id;
  $('#main').innerHTML='<article class="art notes"><header class="chead">'+crumbHTML(t)+'<p class="meta"><span>Topic '+NUM[id]+'</span><span class="'+(t.hl?'hl':'')+'">'+(t.hl?'HL only':'SL and HL')+'</span><span>Updated: '+SYNC_DATE+'</span></p><h1>'+t.title+'</h1><p class="byline"><a href="#'+T.find(x=>unitNum(x)===unitNum(t)).id+'">'+unitName(t)+'</a>, '+(BAND[id]||'')+'</p><p class="acts"><label class="done"><input type="checkbox" id="chk" '+(studied[id]?'checked':'')+'> Mark as studied</label><a href="#" id="citeb">Cite this topic</a></p></header><section><h3>Summary</h3><p>'+t.what+'</p></section>'+t.notes.map(n=>'<section><h3>'+n.h+'</h3>'+n.html+'</section>').join('')+xt(id,'terms')+xt(id,'eval')+'<section class="practice"><h3>Exam practice</h3><p class="qtext">'+t.q+'</p><details><summary>Show model answer</summary><p>'+t.a+'</p></details></section>'+xt(id,'more')+'<div class="pager"><button id="prev" '+(i===0?'disabled':'')+'>← Previous</button><button id="next" '+(i===T.length-1?'disabled':'')+'>Next →</button></div></article>';
  $('#chk').addEventListener('change',e=>onStudiedChange(id,e));
  $('#prev').onclick=()=>go(T[i-1].id);$('#next').onclick=()=>go(T[i+1].id)}


let quiz={};try{quiz=JSON.parse(localStorage.getItem('econ-quiz')||'{}')}catch(e){}
const saveQ=()=>{try{localStorage.setItem('econ-quiz',JSON.stringify(quiz))}catch(e){}};
const unitNum=t=>(t.unit.match(/Unit \d/)||[''])[0];
const unitName=t=>({'Unit 1':'Introduction','Unit 2':'Microeconomics','Unit 3':'Macroeconomics','Unit 4':'Global economy'}[unitNum(t)]||t.unit);
const crumbHTML=t=>'<p class="crumb"><a href="#welcome">DP Economics</a> › '+unitName(t)+' › '+(BAND[t.id]||'')+(t.hl?' · HL only':'')+'</p>';
const refCrumb='<p class="crumb"><a href="#welcome">DP Economics</a> › Reference</p>';
function setStudied(id,on){if(on)studied[id]=1;else delete studied[id];saveS();buildNav()}
let toastT;
function toast(msg,undo){const el=$('#toast');if(!el)return;el.innerHTML='<span>'+msg+'</span>'+(undo?'<button type="button" id="tu">Undo</button>':'');el.hidden=false;if(el.classList){el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
  if(undo){const b=$('#tu');if(b)b.onclick=()=>{undo();el.hidden=true}}
  applyLang(el);clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},4500)}
function onStudiedChange(id,e){const on=e.target.checked;setStudied(id,on);toast(on?'Marked as studied.':'Removed from studied.',()=>{setStudied(id,!on);const c=$('#chk');if(c)c.checked=!on})}
let qfilter='all';
function quizHTML(){
  const list=T.filter(t=>qfilter==='all'||(qfilter==='review'?quiz[t.id]==='review':unitNum(t)===qfilter));
  const got=T.filter(t=>quiz[t.id]==='got').length,rev=T.filter(t=>quiz[t.id]==='review').length;
  const chips=[['all','All'],['Unit 1','Unit 1'],['Unit 2','Unit 2'],['Unit 3','Unit 3'],['Unit 4','Unit 4'],['review','To review']].map(c=>'<button type="button" class="chip'+(qfilter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('');
  const items=list.map(t=>'<details class="qa"><summary><span class="qn">'+NUM[t.id]+'</span> '+t.q+'</summary><p>'+t.a+'</p><div class="qb"><button type="button" data-g="'+t.id+'">I got it</button><button type="button" data-r="'+t.id+'">Review again</button><span class="qs" data-id="'+t.id+'">'+(quiz[t.id]==='got'?'Got it':quiz[t.id]==='review'?'To review':'')+'</span></div></details>').join('');
  return '<div class="card notes">'+refCrumb+'<h1>Self-test</h1><p class="what">Answer each question on paper first, then open the model answer and mark how you did. Your marks are saved on this device.</p><p class="obj" id="qsum"><b>'+got+'</b> got it, <b>'+rev+'</b> to review, <b>'+(T.length-got-rev)+'</b> not tried.</p><div class="chips">'+chips+'</div>'+(items||'<p class="obj">Nothing to review yet. Mark a question with "Review again" and it will appear here.</p>')+'</div>'}
function welcomeHTML(){
  const units=['Unit 1','Unit 2','Unit 3','Unit 4'].map(u=>{const ts=T.filter(t=>unitNum(t)===u);const d=ts.filter(t=>studied[t.id]).length;return '<div class="tile"><div><b>'+unitName(ts[0])+'</b><span>'+ts.length+' topics, '+d+' studied</span></div><a class="pill" href="#'+ts[0].id+'">Study</a></div>'}).join('');
  let last='';try{last=localStorage.getItem('econ-last')||''}catch(e){}
  const lt=T.find(t=>t.id===last);
  const review=T.filter(t=>quiz[t.id]==='review');
  const li=(t,why)=>'<li><a href="#'+t.id+'">'+NUM[t.id]+' '+t.title+'</a><span>'+why+'</span></li>';
  const att=review.map(t=>li(t,'marked to review in the self-test')).concat(T.filter(t=>!studied[t.id]&&!review.includes(t)).slice(0,5).map(t=>li(t,'not studied yet'))).slice(0,6).join('');
  const done=T.filter(t=>studied[t.id]).length;
  return '<div class="art notes"><div class="band"><p class="crumb">All courses › DP Economics</p><h1>DP Economics</h1><p class="stats">'+T.length+' topics · 4 units · HL and SL · '+done+' studied · last synced '+SYNC_DATE+'</p><div class="aboutc"><h3>About this course</h3><p>Every graph in IB Economics for Grades 11 and 12: what it shows, how to draw it, and how to use it in an exam answer. Built from your class materials.</p></div>'+(lt?'<p style="margin:18px 0 0"><a class="pill" href="#'+lt.id+'">Continue with '+NUM[lt.id]+' '+lt.title+'</a></p>':'')+'</div>'
  +'<section><h3>Units</h3><div class="tiles">'+units+'</div></section>'
  +'<section><h3>Needs attention</h3><ul class="att">'+(att||'<li>Everything is studied. Try the <a href="#quiz">self-test</a>.</li>')+'</ul></section>'
  +'<section class="gray"><h3>Resources</h3><p><a href="#quiz">Self-test</a> - every exam question, with model answers</p><p><a href="#practice">Practice bank</a> - worked calculations from your class sheets</p><p><a href="#formulas">Formula sheet</a> - every calculation you need in one place</p><p><a href="#glossary">Key terms</a> - definitions to learn word for word</p><p><a href="#sync">Sync log</a> - which class files are in the app</p></section></div>'}
function show(id){
  const t=T.find(x=>x.id===id);current=id;const main=$('#main');
  if(id==='formulas'){main.innerHTML=`<div class="card">${refCrumb}<h1>Formula sheet</h1><p class="what">The calculations that appear in IB Economics papers. Show your working and state the sign of elasticity results.</p><div class="tw"><table><tr><th>Measure</th><th>Formula</th><th>Reading it</th></tr>${FORMULAS.map(r=>`<tr><td><b>${r[0]}</b></td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`).join('')}</table></div></div>`}
  else if(id==='quiz'){main.innerHTML=quizHTML()}
  else if(id==='welcome'){main.innerHTML=welcomeHTML()}
  else if(id==='practice'){main.innerHTML=practiceHTML()}
  else if(id==='sync'){main.innerHTML=syncHTML()}
  else if(t&&t.notes){renderNotes(t)}
  else if(id==='glossary'){main.innerHTML=`<div class="card">${refCrumb}<h1>Key terms</h1><p class="what">Definitions worth learning word for word. Examiners reward precise definitions.</p><div class="tw"><table><tr><th>Term</th><th>Definition</th><th>Unit</th></tr>${GLOSS.filter(g=>!filter||(g[0]+g[1]).toLowerCase().includes(filter)).map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join('')}</table></div></div>`}
  else{
    const i=T.indexOf(t);
    main.innerHTML=`<article class="art"><header class="chead">${crumbHTML(t)}<p class="meta"><span>Topic ${NUM[id]}</span><span class="${t.hl?'hl':''}">${t.hl?'HL only':'SL and HL'}</span><span>Updated: ${SYNC_DATE}</span></p><h1>${t.title}</h1><p class="byline"><a href="#${T.find(x=>unitNum(x)===unitNum(t)).id}">${unitName(t)}</a>, ${BAND[id]||''}</p><p class="acts"><label class="done"><input type="checkbox" id="chk" ${studied[id]?'checked':''}> Mark as studied</label><a href="#" id="citeb">Cite this topic</a></p></header><section><h3>Summary</h3><p>${t.what}</p></section><figure class="fig" style="margin-left:0;margin-right:0"><p class="ft"><b>Fig. ${NUM[id]}:</b> ${t.title}.</p><div class="chart" id="chart"></div><div class="ctrls" id="ctrls"></div><button type="button" class="reset" id="rs">Reset sliders</button><div class="read" id="read" aria-live="polite"></div><div class="key" id="key"></div><p class="fc">Move the sliders to change the diagram. The result line and the key update as you go.</p></figure><section><h3>Key idea</h3><p>${t.meaning}</p></section>${xt(id,'terms')}<section><h3>Constructing the diagram</h3><ol class="steps">${t.draw.map(d=>`<li>${d}</li>`).join('')}</ol></section>${xt(id,'eval')}<section><h3>Examiner tips</h3><ul>${t.tips.map(d=>`<li>${d}</li>`).join('')}</ul></section><section class="practice"><h3>Exam practice</h3><p class="qtext">${t.q}</p><details><summary>Show model answer</summary><p>${t.a}</p></details></section>${xt(id,'more')}<div class="pager"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button id="next" ${i===T.length-1?'disabled':''}>Next →</button></div></article>`;
    const vals={};t.ctrl.forEach(c=>vals[c.id]=c.val);
    $('#ctrls').innerHTML=t.ctrl.map(c=>`<div class="ctrl"><label for="r-${c.id}">${c.label}<output id="o-${c.id}">${c.val}</output></label><input type="range" id="r-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}"></div>`).join('');
    const draw=()=>{const s=t.f(vals);s.alt=t.title+' graph';$('#chart').innerHTML=render(s,t.id);$('#key').innerHTML=keyHTML(s,t.id);$('#read').innerHTML=trReadHTML(s.read);applyLang($('#chart'));applyLang($('#key'));applyLang($('#read'))};
    t.ctrl.forEach(c=>$('#r-'+c.id).addEventListener('input',e=>{vals[c.id]=parseFloat(e.target.value);$('#o-'+c.id).textContent=e.target.value;draw()}));
    draw();
    $('#rs').onclick=()=>{t.ctrl.forEach(c=>{vals[c.id]=c.val;$('#r-'+c.id).value=c.val;$('#o-'+c.id).textContent=c.val});draw()};
    $('#chk').addEventListener('change',e=>onStudiedChange(id,e));
    $('#prev').onclick=()=>go(T[i-1].id);$('#next').onclick=()=>go(T[i+1].id)}
  try{localStorage.setItem('econ-last',id)}catch(e){}
  buildNav();const mm=$('#main');const nsec=buildOnPage();setTab(nsec&&!filter?'sections':'contents');if(mm.classList){mm.classList.remove('swap');void mm.offsetWidth;mm.classList.add('swap')}if(mm.focus)mm.focus({preventScroll:true});applyLang(document.body);window.scrollTo({top:0})}
function go(id){if(location.hash==='#'+id)show(id);else location.hash=id}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(ENTRIES.some(e=>e.id===id))show(id)});
$('#sel').addEventListener('change',e=>go(e.target.value));
$('#q').addEventListener('input',e=>{filter=e.target.value.trim().toLowerCase();buildNav();if(current==='glossary')show('glossary')});
if(document.addEventListener){
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;const i=T.findIndex(t=>t.id===current);if(i<0)return;if(e.key==='ArrowRight'&&i<T.length-1)go(T[i+1].id);if(e.key==='ArrowLeft'&&i>0)go(T[i-1].id)});
 document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
  const f=t.closest('[data-f]');if(f){qfilter=f.getAttribute('data-f');show('quiz');return}
  const g=t.closest('[data-g],[data-r]');if(g){const id=g.getAttribute('data-g')||g.getAttribute('data-r');quiz[id]=g.hasAttribute('data-g')?'got':'review';saveQ();
   const sp=document.querySelector('.qs[data-id="'+id+'"]');if(sp){sp.textContent=quiz[id]==='got'?'Got it':'To review';ORIG&&ORIG.delete(sp.firstChild);applyLang(sp)}
   const got=T.filter(x=>quiz[x.id]==='got').length,rev=T.filter(x=>quiz[x.id]==='review').length,sm=document.querySelector('#qsum');if(sm){sm.innerHTML='<b>'+got+'</b> got it, <b>'+rev+'</b> to review, <b>'+(T.length-got-rev)+'</b> not tried.';applyLang(sm)}}});
}
if(document.addEventListener)document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;const lg=t.closest('#lang');if(lg){setLang(L==='vi'?'en':'vi');return}
  const tb=t.closest('[data-tab]');if(tb){setTab(tb.getAttribute('data-tab'));return}
  const cb=t.closest('#citeb');if(cb){e.preventDefault();const tt=T.find(x=>x.id===current);if(tt){const txt='Econ App. ('+SYNC_DATE.slice(-4)+'). '+tt.title+'. IB Economics HL and SL, topic '+NUM[current]+'. Last synced '+SYNC_DATE+'.';try{navigator.clipboard.writeText(txt).then(()=>toast('Citation copied.'),()=>toast(txt))}catch(err){toast(txt)}}return}
  const a=t.closest('#onpage a');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}});
const start=location.hash.slice(1);show(ENTRIES.some(e=>e.id===start)?start:'welcome');
</script>
</body></html>
