<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="live">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EVS Systems Diagram &amp; Continuum (IB ESS 1.1 SL)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./ess-viewer.css">
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-l">
      <span class="hd-badge">Topic 1.1 · SL</span>
      <h1 class="hd-title">Environmental Value System (EVS)</h1>
    </div>
    <div class="tb">
      <button type="button" id="btn-theme" aria-pressed="false">Dark</button>
      <button type="button" id="btn-motion" aria-pressed="true">Live</button>
      <button type="button" id="btn-export">Export SVG</button>
    </div>
  </header>

  <div class="ctrl-bar" data-forview="v1">
    <div class="ctrl-grp">
      <label>Select EVS stance on continuum:</label>
      <button type="button" class="ctrl-btn on" data-stance="all">Overview</button>
      <button type="button" class="ctrl-btn" data-stance="eco">Ecocentric</button>
      <button type="button" class="ctrl-btn" data-stance="anthro">Anthropocentric</button>
      <button type="button" class="ctrl-btn" data-stance="techno">Technocentric</button>
    </div>
    <span class="ctrl-read" id="stance-lbl">Click any arrow or stance to inspect</span>
  </div>

  <main class="stage" id="stage">
    <svg class="esvg" data-view="v1" viewBox="0 0 920 452" role="img" aria-label="ESS 1.1 Environmental Value System diagram">
      <defs>
        <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#1b6b4f"/>
        </marker>
        <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#1d4ed8"/>
        </marker>
      </defs>
      <g class="vp">
        <rect x="285" y="28" width="350" height="274" rx="18" fill="var(--surface)" fill-opacity="0.72" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5" data-tip="boundary"/>
        <text x="460" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">SYSTEM BOUNDARY · INDIVIDUAL OR SOCIETY</text>

        <g data-tip="inputs">
          <path d="M40,68 L230,68 L230,57 L276,80 L230,103 L230,92 L40,92 Z" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.6"/>
          <text x="142" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--blue)">Education &amp; Science</text>

          <path d="M40,124 L230,124 L230,113 L276,136 L230,159 L230,148 L40,148 Z" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.6"/>
          <text x="142" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--blue)">Media &amp; Campaigns</text>

          <path d="M40,180 L230,180 L230,169 L276,192 L230,215 L230,204 L40,204 Z" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.6"/>
          <text x="142" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--blue)">Culture, Religion &amp; Laws</text>

          <path d="M40,236 L230,236 L230,225 L276,248 L230,271 L230,260 L40,260 Z" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.6"/>
          <text x="142" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--blue)">Economics &amp; Lived Experience</text>

          <path class="flow-anim" d="M278,108 L345,142" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arr-b)"/>
          <path class="flow-anim" d="M278,220 L345,196" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arr-b)"/>
          <text x="155" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blue)">INPUTS (External Factors)</text>
        </g>

        <g data-tip="process">
          <circle cx="460" cy="172" r="96" fill="var(--warm)" stroke="var(--accent)" stroke-width="2.5"/>
          <circle cx="460" cy="172" r="82" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
          <circle cx="460" cy="126" r="14" fill="var(--green-bg)" stroke="var(--accent)" stroke-width="1.5"/>
          <path d="M454,126 L458,130 L467,121" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          <text x="460" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">EVS Processes</text>
          <text x="460" y="177" text-anchor="middle" font-size="11.5" fill="var(--muted)">1. Assumptions &amp; Beliefs</text>
          <text x="460" y="194" text-anchor="middle" font-size="11.5" fill="var(--muted)">2. Intrinsic vs Instrumental</text>
          <text x="460" y="211" text-anchor="middle" font-size="11.5" fill="var(--muted)">3. Arguments &amp; CBA</text>
          <text x="460" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--accent)">Filters Inputs into Action</text>
        </g>

        <g data-tip="outputs">
          <path class="flow-anim" d="M560,145 L636,112" fill="none" stroke="#1b6b4f" stroke-width="2" marker-end="url(#arr-g)"/>
          <path class="flow-anim" d="M560,198 L636,226" fill="none" stroke="#1b6b4f" stroke-width="2" marker-end="url(#arr-g)"/>

          <path d="M642,84 L824,84 L824,72 L878,97 L824,122 L824,110 L642,110 Z" fill="var(--green-bg)" stroke="var(--accent2)" stroke-width="1.6"/>
          <text x="742" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent)">Perspectives &amp; Decisions</text>

          <path d="M642,154 L824,154 L824,142 L878,167 L824,192 L824,180 L642,180 Z" fill="var(--green-bg)" stroke="var(--accent2)" stroke-width="1.6"/>
          <text x="742" y="171" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent)">Policies, Laws &amp; Votes</text>

          <path d="M642,224 L824,224 L824,212 L878,237 L824,262 L824,250 L642,250 Z" fill="var(--green-bg)" stroke="var(--accent2)" stroke-width="1.6"/>
          <text x="742" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent)">Lifestyle &amp; Actions</text>
          <text x="760" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">OUTPUTS (Visible Choices)</text>
        </g>

        <path class="flow-anim" d="M760,266 C760,318 142,318 142,272" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arr-g)"/>
        <text x="460" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">Feedback: Outcomes reshape future lived experience &amp; social norms (1.1.9)</text>

        <g transform="translate(80,336)">
          <line x1="20" y1="22" x2="740" y2="22" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>
          <g data-tip="eco" class="evs-band" id="band-eco">
            <rect x="20" y="18" width="235" height="8" rx="4" fill="#15803d"/>
            <circle cx="137" cy="22" r="10" fill="var(--surface)" stroke="#15803d" stroke-width="3"/>
            <text x="137" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Ecocentric (Nature-centered)</text>
          </g>
          <g data-tip="anthro" class="evs-band" id="band-anthro">
            <rect x="262" y="18" width="235" height="8" rx="4" fill="#b45309"/>
            <circle cx="380" cy="22" r="10" fill="var(--surface)" stroke="#b45309" stroke-width="3"/>
            <text x="380" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Anthropocentric (Human-managed)</text>
          </g>
          <g data-tip="techno" class="evs-band" id="band-techno">
            <rect x="504" y="18" width="236" height="8" rx="4" fill="#1d4ed8"/>
            <circle cx="622" cy="22" r="10" fill="var(--surface)" stroke="#1d4ed8" stroke-width="3"/>
            <text x="622" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Technocentric (Tech-centered)</text>
          </g>
        </g>
      </g>
    </svg>
    <div class="legend">
      <span class="leg-i"><span class="leg-sw" style="background:var(--blue)"></span>Inputs</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--accent2)"></span>Outputs</span>
      <span class="leg-i"><span class="leg-sw" style="background:var(--accent)"></span>Dashed boundary</span>
    </div>
    <div class="zoom-bar">
      <button type="button" id="z-out" aria-label="Zoom out">-</button>
      <span id="z-lbl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div>
  </main>
  <footer class="insp" id="insp" aria-live="polite"></footer>
</div>

<script src="./ess-viewer.js"></script>
<script>
  var ctrl = initEssDiagram({
    slug: 'evs-model',
    defaultView: 'v1',
    defaultTip: 'process',
    tips: {
      boundary: {
        code: '1.1.7',
        title: 'EVS System Boundary (Individual or Group)',
        body: 'An Environmental Value System behaves like an open system: external cultural, educational, and economic inputs enter, get weighed inside, and leave as decisions.',
        exam: 'Draw the box + inward Input arrows + outward Output arrows cleanly whenever asked for an EVS diagram.'
      },
      inputs: {
        code: '1.1.2',
        title: 'EVS Inputs (What Shapes Your Worldview)',
        body: 'Sociocultural norms, scientific understandings, laws, religion, economic conditions, local/global disasters, and lived experiences inform your perspective.',
        exam: 'Name at least 3 distinct inputs in Paper 2 essays (e.g. Silent Spring media, economic income, religious beliefs).'
      },
      process: {
        code: '1.1.1 / 1.1.3',
        title: 'Internal Processing (Values & Arguments)',
        body: 'Inside the mind/society, broad and specific values weigh intrinsic worth vs instrumental usefulness using cost-benefit analysis and personal assumptions.',
        exam: 'Distinguish a perspective (underlying view) from an argument (reasons supporting/countering a view).'
      },
      outputs: {
        code: '1.1.4 / 1.1.7',
        title: 'EVS Outputs (Visible Actions & Policies)',
        body: 'Internal values show outward through lifestyle choices, voting, NGO activism, stakeholder positions, laws, and environmental policies.',
        exam: 'Match outputs back to inputs when comparing stakeholders (e.g. Gwich in elders vs oil developers).'
      },
      eco: {
        code: '1.1.8',
        title: 'Ecocentric Worldview (Deep Ecologists / Self-Reliance)',
        body: 'Places nature at the center with intrinsic value. Argues humans are one part of ecosystems and must reduce consumption and protect rights of nature.',
        exam: 'Climate response example: cut fossil fuel demand, halt Arctic drilling, protect intact forests.'
      },
      anthro: {
        code: '1.1.8',
        title: 'Anthropocentric Worldview (Environmental Managers)',
        body: 'Views humans as responsible stewards sustainably managing the global system for human well-being using laws, carbon taxes, and global treaties.',
        exam: 'Climate response example: Paris Agreement targets, emissions trading schemes, zoning laws.'
      },
      techno: {
        code: '1.1.8',
        title: 'Technocentric Worldview (Cornucopians / Tech Optimists)',
        body: 'Trusts scientific innovation, R&D, green technology, and markets to solve environmental limits without halting economic growth.',
        exam: 'Climate response example: EVs, carbon capture & storage (CCS), nuclear fusion, solar geoengineering.'
      }
    }
  });

  document.querySelectorAll('[data-stance]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-stance]').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      var st = btn.getAttribute('data-stance');
      ['eco', 'anthro', 'techno'].forEach(function (k) {
        var g = document.getElementById('band-' + k);
        if (g) g.style.opacity = (st === 'all' || st === k) ? '1' : '0.28';
      });
      var lbl = document.getElementById('stance-lbl');
      if (st === 'all') {
        lbl.textContent = 'Click any arrow or stance to inspect';
        ctrl.showTip('process');
      } else {
        lbl.textContent = st === 'eco' ? 'Ecocentric: Intrinsic value & restraint' : (st === 'anthro' ? 'Anthropocentric: Laws, taxes & regulation' : 'Technocentric: Green tech & innovation');
        ctrl.showTip(st);
      }
    });
  });
</script>
</body>
</html>
