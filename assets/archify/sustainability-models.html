<!DOCTYPE html>

</head>
<body>

  <main class="stage" id="stage">
    <svg class="esvg" data-view="donut" viewBox="0 0 920 410" role="img" aria-label="Doughnut Economics and 9 Planetary Boundaries concentric rings">

    <svg class="esvg" data-view="pillars" viewBox="0 0 920 410" hidden role="img" aria-label="Weak Venn vs Strong Nested Circles vs Ecological Footprint Overshoot">

          <circle cx="167" cy="162" r="56" fill="#15803d" fill-opacity="0.24" stroke="#15803d" stroke-width="2.2"/>
          <circle cx="131" cy="222" r="56" fill="#1d4ed8" fill-opacity="0.24" stroke="#1d4ed8" stroke-width="2.2"/>

          <circle cx="459" cy="228" r="42" fill="#b45309" fill-opacity="0.28" stroke="#b45309" stroke-width="2.2"/>
          <text x="459" y="124" text-anchor="middle" font-size="12.5" font-weight="800" fill="#15803d">ENVIRONMENT</text>
          <text x="459" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">SOCIETY</text>
          <text x="459" y="232" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">ECONOMY</text>
          <text x="459" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="var(--accent)">Matches IB ESS systems reality</text>

        <g data-tip="ef_bio">

          <text x="752" y="78" text-anchor="middle" font-size="10.5" fill="var(--muted)">When EF &gt; Biocapacity = Overshoot</text>

          <polygon points="752,248 730,288 774,288" fill="var(--warm)" stroke="var(--ink)" stroke-width="2"/>
          <line x1="654" y1="264" x2="850" y2="216" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          <rect x="642" y="176" width="76" height="82" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.2"/>
          <text x="680" y="206" text-anchor="middle" font-size="12" font-weight="800" fill="var(--red)">EF</text>
          <text x="680" y="222" text-anchor="middle" font-size="10" fill="var(--ink)">Resource</text>
          <text x="680" y="236" text-anchor="middle" font-size="10" fill="var(--ink)">demand + CO2</text>

          <rect x="794" y="156" width="72" height="54" rx="6" fill="var(--green-bg)" stroke="#15803d" stroke-width="2"/>
          <text x="830" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">Biocapacity</text>
          <text x="830" y="196" text-anchor="middle" font-size="10" fill="var(--ink)">Earth supply</text>

          <text x="752" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="var(--red)">Earth Overshoot Day arrived earlier</text>
        </g>
      </g>
    </svg>

    <svg class="esvg" data-view="fly" viewBox="0 0 920 410" hidden role="img" aria-label="Circular Economy Butterfly Diagram">
      <defs>
        <marker id="bf-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#15803d"/>
        </marker>
        <marker id="bf-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#0e7490"/>
        </marker>
      </defs>
      <g class="vp">
        <rect x="390" y="30" width="140" height="46" rx="8" fill="var(--warm)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="460" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Renewables &amp; Inputs</text>

        <rect x="405" y="128" width="110" height="44" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="460" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Manufacturing</text>

        <rect x="405" y="218" width="110" height="44" rx="8" fill="var(--warm)" stroke="var(--accent)" stroke-width="2.2"/>
        <text x="460" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent)">Consumer</text>
        <text x="460" y="252" text-anchor="middle" font-size="10.5" fill="var(--muted)">(Biological &amp; User)</text>

        <rect x="405" y="316" width="110" height="42" rx="8" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.4" stroke-dasharray="4 3"/>
        <text x="460" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="var(--red)">Minimize Leakage</text>

        <line x1="460" y1="76" x2="460" y2="128" stroke="var(--ink)" stroke-width="2.5"/>
        <line x1="460" y1="172" x2="460" y2="218" stroke="var(--ink)" stroke-width="2.5"/>
        <line x1="460" y1="262" x2="460" y2="316" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="4 4"/>

        <g data-tip="bio_wing">
          <text x="190" y="38" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">BIOLOGICAL CYCLE (Left Wing)</text>
          <text x="190" y="56" text-anchor="middle" font-size="11" fill="var(--muted)">Biodegradable nutrients safely regenerate soil</text>
          <path class="flow-anim" d="M402,240 C150,350 96,92 388,58" fill="none" stroke="#15803d" stroke-width="3.2" marker-end="url(#bf-g)"/>
          <rect x="66" y="138" width="114" height="36" rx="18" fill="var(--green-bg)" stroke="#15803d" stroke-width="1.8"/>
          <text x="123" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Regenerate Soil</text>
          <path class="flow-anim" d="M402,235 C220,295 190,132 402,146" fill="none" stroke="#22c55e" stroke-width="2.6" marker-end="url(#bf-g)"/>
          <rect x="190" y="188" width="128" height="34" rx="17" fill="var(--green-bg)" stroke="#15803d" stroke-width="1.6"/>
          <text x="254" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Compost &amp; Biogas</text>
          <path class="flow-anim" d="M404,244 C315,270 315,190 404,225" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#bf-g)"/>
          <text x="345" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Cascades</text>
        </g>

        <g data-tip="tech_wing">
          <text x="730" y="38" text-anchor="middle" font-size="14" font-weight="800" fill="#0e7490">TECHNICAL CYCLE (Right Wing)</text>
          <text x="730" y="56" text-anchor="middle" font-size="11" fill="var(--muted)">Finite metals/plastics stay circulating (inner loops = best)</text>
          <path class="flow-anim" d="M518,240 C770,350 824,92 532,58" fill="none" stroke="#0e7490" stroke-width="3.2" marker-end="url(#bf-t)"/>
          <rect x="742" y="138" width="108" height="36" rx="18" fill="var(--blue-bg)" stroke="#0e7490" stroke-width="1.8"/>
          <text x="796" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">Recycle Materials</text>
          <path class="flow-anim" d="M518,235 C698,295 726,132 518,146" fill="none" stroke="#06b6d4" stroke-width="2.6" marker-end="url(#bf-t)"/>
          <rect x="598" y="188" width="132" height="34" rx="17" fill="var(--blue-bg)" stroke="#0e7490" stroke-width="1.6"/>
          <text x="664" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">Reuse &amp; Refurbish</text>
          <path class="flow-anim" d="M516,244 C606,270 606,190 516,225" fill="none" stroke="#0891b2" stroke-width="2.2" marker-end="url(#bf-t)"/>
          <text x="578" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">Share / Repair</text>
        </g>
      </g>
    </svg>

    <div class="zoom-bar">
      <button type="button" id="z-out" aria-label="Zoom out">-</button>
      <span id="z-lbl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div>
  </main>
  <footer class="insp" id="insp" aria-live="polite"></footer>
</div>

<script src="./ess-viewer.js"></script>
<script>
  (function () {
    var g = document.getElementById('pb-wedges');
    var cx = 308, cy = 205, rIn = 144;
    var items = [
      ['Climate Change', 184, true],
      ['Biosphere Integrity', 194, true],
      ['N & P Cycles', 190, true],
      ['Land-System Change', 178, true],
      ['Freshwater Change', 174, true],
      ['Novel Entities', 182, true],
      ['Ocean Acidification', 148, false],
      ['Ozone Depletion', 148, false],
      ['Atmospheric Aerosols', 148, false]
    ];
    var step = (Math.PI * 2) / items.length;
    items.forEach(function (it, idx) {
      var a0 = -Math.PI / 2 + idx * step + 0.04;
      var a1 = -Math.PI / 2 + (idx + 1) * step - 0.04;
      var amid = (a0 + a1) / 2;
      var rOut = it[1];
      var over = it[2];
      var p1x = cx + rIn * Math.cos(a0), p1y = cy + rIn * Math.sin(a0);
      var p2x = cx + rOut * Math.cos(a0), p2y = cy + rOut * Math.sin(a0);
      var p3x = cx + rOut * Math.cos(a1), p3y = cy + rOut * Math.sin(a1);
      var p4x = cx + rIn * Math.cos(a1), p4y = cy + rIn * Math.sin(a1);
      var d = 'M ' + p1x.toFixed(1) + ',' + p1y.toFixed(1) +
        ' L ' + p2x.toFixed(1) + ',' + p2y.toFixed(1) +
        ' A ' + rOut + ',' + rOut + ' 0 0 1 ' + p3x.toFixed(1) + ',' + p3y.toFixed(1) +
        ' L ' + p4x.toFixed(1) + ',' + p4y.toFixed(1) +
        ' A ' + rIn + ',' + rIn + ' 0 0 0 ' + p1x.toFixed(1) + ',' + p1y.toFixed(1) + ' Z';
      var wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      wrap.setAttribute('data-tip', over ? 'overshoot_pb' : 'ceiling');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', over ? 'var(--red)' : 'var(--accent2)');
      path.setAttribute('fill-opacity', over ? '0.68' : '0.35');
      path.setAttribute('stroke', over ? 'var(--red)' : 'var(--accent)');
      path.setAttribute('stroke-width', '1.2');
      wrap.appendChild(path);

      var lr = over ? (rOut + 14) : 164;
      var lx = cx + lr * Math.cos(amid);
      var ly = cy + lr * Math.sin(amid);
      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', lx.toFixed(1));
      txt.setAttribute('y', (ly + 3).toFixed(1));
      txt.setAttribute('text-anchor', Math.cos(amid) > 0.25 ? 'start' : (Math.cos(amid) < -0.25 ? 'end' : 'middle'));
      txt.setAttribute('font-size', '9.5');
      txt.setAttribute('font-weight', over ? '700' : '600');
      txt.setAttribute('fill', over ? 'var(--red)' : 'var(--muted)');
      txt.textContent = it[0];
      wrap.appendChild(txt);
      g.appendChild(wrap);
    });
  })();

  initEssDiagram({
    slug: 'sustainability-models',
    defaultView: 'donut',
    viewDefaults: { donut: 'safe', pillars: 'strong_s', fly: 'bio_wing' },
    tips: {
      safe: {
        code: '1.3.20',
        title: 'Safe & Just Space (Between Rings)',
        body: 'Kate Raworth Doughnut Economics target zone: every person meets basic SDG human rights without breaking Earth ecological boundaries.',
        exam: 'Always name BOTH boundaries: inner Social Foundation and outer Ecological Ceiling.'
      },
      shortfall: {
        code: '1.3.20',
        title: 'Social Shortfall (Inner Hole)',
        body: 'Populations falling inside the inner ring lack food, clean water, healthcare, education, gender equality, or energy access.',
        exam: 'Environmental justice (1.3.9) connects closely to closing the inner social shortfall fairly.'
      },
      foundation: {
        code: '1.3.18 / 1.3.20',
        title: 'Social Foundation (SDGs)',
        body: 'Built from UN Sustainable Development Goals to ensure no one falls short on essential human well-being.',
        exam: 'Requires distributive design (sharing resources and wealth fairly across regions).'
      },
      ceiling: {
        code: '1.3.19',
        title: 'Ecological Ceiling (Planetary Boundaries)',
        body: 'Nine critical Earth-system processes identified by Rockstrom et al. that maintain Holocene-like planetary stability.',
        exam: 'Three boundaries remain near or within safe limits here (ozone, ocean acidification, aerosols), while six have already been crossed.'
      },
      overshoot_pb: {
        code: '1.3.19',
        title: 'Transgressed Planetary Boundaries (Overshoot)',
        body: 'Humanity has pushed past safe operating limits for Climate Change, Biosphere Integrity, N/P Biogeochemical Flows, Land-System Change, Freshwater, and Novel Entities.',
        exam: 'Crossing a planetary boundary raises the risk of abrupt, irreversible global tipping points.'
      },
      weak_s: {
        code: '1.3.2',
        title: 'Weak Sustainability Model (3 Equal Venn Circles)',
        body: 'Draws Environment, Society, and Economy as equal overlapping rings, implying manufactured GDP capital can substitute for lost natural capital.',
        exam: 'Main critique: real ecosystems cannot be replaced with money once life-support collapses.'
      },
      strong_s: {
        code: '1.3.2',
        title: 'Strong Sustainability (Nested Concentric Circles)',
        body: 'Places Economy inside Society, and both inside Environment. No healthy society or economy can exist outside the biosphere.',
        exam: 'Use the nested circles sketch (and SDG Wedding Cake) to show strong sustainability in Paper 2 essays.'
      },
      ef_bio: {
        code: '1.3.13 / 1.3.15',
        title: 'Ecological Footprint vs Biocapacity',
        body: 'Ecological Footprint (EF) measures biologically productive land & water demanded (especially carbon uptake). When EF > Biocapacity, the population is in ecological overshoot.',
        exam: 'Lower EF by cutting fossil fuels, eating less meat, reducing imports, and restoring ecosystems.'
      },
      bio_wing: {
        code: '1.3.21',
        title: 'Biological Cycle (Left Wing of Butterfly)',
        body: 'Manages renewable, non-toxic bio-based materials so they cascade through secondary uses and return nutrients safely to soil via composting or biogas.',
        exam: 'Decouples production from finite depletion and actively regenerates natural capital.'
      },
      tech_wing: {
        code: '1.3.21',
        title: 'Technical Cycle (Right Wing of Butterfly)',
        body: 'Keeps finite metals, electronics, and polymers circulating. Tighter inner loops (Share, Repair, Reuse) retain far more value and energy than outer Recycling.',
        exam: 'Circular economy aims for zero waste by design, unlike the linear take-make-waste model.'
      }
    }
  });
</script>
</body>
</html>
