<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Econ App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#222;--muted:#5d625f;--green:#0a3324;--link:#14513a;--mid:#1f6b49;--curve2:#2a8f60;--line:#dcdedc;--warm:#f9f8f6;--warm2:#f2f0ec;
--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
--fg:var(--ink);--accent:var(--green);--accent2:var(--mid);--ease-out:cubic-bezier(0.23,1,0.32,1);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:18px/1.6 var(--serif);font-variant-numeric:tabular-nums}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
::selection{background:var(--green);color:#fff}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--green);padding:8px 12px;z-index:30}
.skip:focus{left:8px}
.top1{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1180px;margin:0 auto;padding:18px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px))}
.brand{font:700 30px/1 var(--serif);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.tr{display:flex;align-items:center;gap:22px;font:600 15px var(--sans)}
.tr a{color:var(--ink);text-decoration:none}
.tr input{width:230px;border:1px solid #bbb;border-radius:0;padding:8px 10px;font:15px var(--sans);color:var(--ink);background:#fff;caret-color:var(--mid)}
.top2{max-width:1180px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.top2 a{font:600 15.5px var(--sans);color:var(--ink);text-decoration:none;padding:8px 0 11px;border-bottom:3px solid transparent;white-space:nowrap}
.top2 a.on{border-bottom-color:var(--green);color:var(--green)}
@media (hover:hover) and (pointer:fine){.top2 a:hover{color:var(--mid)}}
.rule{height:2px;background:var(--ink)}
.mobsel{display:none}
select{width:100%;background:#fff;border:1px solid #bbb;border-radius:0;padding:10px 12px;font:16px var(--sans);color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,760px) 300px;gap:60px;max-width:1180px;margin:0 auto;padding:26px max(24px,env(safe-area-inset-right,0px)) 90px max(24px,env(safe-area-inset-left,0px))}
.layout.nolist{grid-template-columns:minmax(0,980px);justify-content:center}
.layout.nolist .side{display:none}
main{min-width:0}
main:focus{outline:none}
.crumb{font:14px var(--sans);color:var(--muted);margin:0 0 14px}
.crumb a{color:var(--muted);text-decoration:none}
.meta{font:14px var(--sans);color:var(--ink);margin:0 0 8px;display:flex;flex-wrap:wrap}
.meta span+span::before{content:"·";margin:0 10px;color:var(--muted)}
.meta .hl{color:var(--mid);font-weight:600}
h1{font:700 36px/1.2 var(--serif);color:var(--ink);margin:0 0 12px;letter-spacing:-.005em}
.byline{font:15px/1.5 var(--sans);margin:0 0 10px;color:var(--muted)}
.byline a{color:var(--link)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:24px;font:15px var(--sans);margin:12px 0 4px}
.done{display:inline-flex;gap:9px;align-items:center;font:600 15px var(--sans);color:var(--ink);cursor:pointer}
.done input{width:17px;height:17px;accent-color:var(--green);transition:transform 120ms var(--ease-out)}
.done:active input{transform:scale(.9)}
h3{font:700 28px/1.25 var(--serif);color:var(--ink);margin:38px 0 12px;scroll-margin-top:70px}
section p,section li,.what,.notes p{font-size:18px;line-height:1.6;margin:0 0 12px;max-width:68ch}
section ul,section ol{margin:0 0 12px;padding-left:26px;display:grid;gap:8px}
.fig{margin:28px 0 8px;padding:18px 20px 16px;border:1px solid var(--line)}
.ft{font:18px/1.4 var(--serif);margin:0 0 12px!important}
.chart{min-width:0}
svg{display:block;width:100%;height:auto;max-width:560px}
svg text{fill:var(--ink);font:14px var(--sans);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg .lbl{fill:var(--muted);font-size:13.5px;font-weight:500}
svg .alab{font-weight:700;font-size:13px}
svg .ax{stroke:var(--ink);stroke-width:1.6;fill:none}
svg .c1{stroke:var(--ink);stroke-width:2.6;fill:none}
svg .c2{stroke:var(--curve2);stroke-width:2.6;fill:none}
svg .c3{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-dasharray:6 5;opacity:.7}
svg .c4{stroke:var(--curve2);stroke-width:1.8;fill:none;stroke-dasharray:6 5}
svg .c5{stroke:var(--mid);stroke-width:5;fill:none;opacity:.9}
svg .a1{fill:rgba(42,143,96,.28)}
svg .a2{fill:rgba(10,51,36,.16)}
svg .drop{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
svg .dot{fill:#fff;stroke:var(--ink);stroke-width:2}
.ctrls{display:grid;gap:12px;margin-top:14px;max-width:560px}
.ctrl label{display:flex;justify-content:space-between;gap:12px;font:600 15px/1.35 var(--sans);margin-bottom:0}
.ctrl output{color:var(--mid)}
input[type=range]{width:100%;height:26px;background:transparent;accent-color:var(--green)}
.reset{background:none;border:0;padding:0;margin:4px 0 0;color:var(--link);font:15px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.read{margin:12px 0 0;font:17px/1.5 var(--serif);max-width:60ch}
.read b{color:var(--green)}
.key{margin:16px 0 0;max-width:560px}
.key:empty{display:none}
.key .kh{display:block;font:700 14px var(--sans);margin-bottom:6px}
.key ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px}
.key li{display:flex;align-items:center;gap:10px;font:14px/1.3 var(--sans);margin:0}
.key svg.sw{width:34px;height:14px;flex:none;display:block;max-width:none}
.fc{font:14px/1.5 var(--sans);color:var(--muted);margin:12px 0 0!important}
.practice .qtext{font-weight:700}
details{margin:8px 0}
details summary{cursor:pointer;font:600 16px var(--sans);color:var(--link);text-decoration:underline;text-underline-offset:3px}
details[open]>summary~*{animation:reveal 200ms var(--ease-out)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px}
.pager button{background:#fff;color:var(--green);border:1px solid var(--green);border-radius:0;padding:9px 18px;font:600 15px var(--sans);cursor:pointer;transition:background-color 140ms ease,color 140ms ease,transform 140ms var(--ease-out)}
.pager button:active:not(:disabled){transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.pager button:hover:not(:disabled){background:var(--green);color:#fff}}
.pager button:disabled{opacity:.35;cursor:default}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:16px/1.5 var(--sans)}
th,td{padding:10px 12px 10px 0;text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--ink)}
td.num{text-align:right}
code{font:inherit;background:var(--warm2);padding:2px 7px}
.terms{margin:0;display:grid}
.terms>div{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:24px;padding:9px 0}
.terms dt{font:700 16.5px var(--sans)}
.terms dd{margin:0;font-size:17px;line-height:1.6}
.notes section{margin:0 0 24px}
/* sidebar (Nature-style tabs) */
.side{position:sticky;top:18px;align-self:start}
.dl{display:block;background:var(--green);color:#fff;text-align:center;padding:12px 16px;font:600 15px var(--sans);text-decoration:none;margin:0 0 16px;transition:transform 140ms var(--ease-out)}
.dl:active{transform:scale(.98)}
.tabs{display:flex;background:#ececec}
.tabs button{flex:1;background:none;border:0;padding:10px 12px;font:600 14.5px var(--sans);color:var(--ink);cursor:pointer}
.tabs button.on{background:#fff;box-shadow:inset 0 3px 0 var(--green)}
.panel{max-height:calc(100vh - 170px);overflow:auto;padding:14px 4px 0;scrollbar-width:thin}
.panel a{display:block;font:15px/1.35 var(--sans);padding:6px 0;color:var(--link)}
.panel a.on{color:var(--ink);font-weight:700;text-decoration:none}
.panel .bandl{font:italic 14px var(--sans);color:var(--muted);margin:14px 0 2px}
.panel .prog{font:14px var(--sans);color:var(--muted);margin:0 0 4px}
.panel .n{display:inline-block;min-width:36px;color:var(--muted)}
.panel small{font:600 11.5px var(--sans);color:var(--mid);margin-left:6px}
.sync{font:13.5px var(--sans);color:var(--muted);margin:18px 4px 0}
/* sticky title bar after scrolling past the title */
.mini{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-bottom:1px solid var(--line);padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));transform:translateY(-101%);transition:transform 200ms var(--ease-out)}
.mini.show{transform:none}
.mini b{font:700 16px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini a{background:var(--green);color:#fff;padding:7px 14px;font:600 14px var(--sans);text-decoration:none;white-space:nowrap}
/* welcome: Academia-style warm band */
.band{background:var(--warm);box-shadow:0 0 0 100vmax var(--warm);clip-path:inset(0 -100vmax);padding:4px 0 30px;margin:0 0 34px}
.band h1{font:400 clamp(44px,7vw,74px)/1.05 var(--serif);color:#141413;margin:6px 0 14px}
.stats{font:14.5px var(--sans);color:var(--muted);margin:0 0 20px}
.aboutc{background:#fff;padding:16px 20px;max-width:760px}
.aboutc h3{font:700 16px var(--sans);margin:0 0 4px}
.aboutc p{margin:0;font:15.5px/1.55 var(--sans);max-width:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:0 0 10px}
.tile{background:var(--warm);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.tile b{display:block;font:600 17px var(--sans)}
.tile span{font:14px var(--sans);color:var(--muted)}
.pill{border:1px solid var(--green);color:var(--green);border-radius:16px;padding:6px 16px;font:600 14px var(--sans);text-decoration:none;white-space:nowrap;transition:background-color 140ms ease,color 140ms ease}
@media (hover:hover) and (pointer:fine){.pill:hover{background:var(--green);color:#fff}}
.obj{font:17px/1.6 var(--serif);margin:0 0 12px;max-width:70ch}
.bar{height:6px;background:#e6e6e6;min-width:100px}
.bar i{display:block;height:100%;background:var(--mid)}
ul.att{margin:0;padding:0;list-style:none;display:grid}
ul.att li{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:17px;margin:0;max-width:none}
ul.att li span{color:var(--muted);font:14.5px var(--sans);text-align:right}
.gray{margin:0 0 22px}
.gray p{margin:6px 0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{background:#fff;border:1px solid var(--green);color:var(--green);padding:6px 14px;font:600 14.5px var(--sans);cursor:pointer;border-radius:16px}
.chip.on{background:var(--green);color:#fff}
.qa{margin:8px 0;background:var(--warm);padding:12px 16px}
.qa summary{font:500 18px/1.5 var(--serif);color:var(--ink);text-decoration:none}
.qn{color:var(--mid);font-weight:700;margin-right:8px}
.qa p{margin:10px 0}
.qb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.qb button{background:#fff;border:1px solid var(--green);color:var(--green);padding:6px 14px;font:600 14.5px var(--sans);cursor:pointer;border-radius:16px;transition:background-color 140ms ease,color 140ms ease,transform 140ms var(--ease-out)}
.qb button:active{transform:scale(.97)}
.qs{color:var(--mid);font:600 14.5px var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 16px;display:flex;gap:18px;align-items:center;font:500 15px var(--sans);z-index:20;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.toast.show{animation:toastin 200ms var(--ease-out)}
.toast button{background:none;border:0;color:#cfe0d6;font:700 15px var(--sans);cursor:pointer;text-decoration:underline}
.swap{animation:swap 160ms var(--ease-out)}
@keyframes swap{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mini{transition:none}@keyframes swap{from{opacity:.5}to{opacity:1}}@keyframes reveal{from{opacity:0}to{opacity:1}}@keyframes toastin{from{opacity:0}to{opacity:1}}.pager button:active:not(:disabled),.qb button:active,.dl:active{transform:none}}
@media (max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr);gap:0}
 .side{display:none}
 .mobsel{display:block;padding:12px max(24px,env(safe-area-inset-left,0px)) 0}
 .tr input{width:150px}
 .tr a{display:none}
 h1{font-size:30px}
 h3{font-size:24px}
 .terms>div{grid-template-columns:minmax(0,1fr);gap:4px}
}
.notes .crumb,.band .crumb{font:14px var(--sans);margin:0 0 14px;max-width:none}
.notes .stats{font:14.5px var(--sans)}
[hidden]{display:none!important}
</style>

</head>
<body>
<a class="skip" href="#" onclick="document.getElementById('main').focus();return false">Skip to content</a>
<div class="mini" id="mini" aria-hidden="true"><b id="minit"></b><a id="minin" href="#welcome">Next topic</a></div>
<header>
  <div class="top1"><a class="brand" href="#welcome">econ app</a><div class="tr"><a href="#quiz">Self-test</a><a href="#practice">Practice bank</a><a href="#glossary">Key terms</a><input type="search" id="q" placeholder="Search" aria-label="Search topics and terms"></div></div>
  <nav class="top2" id="units" aria-label="Sections"></nav>
  <div class="rule"></div>
</header>
<div class="mobsel"><select id="sel" aria-label="Choose a topic"></select></div>
<div class="layout" id="layout">
  <main id="main" tabindex="-1"></main>
  <aside class="side" id="side" aria-label="Topic navigation">
    <a class="dl" id="nextbtn" href="#welcome">Next topic</a>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="sections" class="on">Sections</button><button type="button" role="tab" data-tab="contents">Contents</button></div>
    <div class="panel" id="p-sections"><div id="onpage"></div></div>
    <div class="panel" id="p-contents" hidden><div id="nav"></div></div>
    <p class="sync" id="sync"></p>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const X=q=>50+q*3.9, Y=p=>300-p*2.8;
const D=(a,b)=>q=>a-b*q, S=(c,d)=>q=>c+d*q;
const f1=v=>(Math.round(v*10)/10).toString();
const fc=(fn,cls,label,at,q0=0,q1=100)=>{const pts=[];for(let q=q0;q<=q1+1e-9;q+=1){const y=fn(q);if(y>=-0.01&&y<=100.01)pts.push([q,y])}return{pts,cls,label,at,fn}};
const sg=(a,b,cls,label,at)=>({pts:[a,b],cls,label,lbl:at});
const poly=(pts,cls)=>({pts,cls});
const dot=(x,y,xl,yl)=>({x,y,xl,yl});

function render(s,uid){
  let o=`<svg viewBox="0 0 460 340" role="img" aria-label="${s.alt||'Economics graph'}"><defs><pattern id="h${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0a3324" stroke-width="2" opacity=".85"/></pattern></defs>`;
  (s.areas||[]).forEach(a=>{const p=a.pts.map(t=>X(t[0]).toFixed(1)+','+Y(t[1]).toFixed(1)).join(' ');
    if(a.cls==='dwl')o+=`<polygon points="${p}" fill="url(#h${uid})" stroke="#0a3324" stroke-width="1"/>`;else o+=`<polygon points="${p}" class="${a.cls}"/>`});
  o+=`<path class="ax" d="M50 18 V300 H442"/>`;
  (s.ticks&&s.ticks.x||[]).forEach(t=>o+=`<line x1="${X(t[0])}" x2="${X(t[0])}" y1="300" y2="305" class="ax"/><text class="lbl" x="${X(t[0])}" y="320" text-anchor="middle">${t[1]}</text>`);
  (s.ticks&&s.ticks.y||[]).forEach(t=>o+=`<line x1="45" x2="50" y1="${Y(t[0])}" y2="${Y(t[0])}" class="ax"/><text class="lbl" x="41" y="${Y(t[0])+4}" text-anchor="end">${t[1]}</text>`);
  (s.curves||[]).forEach(c=>{if(c.pts.length<2)return;
    o+=`<path class="${c.cls}" d="M${c.pts.map(t=>X(t[0]).toFixed(1)+' '+Y(t[1]).toFixed(1)).join(' L')}"/>`;
    if(c.label){let p;if(c.lbl)p=c.lbl;else{const q=c.at==null?c.pts[c.pts.length-1][0]:c.at;let best=c.pts[0];c.pts.forEach(t=>{if(Math.abs(t[0]-q)<Math.abs(best[0]-q))best=t});p=best}
      o+=`<text x="${X(p[0])+6}" y="${Y(p[1])-5}">${c.label}</text>`}});
  (s.pts||[]).forEach(p=>{
    if(!p.nodrop)o+=`<line class="drop" x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.y)}" y2="300"/><line class="drop" x1="50" x2="${X(p.x)}" y1="${Y(p.y)}" y2="${Y(p.y)}"/>`;
    if(p.xl)o+=`<text x="${X(p.x)}" y="318" text-anchor="middle">${p.xl}</text>`;
    if(p.yl)o+=`<text x="44" y="${Y(p.y)+4}" text-anchor="end">${p.yl}</text>`;
    o+=`<circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5"/>`;
    if(p.t)o+=`<text x="${X(p.x)+8}" y="${Y(p.y)-8}">${p.t}</text>`});
  (s.texts||[]).forEach(t=>o+=`<text class="${t.c||''}" x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.a||'start'}">${t.t}</text>`);
  {const ak=AKEY[uid];if(ak)(s.areas||[]).forEach(a=>{const k=ak[a.cls];if(!k||!k[0])return;const xs=a.pts.map(t=>X(t[0])),ys=a.pts.map(t=>Y(t[1]));const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);const cx=xs.reduce((m,v)=>m+v,0)/xs.length,cy=ys.reduce((m,v)=>m+v,0)/ys.length;if(w>=k[0].length*7+8&&h>=18)o+='<text class="alab" x="'+cx.toFixed(1)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="middle">'+k[0]+'</text>'})}
  o+=`<text class="lbl" x="${s.xt?s.xt[0]:445}" y="${s.xt?s.xt[1]:334}" text-anchor="end">${s.xlabel||'Quantity'}</text>`;
  o+=`<text class="lbl" x="56" y="14">${s.ylabel||'Price'}</text></svg>`;
  return o}

const AKEY={
 tr:{a1:['TR','Total revenue (price × quantity)']},
 revenue:{a1:['TR','Total revenue (price × quantity)']},
 surplus:{a2:['CS','Consumer surplus'],a1:['PS','Producer surplus']},
 pricemech:{c5:['','Surplus or shortage at this price']},
 ceiling:{dwl:['DWL','Deadweight loss'],c5:['','Shortage (quantity demanded − quantity supplied)']},
 floor:{dwl:['DWL','Deadweight loss'],c5:['','Surplus (quantity supplied − quantity demanded)']},
 tax:{a2:['Consumers','Burden on consumers'],a1:['Producers','Burden on producers'],dwl:['DWL','Deadweight loss']},
 advalorem:{a2:['Consumers','Burden on consumers'],a1:['Producers','Burden on producers'],dwl:['DWL','Deadweight loss']},
 subsidy:{a1:['Cost','Government spending on the subsidy'],dwl:['DWL','Deadweight loss']},
 negext:{dwl:['Welfare loss','Welfare loss']},
 posext:{dwl:['Welfare loss','Welfare loss']},
 perfcomp:{a1:['Profit','Supernormal profit'],a2:['Loss','Loss']},
 moncomp:{a1:['Profit','Abnormal profit'],a2:['Loss','Loss']},
 monopoly:{a1:['Profit','Supernormal profit'],dwl:['DWL','Deadweight loss']},
 lorenz:{a1:['A','Area A: gap between equality and the Lorenz curve']},
 tariff:{a1:['Revenue','Tariff revenue'],dwl:['DWL','Deadweight loss']},
 quota:{a1:['Rent','Quota rent'],dwl:['DWL','Deadweight loss']}};
const LBL={'D':'Demand','S':'Supply','D₁':'New demand','S₁':'New supply','S + tax':'Supply after the tax','S+tax':'Supply after the tax','S+sub':'Supply after the subsidy','S + quota':'Supply plus the quota','Pw':'World price','Pw + t':'World price plus the tariff','Pmax':'Maximum price','Pmin':'Minimum price','P':'Market price',
'MPB':'Marginal private benefit','MSB':'Marginal social benefit','MPB = MSB':'Marginal private and social benefit','MPC':'Marginal private cost','MSC':'Marginal social cost','MSC = MPC':'Marginal social cost = marginal private cost',
'MC':'Marginal cost','ATC':'Average total cost','AVC':'Average variable cost','AR = D':'Average revenue = demand','D = AR':'Demand = average revenue','MR':'Marginal revenue','P = MR = AR':'Price = marginal revenue = average revenue','MC = ATC':'Marginal cost = average total cost',
'AD':'Aggregate demand','AD₀':'Original aggregate demand','AD₁':'New aggregate demand','AS':'Aggregate supply','SRAS':'Short-run aggregate supply','SRAS₁':'New short-run aggregate supply','LRAS':'Long-run aggregate supply',
'SRPC':'Short-run Phillips curve','SRPC₀':'Original short-run Phillips curve','SRPC₁':'New short-run Phillips curve','LRPC':'Long-run Phillips curve',
'Real GDP':'Real GDP over time','Trend':'Long-run trend','Equality':'Line of equality','AE':'Aggregate expenditure','AE₀':'Original aggregate expenditure','AE₁':'New aggregate expenditure','AE = Y':'45° line (expenditure = income)',
'LRAC':'Long-run average cost','SRAC₁':'Short-run average cost (small plant)','SRAC₂':'Short-run average cost (medium plant)','SRAC₃':'Short-run average cost (large plant)','MP':'Marginal product','AP':'Average product','Demand':'Demand','Qd':'Quantity demanded','Current account':'Current account balance','Balance = 0':'Current account balance of zero','PPC':'Production possibility curve','PPC₀':'Original production possibility curve','PPC₁':'New production possibility curve'};
function keyHTML(s,uid){
 const ak=AKEY[uid]||{};const seen={};let h='';
 (s.curves||[]).forEach(c=>{if(c.pts.length<2)return;const name=c.label?(LBL[c.label]||c.label):(ak[c.cls]?ak[c.cls][1]:null);if(!name)return;const k=c.cls+'|'+name;if(seen[k])return;seen[k]=1;
  h+='<li><svg class="sw" viewBox="0 0 34 10" aria-hidden="true"><line x1="1" x2="33" y1="5" y2="5" class="'+c.cls+'"/></svg><span>'+(c.label&&name!==c.label?'<b>'+c.label+'</b> ':'')+name+'</span></li>'});
 (s.areas||[]).forEach((a,i)=>{const k=ak[a.cls];if(!k)return;const kk='a|'+a.cls;if(seen[kk])return;seen[kk]=1;const pid='kp'+i+String(uid).replace(/\W/g,'');
  h+='<li><svg class="sw" viewBox="0 0 34 14" aria-hidden="true"><defs><pattern id="'+pid+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0a3324" stroke-width="2"/></pattern></defs><rect width="34" height="14" '+(a.cls==='dwl'?'fill="url(#'+pid+')" stroke="#0a3324"':'class="'+a.cls+'"')+'/></svg><span>'+k[1]+'</span></li>'});
 if((s.pts||[]).length)h+='<li><svg class="sw" viewBox="0 0 34 14" aria-hidden="true"><circle cx="17" cy="7" r="4.5" class="dot"/></svg><span>'+((s.pts||[]).some(p=>!p.nodrop)?'Point on the graph. Dotted lines show its price and quantity on the axes':'Marked point')+'</span></li>';
 return h?'<b class="kh">Key</b><ul>'+h+'</ul>':''}
const T=[];
const add=o=>T.push(o);
const sl=(id,label,min,max,val,step=1)=>({id,label,min,max,val,step});

/* ---------- UNIT 2: MICROECONOMICS ---------- */
add({id:'demand',unit:'Unit 2 · Microeconomics',title:'Demand curve',
what:'A demand curve shows the quantity of a good consumers are willing and able to buy at each price, ceteris paribus (all else equal).',
meaning:'The curve slopes downward: this is the law of demand. A price change causes a movement along the curve (a change in quantity demanded). A change in anything else shifts the whole curve (a change in demand).',
draw:['Draw axes: price (P) up, quantity (Q) along.','Draw a downward-sloping line and label it D.','To show a shift, draw a second parallel curve D₁ and add an arrow.'],
tips:['Shifters to memorise: income, tastes, price of substitutes and complements, population, expectations (YED and XED explain the direction).','Never say a price change "shifts" demand. It moves you along the curve.'],
q:'Explain why a fall in the price of coffee shifts the demand curve for tea.',a:'Coffee and tea are substitutes (positive XED). A lower coffee price makes consumers switch away from tea, so demand for tea falls at every price and D shifts left.',
ctrl:[sl('sh','Shift in demand (right = increase)',-25,25,0),sl('p','Price',10,85,50)],
f(p){const a=90+p.sh;const c=[];if(p.sh)c.push(fc(D(90,.8),'c3','D',80));c.push(fc(D(a,.8),'c1',p.sh?'D₁':'D',80));
 const q=Math.max(0,(a-p.p)/.8);return{curves:c,pts:[dot(q,p.p,'Q','P')],
 read:`At a price of <b>${p.p}</b>, consumers want <b>${f1(q)}</b> units. ${p.sh>0?'Demand has <b>increased</b>: more is demanded at every price.':p.sh<0?'Demand has <b>decreased</b>: less is demanded at every price.':'Move the price slider to slide along the curve, or shift the curve.'}`}}});

add({id:'supply',unit:'Unit 2 · Microeconomics',title:'Supply curve',
what:'A supply curve shows the quantity producers are willing and able to sell at each price, ceteris paribus.',
meaning:'It slopes upward because higher prices cover higher marginal costs and make production more profitable. A change in price moves along the curve. A change in costs, technology, taxes, subsidies or number of firms shifts it.',
draw:['Draw an upward-sloping line labelled S.','An increase in supply shifts it right (down). A decrease shifts it left (up).'],
tips:['Think "right = increase in supply", never "up" or "down".','Lower costs of production shift S right. An indirect tax shifts S up by the amount of the tax.'],
q:'Distinguish between a change in supply and a change in quantity supplied.',a:'A change in quantity supplied is a movement along S caused only by a change in the good\'s own price. A change in supply is a shift of S caused by non-price factors such as costs, technology, taxes or subsidies.',
ctrl:[sl('sh','Shift in supply (right = increase)',-25,25,0),sl('p','Price',15,90,50)],
f(p){const c0=10-p.sh;const c=[];if(p.sh)c.push(fc(S(10,.8),'c3','S',80));c.push(fc(S(c0,.8),'c1',p.sh?'S₁':'S',80));
 const q=Math.max(0,(p.p-c0)/.8);return{curves:c,pts:[dot(q,p.p,'Q','P')],
 read:`At a price of <b>${p.p}</b>, firms supply <b>${f1(q)}</b> units. ${p.sh>0?'Supply has <b>increased</b>.':p.sh<0?'Supply has <b>decreased</b>.':'Shift the curve to see the effect on quantity.'}`}}});

add({id:'equilibrium',unit:'Unit 2 · Microeconomics',title:'Market equilibrium',
what:'Equilibrium is the price and quantity where quantity demanded equals quantity supplied. The market clears with no shortage or surplus.',
meaning:'Above equilibrium there is a surplus, which pushes the price down. Below it there is a shortage, which pushes the price up. The price mechanism signals and rations scarce resources.',
draw:['Draw D and S crossing. Mark the intersection E.','Drop dotted lines to the axes and label Pe and Qe.','For a shift, draw the new curve, mark E₁, and label P₁ and Q₁.'],
tips:['Always name the shift first, then the new equilibrium: "D shifts right, causing a shortage at P₀, so price rises to P₁".','Evaluate: how elastic are D and S? That decides whether price or quantity moves more.'],
q:'Using a diagram, explain the effect of a rise in incomes on the market for a normal good.',a:'Income rises, so demand for a normal good increases (YED positive). D shifts right. At the old price there is a shortage, so price rises to a new equilibrium with a higher price and a higher quantity.',
ctrl:[sl('d','Demand shift (right = increase)',-25,25,15),sl('s','Supply shift (right = increase)',-25,25,0)],
f(p){const a=90+p.d,c0=10-p.s;const q0=50,p0=50,q1=(a-c0)/1.6,p1=a-.8*q1;const cv=[fc(D(90,.8),p.d?'c3':'c1','D',84),fc(S(10,.8),p.s?'c4':'c2','S',84)];
 if(p.d)cv.push(fc(D(a,.8),'c1','D₁',84));if(p.s)cv.push(fc(S(c0,.8),'c2','S₁',84));
 const pts=[dot(q0,p0,'Q₀','P₀')];if(p.d||p.s)pts.push(dot(q1,p1,'Q₁','P₁'));
 const pr=p1-p0,qr=q1-q0;return{curves:cv,pts,read:`Equilibrium price <b>${f1(p0)} → ${f1(p1)}</b> (${Math.abs(pr)<.05?'no change':pr>0?'rises':'falls'}), quantity <b>${f1(q0)} → ${f1(q1)}</b> (${Math.abs(qr)<.05?'no change':qr>0?'rises':'falls'}).`}}});

add({id:'ped',unit:'Unit 2 · Microeconomics',title:'Price elasticity of demand',
what:'PED measures how responsive quantity demanded is to a change in price: %ΔQd ÷ %ΔP. It is always negative, but we use the absolute value.',
meaning:'If |PED| > 1, demand is elastic: quantity falls by a bigger percentage than price rises. If |PED| < 1 it is inelastic. Determinants: availability of substitutes, necessity, share of income, time, how broadly the market is defined.',
draw:['Elastic demand: a relatively flat curve.','Inelastic demand: a steep curve.','Perfectly inelastic = vertical. Perfectly elastic = horizontal.'],
tips:['Slope is not elasticity. On a straight line PED changes at every point, and real demand curves are not straight: PED is higher at higher prices.','Do not write that elastic goods change when price changes and inelastic goods do not. Both change; it is a question of degree.','Link to revenue: raise price when inelastic, cut price when elastic.'],
q:'Explain why firms selling petrol can raise prices without losing much revenue.',a:'Petrol has few substitutes and is a necessity, so demand is price inelastic (|PED| < 1). A price rise causes a proportionally smaller fall in quantity, so total revenue rises.',
ctrl:[sl('b','Steepness of the curve',.25,3,1,.05),sl('x','Price change from $50 (%)',-30,30,10)],
f(p){const a=50+p.b*50,fn=D(a,p.b);const P2=50*(1+p.x/100),Q2=Math.max(0,(a-P2)/p.b);const ped=1/p.b;const cls=ped>1.02?'elastic':ped<.98?'inelastic':'unit elastic';
 const pc=(Q2-50)/50*100;const tr0=2500,tr1=P2*Q2;
 return{curves:[fc(fn,'c1','D',Math.min(95,(a-10)/p.b))],pts:[dot(50,50,'50','$50'),...(p.x?[dot(Q2,P2,f1(Q2),'$'+f1(P2))]:[])],
 read:`At ($50, 50) PED = <b>${f1(ped)}</b> (${cls}). Price changes ${p.x}%, quantity changes <b>${f1(pc)}%</b>. Total revenue <b>2500 → ${f1(tr1)}</b>.`}}});

add({id:'tr',unit:'Unit 2 · Microeconomics',title:'Elasticity and total revenue',
what:'Total revenue (TR) = price × quantity. On a straight-line demand curve, TR is greatest where PED = 1 (unit elastic), at the midpoint.',
meaning:'Top half of the curve: elastic, so lowering price raises TR. Bottom half: inelastic, so raising price raises TR. The shaded rectangle below is TR at the chosen price.',
draw:['Draw a straight demand line.','Mark the midpoint as unit elastic.','Shade the rectangle P × Q to show TR.'],
tips:['Quote the rule: elastic, price and TR move in opposite directions. Inelastic, they move together.','This is the standard justification for price discrimination and sales promotions.'],
q:'A firm cuts its price by 10% and sales rise by 5%. What happens to revenue?',a:'PED = 5 ÷ 10 = 0.5, so demand is inelastic. Quantity rises by a smaller percentage than price falls, so total revenue falls.',
ctrl:[sl('p','Price',5,95,70)],
f(p){const q=100-p.p;const ped=p.p/q;const cls=ped>1.02?'elastic':ped<.98?'inelastic':'unit elastic';
 return{curves:[fc(D(100,1),'c1','D',92),sg([0,50],[50,50],'c4'),sg([50,0],[50,50],'c4')].slice(0,1),areas:[poly([[0,0],[q,0],[q,p.p],[0,p.p]],'a1')],pts:[dot(q,p.p,'Q','P')],
 texts:[{x:6,y:92,t:'Elastic',c:'lbl'},{x:70,y:12,t:'Inelastic',c:'lbl'}],
 read:`Price <b>${p.p}</b>, quantity <b>${q}</b>, TR = <b>${p.p*q}</b>. |PED| here is <b>${f1(ped)}</b> (${cls}). Maximum TR is 2500 at price 50.`}}});

add({id:'surplus',unit:'Unit 2 · Microeconomics',title:'Consumer and producer surplus',
what:'Consumer surplus is the gap between what consumers are willing to pay and what they actually pay. Producer surplus is the gap between the price firms receive and the least they would accept.',
meaning:'Together they measure the welfare of a market. At the competitive equilibrium total surplus is maximised: allocative efficiency (MB = MC).',
draw:['CS: triangle between D and the price line, up to the Q axis.','PS: triangle between the price line and S.','Label both and shade them differently.'],
tips:['Any intervention that moves output away from Qe loses surplus: that loss is the deadweight loss.','Efficiency language: "at Qe, marginal benefit equals marginal cost".'],
q:'Explain what happens to consumer surplus when demand increases.',a:'D shifts right, the equilibrium price rises and quantity rises. Consumers are willing to pay more, so the area between the new D and the price grows. Consumer surplus increases.',
ctrl:[sl('d','Demand shift (right = increase)',-20,25,0),sl('s','Supply shift (right = increase)',-20,25,0)],
f(p){const a=90+p.d,c0=10-p.s;const q=(a-c0)/1.6,pe=a-.8*q;
 return{curves:[fc(D(a,.8),'c1','D',86),fc(S(c0,.8),'c2','S',86)],areas:[poly([[0,pe],[q,pe],[0,a]],'a2'),poly([[0,pe],[q,pe],[0,c0]],'a1')],pts:[dot(q,pe,'Qe','Pe')],
 texts:[{x:6,y:(a+pe)/2+3,t:'CS',c:''},{x:6,y:(pe+c0)/2-3,t:'PS',c:''}],
 read:`Pe = <b>${f1(pe)}</b>, Qe = <b>${f1(q)}</b>. Consumer surplus = <b>${f1(.5*q*(a-pe))}</b>, producer surplus = <b>${f1(.5*q*(pe-c0))}</b>.`}}});

add({id:'ceiling',unit:'Unit 2 · Microeconomics',title:'Price ceiling (maximum price)',
what:'A legal maximum price set below the equilibrium price, for example rent control, to keep a good affordable.',
meaning:'At the ceiling, quantity demanded exceeds quantity supplied, so there is a shortage. Rationing, queues and black markets appear. Allocative efficiency is lost (deadweight loss).',
draw:['Draw D and S with equilibrium E.','Draw a horizontal line Pmax below Pe.','Mark Qs and Qd on that line; the gap between is the shortage.'],
tips:['A ceiling set above Pe is non-binding and has no effect.','Evaluate: winners (those who get the good), losers (those who cannot), and long-run supply effects such as falling housing quality.','Real example: price controls in Venezuela caused shortages and pushed people to the black market.'],
q:'Explain two consequences of rent controls.',a:'1) Shortage: the capped rent is below equilibrium, so more people want rentals than landlords supply. 2) Black market and reduced quality, as landlords cut maintenance or charge hidden fees when they can fill units anyway.',
ctrl:[sl('pc','Maximum price',10,80,35)],
f(p){const P=p.pc;const qd=(90-P)/.8,qs=(P-10)/.8;const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),'c2','S',86),sg([0,P],[100,P],'c3','Pmax',[88,P])];
 if(P>=50)return{curves:cv,pts:[dot(50,50,'Qe','Pe')],read:'The ceiling is at or above equilibrium, so it is <b>non-binding</b>. Move it below 50.'};
 const pd=90-.8*qs;return{curves:[...cv,sg([qs,P],[qd,P],'c5')],areas:[poly([[qs,P],[qs,pd],[50,50]],'dwl')],pts:[dot(qs,P,'Qs','Pmax'),dot(qd,P,'Qd')],
 read:`Qd = <b>${f1(qd)}</b>, Qs = <b>${f1(qs)}</b>: shortage of <b>${f1(qd-qs)}</b>. Hatched area = deadweight loss.`}}});

add({id:'floor',unit:'Unit 2 · Microeconomics',title:'Price floor (minimum price)',
what:'A legal minimum price set above the equilibrium price, for example a minimum wage or agricultural support price.',
meaning:'At the floor, quantity supplied exceeds quantity demanded, so there is a surplus. The government may buy the surplus, creating a cost. Resources are over-allocated to the good.',
draw:['Draw D and S with E.','Draw a horizontal line Pmin above Pe.','Mark Qd and Qs: the gap is the surplus.'],
tips:['For a minimum wage, labour is the good: surplus = unemployment.','Evaluate using elasticity: if labour demand is inelastic, few jobs are lost.','Worked example (corn): equilibrium $12 and 5m bushels; minimum price $16 gives Qd = 3.5m, Qs = 8.0m, surplus 4.5m. Government buying it costs 4.5m × $16 = $72m, plus storage.'],
q:'Explain why a minimum price on wheat causes a surplus.',a:'The price is held above equilibrium. At that price farmers supply more than buyers demand, so quantity supplied exceeds quantity demanded and the surplus cannot clear through falling prices.',
ctrl:[sl('pf','Minimum price',30,90,68)],
f(p){const P=p.pf;const qd=(90-P)/.8,qs=(P-10)/.8;const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),'c2','S',86),sg([0,P],[100,P],'c3','Pmin',[88,P])];
 if(P<=50)return{curves:cv,pts:[dot(50,50,'Qe','Pe')],read:'The floor is at or below equilibrium, so it is <b>non-binding</b>. Move it above 50.'};
 const ps=10+.8*qd;return{curves:[...cv,sg([qd,P],[qs,P],'c5')],areas:[poly([[qd,P],[qd,ps],[50,50]],'dwl')],pts:[dot(qd,P,'Qd','Pmin'),dot(qs,P,'Qs')],
 read:`Qd = <b>${f1(qd)}</b>, Qs = <b>${f1(qs)}</b>: surplus of <b>${f1(qs-qd)}</b>. Hatched area = deadweight loss.`}}});

add({id:'tax',unit:'Unit 2 · Microeconomics',title:'Indirect tax',
what:'A tax on spending on a good (VAT, excise duty). It is a per-unit cost to the seller, so supply shifts up (left) by the amount of the tax.',
meaning:'The tax is shared between consumers and producers. The more inelastic the demand, the more the consumer pays. Revenue goes to the government, and there is a deadweight loss because output falls below the efficient level.',
draw:['Draw S and S + tax, a parallel vertical shift up by the tax.','Mark the new price paid by consumers (Pc) and received by producers (Pp).','Shade: consumer burden, producer burden, and the DWL triangle.'],
tips:['The vertical gap between S and S+tax equals the tax. Pc − Pp = tax.','Use the demerit goods argument: a tax can correct negative externalities (cigarettes), which makes the DWL a gain in welfare.'],
q:'Why is the burden of a tax on cigarettes mostly borne by consumers?',a:'Cigarettes are addictive with few substitutes, so demand is price inelastic. Quantity falls little, producers can pass most of the tax on in a higher price, and consumers pay most of it.',
ctrl:[sl('t','Tax per unit',0,40,20)],
f(p){const t=p.t,q=(80-t)/1.6,pc=90-.8*q,pp=pc-t;const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),t?'c4':'c2','S',86)];if(t)cv.push(fc(S(10+t,.8),'c2','S+tax',80));
 const ar=t?[poly([[0,50],[q,50],[q,pc],[0,pc]],'a2'),poly([[0,pp],[q,pp],[q,50],[0,50]],'a1'),poly([[q,pc],[50,50],[q,pp]],'dwl')]:[];
 return{curves:cv,areas:ar,pts:t?[dot(q,pc,'Q₁','Pc'),dot(50,50,'Q₀','P₀')]:[dot(50,50,'Q₀','P₀')],
 read:t?`Consumers pay <b>${f1(pc)}</b>, producers keep <b>${f1(pp)}</b>. Consumer burden <b>${f1((pc-50)*q)}</b>, producer burden <b>${f1((50-pp)*q)}</b>, tax revenue <b>${f1(t*q)}</b>. Quantity falls to <b>${f1(q)}</b>.`:'Increase the tax to see the burden split.'}}});

add({id:'subsidy',unit:'Unit 2 · Microeconomics',title:'Subsidy',
what:'A payment from the government to producers per unit of output. It lowers costs, so supply shifts down (right) by the amount of the subsidy.',
meaning:'Price to consumers falls and quantity rises. The cost to the government is the subsidy × quantity. If the good has no positive externality, the subsidy over-allocates resources and creates a deadweight loss.',
draw:['Draw S and S + subsidy, a parallel shift down.','Mark the new consumer price and the price producers receive (higher).','Shade the government cost rectangle.'],
tips:['Producer receives Pc + subsidy.','Justifications: merit goods, infant industries, food security. Drawbacks: opportunity cost, dependence, distortion.'],
q:'Explain how a subsidy on solar panels affects the market.',a:'The subsidy lowers production costs, so supply shifts right. Price falls, quantity rises. Consumption of a good with positive externalities moves closer to the socially optimal level, at a cost to government.',
ctrl:[sl('s','Subsidy per unit',0,35,15)],
f(p){const s=p.s,q=(80+s)/1.6,pc=90-.8*q,pr=pc+s;const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),s?'c4':'c2','S',86)];if(s)cv.push(fc(S(10-s,.8),'c2','S+sub',80));
 const ar=s?[poly([[0,pc],[q,pc],[q,pr],[0,pr]],'a1'),poly([[50,50],[q,pc],[q,pr]],'dwl')]:[];
 return{curves:cv,areas:ar,pts:[dot(50,50,'Q₀','P₀'),...(s?[dot(q,pc,'Q₁','Pc')]:[])],
 read:s?`Consumers pay <b>${f1(pc)}</b>, producers receive <b>${f1(pr)}</b>. Quantity <b>50 → ${f1(q)}</b>. Government cost = <b>${f1(s*q)}</b>.`:'Increase the subsidy to see the effect.'}}});

add({id:'negext',unit:'Unit 2 · Microeconomics',title:'Negative externality of production',
what:'A cost imposed on a third party that is not reflected in the market price, such as pollution from a factory.',
meaning:'The market produces where MPB = MPC (Qm), but society wants MSB = MSC (Qs). The market overproduces, creating a welfare loss. The external cost is the gap between MSC and MPC.',
draw:['Draw MPC (= S) and MSB = MPB (= D).','Draw MSC above MPC. The vertical gap is the external cost.','Mark Qm and Qopt; shade the welfare-loss triangle.'],
tips:['Fixes: indirect tax equal to the external cost, regulation, tradable permits, education.','Label correctly: private costs are MPC, social costs MSC = MPC + MEC.'],
q:'Explain how a carbon tax can correct a negative externality.',a:'The tax raises private costs by the value of the external cost, so MPC shifts up to MSC. The firm now internalises the externality, output falls to the socially optimal level where MSB = MSC and the welfare loss is eliminated.',
ctrl:[sl('e','External cost per unit',0,40,20)],
f(p){const e=p.e,qs=(80-e)/1.6,ps=90-.8*qs;const cv=[fc(D(90,.8),'c1','MPB = MSB',74),fc(S(10,.8),'c2','MPC',80)];if(e)cv.push(fc(S(10+e,.8),'c4','MSC',74));
 return{curves:cv,areas:e?[poly([[qs,ps],[50,50],[50,50+e]],'dwl')]:[],pts:[dot(50,50,'Qm','Pm'),...(e?[dot(qs,ps,'Qopt','Popt')]:[])],
 read:e?`Market output <b>50</b> versus socially optimal <b>${f1(qs)}</b>: overproduction of <b>${f1(50-qs)}</b>. Welfare loss (hatched) = <b>${f1(.5*e*(50-qs))}</b>.`:'Raise the external cost to open a gap between MPC and MSC.'}}});

add({id:'posext',unit:'Unit 2 · Microeconomics',title:'Positive externality of consumption',
what:'A benefit to a third party that is not reflected in the market price, such as vaccination or education.',
meaning:'The market produces at MPB = MPC (Qm), but society wants MSB = MSC (Qopt). The good is underconsumed, creating a welfare loss. These are merit goods.',
draw:['Draw MPB (= D) and MSC = MPC (= S).','Draw MSB above MPB. The gap is the external benefit.','Mark Qm and Qopt; shade the welfare-loss triangle.'],
tips:['Fixes: subsidy equal to the external benefit, direct provision, information campaigns.','Define it precisely: "benefit to third parties not reflected in price".'],
q:'Explain why education is underprovided by the free market.',a:'Education creates external benefits such as a more productive society. Individuals consider only their private benefit (MPB), so the market quantity is below the social optimum where MSB = MSC, causing a welfare loss.',
ctrl:[sl('e','External benefit per unit',0,40,20)],
f(p){const e=p.e,qs=(80+e)/1.6,ps=10+.8*qs;const cv=[fc(D(90,.8),'c1','MPB',84),fc(S(10,.8),'c2','MSC = MPC',72)];if(e)cv.push(fc(D(90+e,.8),'c4','MSB',84));
 return{curves:cv,areas:e?[poly([[50,50],[50,50+e],[qs,ps]],'dwl')]:[],pts:[dot(50,50,'Qm','Pm'),...(e?[dot(qs,ps,'Qopt','Popt')]:[])],
 read:e?`Market output <b>50</b> versus socially optimal <b>${f1(qs)}</b>: underconsumption of <b>${f1(qs-50)}</b>. Welfare loss (hatched) = <b>${f1(.5*e*(qs-50))}</b>.`:'Raise the external benefit to open a gap between MPB and MSB.'}}});

add({id:'ppc',unit:'Unit 2 · Microeconomics',title:'Production possibility curve',hl:false,
what:'The PPC shows the maximum combinations of two goods an economy can produce with all resources fully and efficiently employed.',
meaning:'Points on the curve are efficient. Inside is unemployment or inefficiency. Outside is unattainable. Bowed-out shape = increasing opportunity cost. Shifting out is economic growth (more or better resources).',
draw:['Draw a curve bowed out from the origin.','Label points: A inside (inefficient), B on (efficient), C outside (unattainable).','Growth: draw a new curve outside the old one.'],
tips:['Straight-line PPC = constant opportunity cost.','A shift may be a parallel or biased shift. Biased growth increases capacity for only one good.'],
q:'Distinguish between a movement along a PPC and a shift of the PPC.',a:'A movement along shows reallocating resources, giving up one good for another (opportunity cost). A shift outward shows increased productive capacity, for example from new technology or more capital.',
ctrl:[sl('g','Economic growth (% more resources)',0,40,0)],
f(p){const R=70*(1+p.g/100);const ppc=(R,cls,label)=>{const pts=[];for(let t=0;t<=90;t+=3){const r=t*Math.PI/180;pts.push([R*Math.sin(r),R*Math.cos(r)])}return{pts,cls,label,at:null,lbl:[R*Math.sin(.7)-30,R*Math.cos(.7)+12]}};
 const cv=[ppc(70,p.g?'c3':'c1',p.g?'PPC₀':'PPC')];if(p.g)cv.push(ppc(R,'c2','PPC₁'));
 const C=[63,63];const rc=Math.hypot(C[0],C[1]);const ok=rc<=R;
 return{curves:cv,xlabel:'Capital goods',ylabel:'Consumer goods',pts:[{x:28,y:34,t:'A',nodrop:true},{x:70*Math.sin(.7),y:70*Math.cos(.7),t:'B',nodrop:true},{x:C[0],y:C[1],t:'C',nodrop:true}],areas:[],
 read:`Point C lies <b>${ok?'inside':'outside'}</b> the PPC. ${ok?'Growth has made it <b>attainable</b>.':'It is <b>unattainable</b> with current resources.'} A lies inside the curve (unemployed or inefficiently used resources), B lies on it (efficient) and C lies outside it.`}}});

/* ---------- THEORY OF THE FIRM ---------- */
const TC=(FC)=>q=>FC+20*q-.2*q*q+.004*q*q*q;
const costCurves=(FC)=>{const atc=q=>q>0?TC(FC)(q)/q:999,avc=q=>q>0?(TC(0)(q))/q:999,mc=q=>20-.4*q+.012*q*q;return{atc,avc,mc}};
add({id:'costs',unit:'Unit 2 · Microeconomics',title:'Cost curves (short run)',hl:true,
what:'Average total cost (ATC), average variable cost (AVC) and marginal cost (MC) describe how a firm\'s unit costs change as output rises.',
meaning:'MC falls then rises because of the law of diminishing marginal returns. MC cuts ATC and AVC at their minimum points. The gap between ATC and AVC is average fixed cost, which shrinks as output rises.',
draw:['Draw a U-shaped ATC and a lower U-shaped AVC.','Draw MC through the minimum of both.','Mark the minimum of ATC: productive efficiency.'],
tips:['Rule: when MC < average, the average falls. When MC > average, the average rises.','Short run: at least one fixed factor. Long run: all factors variable, giving economies and diseconomies of scale.'],
q:'Explain why the MC curve cuts the ATC curve at its lowest point.',a:'While MC is below ATC, producing one more unit pulls the average down. Once MC rises above ATC, each extra unit pulls the average up. So ATC stops falling and starts rising exactly where MC = ATC.',
ctrl:[sl('fc','Fixed costs',100,600,300,25)],
f(p){const c=costCurves(p.fc);let mn=[0,999];for(let q=1;q<=100;q++){const v=c.atc(q);if(v<mn[1])mn=[q,v]}
 return{curves:[fc(c.mc,'c1','MC',92,0,100),fc(c.atc,'c2','ATC',72,1,100),fc(c.avc,'c4','AVC',97,1,100)],pts:[dot(mn[0],mn[1],'Q*',f1(mn[1]))],xlabel:'Output',ylabel:'Costs ($)',
 read:`Minimum ATC is <b>${f1(mn[1])}</b> at output <b>${mn[0]}</b>, where MC cuts ATC. More fixed costs push ATC up and move its minimum to the right.`}}});

add({id:'perfcomp',unit:'Unit 2 · Microeconomics',title:'Perfect competition',hl:true,
what:'Many small firms sell an identical product, with free entry and exit and perfect information. Each firm is a price taker, so P = AR = MR.',
meaning:'A firm maximises profit where MC = MR. If P > ATC it earns supernormal profit, which attracts entry until price falls to min ATC (normal profit, long-run equilibrium). If P < AVC the firm shuts down.',
draw:['Draw the firm: MC, ATC (and AVC) with a horizontal P = MR = AR.','Find MC = MR to read Q*.','Profit rectangle: from Q* up to P and down to ATC.'],
tips:['Long-run equilibrium: P = MC = min ATC, so allocatively and productively efficient.','Shut-down rule: short run P < AVC; long run P < ATC.'],
q:'Illustrate with a diagram why a perfectly competitive firm can still make a loss in the short run while producing at its profit-maximising output. [10]',a:'Draw MC, ATC, AVC and a horizontal P = MR = AR below ATC but above AVC. The firm produces where MC = MR, which minimises the loss. P covers AVC (so it keeps producing short run) but not ATC, so TR < TC and the loss is the rectangle (ATC − P) × Q*. In the long run firms with losses leave, supply falls and price rises to min ATC. Also explain why P = MR = AR for a price taker.',
ctrl:[sl('p','Market price',10,60,40)],
f(p){const c=costCurves(300);let q=17;while(q<100&&c.mc(q)<p.p)q+=.5;const P=p.p,atc=c.atc(q);const profit=(P-atc)*q;
 const cv=[fc(c.mc,'c1','MC',92),fc(c.atc,'c2','ATC',72,1),fc(c.avc,'c4','AVC',97,1),sg([0,P],[100,P],'c3','P = MR = AR',[72,P])];
 let minAvc=999;for(let k=1;k<=100;k++)minAvc=Math.min(minAvc,c.avc(k));const shut=P<minAvc-.01;let st=profit>0.5?`Supernormal profit <b>${f1(profit)}</b>. New firms enter.`:profit<-0.5?(P<minAvc?`P is below AVC: the firm <b>shuts down</b>.`:`Loss of <b>${f1(-profit)}</b>, but P covers AVC so it keeps producing short run.`):'Normal profit (P ≈ ATC): long-run equilibrium.';
 const lo=Math.min(P,atc),hi=Math.max(P,atc);
 return{curves:cv,areas:shut?[]:[poly([[0,lo],[q,lo],[q,hi],[0,hi]],profit>=0?'a1':'a2')],pts:shut?[]:[dot(q,P,'Q*','P')],xlabel:'Output',ylabel:'Costs / revenue ($)',read:shut?`The price (${P}) is below the lowest AVC (${f1(minAvc)}): the firm <b>shuts down</b> in the short run and loses its fixed costs (300).`:`Q* = <b>${f1(q)}</b> where MC = MR. ATC = <b>${f1(atc)}</b>. ${st}`}}});

add({id:'monopoly',unit:'Unit 2 · Microeconomics',title:'Monopoly',hl:true,
what:'A single seller faces the whole market demand curve and is protected by barriers to entry. It is a price maker, so AR = D and MR lies below it.',
meaning:'The monopolist produces where MC = MR, then charges the price on the demand curve at that quantity. Compared with perfect competition, output is lower and price higher, giving supernormal profit and a deadweight loss.',
draw:['Draw D (= AR) and MR with twice the slope.','Draw MC (and ATC) and mark MR = MC to find Qm.','Go up to D for Pm. Shade profit and the DWL triangle.'],
tips:['Not allocatively efficient (P > MC). Possibly not productively efficient either.','Evaluate: economies of scale, dynamic efficiency, natural monopoly, and regulation such as price caps.'],
q:'Explain why a monopolist\'s MR curve lies below its demand curve.',a:'To sell an extra unit the monopolist must lower the price on all units, not just the last. So the extra revenue (MR) is less than the price of the last unit, and the MR curve lies below D.',
ctrl:[sl('mc','Marginal cost',10,60,25)],
f(p){const mc=p.mc;const qm=(90-mc)/1.8,pm=90-.9*qm,qc=(90-mc)/.9;
 return{curves:[fc(D(90,.9),'c1','D = AR',70),fc(D(90,1.8),'c3','MR',48),sg([0,mc],[100,mc],'c2','MC = ATC',[84,mc])],areas:[poly([[0,mc],[qm,mc],[qm,pm],[0,pm]],'a1'),poly([[qm,pm],[qm,mc],[qc,mc]],'dwl')],pts:[dot(qm,pm,'Qm','Pm'),dot(qc,mc,'Qc')],ylabel:'Price / costs',
 read:`Qm = <b>${f1(qm)}</b>, Pm = <b>${f1(pm)}</b>. Supernormal profit <b>${f1((pm-mc)*qm)}</b> (green). Competitive output would be <b>${f1(qc)}</b>. Hatched = deadweight loss.`}}});

/* ---------- UNIT 3: MACROECONOMICS ---------- */
add({id:'adas-k',unit:'Unit 3 · Macroeconomics',title:'AD–AS (Keynesian)',
what:'Aggregate demand (AD) is total planned spending in the economy. Keynesian aggregate supply (AS) is flat when there is spare capacity and becomes vertical at full employment.',
meaning:'In the flat range, an increase in AD raises real GDP with almost no inflation. Near full employment the AS curve slopes up. At full capacity (Yf) extra AD only causes inflation. Unemployment can persist in a recession.',
draw:['Draw an L-shaped (or reverse-L) AS with a flat, an intermediate and a vertical range.','Draw downward-sloping AD.','Shift AD right and compare real output and price level.'],
tips:['Explain the AD shift: C, I, G, X−M. Use the multiplier.','Evaluate: Keynesians favour fiscal policy to close a deflationary gap.'],
q:'Using a Keynesian AD–AS diagram, explain how government spending can reduce unemployment.',a:'Higher G shifts AD right. With spare capacity on the flat/intermediate AS, real GDP rises, and firms hire more workers, so unemployment falls with little inflation. The multiplier amplifies the effect.',
ctrl:[sl('d','AD shift (right = increase)',-30,40,0)],
f(p){const as=q=>q<=35?20:q<=75?20+80*Math.pow((q-35)/40,2):999;const asPts=[];for(let q=0;q<=75;q+=1)asPts.push([q,as(q)]);asPts.push([75,100]);
 const a=110+p.d;const ad=D(a,.8);let qe=75,pe=ad(75);for(let q=0;q<=75;q+=.25){if(ad(q)<=as(q)){qe=q;pe=as(q);break}}
 const base=(()=>{for(let q=0;q<=75;q+=.25){if(D(110,.8)(q)<=as(q))return[q,as(q)]}return[75,50]})();
 const cv=[{pts:asPts,cls:'c2',label:'AS',lbl:[40,24]}];if(p.d)cv.push(fc(D(110,.8),'c3','AD₀',60));cv.push(fc(ad,'c1',p.d?'AD₁':'AD',Math.min(90,(a-10)/.8)));
 return{curves:cv,pts:[dot(qe,pe,'Y','PL')],xlabel:'Real GDP',ylabel:'Price level',texts:[{x:60,y:96,t:'Yf',c:'lbl'}],
 read:qe>=74.5?`Real GDP is at <b>full employment</b>. Further AD only raises the price level: <b>${f1(pe)}</b> (demand-pull inflation).`:`Real GDP = <b>${f1(qe)}</b> (full employment at 75), price level <b>${f1(pe)}</b>. ${base[0]>qe+.1?'Output fell: recession risk.':'There is spare capacity, so a deflationary gap of <b>'+f1(75-qe)+'</b>.'}`}}});

add({id:'adas-n',unit:'Unit 3 · Macroeconomics',title:'AD–AS (Monetarist / neoclassical)',
what:'The neoclassical model has a vertical long-run aggregate supply (LRAS) at the full-employment output, and an upward-sloping short-run aggregate supply (SRAS).',
meaning:'In the long run output depends on factors of production, not the price level. A demand-side boost only causes a short-run rise in output; in the long run the economy returns to LRAS with a higher price level. A supply-side policy shifts LRAS right.',
draw:['Draw a vertical LRAS at Yf, a rising SRAS and a falling AD.','Equilibrium left of Yf = recessionary gap; right = inflationary gap.','Show the long-run adjustment back to Yf.'],
tips:['SRAS shifts with costs of production (wages, oil). LRAS shifts with quantity or quality of factors (capital, labour, technology).','Evaluate: self-correction can take a long time (Keynesian critique).'],
q:'Explain the effect of falling oil prices in the short run and the long run.',a:'Lower costs shift SRAS right: price level falls and real GDP rises in the short run. If output is above full employment, wages and costs rise over time and SRAS returns, so in the long run GDP returns to Yf.',
ctrl:[sl('d','AD shift (right = increase)',-25,25,0),sl('s','SRAS shift (right = increase)',-20,20,0)],
f(p){const a=100+p.d,c0=10-p.s;const q=(a-c0)/1.8,pe=a-.8*q;
 const cv=[sg([50,0],[50,100],'c2','LRAS',[50,96]),fc(S(10,1),p.s?'c4':'c1','SRAS',84),fc(D(100,.8),p.d?'c3':'c1','AD',84)];if(p.s)cv.push(fc(S(c0,1),'c1','SRAS₁',84));if(p.d)cv.push(fc(D(a,.8),'c1','AD₁',84));
 const gap=q-50;const lr=a-.8*50;
 return{curves:cv,pts:[dot(q,pe,'Y','PL')],xlabel:'Real GDP',ylabel:'Price level',
 read:Math.abs(gap)<.5?`Economy is at full employment (Yf = 50), price level <b>${f1(pe)}</b>.`:gap<0?`Real GDP <b>${f1(q)}</b> is below Yf: <b>recessionary (deflationary) gap</b> of ${f1(-gap)}. In the long run the economy returns to Yf at price level ≈ ${f1(lr)}.`:`Real GDP <b>${f1(q)}</b> is above Yf: <b>inflationary gap</b> of ${f1(gap)}. Pressure on wages pulls it back to Yf at a price level ≈ ${f1(lr)}.`}}});

add({id:'cycle',unit:'Unit 3 · Macroeconomics',title:'Business cycle',
what:'The business cycle shows short-run fluctuations of real GDP around its long-term trend: expansion, peak, contraction (recession), trough.',
meaning:'Actual growth is the change in real GDP; potential growth is the trend. Positive output gap = above trend (inflation pressure). Negative output gap = below trend (spare capacity and unemployment). A recession is typically two consecutive quarters of falling GDP.',
draw:['Draw a dashed upward trend line (long-term growth).','Draw a wave around it.','Label peak, trough, expansion and contraction.'],
tips:['Distinguish actual growth (the cycle) from potential growth (the trend).','Policy goal: smooth the cycle with stabilisers and counter-cyclical policy.'],
q:'Distinguish between a recession and a depression.',a:'A recession is a period of falling real GDP, often two consecutive quarters. A depression is a very deep and prolonged slump with severe unemployment, often lasting years.',
ctrl:[sl('t','Move through time',0,100,10)],
f(p){const y=x=>42+.25*x+14*Math.sin(2*Math.PI*x/50);const pts=[];for(let x=0;x<=100;x+=1)pts.push([x,y(x)]);
 const u=((p.t/50)%1);let ph;if(Math.abs(u-.25)<.04)ph='Peak';else if(Math.abs(u-.75)<.04)ph='Trough';else if(u>.25&&u<.75)ph='Contraction (recession)';else ph='Expansion (recovery)';
 const gap=y(p.t)-(42+.25*p.t);
 return{curves:[{pts,cls:'c1',label:'Real GDP',lbl:[78,y(78)+13]},sg([0,42],[100,67],'c4','Trend',[8,52])],pts:[dot(p.t,y(p.t))],xlabel:'Time',ylabel:'Real GDP',
 read:`Phase: <b>${ph}</b>. Output gap: <b>${gap>0?'positive':'negative'}</b> (actual GDP ${gap>0?'above':'below'} trend). ${gap>0?'Inflationary pressure builds.':'Spare capacity and rising unemployment.'}`}}});

add({id:'phillips',unit:'Unit 3 · Macroeconomics',title:'Phillips curve',hl:true,
what:'The short-run Phillips curve (SRPC) shows a trade-off between unemployment and inflation. The long-run Phillips curve (LRPC) is vertical at the natural rate of unemployment (NRU).',
meaning:'Moving along SRPC: faster AD growth lowers unemployment but raises inflation. If workers expect higher inflation, the SRPC shifts up. In the long run you cannot buy lower unemployment with higher inflation: the LRPC is vertical.',
draw:['Draw a downward-sloping curve convex to the origin: SRPC.','Draw a vertical LRPC at the NRU.','Show a shift of SRPC when expected inflation changes.'],
tips:['Stagflation (high inflation and high unemployment) in the 1970s showed that the trade-off is not stable.','Link it to AD–AS: AD up means lower unemployment and higher inflation.'],
q:'Explain why the long-run Phillips curve is vertical.',a:'In the long run people adjust their expectations of inflation, so any inflation above expectations disappears. Unemployment returns to the natural rate regardless of the inflation rate, so the curve is vertical.',
ctrl:[sl('u','Unemployment rate (%)',2,9,4,.1),sl('e','Expected inflation (%)',0,4,2,.5)],
f(p){const infl=(u,e)=>e+6*(5-u)/(u-1);const yy=v=>(v+2)*100/16;const pts=[];for(let u=2;u<=9.01;u+=.1){const v=infl(u,p.e);if(yy(v)>=0&&yy(v)<=100)pts.push([u*10,yy(v)])}
 const base=[];for(let u=2;u<=9.01;u+=.1){const v=infl(u,2);if(yy(v)>=0&&yy(v)<=100)base.push([u*10,yy(v)])}
 const cv=[];if(p.e!==2)cv.push({pts:base,cls:'c3',label:'SRPC₀',lbl:[78,yy(infl(7.8,2))+2]});cv.push({pts,cls:'c1',label:p.e!==2?'SRPC₁':'SRPC',lbl:[78,yy(infl(7.8,p.e))+2]});cv.push(sg([50,0],[50,100],'c2','LRPC',[50,95]));
 const v=infl(p.u,p.e);return{curves:cv,pts:[dot(p.u*10,yy(v))],xlabel:'Unemployment (%)',ylabel:'Inflation (%)',ticks:{x:[[20,'2'],[40,'4'],[50,'NRU 5'],[60,'6'],[80,'8']],y:[[yy(0),'0'],[yy(4),'4'],[yy(8),'8'],[yy(12),'12']]},
 read:`At <b>${p.u}%</b> unemployment, inflation is <b>${f1(v)}%</b>. ${p.u<5?'Below the NRU: the economy is overheating.':p.u>5?'Above the NRU: spare capacity holds inflation down.':'At the NRU.'} Raising expected inflation shifts the whole SRPC up.`}}});

add({id:'lorenz',unit:'Unit 3 · Macroeconomics',title:'Lorenz curve and Gini',
what:'The Lorenz curve plots the cumulative share of income against the cumulative share of households (poorest first). The Gini coefficient measures inequality from it.',
meaning:'The 45° line is perfect equality. The further the curve bows below it, the more unequal the distribution. Gini = area A ÷ (A + B) where A is the area between the line and the curve. Gini 0 = equality; 1 = one person has everything.',
draw:['Draw a square with the 45° line of equality.','Draw a curve below it that starts and ends on the diagonal corners.','Shade the area between the line and the curve (A).'],
tips:['Use it to compare countries or time periods. Lorenz curves can cross, so Gini alone can hide differences.','Link to taxation: progressive taxes and transfers move the curve toward the line.'],
q:'Explain what a Gini coefficient of 0.45 means.',a:'Income is quite unequal: the Lorenz curve lies well below the line of equality. A Gini of 0 would be perfect equality and 1 would be perfect inequality, so 0.45 shows considerable income inequality.',
ctrl:[sl('k','Inequality',1.2,4,2.2,.1)],
f(p){const pts=[];for(let x=0;x<=100;x+=2)pts.push([x,100*Math.pow(x/100,p.k)]);const g=(p.k-1)/(p.k+1);
 const area=[[0,0],...pts.filter((_,i)=>i>0).map(t=>[t[0],t[0]]).reverse(),...[]];
 const poly1=[...pts,...[[100,100]]];const lineback=[];for(let x=100;x>=0;x-=2)lineback.push([x,x]);
 return{curves:[sg([0,0],[100,100],'c3','Equality',[70,72]),{pts,cls:'c1',label:'Lorenz curve',lbl:[58,100*Math.pow(.58,p.k)-8]}],areas:[poly([...pts,...lineback],'a1')],texts:[{x:26,y:44,t:'A'},{x:70,y:28,t:'B'}],xlabel:'Cumulative % of households',ylabel:'Cumulative % of income',
 ticks:{x:[[0,'0'],[50,'50'],[100,'100']],y:[[0,'0'],[50,'50'],[100,'100']]},
 read:`Gini coefficient = <b>${f1(g*100)/100}</b>. The poorest 50% hold <b>${f1(100*Math.pow(.5,p.k))}%</b> of income.`}}});

/* ---------- UNIT 4: GLOBAL ECONOMY ---------- */
add({id:'fx',unit:'Unit 4 · The global economy',title:'Exchange rate determination',
what:'The exchange rate is the price of one currency in terms of another. In a floating system it is set by the demand for and supply of the currency.',
meaning:'Demand for the currency comes from exports, foreign investment and speculation. Supply comes from imports and outward investment. A rise in value is appreciation; a fall is depreciation. A weaker currency makes exports cheaper and imports dearer.',
draw:['Label the vertical axis as the price of the currency (for example € per $).','Draw D and S of the currency crossing at the equilibrium rate.','Shift D or S and label the new rate.'],
tips:['Causes of appreciation: higher interest rates (hot money), strong export demand, lower relative inflation.','Evaluate with the Marshall–Lerner condition: depreciation improves the current account only if PED exports + PED imports > 1.'],
q:'Explain how higher interest rates can lead to appreciation of a currency.',a:'Higher interest rates attract foreign savers, who need the domestic currency to deposit funds. Demand for the currency rises, D shifts right, and the exchange rate appreciates.',
ctrl:[sl('d','Demand for currency (right = increase)',-25,25,15),sl('s','Supply of currency (right = increase)',-25,25,0)],
f(p){const a=90+p.d,c0=10-p.s;const q1=(a-c0)/1.6,p1=a-.8*q1;const cv=[fc(D(90,.8),p.d?'c3':'c1','D',84),fc(S(10,.8),p.s?'c4':'c2','S',84)];if(p.d)cv.push(fc(D(a,.8),'c1','D₁',84));if(p.s)cv.push(fc(S(c0,.8),'c2','S₁',84));
 const pts=[dot(50,50,'Q₀','ER₀')];if(p.d||p.s)pts.push(dot(q1,p1,'Q₁','ER₁'));
 return{curves:cv,pts,xlabel:'Quantity of currency',ylabel:'Exchange rate',read:Math.abs(p1-50)<.05?'The exchange rate is unchanged.':`The currency <b>${p1>50?'appreciates':'depreciates'}</b> from <b>50</b> to <b>${f1(p1)}</b>. ${p1>50?'Exports become dearer, imports cheaper.':'Exports become cheaper, imports dearer.'}`}}});

add({id:'tariff',unit:'Unit 4 · The global economy',title:'Tariff',
what:'A tax on imported goods. It raises the domestic price above the world price and protects domestic producers.',
meaning:'With free trade the country buys at the world price Pw. A tariff raises the price to Pw + t: domestic output rises, consumption falls, imports fall. The government gains revenue, but there are two deadweight-loss triangles (inefficient production and lost consumption).',
draw:['Draw domestic D and S and a horizontal world price Pw.','Draw a second horizontal line Pw + tariff.','Label Q1–Q4. Imports = Qd − Qs. Shade revenue and the two DWL triangles.'],
tips:['Winners: domestic producers, government. Losers: consumers, export industries (retaliation).','Arguments for: infant industry, jobs, national security, anti-dumping. Against: higher prices, inefficiency, trade wars.'],
q:'Explain two effects of a tariff on a country\'s consumers.',a:'1) Higher price: the tariff pushes the domestic price above the world price. 2) Lower consumption and consumer surplus: fewer units are bought at the higher price, and the lost surplus partly becomes tariff revenue and partly deadweight loss.',
ctrl:[sl('t','Tariff per unit',0,20,10)],
f(p){const t=p.t,pw=30,pt=pw+t;const qs0=(pw-10)/.8,qd0=(90-pw)/.8,qs=(pt-10)/.8,qd=(90-pt)/.8;
 const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),'c2','S',86),sg([0,pw],[100,pw],'c3','Pw',[90,pw])];if(t)cv.push(sg([0,pt],[100,pt],'c3','Pw + t',[84,pt]));
 const ar=t?[poly([[qs,pw],[qd,pw],[qd,pt],[qs,pt]],'a1'),poly([[qs0,pw],[qs,pt],[qs,pw]],'dwl'),poly([[qd,pw],[qd,pt],[qd0,pw]],'dwl')]:[];
 return{curves:cv,areas:ar,pts:t?[dot(qs,pt,'Q₂'),dot(qd,pt,'Q₃')]:[],
 read:t?`Domestic output <b>${f1(qs0)} → ${f1(qs)}</b>, consumption <b>${f1(qd0)} → ${f1(qd)}</b>, imports <b>${f1(qd0-qs0)} → ${f1(qd-qs)}</b>. Tariff revenue (green) = <b>${f1(t*(qd-qs))}</b>.`:`Free trade at Pw = 30: domestic supply ${f1(qs0)}, demand ${f1(qd0)}, imports <b>${f1(qd0-qs0)}</b>. Add a tariff.`}}});

add({id:'quota',unit:'Unit 4 · The global economy',title:'Import quota',
what:'A quota is a physical limit on the quantity of a good that can be imported in a given period.',
meaning:'Like a tariff, a quota raises the domestic price above the world price, protects domestic producers and cuts consumption. Unlike a tariff, the government collects no revenue. The gap between the new price and the world price on the permitted imports is a quota rent, kept by whoever holds the import licences.',
draw:['Draw domestic D and S and the world price Pw.','Add the quota to domestic supply: S + quota, a kinked curve starting where S meets Pw.','Find the new price where D meets S + quota. Imports = Qd − Qs. Shade the quota rent and the two deadweight-loss triangles.'],
tips:['Compare with a tariff on the same diagram: the price and quantities can be identical, but the rectangle goes to licence holders (often foreign firms), not the government.','Evaluate: retaliation, higher prices for consumers, black-market licences, and the jobs protected.'],
q:'Explain one difference between a tariff and a quota.',a:'A tariff raises revenue for the government because it is a tax on each import. A quota is a quantity limit, so the extra price on imports is a quota rent that goes to the importers or licence holders, not to the government.',
ctrl:[sl('q','Quota (maximum imports)',0,50,25)],
f(p){const q=p.q,pw=30,P=50-.4*q;const qs0=25,qd0=75,qs=(P-10)/.8,qd=(90-P)/.8;
 const sq=[];for(let x=0;x<=100;x+=1){let y;if(x<=25)y=10+.8*x;else if(x<=25+q)y=30;else y=10+.8*(x-q);if(y<=100)sq.push([x,y])}
 const cv=[fc(D(90,.8),'c1','D',86),fc(S(10,.8),'c4','S',86),{pts:sq,cls:'c2',label:'S + quota',lbl:[78,10+.8*(78-q)-4]},sg([0,pw],[100,pw],'c3','Pw',[90,pw])];
 const ar=q<50?[poly([[qs,pw],[qd,pw],[qd,P],[qs,P]],'a1'),poly([[qs0,pw],[qs,P],[qs,pw]],'dwl'),poly([[qd,pw],[qd,P],[qd0,pw]],'dwl')]:[];
 return{curves:cv,areas:ar,pts:q<50?[dot(qs,P,'Q₂','P₁'),dot(qd,P,'Q₃')]:[],
 read:q<50?`New domestic price <b>${f1(P)}</b> (world price 30). Imports fall <b>50 → ${f1(qd-qs)}</b>. Quota rent (green) = <b>${f1((P-pw)*(qd-qs))}</b>, kept by licence holders. Hatched = deadweight loss.`:'A quota of 50 equals free-trade imports, so it has no effect. Lower it.'}}});

add({id:'multiplier',unit:'Unit 3 · Macroeconomics',title:'Keynesian multiplier',hl:false,
what:'The multiplier shows that an initial change in injections (investment, government spending or exports) leads to a larger final change in real GDP: multiplier k = 1 ÷ (1 − MPC) = 1 ÷ MPW.',
meaning:'The first round of spending becomes someone else\'s income, and a fraction (the marginal propensity to consume) is spent again. The rounds shrink until the total change in income is k times the initial injection. The higher the MPC, the bigger the multiplier. Withdrawals (saving, tax, imports) reduce it.',
draw:['Plot aggregate expenditure (AE) against national income (Y), with the 45° line where AE = Y.','AE has a positive intercept and slope equal to the MPC.','An injection shifts AE up by ΔI. The new equilibrium Y₁ is further than ΔI to the right.'],
tips:['The multiplier works in both directions: a fall in injections reduces GDP by more than the initial fall.','Evaluate: spare capacity needed, crowding out, time lags, leakages through imports and taxes.'],
q:'The MPC is 0.75 and investment rises by $8bn. Calculate the change in real GDP.',a:'k = 1 ÷ (1 − 0.75) = 4. Change in GDP = 4 × $8bn = $32bn.',
ctrl:[sl('c','Marginal propensity to consume',.4,.8,.75,.05),sl('i','Rise in investment (ΔI)',0,6,3,.5)],
f(p){const a=8,c=p.c,i=p.i,y0=a/(1-c),y1=(a+i)/(1-c);const k=1/(1-c);
 const cv=[sg([0,0],[100,100],'c3','AE = Y',[84,88]),fc(q=>a+c*q,i?'c3':'c1',i?'AE₀':'AE',38)];if(i)cv.push(fc(q=>a+i+c*q,'c1','AE₁',88));
 return{curves:cv,pts:[dot(y0,y0,'Y₀','AE₀'),...(i?[dot(y1,y1,'Y₁','AE₁')]:[])],xlabel:'National income (Y)',ylabel:'Aggregate expenditure',
 read:`k = 1 ÷ (1 − ${c}) = <b>${f1(k)}</b>. A rise of <b>${i}</b> in investment raises income by <b>${f1(y1-y0)}</b> (${f1(i*k)} = ${i} × ${f1(k)}).`}}});

add({id:'lrac',unit:'Unit 2 · Microeconomics',title:'Long-run average cost and economies of scale',hl:true,
what:'The long-run average cost (LRAC) curve shows the lowest average cost of producing each output when all factors, including capital, can be varied.',
meaning:'It is the envelope of all the short-run average cost (SRAC) curves. Falling LRAC means economies of scale (specialisation, bulk buying, spreading fixed costs). The minimum is the minimum efficient scale. Rising LRAC means diseconomies of scale (coordination, communication, motivation problems).',
draw:['Draw several U-shaped SRAC curves, each for a different plant size.','Draw a smooth U-shaped curve touching the bottom of each SRAC from beneath: the LRAC.','Label the economies-of-scale, minimum efficient scale and diseconomies-of-scale regions.'],
tips:['Distinguish internal from external economies of scale.','Link to market structure: large minimum efficient scale relative to the market creates natural monopoly.'],
q:'Explain two internal economies of scale.',a:'1) Technical: larger firms use specialised machinery and spread fixed costs over more units. 2) Purchasing: bulk buying of inputs gets discounts, lowering average cost. Both cause LRAC to fall as output rises.',
ctrl:[sl('q','Output',10,95,30)],
f(p){const L=q=>22+.012*(q-55)*(q-55),dL=q=>.024*(q-55);const S1=c=>q=>L(c)+dL(c)*(q-c)+.03*(q-c)*(q-c);
 const cv=[fc(L,'c1','LRAC',92),fc(S1(25),'c4','SRAC₁',45,5,55),fc(S1(55),'c4','SRAC₂',72,30,80),fc(S1(85),'c4','SRAC₃',95,60,100)];
 const q=p.q;const reg=q<50?'<b>economies of scale</b>: LRAC falls as output rises.':q<=60?'the <b>minimum efficient scale</b>: average cost is lowest.':'<b>diseconomies of scale</b>: LRAC rises as output rises.';
 return{curves:cv,pts:[dot(q,L(q),'Q','$'+f1(L(q)))],xlabel:'Output',ylabel:'Average cost ($)',read:`At output ${q} the firm is in the range of ${reg}`}}});

/* ===== Added from the class ECON folder ===== */
const cards=a=>'<dl class="terms">'+a.map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('')+'</dl>';
const tbl=(h,rows,num)=>'<div class="tw"><table><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${num&&i>0?'num':''}">${c}</td>`).join('')+'</tr>').join('')+'</table></div>';
const U1='Unit 1 · Introduction to economics';

add({id:'nine',unit:U1,title:'The nine economic concepts',
what:'The IB Diploma Programme frames the whole course around nine key concepts: scarcity, choice, efficiency, equity, economic well-being, sustainability, change, interdependence and intervention.',
notes:[{h:'The nine concepts',html:cards([
['Scarcity','Limited resources against unlimited wants. The central problem: economics studies how to make the best use of scarce resources.'],
['Choice','Scarcity forces choices between alternatives, which creates opportunity cost.'],
['Efficiency','Ratio of useful output to total input. Allocative efficiency uses scarce resources to produce the mix of goods that is best for society, with minimal waste.'],
['Equity','Fairness, a normative idea that means different things to different people. Different from equality, which means similar outcomes. Often seen as inequality of income, wealth or opportunity.'],
['Economic well-being','Prosperity and living standards: financial security now and later, meeting basic needs, freedom of economic choice and adequate long-term income.'],
['Sustainability','Meeting the needs of the present without harming the ability of future generations to meet theirs. Limits resource depletion and environmental damage.'],
['Change','Economic theory studies changes in variables more than their levels, and the real world is always changing (technology, institutions, society).'],
['Interdependence','No individual, firm or country is self-sufficient. Decisions by one actor have often unintended consequences for others.'],
['Intervention','Government involvement in markets. Markets can fail to deliver equity, well-being or sustainability, which may justify intervention, but its extent is debated.']])}],
q:'Distinguish between equity and equality.',a:'Equality describes similar economic outcomes for different people or groups. Equity is about fairness, a normative concept, so an equitable outcome may involve unequal outcomes if they are judged fair (for example, more help for those with greater need).'});

add({id:'method',unit:U1,title:'Economic methodology: positive and normative',
what:'Economics is a social science. Economists test theories with empirical evidence (observed data and behaviour) because they cannot run controlled laboratory experiments on whole economies.',
notes:[{h:'Positive and normative statements',html:tbl(['','Positive','Normative'],[['Nature','Objective; can be tested as true or false with evidence','Value judgement; cannot be proved true or false'],['Example','"If interest rates fall, economic growth rises."','"The government ought to reduce interest rates in a recession."'],['Example','"As the price of a computer falls, quantity demanded rises."','"Professional footballers are paid too much."'],['Used for','Building and testing theory','The basis of policy decisions']])},
{h:'Ceteris paribus',html:'<p>Other factors are held constant so that the effect of one variable can be isolated. In reality many variables change at once, which is why economic claims are hard to test, and why the assumption is stated explicitly.</p>'},
{h:'Hypotheses, models and theories',html:'<p>A hypothesis is a testable claim (reducing interest rates increases consumer spending, which raises aggregate demand). Models such as the circular flow of income support the claim, and data either supports or refutes it.</p>'},
{h:'Rational and behavioural economics',html:'<p>Classical theory assumes rational consumers who maximise satisfaction (utility). Behavioural economics allows irrational behaviour and shows that people are influenced by psychology, for example nudge theory (confectionery at the checkout).</p>'}],
q:'Explain how economists use economic methodology to study the subject. [4]',a:'Economists form hypotheses from theories and models, then test them with empirical evidence such as past data. For example, to test whether better healthcare raises labour productivity they compare healthcare spending with productivity over time. They hold other factors constant (ceteris paribus) to isolate the effect of one variable.'});

add({id:'thought',unit:U1,title:'Schools of economic thought',
what:'Different economists have given different answers to how much the state should do and how people behave. Knowing the schools helps you evaluate policy.',
notes:[{h:'Key thinkers and ideas',html:cards([
['Adam Smith (1776)','The Wealth of Nations. Free, unregulated (laissez-faire) markets and trade benefit buyers and sellers and raise incomes.'],
['Classical economics','Developed from Smith. Utility theory and Say\'s Law: producing goods creates income and therefore demand for other goods.'],
['Karl Marx','Critic of capitalism: industrialists gain at workers\' expense; workers would overthrow capitalism and replace it with socialism.'],
['John Maynard Keynes (1936)','The General Theory. Shaped by the Great Depression; argued for a bigger role for government in managing demand.'],
['Monetarism (Friedman)','Dominant in the 1970s. The money supply is the key determinant of inflation and growth; use interest rates to control it.'],
['Behavioural economics (Thaler)','Nobel 2017. Psychology matters: people are "humans" not "econs". Nudge theory. Allows irrational behaviour.'],
['Doughnut economics (Raworth)','Meet everyone\'s needs (social foundation) within the planet\'s sustainable limits (ecological ceiling). Questions a focus on growth alone.'],
['Dambisa Moyo','Rising inequality and scarcity undermine welfare. Long-term public and private partnership and more spending on education as solutions.']])}],
q:'Explain two factors that might prevent consumers from making rational economic decisions. [4]',a:'1) Imperfect information: consumers may not know the true quality or price of products and so cannot maximise utility. 2) Habit, social pressure or emotion (behavioural factors): people follow trends, are nudged by marketing or choose impulsively, which departs from the rational model.'});

add({id:'fop',unit:U1,title:'Factors of production, needs and wants',
what:'Factors of production are the collective term for the resources used to produce goods and services: land, labour, capital and entrepreneurship.',
notes:[{h:'Key terms',html:cards([
['Needs and wants','Needs are basic necessities for survival (food, water, shelter). Wants are desires for goods we would like to have (a new smartphone, a holiday).'],
['Goods and services','Goods are tangible (cars, food). Services are intangible (haircuts, banking, education).'],
['Consumers and customers','Consumers use a product. Customers purchase it. They can be different people.'],
['Entrepreneurship','Knowledge, skills and experience to manage production. Entrepreneurs take risks in pursuit of profit.'],
['Adding value','Producing a good or service worth more than the cost of the resources. Value added = price of output minus cost of inputs.'],
['Production','Creating goods and services using the factors of production.']])},
{h:'The four sectors',html:tbl(['Sector','Activity','Example'],[['Primary','Extraction of natural resources','Fishing, mining, agriculture'],['Secondary','Manufacturing and construction','Car assembly, building'],['Tertiary','Providing services','Tourism, banking, education'],['Quaternary','Creating or sharing knowledge and information','Research, IT']])}],
q:'Define value added and give an example.',a:'Value added is the difference between the cost of the factor inputs and the price at which the final output is sold. A bakery that buys flour and ingredients for $2 and sells a loaf for $5 adds $3 of value.'});

add({id:'goods',unit:'Unit 2 · Microeconomics',title:'Types of goods and market failure',
what:'Goods are classified by rivalry and excludability. A public good is non-rivalrous and non-excludable, so the market underprovides it because of the free-rider problem.',
notes:[{h:'Summary table',html:tbl(['','Private','Public','Merit','Demerit','Free'],[
['Definition','Rivalrous and excludable','Non-rivalrous and non-excludable','Under-consumed because people undervalue benefits','Over-consumed because people undervalue harms','No opportunity cost; unlimited supply'],
['Provided by','Market (firms)','Government','Market and government','Market','Nature'],
['External costs / benefits','Usually none','Large external benefits','Positive externalities','Negative externalities','None'],
['Information failure','Little','Not the main problem','Consumers underestimate benefits','Consumers underestimate harms','None'],
['Government action','None needed','Direct provision from taxes','Subsidy, direct provision, education','Tax, ban, regulation, information','None'],
['Examples','Burger, phone','Street lighting, national defence','Education, vaccines','Tobacco, alcohol','Air, sunlight'],
['Non-rivalrous','No','Yes','No','No','Yes'],
['Non-excludable','No','Yes','No','No','Yes'],
['MC of an extra user','Positive','Zero','Positive','Positive','Zero']])},
