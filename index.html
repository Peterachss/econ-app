roduction":"› Giới thiệu › Giới thiệu","Topic 1.1":"Chủ đề 1.1","SL and HL":"SL và HL","Updated: 30 November 2026":"Cập nhật: 30 tháng 11, 2026",", Introduction":", Giới thiệu","Mark as studied":"Đánh dấu đã học","Cite this topic":"Trích dẫn chủ đề này","Summary":"Tóm tắt","The nine concepts":"Chín khái niệm","Limited resources against unlimited wants. The central problem: economics studies how to make the best use of scarce resources.":"Nguồn lực có hạn so với những mong muốn vô hạn. Vấn đề trung tâm: kinh tế học nghiên cứu cách sử dụng tốt nhất các nguồn lực khan hiếm.","Choice":"Lựa chọn","Scarcity forces choices between alternatives, which creates opportunity cost.":"Khan hiếm buộc phải lựa chọn giữa các phương án, từ đó tạo ra chi phí cơ hội.","Efficiency":"Hiệu quả","Ratio of useful output to total input. Allocative efficiency uses scarce resources to produce the mix of goods that is best for society, with minimal waste.":"Tỷ lệ giữa sản lượng hữu ích và tổng đầu vào. Hiệu quả phân bổ dùng các nguồn lực khan hiếm để tạo ra cơ cấu hàng hóa tốt nhất cho xã hội, với lãng phí tối thiểu.","Equity":"Công bằng","Fairness, a normative idea that means different things to different people. Different from equality, which means similar outcomes. Often seen as inequality of income, wealth or opportunity.":"Sự đúng đắn, một ý tưởng chuẩn tắc có nghĩa khác nhau với những người khác nhau. Khác với bình đẳng, nghĩa là kết quả giống nhau. Thường được hiểu là bất bình đẳng về thu nhập, của cải hoặc cơ hội.","Economic well-being":"Phúc lợi kinh tế","Prosperity and living standards: financial security now and later, meeting basic needs, freedom of economic choice and adequate long-term income.":"Sự thịnh vượng và mức sống: an ninh tài chính hiện tại và tương lai, đáp ứng nhu cầu cơ bản, tự do lựa chọn kinh tế và thu nhập dài hạn đầy đủ.","Sustainability":"Tính bền vững","Meeting the needs of the present without harming the ability of future generations to meet theirs. Limits resource depletion and environmental damage.":"Đáp ứng nhu cầu hiện tại mà không làm tổn hại khả năng của các thế hệ tương lai trong việc đáp ứng nhu cầu của họ. Hạn chế cạn kiệt tài nguyên và thiệt hại môi trường.","Change":"Sự thay đổi","Economic theory studies changes in variables more than their levels, and the real world is always changing (technology, institutions, society).":"Lý thuyết kinh tế nghiên cứu sự thay đổi của các biến số nhiều hơn mức độ của chúng, và thế giới thực luôn thay đổi (công nghệ, thể chế, xã hội).","Interdependence":"Sự phụ thuộc lẫn nhau","No individual, firm or country is self-sufficient. Decisions by one actor have often unintended consequences for others.":"Không cá nhân, doanh nghiệp hay quốc gia nào tự cung tự cấp hoàn toàn. Quyết định của một chủ thể thường gây ra những hệ quả ngoài ý muốn cho các chủ thể khác.","Intervention":"Sự can thiệp","Government involvement in markets. Markets can fail to deliver equity, well-being or sustainability, which may justify intervention, but its extent is debated.":"Sự tham gia của chính phủ vào thị trường. Thị trường có thể thất bại trong việc mang lại công bằng, phúc lợi hay tính bền vững, điều có thể biện minh cho sự can thiệp, nhưng mức độ can thiệp còn tranh luận.","Exam practice":"Luyện thi","Show model answer":"Hiện đáp án mẫu","← Previous":"← Trước","Next →":"Tiếp →","0 of 4 studied":"0 trong 4 đã học","Topic 1.2":"Chủ đề 1.2","Positive and normative statements":"Các phát biểu thực chứng và chuẩn tắc","Positive":"Thực chứng","Normative":"Chuẩn tắc","Nature":"Bản chất","Objective; can be tested as true or false with evidence":"Khách quan; có thể kiểm tra đúng hay sai bằng bằng chứng","Value judgement; cannot be proved true or false":"Nhận định giá trị; không thể chứng minh đúng hay sai","Example":"Ví dụ","\"If interest rates fall, economic growth rises.\"":"\"Nếu lãi suất giảm, tăng trưởng kinh tế tăng.\"","\"The government ought to reduce interest rates in a recession.\"":"\"Chính phủ nên giảm lãi suất trong thời kỳ suy thoái.\"","\"As the price of a computer falls, quantity demanded rises.\"":"\"Khi giá máy tính giảm, lượng cầu tăng.\"","\"Professional footballers are paid too much.\"":"\"Các cầu thủ bóng đá chuyên nghiệp được trả quá cao.\"","Used for":"Dùng để","Building and testing theory":"Xây dựng và kiểm tra lý thuyết","The basis of policy decisions":"Cơ sở của các quyết định chính sách","Other factors are held constant so that the effect of one variable can be isolated. In reality many variables change at once, which is why economic claims are hard to test, and why the assumption is stated explicitly.":"Các yếu tố khác được giữ không đổi để có thể tách riêng tác động của một biến số. Trong thực tế nhiều biến thay đổi cùng lúc, đó là lý do các nhận định kinh tế khó kiểm tra, và vì sao giả định này được nêu rõ.","Hypotheses, models and theories":"Giả thuyết, mô hình và lý thuyết","A hypothesis is a testable claim (reducing interest rates increases consumer spending, which raises aggregate demand). Models such as the circular flow of income support the claim, and data either supports or refutes it.":"Giả thuyết là một nhận định có thể kiểm tra (giảm lãi suất làm tăng chi tiêu tiêu dùng, từ đó làm tăng tổng cầu). Các mô hình như vòng chu chuyển thu nhập ủng hộ nhận định này, và dữ liệu hoặc ủng hộ hoặc bác bỏ nó.","Rational and behavioural economics":"Kinh tế học hợp lý và kinh tế học hành vi","Classical theory assumes rational consumers who maximise satisfaction (utility). Behavioural economics allows irrational behaviour and shows that people are influenced by psychology, for example nudge theory (confectionery at the checkout).":"Lý thuyết cổ điển giả định người tiêu dùng hợp lý tối đa hóa sự hài lòng (thỏa dụng). Kinh tế học hành vi cho phép hành vi phi lý và cho thấy con người chịu ảnh hưởng của tâm lý, ví dụ lý thuyết thúc đẩy nhẹ (đặt kẹo ở quầy thanh toán).","Topic 1.3":"Chủ đề 1.3","Key thinkers and ideas":"Các nhà tư tưởng và ý tưởng chính","The Wealth of Nations. Free, unregulated (laissez-faire) markets and trade benefit buyers and sellers and raise incomes.":"Của cải của các quốc gia. Thị trường tự do, không bị kiểm soát (tự do kinh doanh) và thương mại có lợi cho người mua và người bán và làm tăng thu nhập.","Classical economics":"Kinh tế học cổ điển","Developed from Smith. Utility theory and Say's Law: producing goods creates income and therefore demand for other goods.":"Phát triển từ Smith. Lý thuyết thỏa dụng và Quy luật Say: sản xuất hàng hóa tạo ra thu nhập và do đó tạo ra cầu về các hàng hóa khác.","Critic of capitalism: industrialists gain at workers' expense; workers would overthrow capitalism and replace it with socialism.":"Nhà phê phán chủ nghĩa tư bản: nhà công nghiệp được lợi trên lưng người lao động; người lao động sẽ lật đổ chủ nghĩa tư bản và thay bằng chủ nghĩa xã hội.","The General Theory. Shaped by the Great Depression; argued for a bigger role for government in managing demand.":"Lý thuyết tổng quát. Hình thành sau cuộc Đại suy thoái; lập luận cho vai trò lớn hơn của chính phủ trong quản lý tổng cầu.","Monetarism (Friedman)":"Chủ nghĩa trọng tiền (Friedman)","Dominant in the 1970s. The money supply is the key determinant of inflation and growth; use interest rates to control it.":"Thống trị những năm 1970. Cung tiền là yếu tố quyết định chính của lạm phát và tăng trưởng; dùng lãi suất để kiểm soát nó.","Behavioural economics (Thaler)":"Kinh tế học hành vi (Thaler)","Nobel 2017. Psychology matters: people are \"humans\" not \"econs\". Nudge theory. Allows irrational behaviour.":"Nobel 2017. Tâm lý có vai trò quan trọng: con người là \"con người\" chứ không phải \"econs\". Lý thuyết thúc đẩy nhẹ. Cho phép hành vi phi lý.","Doughnut economics (Raworth)":"Kinh tế học bánh doughnut (Raworth)","Meet everyone's needs (social foundation) within the planet's sustainable limits (ecological ceiling). Questions a focus on growth alone.":"Đáp ứng nhu cầu của mọi người (nền tảng xã hội) trong giới hạn bền vững của hành tinh (trần sinh thái). Đặt câu hỏi về việc chỉ tập trung vào tăng trưởng.","Rising inequality and scarcity undermine welfare. Long-term public and private partnership and more spending on education as solutions.":"Bất bình đẳng và khan hiếm gia tăng làm suy yếu phúc lợi. Giải pháp: hợp tác công tư dài hạn và chi nhiều hơn cho giáo dục.","Topic 1.4":"Chủ đề 1.4","Needs and wants":"Nhu cầu và mong muốn","Needs are basic necessities for survival (food, water, shelter). Wants are desires for goods we would like to have (a new smartphone, a holiday).":"Nhu cầu là những thứ thiết yếu cơ bản để sinh tồn (thức ăn, nước, nơi ở). Mong muốn là ham muốn có những hàng hóa ta thích (một chiếc điện thoại mới, một kỳ nghỉ).","Goods and services":"Hàng hóa và dịch vụ","Goods are tangible (cars, food). Services are intangible (haircuts, banking, education).":"Hàng hóa là hữu hình (xe hơi, thực phẩm). Dịch vụ là vô hình (cắt tóc, ngân hàng, giáo dục).","Consumers and customers":"Người tiêu dùng và khách hàng","Consumers use a product. Customers purchase it. They can be different people.":"Người tiêu dùng sử dụng sản phẩm. Khách hàng mua nó. Họ có thể là những người khác nhau.","Entrepreneurship":"Tinh thần kinh doanh","Knowledge, skills and experience to manage production. Entrepreneurs take risks in pursuit of profit.":"Kiến thức, kỹ năng và kinh nghiệm để quản lý sản xuất. Doanh nhân chấp nhận rủi ro để theo đuổi lợi nhuận.","Adding value":"Gia tăng giá trị","Producing a good or service worth more than the cost of the resources. Value added = price of output minus cost of inputs.":"Sản xuất một hàng hóa hoặc dịch vụ có giá trị cao hơn chi phí nguồn lực. Giá trị gia tăng = giá sản lượng trừ chi phí đầu vào.","Production":"Sản xuất","Creating goods and services using the factors of production.":"Tạo ra hàng hóa và dịch vụ bằng các yếu tố sản xuất.","The four sectors":"Bốn khu vực","Sector":"Khu vực","Activity":"Hoạt động","Primary":"Sơ cấp","Extraction o ng thiếu vì người ta đánh giá thấp lợi ích","Over-consumed because people undervalue harms":"Bị tiêu dùng quá mức vì người ta đánh giá thấp tác hại","No opportunity cost; unlimited supply":"Không có chi phí cơ hội; nguồn cung vô hạn","Provided by":"Do ai cung cấp","Market (firms)":"Thị trường (doanh nghiệp)","Government":"Chính phủ","Market and government":"Thị trường và chính phủ","Market":"Thị trường","External costs / benefits":"Chi phí / lợi ích ngoại tác","Usually none":"Thường không có","Large external benefits":"Lợi ích ngoại tác lớn","Positive externalities":"Ngoại tác tích cực","Negative externalities":"Ngoại tác tiêu cực","None":"Không có","Information failure":"Thất bại thông tin","Little":"Ít","Not the main problem":"Không phải vấn đề chính","Consumers underestimate benefits":"Người tiêu dùng đánh giá thấp lợi ích","Consumers underestimate harms":"Người tiêu dùng đánh giá thấp tác hại","Government action":"Hành động của chính phủ","None needed":"Không cần","Direct provision from taxes":"Cung cấp trực tiếp từ tiền thuế","Subsidy, direct provision, education":"Trợ cấp, cung cấp trực tiếp, giáo dục","Tax, ban, regulation, information":"Thuế, cấm, quy định, thông tin","Examples":"Ví dụ","Burger, phone":"Bánh hamburger, điện thoại","Street lighting, national defence":"Đèn đường, quốc phòng","Education, vaccines":"Giáo dục, vắc-xin","Tobacco, alcohol":"Thuốc lá, rượu","Air, sunlight":"Không khí, ánh nắng","Non-rivalrous":"Không cạnh tranh","No":"Không","Yes":"Có","Non-excludable":"Không loại trừ","MC of an extra user":"Chi phí cận biên của một người dùng thêm","Zero":"Bằng không","Merit goods and the mask example":"Hàng hóa khuyến dụng và ví dụ về khẩu trang","Masks protect the wearer and third parties from infection, so consumption creates external benefits. People may undervalue the benefit (information failure), so the free market under-provides them. Merit goods are a normative idea: it is a value judgement that the good is good for people.":"Khẩu trang bảo vệ người đeo và bên thứ ba khỏi nhiễm bệnh, nên việc tiêu dùng tạo ra lợi ích ngoại tác. Mọi người có thể đánh giá thấp lợi ích (thất bại thông tin), nên thị trường tự do cung cấp không đủ. Hàng hóa khuyến dụng là một ý tưởng chuẩn tắc: đó là nhận định giá trị rằng hàng hóa tốt cho con người.","› Microeconomics › Market failure · HL only":"› Kinh tế vi mô › Thất bại thị trường · chỉ HL","Topic 2.20":"Chủ đề 2.20","HL only":"Chỉ HL","Two problems":"Hai vấn đề","When":"Khi nào","Before the contract (hidden characteristics)":"Trước hợp đồng (đặc điểm ẩn)","After the contract (hidden actions)":"Sau hợp đồng (hành động ẩn)","Problem":"Vấn đề","The uninformed party cannot tell good from bad, so the price reflects average quality and good sellers leave":"Bên thiếu thông tin không phân biệt được tốt và xấu, nên giá phản ánh chất lượng trung bình và người bán hàng tốt rời đi","One party takes more risk because the other bears the cost":"Một bên chấp nhận rủi ro nhiều hơn vì bên kia gánh chi phí","Used car \"lemons\"; unhealthy people buying health insurance":"Xe cũ \"chanh\"; người không khỏe mua bảo hiểm y tế","Insured homeowner less careful; banks \"too big to fail\" take bigger risks":"Chủ nhà đã mua bảo hiểm bớt cẩn thận hơn; các ngân hàng \"quá lớn để sụp đổ\" chấp nhận rủi ro lớn hơn","Memory aid":"Mẹo nhớ","Ahead of the deal":"Trước thỏa thuận","Mid-contract behaviour":"Hành vi giữa chừng hợp đồng","The lemon problem step by step":"Vấn đề xe \"chanh\" từng bước một","The seller knows the car's true quality; the buyer does not. The buyer only pays a price for average quality. Sellers of high-quality cars withdraw. Eventually only lemons remain and the market breaks down (Akerlof, 1970).":"Người bán biết chất lượng thật của chiếc xe; người mua thì không. Người mua chỉ trả giá cho chất lượng trung bình. Người bán xe chất lượng cao rút lui. Cuối cùng chỉ còn xe \"chanh\" và thị trường sụp đổ (Akerlof, 1970).","Solutions":"Các giải pháp","Type":"Loại","Who acts":"Ai hành động","Informed party":"Bên có thông tin","Long warranty on a used car; qualifications such as the IB Diploma":"Bảo hành dài cho xe cũ; bằng cấp như IB Diploma","Uninformed party":"Bên thiếu thông tin","Insurance deductible (excess); CVs, references and background checks":"Mức miễn thường bảo hiểm; hồ sơ, người giới thiệu và kiểm tra lý lịch","Regulation":"Quy định","Minimum quality standards, compulsory insurance, mandatory disclosure, consumer protection laws":"Tiêu chuẩn chất lượng tối thiểu, bảo hiểm bắt buộc, công khai thông tin bắt buộc, luật bảo vệ người tiêu dùng","Provision of information":"Cung cấp thông tin","Free public credit ratings and property data":"Xếp hạng tín dụng công khai miễn phí và dữ liệu bất động sản","Topic 2.21":"Chủ đề 2.21","The argument":"Lập luận","Free markets reward those with valuable skills or assets and can leave others with little. Strong institutions (laws, property rights, regulation) are needed to limit the excesses of the free market and promote development.":"Thị trường tự do thưởng cho những ai có kỹ năng hoặc tài sản có giá trị và có thể để lại rất ít cho người khác. Cần có các thể chế mạnh (luật pháp, quyền sở hữu, quy định) để hạn chế những thái quá của thị trường tự do và thúc đẩy phát triển.","Negative externalities of unrestrained growth":"Ngoại tác tiêu cực của tăng trưởng không kiềm chế","Rapid growth with little regulation, as in parts of China, causes air and water pollution. This is a negative externality: social costs exceed private costs, so output is higher than the socially optimal level and there is a welfare loss (see the negative externality diagram).":"Tăng trưởng nhanh với ít quy định, như ở một số vùng của Trung Quốc, gây ô nhiễm không khí và nước. Đây là một ngoại tác tiêu cực: chi phí xã hội vượt chi phí tư nhân, nên sản lượng cao hơn mức tối ưu xã hội và có tổn thất phúc lợi (xem sơ đồ ngoại tác tiêu cực).","Market and intervention together":"Thị trường và sự can thiệp cùng nhau","Living standards are often improved most by a mixture of free markets for efficiency and government intervention for equity and sustainability (progressive taxes, transfers, public provision of education and healthcare).":"Mức sống thường được cải thiện nhiều nhất nhờ sự kết hợp giữa thị trường tự do để đạt hiệu quả và sự can thiệp của chính phủ để đạt công bằng và bền vững (thuế lũy tiến, chuyển giao thu nhập, cung cấp công về giáo dục và y tế).","Evaluating":"Đánh giá","Equity is normative, so views differ. Intervention can reduce incentives and cause government failure, while no intervention can leave a growing underclass. Use the Lorenz curve and Gini coefficient as evidence.":"Công bằng là chuẩn tắc nên quan điểm khác nhau. Can thiệp có thể làm giảm động lực và gây thất bại của chính phủ, trong khi không can thiệp có thể để lại một tầng lớp thấp kém ngày càng tăng. Dùng đường Lorenz và hệ số Gini làm bằng chứng.","› Microeconomics › Theory of the firm · HL only":"› Kinh tế vi mô › Lý thuyết doanh nghiệp · chỉ HL","Topic 2.22":"Chủ đề 2.22",", Theory of the firm":", Lý thuyết doanh nghiệp","Fig. 2.22:":"Hình 2.22:","Cost curves (short run).":"Đường chi phí (ngắn hạn).","Rule: when MC":"Quy tắc: khi MC","Topic 2.23":"Chủ đề 2.23","Fig. 2.23:":"Hình 2.23:","Long-run average cost and economies of scale.":"Chi phí bình quân dài hạn và tính kinh tế theo quy mô.","Topic 2.24":"Chủ đề 2.24","Fig. 2.24:":"Hình 2.24:","Production: total, average and marginal product.":"Sản xuất: sản phẩm tổng, bình quân và cận biên.","Topic 2.25":"Chủ đề 2.25","Fig. 2.25:":"Hình 2.25:","Revenue: TR, AR and MR.":"Doanh thu: TR, AR và MR.","Topic 2.26":"Chủ đề 2.26","Fig. 2.26:":"Hình 2.26:","Perfect competition.":"Cạnh tranh hoàn hảo.","Shut-down rule: short run P":"Quy tắc ngừng sản xuất: ngắn hạn P","Topic 2.27":"Chủ đề 2.27","Fig. 2.27:":"Hình 2.27:","Monopolistic competition.":"Cạnh tranh độc quyền.","Topic 2.28":"Chủ đề 2.28","Fig. 2.28:":"Hình 2.28:","Monopoly.":"Độc quyền.","› Macroeconomics › Aggregate demand and supply":"› Kinh tế vĩ mô › Tổng cầu và tổng cung","Topic 3.1":"Chủ đề 3.1",", Aggregate demand and supply":", Tổng cầu và tổng cung","Fig. 3.1:":"Hình 3.1:","AD–AS (Keynesian).":"AD–AS (Keynes).","0 of 6 studied":"0 trong 6 đã học","Aggregate demand and supply":"Tổng cầu và tổng cung","Unemployment and inflation":"Thất nghiệp và lạm phát","Equity and distribution":"Công bằng và phân phối","Topic 3.2":"Chủ đề 3.2","Fig. 3.2:":"Hình 3.2:","AD–AS (Monetarist / neoclassical).":"AD–AS (trọng tiền / tân cổ điển).","Topic 3.3":"Chủ đề 3.3","Fig. 3.3:":"Hình 3.3:","Keynesian multiplier.":"Số nhân Keynes.","Topic 3.4":"Chủ đề 3.4","Fig. 3.4:":"Hình 3.4:","Business cycle.":"Chu kỳ kinh doanh.","› Macroeconomics › Unemployment and inflation · HL only":"› Kinh tế vĩ mô › Thất nghiệp và lạm phát · chỉ HL","Topic 3.5":"Chủ đề 3.5",", Unemployment and inflation":", Thất nghiệp và lạm phát","Fig. 3.5:":"Hình 3.5:","Phillips curve.":"Đường Phillips.","› Macroeconomics › Equity and distribution":"› Kinh tế vĩ mô › Công bằng và phân phối","Topic 3.6":"Chủ đề 3.6",", Equity and distribution":", Công bằng và phân phối","Fig. 3.6:":"Hình 3.6:","Lorenz curve and Gini.":"Đường Lorenz và hệ số Gini.","› Global economy › International trade":"› Kinh tế toàn cầu › Thương mại quốc tế","Topic 4.1":"Chủ đề 4.1",", International trade":", Thương mại quốc tế","Fig. 4.1:":"Hình 4.1:","Tariff.":"Thuế quan.","International trade":"Thương mại quốc tế","Exchange rates":"Tỷ giá hối đoái","Topic 4.2":"Chủ đề 4.2","Fig. 4.2:":"Hình 4.2:","Import quota.":"Hạn ngạch nhập khẩu.","› Global economy › Exchange rates":"› Kinh tế toàn cầu › Tỷ giá hối đoái","Topic 4.3":"Chủ đề 4.3",", Exchange rates":", Tỷ giá hối đoái","Fig. 4.3:":"Hình 4.3:","Exchange rate determination.":"Xác định tỷ giá hối đoái.","Topic 4.4":"Chủ đề 4.4","Fig. 4.4:":"Hình 4.4:","The Marshall–Lerner condition and the J-curve.":"Điều kiện Marshall–Lerner và đường cong J.","› Reference":"› Tham khảo","Answer each question on paper first, then open the model answer and mark how you did. Your marks are saved on this device.":"Hãy trả lời mỗi câu hỏi ra giấy trước, rồi mở đáp án mẫu và đánh dấu kết quả của bạn. Các đánh dấu được lưu trên thiết bị này.","got it,":"đã làm được,","to review,":"cần ôn lại,","not tried.":"chưa thử.","All":"Tất cả","To review":"Cần ôn lại","I got it":"Tôi làm được","Review again":"Ôn lại","Worked calculations from your class sheets, with answers computed from the numbers in them.":"Các bài tính toán từ tài liệu trên lớp của bạn, với đáp án được tính từ các số trong đó.","PED calculations (camera shop)":"Tính PED (cửa hàng máy ảnh)","Product":"Sản phẩm","Verdict":"Kết luận","Camera $150 → $130, 4m → 6m":"Máy ảnh 150 → 130 đô la, 4 triệu → 6 triệu","Elastic":"Co giãn","Batteries $1.00 → $1.10, 10m → 9.5m":"Pin 1,00 → 1,10 đô la, 10 triệu → 9,5 triệu","Inelastic":"Kém co giãn","Flash lights $5.00 → $4.50, 2m → 2.2m":"Đèn pin 5,00 → 4,50 đô la, 2 triệu → 2,2 triệu","Unit elastic":"Co giãn đơn vị","A mistake to avoid: elastic does not mean that demand changes and inelastic does not mean that it stays the same. Both change; the difference is the degree.":"Một sai lầm cần tránh: co giãn không có nghĩa là cầu thay đổi và kém co giãn không có nghĩa là nó đứng yên. Cả hai đều thay đổi; khác biệt là ở mức độ.","Snack shop: a 10% price rise or cut (Orhan Bufe)":"Quán ăn nhanh: tăng hoặc giảm giá 10% (Orhan Bufe)","Product (TL)":"Sản phẩm (TL)","Revenue now":"Doanh thu hiện tại","Revenue after +10%":"Doanh thu sau khi tăng 10%","Revenue after −10%":"Doanh thu sau khi giảm 10%","Hamburger":"Bánh hamburger","Cheese toastie":"Bánh mì nướng phô mai","Shish kebab":"Thịt nướng shish kebab","Total":"Tổng","Raising prices helps only the shish kebab (PED −0.6, inelastic). For the hamburger and cheese toastie (elastic) the rise loses revenue and a 10% cut would raise it. A mixed pricing policy works best.":"Việc tăng giá chỉ có lợi cho shish kebab (PED −0,6, kém co giãn). Đối với hamburger và bánh mì nướng phô mai (co giãn), tăng giá làm mất doanh thu và giảm giá 10% sẽ làm tăng. Chính sách giá hỗn hợp hiệu quả nhất.","Meal packages: PED from $11 to $10 and revenue-maximising price":"Các gói bữa ăn: PED từ 11 xuống 10 đô la và mức giá tối đa hóa doanh thu","Package":"Gói","|PED| ($11 → $10)":"|PED| (11 → 10 đô la)","Revenue-maximising price":"Mức giá tối đa hóa doanh thu","$13 (TR 10,400)":"13 đô la (TR 10.400)","$10 (TR 28,000)":"10 đô la (TR 28.000)","$7 (TR 49,000)":"7 đô la (TR 49.000)","Cinema tickets (mark scheme)":"Vé xem phim (đáp án của giáo viên)","Day":"Ngày","Demand at $10":"Cầu tại 10 đô la","Demand at $15":"Cầu tại 15 đô la","Best price":"Mức giá tốt nhất","Mon–Thu":"Thứ Hai–Thứ Năm","1.5 (elastic)":"1,5 (co giãn)","$10":"10 đô la","Friday":"Thứ Sáu","0.2 (inelastic)":"0,2 (kém co giãn)","$15":"15 đô la","Saturday":"Thứ Bảy","0.13 (inelastic)":"0,13 (kém co giãn)","Sunday":"Chủ Nhật","0.67 (inelastic)":"0,67 (kém co giãn)","Either: $1,500 at both prices":"Cả hai: 1.500 đô la ở cả hai mức giá","Weekly revenue: $10 weekdays and $15 weekends = $19,250. $10 every day = $17,000. $15 every day = $14,250. Weekend demand is less elastic because cheaper substitutes are scarcer and a night out is seen more as a need.":"Doanh thu hằng tuần: 10 đô la các ngày trong tuần và 15 đô la cuối tuần = 19.250 đô la. 10 đô la mọi ngày = 17.000 đô la. 15 đô la mọi ngày = 14.250 đô la. Cầu cuối tuần kém co giãn hơn vì hàng thay thế rẻ hơn khan hiếm hơn và một buổi đi chơi tối được xem nhiều hơn là một nhu cầu.","YED, PES and PED (numbers from your notes)":"YED, PES và PED (các số từ ghi chú của bạn)","Question":"Câu hỏi","Working":"Cách tính","Answer":"Đáp án","YED, coffee beans: income $4,000 → $4,400; 150 → 165":"YED, hạt cà phê: thu nhập 4.000 → 4.400 đô la; 150 → 165","+1.0: normal good, unitary YED":"+1,0: hàng thông thường, YED bằng đơn vị","PES, computers: $600 → $800; 1.0m → 1.1m (short run)":"PES, máy tính: 600 → 800 đô la; 1,0 triệu → 1,1 triệu (ngắn hạn)","0.3, inelastic":"0,3, kém co giãn","PES, computers: long run output 1.8m":"PES, máy tính: sản lượng dài hạn 1,8 triệu","2.4, elastic":"2,4, co giãn","PES: price 50 → 90 TL; supply 60 → 100":"PES: giá 50 → 90 TL; cung 60 → 100","0.83, inelastic":"0,83, kém co giãn","PES: price 10 → 50 TL; supply 10 → 20":"PES: giá 10 → 50 TL; cung 10 → 20","0.25, inelastic":"0,25, kém co giãn","PES: price 100 → 50; supply unchanged":"PES: giá 100 → 50; cung không đổi","0, perfectly inelastic":"0, hoàn toàn không co giãn","PES: price 100 → 110; supply 10 → 30":"PES: giá 100 → 110; cung 10 → 30","20, elastic":"20, co giãn","PES of coffee beans":"PES của hạt cà phê","Period":"Giai đoạn","Row 1 → 2":"Dòng 1 → 2","Row 2 → 3":"Dòng 2 → 3","Row 3 → 4":"Dòng 3 → 4","Every value is below 1, so supply is inelastic: crops take a season to grow and stock is hard to adjust. A small shock to demand or harvest therefore causes large price swings.":"Mọi giá trị đều dưới 1, nên cung kém co giãn: cây trồng cần một mùa để lớn và hàng tồn kho khó điều chỉnh. Vì vậy một cú sốc nhỏ về cầu hoặc thu hoạch gây ra biến động giá lớn.","HL table: PES and PED between each price (change from the previous row)":"Bảng HL: PES và PED giữa mỗi mức giá (thay đổi so với dòng trước)","Price":"Giá","Equilibrium is at $25 (Qs = Qd = 7,500). PES falls as price rises (resources get scarcer) and PED grows in size at higher prices, so the straight lines in diagrams are simplifications.":"Cân bằng tại 25 đô la (Qs = Qd = 7.500). PES giảm khi giá tăng (nguồn lực khan hiếm hơn) và PED lớn hơn ở mức giá cao hơn, nên các đường thẳng trong sơ đồ chỉ là sự đơn giản hóa.","Marginal product table":"Bảng sản phẩm cận biên","Workers":"Lao động","MP peaks at the 3rd worker (21), where diminishing marginal returns begin. AP peaks at 3 workers (17) and MP cuts it from below afterwards.":"MP đạt đỉnh ở lao động thứ 3 (21), nơi năng suất cận biên giảm dần bắt đầu. AP đạt đỉnh ở 3 lao động (17) và MP cắt nó từ bên dưới sau đó.","The calculations that appear in IB Economics papers. Show your working and state the sign of elasticity results.":"Các phép tính xuất hiện trong đề thi Kinh tế học IB. Hãy trình bày cách làm và nêu dấu của kết quả độ co giãn.","Measure":"Chỉ tiêu","Formula":"Công thức","Reading it":"Cách hiểu","Definitions worth learning word for word. Examiners reward precise definitions.":"Các định nghĩa đáng học thuộc từng chữ. Giám khảo thưởng điểm cho định nghĩa chính xác.","Term":"Thuật ngữ","Unit":"Phần","Last synced with your ECON folder on":"Đồng bộ lần cuối với thư mục ECON của bạn vào","30 November 2026":"30 tháng 11, 2026",". Material for next year goes in a later sync.":". Tài liệu cho năm sau sẽ được đồng bộ ở lần sau.","Synced into the app":"Đã đồng bộ vào ứng dụng","Class file":"Tệp của lớp","Used in":"Dùng trong","Unit 1: factors of production, key terms":"Phần 1: các yếu tố sản xuất, thuật ngữ chính","Unit 1: nine economic concepts":"Phần 1: chín khái niệm kinh tế","Unit 1: methodology, schools of thought":"Phần 1: phương pháp luận, các trường phái tư tưởng","Types of goods table (filled in)":"Bảng các loại hàng hóa (đã điền)","PED topic, practice bank":"Chủ đề PED, ngân hàng bài tập","YED topic":"Chủ đề YED","PES topic, practice bank":"Chủ đề PES, ngân hàng bài tập","Elasticity notes, HL table":"Ghi chú về độ co giãn, bảng HL","Price mechanism; demand and supply shifters":"Cơ chế giá; các yếu tố dịch chuyển cung và cầu","Demand and supply shifters":"Các yếu tố dịch chuyển cung và cầu","Ad valorem tax; tax incidence":"Thuế theo giá trị; gánh nặng thuế","Price floor example, price ceiling":"Ví dụ giá sàn, giá trần","Veblen topic":"Chủ đề Veblen","Types of goods: merit goods":"Các loại hàng hóa: hàng hóa khuyến dụng","Asymmetric information (HL)":"Thông tin bất cân xứng (HL)","Equity (HL)":"Công bằng (HL)","Monopolistic competition (HL)":"Cạnh tranh độc quyền (HL)","Production topic (HL), practice bank":"Chủ đề sản xuất (HL), ngân hàng bài tập","Revenue topic (HL)":"Chủ đề doanh thu (HL)","Perfect competition exam question":"Câu hỏi thi về cạnh tranh hoàn hảo","Not synced yet":"Chưa được đồng bộ","Why":"Lý do","Overlaps topics already covered; not read line by line":"Trùng với các chủ đề đã có; chưa đọc từng dòng","Question banks; could become a quiz":"Ngân hàng câu hỏi; có thể thành bài kiểm tra","Activity sheets and a case study; not yet turned into questions":"Phiếu hoạt động và một nghiên cứu tình huống; chưa chuyển thành câu hỏi","Scanned or image-only, no text to read":"Bản quét hoặc chỉ có hình ảnh, không có văn bản để đọc","History (World War 1) assessment, not economics":"Bài đánh giá Lịch sử (Thế chiến thứ nhất), không phải kinh tế học","Vietnamese advertising assignment, not economics":"Bài tập quảng cáo bằng tiếng Việt, không phải kinh tế học","Opportunity cost":"Chi phí cơ hội","The next best alternative given up when a choice is made.":"Lựa chọn thay thế tốt nhất tiếp theo bị bỏ qua khi đưa ra một quyết định.","Ceteris paribus":"Các yếu tố khác không đổi","Holding all other variables constant.":"Giữ nguyên tất cả các biến số khác.","Scarcity":"Khan hiếm","Limited resources against unlimited wants.":"Nguồn lực có hạn so với những mong muốn vô hạn.","Allocative efficiency":"Hiệu quả phân bổ","Resources produce the mix of goods society values most: MB = MC (or P = MC).":"Nguồn lực tạo ra cơ cấu hàng hóa mà xã hội đánh giá cao nhất: MB = MC (hoặc P = MC).","Productive efficiency":"Hiệu quả sản xuất","Producing at the lowest possible average cost: MC = ATC at minimum.":"Sản xuất ở chi phí bình quân thấp nhất có thể: MC = ATC tại điểm thấp nhất.","Deadweight loss":"Tổn thất vô ích","Loss of total surplus when output differs from the efficient level.":"Phần mất đi của tổng thặng dư khi sản lượng khác mức hiệu quả.","Externality":"Ngoại tác","A cost or benefit to a third party not reflected in the price.":"Chi phí hoặc lợi ích đối với bên thứ ba không được phản ánh trong giá.","Merit good":"Hàng hóa khuyến dụng","A good that is under-consumed because people do not fully appreciate its benefits (education).":"Hàng hóa bị tiêu dùng thiếu vì người ta không đánh giá đầy đủ lợi ích của nó (giáo dục).","Demerit good":"Hàng hóa phi khuyến dụng","A good that is over-consumed because of external costs (tobacco).":"Hàng hóa bị tiêu dùng quá mức vì chi phí ngoại tác (thuốc lá).","Public good":"Hàng hóa công cộng","Non-rivalrous and non-excludable; the free-rider problem means the market underprovides it.":"Không cạnh tranh và không loại trừ; vấn đề người ăn theo khiến thị trường cung cấp thiếu.","Normal profit":"Lợi nhuận bình thường","The minimum reward needed to keep a firm in an industry; TR = TC including opportunity costs.":"Mức thù lao tối thiểu cần để giữ một doanh nghiệp trong ngành; TR = TC bao gồm chi phí cơ hội.","Supernormal profit":"Lợi nhuận siêu ngạch","Profit above normal profit; TR > TC.":"Lợi nhuận vượt mức lợi nhuận bình thường; TR > TC.","Barriers to entry":"Rào cản gia nhập","Factors that stop new firms entering a market (economies of scale, patents, control of resources).":"Các yếu tố ngăn doanh nghiệp mới tham gia thị trường (tính kinh tế theo quy mô, bằng sáng chế, kiểm soát nguồn lực).","Price discrimination":"Phân biệt giá","Charging different prices to different consumers for the same good, not for cost reasons.":"Tính giá khác nhau cho những người tiêu dùng khác nhau đối với cùng một hàng hóa, không phải vì lý do chi phí.","Economies of scale":"Tính kinh tế theo quy mô","Falling long-run average cost as output rises.":"Chi phí bình quân dài hạn giảm khi sản lượng tăng.","The total market value of final goods and services produced within a country in a year.":"Tổng giá trị thị trường của hàng hóa và dịch vụ cuối cùng được sản xuất trong một quốc gia trong một năm.","GDP plus net income from abroad.":"GDP cộng thu nhập ròng từ nước ngoài.","Aggregate demand":"Tổng cầu","Total planned spending: AD = C + I + G + (X − M).":"Tổng chi tiêu theo kế hoạch: AD = C + I + G + (X − M).","Full employment":"Toàn dụng lao động","Output at which there is only frictional, structural and seasonal unemployment (no cyclical).":"Mức sản lượng chỉ còn thất nghiệp ma sát, cơ cấu và mùa vụ (không có thất nghiệp chu kỳ).","Natural rate of unemployment":"Tỷ lệ thất nghiệp tự nhiên","The rate at which only non-cyclical unemployment exists.":"Tỷ lệ mà tại đó chỉ tồn tại thất nghiệp không do chu kỳ.","Cyclical unemployment":"Thất nghiệp chu kỳ","Unemployment due to insufficient aggregate demand.":"Thất nghiệp do tổng cầu không đủ.","Demand-pull inflation":"Lạm phát do cầu kéo","Rising price level caused by excess aggregate demand.":"Mức giá tăng do tổng cầu quá mức.","Cost-push inflation":"Lạm phát do chi phí đẩy","Rising price level caused by higher production costs (SRAS shifts left).":"Mức giá tăng do chi phí sản xuất cao hơn (SRAS dịch sang trái).","Stagflation":"Lạm phát đình trệ","High unemployment together with high inflation.":"Thất nghiệp cao cùng với lạm phát cao.","Fiscal policy":"Chính sách tài khóa","Government use of spending and taxation to influence AD.":"Chính phủ dùng chi tiêu và thuế để tác động đến AD.","Monetary policy":"Chính sách tiền tệ","Central bank use of interest rates and the money supply to influence AD.":"Ngân hàng trung ương dùng lãi suất và cung tiền để tác động đến AD.","Supply-side policy":"Chính sách phía cung","Policies that raise potential output (education, deregulation, investment).":"Các chính sách nâng sản lượng tiềm năng (giáo dục, bãi bỏ quy định, đầu tư).","Automatic stabilisers":"Các bộ ổn định tự động","Taxes and benefits that dampen the cycle without new decisions.":"Thuế và trợ cấp làm dịu chu kỳ mà không cần quyết định mới.","Crowding out":"Hiệu ứng lấn át","Government borrowing raising interest rates and reducing private investment.":"Vay mượn của chính phủ làm tăng lãi suất và giảm đầu tư tư nhân.","Comparative advantage":"Lợi thế so sánh","Producing a good at a lower opportunity cost than another country.":"Sản xuất một hàng hóa với chi phí cơ hội thấp hơn quốc gia khác.","Protectionism":"Chủ nghĩa bảo hộ","Government policies that limit imports to protect domestic industry.":"Các chính sách của chính phủ hạn chế nhập khẩu để bảo vệ ngành công nghiệp trong nước.","Quota":"Hạn ngạch","A physical limit on the quantity of a good that can be imported.":"Giới hạn về lượng của một hàng hóa có thể được nhập khẩu.","Balance of payments":"Cán cân thanh toán","A record of all transactions between a country and the rest of the world.":"Bản ghi tất cả giao dịch giữa một quốc gia và phần còn lại của thế giới.","Appreciation / depreciation":"Lên giá / mất giá (đồng tiền)","A rise / fall in the value of a currency in a floating system.":"Giá trị của một đồng tiền tăng (lên giá) / giảm (mất giá) trong chế độ tỷ giá thả nổi.","Marshall–Lerner condition":"Điều kiện Marshall–Lerner","Depreciation improves the current account if PEDx + PEDm > 1.":"Việc đồng tiền mất giá cải thiện cán cân vãng lai nếu PEDx + PEDm > 1.","Human Development Index":"Chỉ số Phát triển Con người (HDI)","Composite of life expectancy, education and income per capita.":"Chỉ số tổng hợp của tuổi thọ, giáo dục và thu nhập bình quân đầu người.","Foreign direct investment":"Đầu tư trực tiếp nước ngoài","Investment by a firm in operations in another country.":"Đầu tư của một doanh nghiệp vào hoạt động ở quốc gia khác.","Positive statement":"Phát biểu thực chứng","An objective statement that can be tested as true or false with evidence.":"Phát biểu khách quan có thể được kiểm tra là đúng hay sai bằng bằng chứng.","Normative statement":"Phát biểu chuẩn tắc","A value judgement that cannot be proved true or false.":"Nhận định giá trị không thể được chứng minh là đúng hay sai.","Empirical evidence":"Bằng chứng thực nghiệm","Evidence gathered by observing behaviour and using data, used to test economic theories.":"Bằng chứng thu thập qua quan sát hành vi và dùng dữ liệu, dùng để kiểm tra các lý thuyết kinh tế.","Factors of production":"Các yếu tố sản xuất","Land, labour, capital and entrepreneurship: the resources used to produce goods and services.":"Đất đai, lao động, vốn và tinh thần kinh doanh: các nguồn lực dùng để sản xuất hàng hóa và dịch vụ.","Value added":"Giá trị gia tăng","The difference between the cost of inputs and the price of the final output.":"Chênh lệch giữa chi phí đầu vào và giá của sản phẩm cuối cùng.","Price mechanism":"Cơ chế giá","The system where demand and supply determine prices and allocate resources. Functions: signalling, incentive, rationing.":"Hệ thống trong đó cầu và cung xác định giá và phân bổ nguồn lực. Chức năng: tín hiệu, khuyến khích, phân phối.","Specific tax":"Thuế đặc định","A fixed sum per unit sold; shifts supply up in parallel.":"Khoản cố định trên mỗi đơn vị bán ra; làm cung dịch lên song song.","Ad valorem tax":"Thuế theo giá trị","A percentage of the price; pivots the supply curve upward.":"Tỷ lệ phần trăm của giá; làm đường cung xoay lên.","Tax incidence":"Gánh nặng thuế","How the burden of a tax is shared between consumers and producers.":"Cách gánh nặng của một loại thuế được chia giữa người tiêu dùng và nhà sản xuất.","Veblen good":"Hàng Veblen","A super-luxury good whose demand rises as its price rises because of snob value.":"Hàng siêu xa xỉ có cầu tăng khi giá tăng vì giá trị phô trương.","Asymmetric information":"Thông tin bất cân xứng","One party in a transaction has more or better information than the other.":"Một bên trong giao dịch có thông tin nhiều hơn hoặc tốt hơn bên kia.","Adverse selection":"Lựa chọn bất lợi","Hidden characteristics before a contract: bad quality or high risk drives out the good.":"Đặc điểm ẩn trước hợp đồng: chất lượng xấu hoặc rủi ro cao đẩy cái tốt ra khỏi thị trường.","Moral hazard":"Rủi ro đạo đức","Hidden actions after a contract: one party takes more risk because another bears the cost.":"Hành động ẩn sau hợp đồng: một bên chấp nhận rủi ro nhiều hơn vì bên kia gánh chi phí.","Signalling":"Phát tín hiệu","The informed party acts to show quality (warranty, qualification).":"Bên có thông tin hành động để thể hiện chất lượng (bảo hành, bằng cấp).","Screening":"Sàng lọc","The uninformed party acts to find out quality or risk (deductible, background checks).":"Bên thiếu thông tin hành động để tìm hiểu chất lượng hoặc rủi ro (mức miễn thường, kiểm tra lý lịch).","Monopolistic competition":"Cạnh tranh độc quyền","Many firms, differentiated products, no barriers to entry; some price-making power.":"Nhiều doanh nghiệp, sản phẩm khác biệt, không có rào cản gia nhập; có chút quyền định giá.","Total, average and marginal product":"Sản phẩm tổng, bình quân và cận biên","TP = total output; AP = TP ÷ variable input; MP = extra output from one more unit of input.":"TP = tổng sản lượng; AP = TP ÷ đầu vào biến đổi; MP = sản lượng thêm từ một đơn vị đầu vào nữa.","Law of diminishing returns":"Quy luật năng suất cận biên giảm dần","Adding variable factors to a fixed factor eventually reduces MP and then AP.":"Thêm các yếu tố biến đổi vào một yếu tố cố định cuối cùng làm giảm MP rồi AP.","Marginal revenue":"Doanh thu cận biên","The extra revenue from selling one more unit; lies below AR when demand slopes down.":"Doanh thu thêm từ việc bán thêm một đơn vị; nằm dưới AR khi cầu dốc xuống.","|PED|>1 elastic, <1 inelastic":"|PED|>1 co giãn, <1 kém co giãn","%ΔQd ÷ %Δincome":"%ΔQd ÷ %Δthu nhập","Positive = normal, negative = inferior, >1 luxury":"Dương = hàng thông thường, âm = hàng hóa thứ cấp, >1 xa xỉ","%ΔQd of A ÷ %ΔP of B":"%ΔQd của A ÷ %ΔP của B","Positive = substitutes, negative = complements":"Dương = hàng thay thế, âm = hàng bổ sung","Higher with spare capacity, stocks, time":"Cao hơn khi có công suất dư thừa, hàng tồn kho, thời gian","Total revenue":"Tổng doanh thu","Price × quantity":"Giá × lượng","Maximised where PED = 1 on a straight line":"Lớn nhất tại PED = 1 trên đường thẳng","Consumer surplus":"Thặng dư người tiêu dùng","½ × base × height":"½ × đáy × cao","Triangle under D, above price":"Tam giác dưới D, trên mức giá","Real GDP":"GDP thực","Nominal GDP ÷ price index × 100":"GDP danh nghĩa ÷ chỉ số giá × 100","Removes the effect of inflation":"Loại bỏ tác động của lạm phát","GDP growth":"Tăng trưởng GDP","Use real GDP":"Dùng GDP thực","Inflation rate":"Tỷ lệ lạm phát","CPI base year = 100":"Năm cơ sở CPI = 100","Unemployment rate":"Tỷ lệ thất nghiệp","Unemployed ÷ labour force × 100":"Số người thất nghiệp ÷ lực lượng lao động × 100","Labour force = employed + unemployed":"Lực lượng lao động = có việc + thất nghiệp","Multiplier":"Số nhân","Gini coefficient":"Hệ số Gini","0 = equality, 1 = total inequality":"0 = bình đẳng, 1 = bất bình đẳng hoàn toàn","Current account":"Cán cân vãng lai","(X − M) + net income + net transfers":"(X − M) + thu nhập ròng + chuyển giao ròng","Balance of goods, services, income, transfers":"Cán cân hàng hóa, dịch vụ, thu nhập, chuyển giao","Terms of trade":"Điều kiện thương mại","Export price index ÷ import price index × 100":"Chỉ số giá xuất khẩu ÷ chỉ số giá nhập khẩu × 100","Rise = favourable":"Tăng = thuận lợi","Profit":"Lợi nhuận","Max where MC = MR":"Cực đại tại MC = MR","Average product":"Sản phẩm bình quân","TP ÷ variable input":"TP ÷ đầu vào biến đổi","Peaks where MP = AP":"Đạt đỉnh tại MP = AP","Marginal product":"Sản phẩm cận biên","ΔTP ÷ Δvariable input":"ΔTP ÷ Δđầu vào biến đổi","Rises, then falls (diminishing returns)":"Tăng rồi giảm (năng suất cận biên giảm dần)","MR = 0 where TR is at a maximum":"MR = 0 khi TR đạt cực đại","Tax revenue":"Thu thuế","Tax per unit × quantity after the tax":"Thuế trên mỗi đơn vị × lượng sau thuế","Consumer share = rise in price × new quantity":"Phần người tiêu dùng chịu = mức tăng giá × lượng mới","Price × tax rate":"Giá × thuế suất","Tax per unit rises with price":"Thuế trên mỗi đơn vị tăng theo giá","Exchange rate change":"Thay đổi tỷ giá","(new − old) ÷ old × 100":"(mới − cũ) ÷ cũ × 100","Positive = appreciation":"Dương = lên giá","Shift in demand (right = increase)":"Dịch chuyển của cầu (sang phải = tăng)","Shift in supply (right = increase)":"Dịch chuyển của cung (sang phải = tăng)","Demand shift (right = increase)":"Dịch chuyển của cầu (sang phải = tăng)","Supply shift (right = increase)":"Dịch chuyển của cung (sang phải = tăng)","Market price":"Giá thị trường","Economic growth (% more resources)":"Tăng trưởng kinh tế (% thêm nguồn lực)","Capital goods":"Hàng hóa tư bản","Consumer goods":"Hàng tiêu dùng","Steepness of the curve":"Độ dốc của đường","Price change from $50 (%)":"Thay đổi giá từ 50 đô la (%)","YED of the good":"YED của hàng hóa","Income change (%)":"Thay đổi thu nhập (%)","Income (Y)":"Thu nhập (Y)","Quantity demanded":"Lượng cầu","Snob value":"Giá trị phô trương","Maximum price":"Giá tối đa","Minimum price":"Giá tối thiểu","Tax per unit":"Thuế trên mỗi đơn vị","Tax rate (%)":"Thuế suất (%)","S + tax":"S + thuế","Subsidy per unit":"Trợ cấp trên mỗi đơn vị","External cost per unit":"Chi phí ngoại tác trên mỗi đơn vị","External benefit per unit":"Lợi ích ngoại tác trên mỗi đơn vị","Fixed costs":"Chi phí cố định","Costs ($)":"Chi phí ($)","Average cost ($)":"Chi phí bình quân ($)","Workers (variable input)":"Lao động (đầu vào biến đổi)","Output per worker":"Sản lượng trên mỗi lao động","Quantity sold":"Lượng bán","Price / revenue":"Giá / doanh thu","Costs / revenue ($)":"Chi phí / doanh thu ($)","Demand for the firm's product":"Cầu về sản phẩm của doanh nghiệp","Price / costs":"Giá / chi phí","Marginal cost":"Chi phí cận biên","AD shift (right = increase)":"Dịch chuyển của AD (sang phải = tăng)","Price level":"Mức giá","SRAS shift (right = increase)":"Dịch chuyển của SRAS (sang phải = tăng)","Marginal propensity to consume":"Xu hướng tiêu dùng cận biên","Rise in investment (ΔI)":"Tăng đầu tư (ΔI)","National income (Y)":"Thu nhập quốc dân (Y)","Aggregate expenditure":"Chi tiêu tổng hợp","Move through time":"Di chuyển theo thời gian","Unemployment rate (%)":"Tỷ lệ thất nghiệp (%)","Expected inflation (%)":"Lạm phát kỳ vọng (%)","Unemployment (%)":"Thất nghiệp (%)","Inflation (%)":"Lạm phát (%)","Cumulative % of households":"% hộ gia đình lũy kế","Cumulative % of income":"% thu nhập lũy kế","Lorenz curve":"Đường Lorenz","Tariff per unit":"Thuế quan trên mỗi đơn vị","Quota (maximum imports)":"Hạn ngạch (nhập khẩu tối đa)","S + quota":"S + hạn ngạch","Demand for currency (right = increase)":"Cầu về tiền tệ (sang phải = tăng)","Supply of currency (right = increase)":"Cung tiền tệ (sang phải = tăng)","Quantity of currency":"Lượng tiền tệ","Exchange rate":"Tỷ giá hối đoái","Time since depreciation":"Thời gian kể từ khi đồng tiền mất giá","Current account balance":"Cán cân vãng lai","Balance = 0":"Cán cân = 0","New demand":"Cầu mới","New supply":"Cung mới","Supply after the tax":"Cung sau thuế","Supply after the subsidy":"Cung sau trợ cấp","Supply plus the quota":"Cung cộng hạn ngạch","World price":"Giá thế giới","World price plus the tariff":"Giá thế giới cộng thuế quan","Marginal private benefit":"Lợi ích tư nhân cận biên","Marginal social benefit":"Lợi ích xã hội cận biên","Marginal private and social benefit":"Lợi ích tư nhân và xã hội cận biên","Marginal private cost":"Chi phí tư nhân cận biên","Marginal social cost":"Chi phí xã hội cận biên","Marginal social cost = marginal private cost":"Chi phí xã hội cận biên = chi phí tư nhân cận biên","Average total cost":"Tổng chi phí bình quân","Average variable cost":"Chi phí biến đổi bình quân","Average revenue = demand":"Doanh thu bình quân = cầu","Demand = average revenue":"Cầu = doanh thu bình quân","Price = marginal revenue = average revenue":"Giá = doanh thu cận biên = doanh thu bình quân","Marginal cost = average total cost":"Chi phí cận biên = tổng chi phí bình quân","Original aggregate demand":"Tổng cầu ban đầu","New aggregate demand":"Tổng cầu mới","Aggregate supply":"Tổng cung","Short-run aggregate supply":"Tổng cung ngắn hạn","New short-run aggregate supply":"Tổng cung ngắn hạn mới","Long-run aggregate supply":"Tổng cung dài hạn","Short-run Phillips curve":"Đường Phillips ngắn hạn","Original short-run Phillips curve":"Đường Phillips ngắn hạn ban đầu","New short-run Phillips curve":"Đường Phillips ngắn hạn mới","Long-run Phillips curve":"Đường Phillips dài hạn","Real GDP over time":"GDP thực theo thời gian","Long-run trend":"Xu hướng dài hạn","Line of equality":"Đường bình đẳng","Original aggregate expenditure":"Chi tiêu tổng hợp ban đầu","New aggregate expenditure":"Chi tiêu tổng hợp mới","45° line (expenditure = income)":"Đường 45° (chi tiêu = thu nhập)","Long-run average cost":"Chi phí bình quân dài hạn","Short-run average cost (small plant)":"Chi phí bình quân ngắn hạn (nhà máy nhỏ)","Short-run average cost (medium plant)":"Chi phí bình quân ngắn hạn (nhà máy vừa)","Short-run average cost (large plant)":"Chi phí bình quân ngắn hạn (nhà máy lớn)","Current account balance of zero":"Cán cân vãng lai bằng không","Production possibility curve":"Đường giới hạn khả năng sản xuất","Original production possibility curve":"Đường giới hạn khả năng sản xuất ban đầu","New production possibility curve":"Đường giới hạn khả năng sản xuất mới","Total revenue (price × quantity)":"Tổng doanh thu (giá × lượng)","Producer surplus":"Thặng dư nhà sản xuất","Surplus or shortage at this price":"Dư thừa hoặc thiếu hụt ở mức giá này","Shortage (quantity demanded − quantity supplied)":"Thiếu hụt (lượng cầu − lượng cung)","Surplus (quantity supplied − quantity demanded)":"Dư thừa (lượng cung − lượng cầu)","Burden on consumers":"Gánh nặng của người tiêu dùng","Burden on producers":"Gánh nặng của nhà sản xuất","Government spending on the subsidy":"Chi tiêu của chính phủ cho trợ cấp","Welfare loss":"Tổn thất phúc lợi","Abnormal profit":"Lợi nhuận bất thường","Area A: gap between equality and the Lorenz curve":"Diện tích A: khoảng cách giữa đường bình đẳng và đường Lorenz","Tariff revenue":"Thu thuế quan","Quota rent":"Tô hạn ngạch","Point on the graph. Dotted lines show its price and quantity on the axes":"Điểm trên đồ thị. Các đường chấm cho thấy giá và lượng của nó trên các trục","Marked point":"Điểm được đánh dấu","The nine economic concepts":"Chín khái niệm kinh tế","The IB Diploma Programme frames the whole course around nine key concepts: scarcity, choice, efficiency, equity, economic well-being, sustainability, change, interdependence and intervention.":"Chương trình IB Diploma xây dựng toàn bộ môn học quanh chín khái niệm chính: khan hiếm, lựa chọn, hiệu quả, công bằng, phúc lợi kinh tế, tính bền vững, sự thay đổi, sự phụ thuộc lẫn nhau và sự can thiệp.","Distinguish between equity and equality.":"Phân biệt giữa công bằng (equity) và bình đẳng (equality).","Equality describes similar economic outcomes for different people or groups. Equity is about fairness, a normative concept, so an equitable outcome may involve unequal outcomes if they are judged fair (for example, more help for those with greater need).":"Bình đẳng mô tả những kết quả kinh tế giống nhau giữa các cá nhân hoặc nhóm. Công bằng nói về sự đúng đắn, là một khái niệm chuẩn tắc, nên một kết quả công bằng có thể bao gồm những kết quả không bằng nhau nếu chúng được xem là hợp lý (ví dụ: hỗ trợ nhiều hơn cho người có nhu cầu lớn hơn).","Economic methodology: positive and normative":"Phương pháp luận kinh tế: thực chứng và chuẩn tắc","Economics is a social science. Economists test theories with empirical evidence (observed data and behaviour) because they cannot run controlled laboratory experiments on whole economies.":"Kinh tế học là một ngành khoa học xã hội. Các nhà kinh tế kiểm tra lý thuyết bằng bằng chứng thực nghiệm (dữ liệu và hành vi quan sát được) vì họ không thể tiến hành thí nghiệm có kiểm soát trong phòng thí nghiệm trên cả nền kinh tế.","Explain how economists use economic methodology to study the subject. [4]":"Giải thích cách các nhà kinh tế sử dụng phương pháp luận kinh tế để nghiên cứu môn học. [4]","Economists form hypotheses from theories and models, then test them with empirical evidence such as past data. For example, to test whether better healthcare raises labour productivity they compare healthcare spending with productivity over time. They hold other factors constant (ceteris paribus) to isolate the effect of one variable.":"Các nhà kinh tế đưa ra giả thuyết từ lý thuyết và mô hình, rồi kiểm tra bằng bằng chứng thực nghiệm như dữ liệu quá khứ. Ví dụ, để kiểm tra liệu chăm sóc sức khỏe tốt hơn có làm tăng năng suất lao động hay không, họ so sánh chi tiêu cho y tế với năng suất theo thời gian. Họ giữ các yếu tố khác không đổi (ceteris paribus) để tách riêng tác động của một biến số.","Schools of economic thought":"Các trường phái tư tưởng kinh tế","Different economists have given different answers to how much the state should do and how people behave. Knowing the schools helps you evaluate policy.":"Các nhà kinh tế khác nhau đã đưa ra những câu trả lời khác nhau về việc nhà nước nên làm bao nhiêu và con người hành xử như thế nào. Hiểu các trường phái giúp bạn đánh giá chính sách.","Explain two factors that might prevent consumers from making rational economic decisions. [4]":"Giải thích hai yếu tố có thể ngăn người tiêu dùng đưa ra quyết định kinh tế hợp lý. [4]","1) Imperfect information: consumers may not know the true quality or price of products and so cannot maximise utility. 2) Habit, social pressure or emotion (behavioural factors): people follow trends, are nudged by marketing or choose impulsively, which departs from the rational model.":"1) Thông tin không hoàn hảo: người tiêu dùng có thể không biết chất lượng hoặc giá thực của sản phẩm nên không thể tối đa hóa thỏa dụng. 2) Thói quen, áp lực xã hội hoặc cảm xúc (yếu tố hành vi): con người chạy theo xu hướng, bị tiếp thị tác động hoặc mua theo cảm hứng, điều này lệch khỏi mô hình hợp lý.","Factors of production, needs and wants":"Các yếu tố sản xuất, nhu cầu và mong muốn","Factors of production are the collective term for the resources used to produce goods and services: land, labour, capital and entrepreneurship.":"Các yếu tố sản xuất là thuật ngữ chung chỉ các nguồn lực dùng để sản xuất hàng hóa và dịch vụ: đất đai, lao động, vốn và tinh thần kinh doanh.","Define value added and give an example.":"Định nghĩa giá trị gia tăng và cho một ví dụ.","Value added is the difference between the cost of the factor inputs and the price at which the final output is sold. A bakery that buys flour and ingredients for $2 and sells a loaf for $5 adds $3 of value.":"Giá trị gia tăng là chênh lệch giữa chi phí các yếu tố đầu vào và giá bán của sản phẩm cuối cùng. Một tiệm bánh mua bột và nguyên liệu với giá 2 đô la và bán một ổ bánh giá 5 đô la tạo ra 3 đô la giá trị gia tăng.","Demand curve":"Đường cầu","A demand curve shows the quantity of a good consumers are willing and able to buy at each price, ceteris paribus (all else equal).":"Đường cầu cho biết lượng hàng hóa mà người tiêu dùng sẵn sàng và có khả năng mua ở mỗi mức giá, ceteris paribus (các yếu tố khác không đổi).","The curve slopes downward: this is the law of demand. A price change causes a movement along the curve (a change in quantity demanded). A change in anything else shifts the whole curve (a change in demand).":"Đường cầu dốc xuống: đây là luật cầu. Thay đổi giá gây ra sự di chuyển dọc theo đường cầu (thay đổi lượng cầu). Thay đổi bất kỳ yếu tố nào khác làm dịch chuyển cả đường cầu (thay đổi cầu).","Draw axes: price (P) up, quantity (Q) along.":"Vẽ trục: giá (P) theo chiều dọc, lượng (Q) theo chiều ngang.","Draw a downward-sloping line and label it D.":"Vẽ một đường dốc xuống và ghi nhãn là D.","To show a shift, draw a second parallel curve D₁ and add an arrow.":"Để thể hiện sự dịch chuyển, vẽ đường cầu thứ hai song song D₁ và thêm mũi tên.","Shifters to memorise: income, tastes, price of substitutes and complements, population, expectations (YED and XED explain the direction).":"Các yếu tố dịch chuyển cần nhớ: thu nhập, thị hiếu, giá hàng hóa thay thế và bổ sung, dân số, kỳ vọng (YED và XED giải thích chiều dịch chuyển).","Never say a price change \"shifts\" demand. It moves you along the curve.":"Đừng bao giờ nói thay đổi giá làm \"dịch chuyển\" cầu. Nó chỉ di chuyển bạn dọc theo đường cầu.","Explain why a fall in the price of coffee shifts the demand curve for tea.":"Giải thích vì sao giá cà phê giảm làm dịch chuyển đường cầu của trà.","Coffee and tea are substitutes (positive XED). A lower coffee price makes consumers switch away from tea, so demand for tea falls at every price and D shifts left.":"Cà phê và trà là hàng hóa thay thế (XED dương). Giá cà phê thấp hơn khiến người tiêu dùng chuyển khỏi trà, nên cầu trà giảm ở mọi mức giá và D dịch sang trái.","Supply curve":"Đường cung","A supply curve shows the quantity producers are willing and able to sell at each price, ceteris paribus.":"Đường cung cho biết lượng hàng mà nhà sản xuất sẵn sàng và có khả năng bán ở mỗi mức giá, ceteris paribus.","It slopes upward because higher prices cover higher marginal costs and make production more profitable. A change in price moves along the curve. A change in costs, technology, taxes, subsidies or number of firms shifts it.":"Đường cung dốc lên vì giá cao hơn bù đắp được chi phí cận biên cao hơn và làm sản xuất có lợi hơn. Thay đổi giá làm di chuyển dọc theo đường. Thay đổi chi phí, công nghệ, thuế, trợ cấp hoặc số lượng doanh nghiệp làm dịch chuyển đường cung.","Draw an upward-sloping line labelled S.":"Vẽ một đường dốc lên và ghi nhãn là S.","An increase in supply shifts it right (down). A decrease shifts it left (up).":"Cung tăng làm đường dịch sang phải (xuống). Cung giảm làm đường dịch sang trái (lên).","Think \"right = increase in supply\", never \"up\" or \"down\".":"Hãy nghĩ \"sang phải = cung tăng\", đừng bao giờ nói \"lên\" hay \"xuống\".","Lower costs of production shift S right. An indirect tax shifts S up by the amount of the tax.":"Chi phí sản xuất thấp hơn làm S dịch sang phải. Thuế gián thu làm S dịch lên đúng bằng mức thuế.","Distinguish between a change in supply and a change in quantity supplied.":"Phân biệt giữa thay đổi cung và thay đổi lượng cung.","A change in quantity supplied is a movement along S caused only by a change in the good's own price. A change in supply is a shift of S caused by non-price factors such as costs, technology, taxes or subsidies.":"Thay đổi lượng cung là sự di chuyển dọc theo S chỉ do thay đổi giá của chính hàng hóa đó. Thay đổi cung là sự dịch chuyển của S do các yếu tố phi giá như chi phí, công nghệ, thuế hoặc trợ cấp.","Market equilibrium":"Cân bằng thị trường","Equilibrium is the price and quantity where quantity demanded equals quantity supplied. The market clears with no shortage or surplus.":"Cân bằng là mức giá và lượng mà tại đó lượng cầu bằng lượng cung. Thị trường được giải phóng, không có thiếu hụt hay dư thừa.","Above equilibrium there is a surplus, which pushes the price down. Below it there is a shortage, which pushes the price up. The price mechanism signals and rations scarce resources.":"Trên mức cân bằng có dư thừa, đẩy giá xuống. Dưới mức cân bằng có thiếu hụt, đẩy giá lên. Cơ chế giá phát tín hiệu và phân bổ các nguồn lực khan hiếm.","Draw D and S crossing. Mark the intersection E.":"Vẽ D và S cắt nhau. Đánh dấu giao điểm E.","Drop dotted lines to the axes and label Pe and Qe.":"Kẻ các đường chấm xuống các trục và ghi nhãn Pe và Qe.","For a shift, draw the new curve, mark E₁, and label P₁ and Q₁.":"Với sự dịch chuyển, vẽ đường mới, đánh dấu E₁ và ghi nhãn P₁ và Q₁.","Always name the shift first, then the new equilibrium: \"D shifts right, causing a shortage at P₀, so price rises to P₁\".":"Luôn nêu tên sự dịch chuyển trước, rồi đến cân bằng mới: \"D dịch sang phải, gây ra thiếu hụt tại P₀, nên giá tăng lên P₁\".","Evaluate: how elastic are D and S? That decides whether price or quantity moves more.":"Đánh giá: D và S co giãn đến đâu? Điều đó quyết định giá hay lượng thay đổi nhiều hơn.","Using a diagram, explain the effect of a rise in incomes on the market for a normal good.":"Dùng sơ đồ, giải thích tác động của việc thu nhập tăng lên đối với thị trường một hàng hóa thông thường.","Income rises, so demand for a normal good increases (YED positive). D shifts right. At the old price there is a shortage, so price rises to a new equilibrium with a higher price and a higher quantity.":"Thu nhập tăng nên cầu về hàng hóa thông thường tăng (YED dương). D dịch sang phải. Ở mức giá cũ có thiếu hụt, nên giá tăng đến mức cân bằng mới với giá cao hơn và lượng cao hơn.","The price mechanism":"Cơ chế giá","The price mechanism is the system in which demand and supply determine prices and so allocate scarce resources without central direction. It has three functions: signalling, incentive and rationing.":"Cơ chế giá là hệ thống trong đó cầu và cung quyết định giá cả và do đó phân bổ các nguồn lực khan hiếm mà không cần sự chỉ đạo trung ương. Nó có ba chức năng: tín hiệu, khuyến khích và phân phối.","Signalling: price changes tell producers and consumers about shortages and surpluses. Incentive: higher prices encourage firms to produce more and lower prices encourage consumers to buy more. Rationing: when a resource is scarce, higher prices ration it to those willing and able to pay.":"Tín hiệu: thay đổi giá cho nhà sản xuất và người tiêu dùng biết về thiếu hụt và dư thừa. Khuyến khích: giá cao khuyến khích doanh nghiệp sản xuất nhiều hơn và giá thấp khuyến khích người tiêu dùng mua nhiều hơn. Phân phối: khi một nguồn lực khan hiếm, giá cao phân phối nó cho những người sẵn sàng và có khả năng trả.","Draw D and S and mark equilibrium Pe, Qe.":"Vẽ D và S và đánh dấu cân bằng Pe, Qe.","Draw a price above Pe: mark Qd and Qs, and show the surplus between them.":"Vẽ một mức giá trên Pe: đánh dấu Qd và Qs, và thể hiện lượng dư thừa giữa chúng.","Draw a price below Pe: show the shortage, then arrows showing the price moving to Pe.":"Vẽ một mức giá dưới Pe: thể hiện lượng thiếu hụt, rồi các mũi tên cho thấy giá di chuyển về Pe.","Always name the function: the price rise signals shortage, incentivises supply, rations demand.":"Luôn nêu tên chức năng: giá tăng phát tín hiệu thiếu hụt, khuyến khích cung và phân phối cầu.","Above Pe means surplus (excess supply). Below Pe means shortage (excess demand).":"Trên Pe nghĩa là dư thừa (cung vượt). Dưới Pe nghĩa là thiếu hụt (cầu vượt).","Explain the three functions of the price mechanism.":"Giải thích ba chức năng của cơ chế giá.","Signalling: price changes show where resources are needed. Incentive: higher prices increase profit and encourage more production, while lower prices encourage consumers to buy. Rationing: scarce goods go to those willing and able to pay the price.":"Tín hiệu: thay đổi giá cho thấy nơi cần nguồn lực. Khuyến khích: giá cao làm tăng lợi nhuận và khuyến khích sản xuất nhiều hơn, còn giá thấp khuyến khích người tiêu dùng mua. Phân phối: hàng khan hiếm thuộc về những người sẵn sàng và có khả năng trả giá.","The PPC shows the maximum combinations of two goods an economy can produce with all resources fully and efficiently employed.":"PPC cho biết các kết hợp tối đa của hai hàng hóa mà một nền kinh tế có thể sản xuất khi mọi nguồn lực được sử dụng đầy đủ và hiệu quả.","Points on the curve are efficient. Inside is unemployment or inefficiency. Outside is unattainable. Bowed-out shape = increasing opportunity cost. Shifting out is economic growth (more or better resources).":"Các điểm trên đường là hiệu quả. Bên trong là thất nghiệp hoặc kém hiệu quả. Bên ngoài là không thể đạt được. Hình dạng cong lồi = chi phí cơ hội tăng dần. Dịch chuyển ra ngoài là tăng trưởng kinh tế (nhiều hoặc tốt hơn nguồn lực).","Draw a curve bowed out from the origin.":"Vẽ một đường cong lồi ra từ gốc tọa độ.","Label points: A inside (inefficient), B on (efficient), C outside (unattainable).":"Ghi nhãn các điểm: A bên trong (kém hiệu quả), B trên đường (hiệu quả), C bên ngoài (không thể đạt được).","Growth: draw a new curve outside the old one.":"Tăng trưởng: vẽ đường mới nằm ngoài đường cũ.","Straight-line PPC = constant opportunity cost.":"PPC đường thẳng = chi phí cơ hội không đổi.","A shift may be a parallel or biased shift. Biased growth increases capacity for only one good.":"Sự dịch chuyển có thể song song hoặc lệch. Tăng trưởng lệch chỉ làm tăng năng lực cho một hàng hóa.","Distinguish between a movement along a PPC and a shift of the PPC.":"Phân biệt giữa di chuyển dọc theo PPC và dịch chuyển của PPC.","A movement along shows reallocating resources, giving up one good for another (opportunity cost). A shift outward shows increased productive capacity, for example from new technology or more capital.":"Di chuyển dọc theo đường cho thấy phân bổ lại nguồn lực, từ bỏ hàng hóa này để lấy hàng hóa khác (chi phí cơ hội). Dịch chuyển ra ngoài cho thấy năng lực sản xuất tăng lên, ví dụ do công nghệ mới hoặc thêm vốn.","Price elasticity of demand":"Độ co giãn của cầu theo giá","PED measures how responsive quantity demanded is to a change in price: %ΔQd ÷ %ΔP. It is always negative, but we use the absolute value.":"PED đo mức độ nhạy của lượng cầu trước thay đổi giá: %ΔQd ÷ %ΔP. Giá trị luôn âm nhưng ta dùng giá trị tuyệt đối.","If |PED| > 1, demand is elastic: quantity falls by a bigger percentage than price rises. If |PED| < 1 it is inelastic. Determinants: availability of substitutes, necessity, share of income, time, how broadly the market is defined.":"Nếu |PED| > 1, cầu co giãn: lượng giảm theo tỷ lệ phần trăm lớn hơn mức giá tăng. Nếu |PED| < 1 thì cầu kém co giãn. Các yếu tố quyết định: sự sẵn có của hàng thay thế, tính thiết yếu, tỷ trọng trong thu nhập, thời gian, thị trường được định nghĩa rộng đến đâu.","Elastic demand: a relatively flat curve.":"Cầu co giãn: đường cong tương đối thoải.","Inelastic demand: a steep curve.":"Cầu kém co giãn: đường cong dốc.","Perfectly inelastic = vertical. Perfectly elastic = horizontal.":"Hoàn toàn không co giãn = thẳng đứng. Hoàn toàn co giãn = nằm ngang.","Slope is not elasticity. On a straight line PED changes at every point, and real demand curves are not straight: PED is higher at higher prices.":"Độ dốc không phải là độ co giãn. Trên đường thẳng, PED thay đổi tại mọi điểm, và các đường cầu thực tế không thẳng: PED cao hơn ở mức giá cao hơn.","Do not write that elastic goods change when price changes and inelastic goods do not. Both change; it is a question of degree.":"Đừng viết rằng hàng co giãn thì thay đổi khi giá đổi còn hàng kém co giãn thì không. Cả hai đều thay đổi; vấn đề là mức độ.","Link to revenue: raise price when inelastic, cut price when elastic.":"Liên hệ với doanh thu: tăng giá khi cầu kém co giãn, giảm giá khi cầu co giãn.","Explain why firms selling petrol can raise prices without losing much revenue.":"Giải thích vì sao các công ty bán xăng có thể tăng giá mà không mất nhiều doanh thu.","Petrol has few substitutes and is a necessity, so demand is price inelastic (|PED| < 1). A price rise causes a proportionally smaller fall in quantity, so total revenue rises.":"Xăng có ít hàng thay thế và là hàng thiết yếu, nên cầu kém co giãn theo giá (|PED| < 1). Giá tăng làm lượng giảm theo tỷ lệ nhỏ hơn, nên tổng doanh thu tăng.","Elasticity and total revenue":"Độ co giãn và tổng doanh thu","Total revenue (TR) = price × quantity. On a straight-line demand curve, TR is greatest where PED = 1 (unit elastic), at the midpoint.":"Tổng doanh thu (TR) = giá × lượng. Trên đường cầu thẳng, TR lớn nhất tại điểm PED = 1 (co giãn đơn vị), ở điểm giữa.","Top half of the curve: elastic, so lowering price raises TR. Bottom half: inelastic, so raising price raises TR. The shaded rectangle below is TR at the chosen price.":"Nửa trên của đường cầu: co giãn, nên hạ giá làm tăng TR. Nửa dưới: kém co giãn, nên tăng giá làm tăng TR. Hình chữ nhật tô màu bên dưới là TR tại mức giá đã chọn.","Draw a straight demand line.":"Vẽ một đường cầu thẳng.","Mark the midpoint as unit elastic.":"Đánh dấu điểm giữa là co giãn đơn vị.","Shade the rectangle P × Q to show TR.":"Tô hình chữ nhật P × Q để thể hiện TR.","Quote the rule: elastic, price and TR move in opposite directions. Inelastic, they move together.":"Nhớ quy tắc: khi co giãn, giá và TR đi ngược chiều. Khi kém co giãn, chúng đi cùng chiều.","This is the standard justification for price discrimination and sales promotions.":"Đây là lý do chuẩn để biện minh cho phân biệt giá và khuyến mãi.","A firm cuts its price by 10% and sales rise by 5%. What happens to revenue?":"Một công ty giảm giá 10% và doanh số tăng 5%. Doanh thu thay đổi thế nào?","PED = 5 ÷ 10 = 0.5, so demand is inelastic. Quantity rises by a smaller percentage than price falls, so total revenue falls.":"PED = 5 ÷ 10 = 0,5, nên cầu kém co giãn. Lượng tăng theo tỷ lệ nhỏ hơn mức giá giảm, nên tổng doanh thu giảm.","Income elasticity of demand":"Độ co giãn của cầu theo thu nhập","YED measures the responsiveness of quantity demanded to a change in income: YED = %ΔQd ÷ %ΔY. The sign shows the type of good and the size shows how sensitive demand is.":"YED đo mức độ phản ứng của lượng cầu trước thay đổi thu nhập: YED = %ΔQd ÷ %ΔY. Dấu cho biết loại hàng hóa và độ lớn cho biết cầu nhạy đến đâu.","Positive sign: normal good. Between 0 and 1: income inelastic (necessity). Above 1: income elastic (luxury). Negative: inferior good, where demand falls as income rises (bus tickets, instant noodles, second-hand clothes).":"Dấu dương: hàng thông thường. Từ 0 đến 1: cầu kém co giãn theo thu nhập (hàng thiết yếu). Trên 1: co giãn theo thu nhập (hàng xa xỉ). Âm: hàng hóa thứ cấp, cầu giảm khi thu nhập tăng (vé xe buýt, mì ăn liền, quần áo cũ).","Draw income on the horizontal axis and quantity demanded on the vertical axis.":"Vẽ thu nhập trên trục hoành và lượng cầu trên trục tung.","Normal good: line rising. Inferior good: line falling.":"Hàng thông thường: đường dốc lên. Hàng hóa thứ cấp: đường dốc xuống.","Steeper rise = higher YED.":"Dốc hơn = YED cao hơn.","Use Y for income. Always show the sign.":"Dùng Y cho thu nhập. Luôn thể hiện dấu.","Implications: primary-sector goods (food) have low YED, so their producers gain little as the economy grows. Manufactured goods and services often have higher YED.":"Hệ quả: hàng hóa khu vực sơ cấp (thực phẩm) có YED thấp nên nhà sản xuất hưởng lợi ít khi nền kinh tế tăng trưởng. Hàng chế tạo và dịch vụ thường có YED cao hơn.","Income rises from $4,000 to $4,400 and monthly purchases of organic coffee beans rise from 150 to 165 units. Calculate the YED and classify the good.":"Thu nhập tăng từ 4.000 lên 4.400 đô la và lượng mua hạt cà phê hữu cơ hằng tháng tăng từ 150 lên 165 đơn vị. Tính YED và phân loại hàng hóa.","%ΔY = 400 ÷ 4,000 = 10%. %ΔQ = 15 ÷ 150 = 10%. YED = 10 ÷ 10 = +1.0. It is a normal good with unitary income elasticity, on the border between necessity and luxury.":"%ΔY = 400 ÷ 4.000 = 10%. %ΔQ = 15 ÷ 150 = 10%. YED = 10 ÷ 10 = +1,0. Đây là hàng thông thường với độ co giãn theo thu nhập bằng đơn vị, nằm ở ranh giới giữa hàng thiết yếu và hàng xa xỉ.","Price elasticity of supply":"Độ co giãn của cung theo giá","PES measures how responsive quantity supplied is to a change in price: PES = %ΔQs ÷ %ΔP. Remember \"Q before P\". A price change causes a movement along S, not a shift.":"PES đo mức độ phản ứng của lượng cung trước thay đổi giá: PES = %ΔQs ÷ %ΔP. Hãy nhớ \"Q trước P\". Thay đổi giá gây ra sự di chuyển dọc theo S, không phải dịch chuyển.","PES > 1 is elastic (flat curve), PES < 1 is inelastic (steep curve), PES = 1 is unitary. Determinants: spare capacity, ability to store stock, mobility of factors, time, and how costs rise with output. Primary products (olives) are usually less elastic than manufactured goods (toys).":"PES > 1 là co giãn (đường thoải), PES < 1 là kém co giãn (đường dốc), PES = 1 là co giãn đơn vị. Các yếu tố quyết định: công suất dư thừa, khả năng lưu kho, tính linh động của các yếu tố, thời gian và mức chi phí tăng theo sản lượng. Sản phẩm sơ cấp (ô liu) thường kém co giãn hơn hàng chế tạo (đồ chơi).","Elastic supply: a flat curve. Inelastic: steep.":"Cung co giãn: đường thoải. Kém co giãn: dốc.","Perfectly inelastic: vertical. Perfectly elastic: horizontal.":"Hoàn toàn không co giãn: thẳng đứng. Hoàn toàn co giãn: nằm ngang.","Straight lines are simplifications: real supply becomes less elastic at high output as resources get scarcer.":"Đường thẳng chỉ là sự đơn giản hóa: cung thực tế trở nên kém co giãn hơn ở sản lượng cao khi nguồn lực khan hiếm dần.","Time matters: PES is greater in the long run, when firms can build capacity.":"Thời gian rất quan trọng: PES lớn hơn trong dài hạn, khi doanh nghiệp có thể xây thêm công suất.","HL paper 1 favourite: explain why PES for primary commodities is lower than for manufactured products.":"Câu hỏi quen thuộc của HL Paper 1: giải thích vì sao PES của hàng hóa sơ cấp thấp hơn của hàng chế tạo.","A firm raises price from $600 to $800 and its weekly output rises from 1 million to 1.1 million. Calculate the PES. In the long run output reaches 1.8 million. Calculate the long-run PES.":"Một công ty tăng giá từ 600 lên 800 đô la và sản lượng hằng tuần tăng từ 1 triệu lên 1,1 triệu. Tính PES. Trong dài hạn sản lượng đạt 1,8 triệu. Tính PES dài hạn.","%ΔP = 200 ÷ 600 = 33.3%. Short run: %ΔQs = 10%, PES = 0.3 (inelastic). Long run: %ΔQs = 80%, PES = 2.4 (elastic). It is larger in the long run because firms can add capacity and hire and train workers over time.":"%ΔP = 200 ÷ 600 = 33,3%. Ngắn hạn: %ΔQs = 10%, PES = 0,3 (kém co giãn). Dài hạn: %ΔQs = 80%, PES = 2,4 (co giãn). PES dài hạn lớn hơn vì doanh nghiệp có thể thêm công suất và tuyển dụng, đào tạo lao động theo thời gian.","Veblen and speculative goods":"Hàng Veblen và hàng đầu cơ","A Veblen good is a super-luxury good whose demand rises as its price rises, because the high price itself gives snob value. This gives a positive price elasticity of demand over part of the range.":"Hàng Veblen là hàng siêu xa xỉ có cầu tăng khi giá tăng, vì chính mức giá cao tạo ra giá trị phô trương. Điều này cho độ co giãn của cầu theo giá dương trên một phần của đường cầu.","At low prices demand follows the normal law of demand. Above a threshold price P₁ the snob effect dominates and quantity demanded rises with price. Speculative goods (gold, prime property) also rise in demand when prices rise because buyers expect further gains. Most luxury goods are YED elastic but do not have a positive PED.":"Ở mức giá thấp, cầu tuân theo luật cầu thông thường. Trên mức giá ngưỡng P₁, hiệu ứng phô trương chiếm ưu thế và lượng cầu tăng theo giá. Hàng đầu cơ (vàng, bất động sản đắc địa) cũng có cầu tăng khi giá tăng vì người mua kỳ vọng sẽ có lợi thêm. Hầu hết hàng xa xỉ co giãn theo thu nhập nhưng không có PED dương.","Draw a demand curve that slopes down from the vertical axis, then bends and slopes upward above P₁.":"Vẽ một đường cầu dốc xuống từ trục tung, rồi uốn cong và dốc lên trên P₁.","Label the kink P₁ and mark the normal and snob-value sections.":"Ghi nhãn điểm gấp P₁ và đánh dấu các đoạn bình thường và đoạn phô trương.","Do not confuse luxury goods with Veblen goods. Veblen goods are a small exception to the law of demand.":"Đừng nhầm hàng xa xỉ với hàng Veblen. Hàng Veblen là ngoại lệ nhỏ của luật cầu.","Link to behavioural economics: conspicuous consumption (Veblen) signals wealth to others, so it is not simply irrational.":"Liên hệ với kinh tế học hành vi: tiêu dùng phô trương (Veblen) báo hiệu sự giàu có cho người khác, nên không đơn thuần là phi lý.","Explain why the demand curve for a Veblen good may slope upward.":"Giải thích vì sao đường cầu của hàng Veblen có thể dốc lên.","Veblen goods derive value from their prestige and exclusivity. A higher price increases the snob value, so some consumers buy more when the price rises and less when it falls. Above the threshold price the quantity demanded rises as price rises, giving positive PED.":"Hàng Veblen có giá trị từ uy tín và tính độc quyền. Giá cao hơn làm tăng giá trị phô trương, nên một số người mua nhiều hơn khi giá tăng và ít hơn khi giá giảm. Trên mức giá ngưỡng, lượng cầu tăng khi giá tăng, cho PED dương.","Consumer and producer surplus":"Thặng dư người tiêu dùng và nhà sản xuất","Consumer surplus is the gap between what consumers are willing to pay and what they actually pay. Producer surplus is the gap between the price firms receive and the least they would accept.":"Thặng dư người tiêu dùng là chênh lệch giữa mức người tiêu dùng sẵn sàng trả và mức họ thực sự trả. Thặng dư nhà sản xuất là chênh lệch giữa giá doanh nghiệp nhận được và mức tối thiểu họ chấp nhận.","Together they measure the welfare of a market. At the competitive equilibrium total surplus is maximised: allocative efficiency (MB = MC).":"Cùng nhau, chúng đo phúc lợi của một thị trường. Tại cân bằng cạnh tranh, tổng thặng dư đạt tối đa: hiệu quả phân bổ (MB = MC).","CS: triangle between D and the price line, up to the Q axis.":"CS: tam giác giữa D và đường giá, đến trục Q.","PS: triangle between the price line and S.":"PS: tam giác giữa đường giá và S.","Label both and shade them differently.":"Ghi nhãn cả hai và tô màu khác nhau.","Any intervention that moves output away from Qe loses surplus: that loss is the deadweight loss.":"Bất kỳ sự can thiệp nào làm sản lượng lệch khỏi Qe đều mất thặng dư: phần mất đó là tổn thất vô ích.","Efficiency language: \"at Qe, marginal benefit equals marginal cost\".":"Ngôn ngữ về hiệu quả: \"tại Qe, lợi ích cận biên bằng chi phí cận biên\".","Explain what happens to consumer surplus when demand increases.":"Giải thích điều gì xảy ra với thặng dư người tiêu dùng khi cầu tăng.","D shifts right, the equilibrium price rises and quantity rises. Consumers are willing to pay more, so the area between the new D and the price grows. Consumer surplus increases.":"D dịch sang phải, giá cân bằng tăng và lượng tăng. Người tiêu dùng sẵn sàng trả nhiều hơn nên diện tích giữa D mới và mức giá lớn lên. Thặng dư người tiêu dùng tăng.","Price ceiling (maximum price)":"Giá trần (giá tối đa)","A legal maximum price set below the equilibrium price, for example rent control, to keep a good affordable.":"Mức giá tối đa theo luật được đặt thấp hơn giá cân bằng, ví dụ kiểm soát tiền thuê nhà, để giữ hàng hóa ở mức giá phải chăng.","At the ceiling, quantity demanded exceeds quantity supplied, so there is a shortage. Rationing, queues and black markets appear. Allocative efficiency is lost (deadweight loss).":"Tại mức giá trần, lượng cầu vượt lượng cung nên có thiếu hụt. Xuất hiện tình trạng phân phối, xếp hàng và chợ đen. Hiệu quả phân bổ bị mất (tổn thất vô ích).","Draw D and S with equilibrium E.":"Vẽ D và S với cân bằng E.","Draw a horizontal line Pmax below Pe.":"Vẽ một đường ngang Pmax dưới Pe.","Mark Qs and Qd on that line; the gap between is the shortage.":"Đánh dấu Qs và Qd trên đường đó; khoảng cách giữa chúng là thiếu hụt.","A ceiling set above Pe is non-binding and has no effect.":"Giá trần đặt trên Pe là không ràng buộc và không có tác dụng.","Evaluate: winners (those who get the good), losers (those who cannot), and long-run supply effects such as falling housing quality.":"Đánh giá: người được lợi (những người mua được hàng), người thiệt (những người không mua được) và tác động cung dài hạn như chất lượng nhà ở giảm.","Real example: price controls in Venezuela caused shortages and pushed people to the black market.":"Ví dụ thực tế: kiểm soát giá ở Venezuela gây thiếu hụt và đẩy người dân ra chợ đen.","Explain two consequences of rent controls.":"Giải thích hai hệ quả của kiểm soát tiền thuê nhà.","1) Shortage: the capped rent is below equilibrium, so more people want rentals than landlords supply. 2) Black market and reduced quality, as landlords cut maintenance or charge hidden fees when they can fill units anyway.":"1) Thiếu hụt: tiền thuê bị giới hạn thấp hơn mức cân bằng nên nhiều người muốn thuê hơn số chủ nhà cung cấp. 2) Chợ đen và chất lượng giảm, vì chủ nhà cắt giảm bảo trì hoặc thu phí ẩn khi họ vẫn cho thuê hết được.","Price floor (minimum price)":"Giá sàn (giá tối thiểu)","A legal minimum price set above the equilibrium price, for example a minimum wage or agricultural support price.":"Mức giá tối thiểu theo luật được đặt cao hơn giá cân bằng, ví dụ lương tối thiểu hoặc giá hỗ trợ nông sản.","At the floor, quantity supplied exceeds quantity demanded, so there is a surplus. The government may buy the surplus, creating a cost. Resources are over-allocated to the good.":"Tại mức giá sàn, lượng cung vượt lượng cầu nên có dư thừa. Chính phủ có thể mua phần dư thừa, gây ra chi phí. Nguồn lực bị phân bổ quá mức cho hàng hóa đó.","Draw D and S with E.":"Vẽ D và S với E.","Draw a horizontal line Pmin above Pe.":"Vẽ một đường ngang Pmin trên Pe.","Mark Qd and Qs: the gap is the surplus.":"Đánh dấu Qd và Qs: khoảng cách giữa chúng là lượng dư thừa.","For a minimum wage, labour is the good: surplus = unemployment.":"Với lương tối thiểu, lao động là hàng hóa: dư thừa = thất nghiệp.","Evaluate using elasticity: if labour demand is inelastic, few jobs are lost.":"Đánh giá bằng độ co giãn: nếu cầu lao động kém co giãn thì mất ít việc làm.","Worked example (corn): equilibrium $12 and 5m bushels; minimum price $16 gives Qd = 3.5m, Qs = 8.0m, surplus 4.5m. Government buying it costs 4.5m × $16 = $72m, plus storage.":"Ví dụ tính toán (ngô): cân bằng 12 đô la và 5 triệu giạ; giá tối thiểu 16 đô la cho Qd = 3,5 triệu, Qs = 8,0 triệu, dư thừa 4,5 triệu. Chính phủ mua phần đó tốn 4,5 triệu × 16 đô la = 72 triệu đô la, chưa kể chi phí lưu kho.","Explain why a minimum price on wheat causes a surplus.":"Giải thích vì sao giá tối thiểu đối với lúa mì gây ra dư thừa.","The price is held above equilibrium. At that price farmers supply more than buyers demand, so quantity supplied exceeds quantity demanded and the surplus cannot clear through falling prices.":"Giá bị giữ trên mức cân bằng. Ở mức giá đó nông dân cung nhiều hơn mức người mua cần, nên lượng cung vượt lượng cầu và phần dư thừa
