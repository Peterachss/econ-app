add({id:'moncomp',unit:'Unit 2 · Microeconomics',title:'Monopolistic competition',hl:true,
what:'A market with many firms selling differentiated products and no barriers to entry or exit (hairdressers, small shops, plumbers). Each firm has some price-making power and faces a downward-sloping, fairly elastic demand curve.',
meaning:'Firms maximise profit where MC = MR (with MC rising) and charge the price on their demand curve. Short run: abnormal profit or loss is possible. Long run: entry or exit shifts demand until AR = ATC and firms earn only normal profit. Neither productive nor allocative efficiency is achieved: P > MC and output is below the minimum ATC.',
draw:['Draw a downward-sloping AR (= D) with MR below it, and U-shaped MC and ATC.','Find MR = MC, then go up to AR for the price.','Profit = (AR − ATC) × Q. Long run: AR touches ATC at the profit-maximising output.'],
tips:['Difference from perfect competition: differentiated products and downward-sloping demand, so the long-run output is not at the minimum of ATC (excess capacity).','Evaluate: the variety and quality gained by consumers may outweigh the efficiency losses.'],
q:'Explain why a firm in monopolistic competition earns only normal profit in the long run.',a:'Abnormal profit attracts new firms because there are no barriers to entry. Their products are close substitutes, so demand for each existing firm falls (shifts left) until AR equals ATC at the profit-maximising output. Profit is then normal only. If firms make losses, firms leave and demand rises until normal profit is restored.',
ctrl:[sl('a','Demand for the firm\'s product',30,70,55,.5)],
f(p){const c=costCurves(300);
 const solve=a=>{let q=17;while(q<100&&(a-.9*q)>c.mc(q))q+=.1;const P=a-.45*q,atc=c.atc(q);return{q,P,atc,pr:(P-atc)*q}};
 let lo=30,hi=70;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(solve(mid).pr>0)hi=mid;else lo=mid}const aLR=(lo+hi)/2;
 const a=p.a,o=solve(a);const l2=Math.min(o.P,o.atc),h2=Math.max(o.P,o.atc);const tang=Math.abs(a-aLR)<.5;
 const tail=' Long run: entry or exit shifts demand until AR just touches ATC (at about '+f1(aLR)+' on this slider).';
 return{curves:[fc(D(a,.45),'c1','AR = D',70),fc(D(a,.9),'c3','MR',40),fc(c.mc,'c2','MC',92),fc(c.atc,'c4','ATC',92,1)],areas:[poly([[0,l2],[o.q,l2],[o.q,h2],[0,h2]],o.pr>=0?'a1':'a2')],pts:[dot(o.q,o.P,'Q*','P')],ylabel:'Price / costs',
 read:'Q* = <b>'+f1(o.q)+'</b> where MR = MC, price <b>'+f1(o.P)+'</b>, ATC <b>'+f1(o.atc)+'</b>. '+(tang?'<b>Normal profit</b>: AR touches ATC, the long-run equilibrium.':o.pr>0?'<b>Abnormal profit</b> of '+f1(o.pr)+': new firms enter and demand shifts left.':'<b>Loss</b> of '+f1(-o.pr)+': firms leave and demand shifts right.')+(tang?'':tail)}}});

add({id:'prod',unit:'Unit 2 · Microeconomics',title:'Production: total, average and marginal product',hl:true,
what:'Total product (TP) is total output. Average product (AP) = TP ÷ variable input. Marginal product (MP) is the extra output from one more unit of the variable input. In the short run at least one factor is fixed.',
meaning:'The law of diminishing returns: as more of a variable factor is added to a fixed factor, MP and then AP eventually fall; total product may still rise, but more slowly. MP cuts AP at the maximum of AP. This is the origin of the U-shape of MC and ATC.',
draw:['Plot labour on the x-axis. MP rises, peaks, then falls.','AP rises, peaks where MP = AP, then falls.','Mark where diminishing marginal returns begin (the peak of MP).'],
tips:['Output per worker rises at first because of specialisation, then falls as workers share limited space and equipment.','Be precise: diminishing returns is a short-run idea. It is different from diseconomies of scale (long run).'],
q:'Complete the table: with TP 0, 10, 30, 51, 64, 75, 84, 91 for 0 to 7 workers, calculate MP for the 4th worker and AP for 5 workers.',a:'MP of the 4th worker = 64 − 51 = 13. AP for 5 workers = 75 ÷ 5 = 15.',
ctrl:[sl('l','Workers',1,7,3)],
f(p){const TP=[0,10,30,51,64,75,84,91];const mp=L=>TP[L]-TP[L-1],ap=L=>TP[L]/L;const L=p.l;
 const m=[],a=[];for(let i=1;i<=7;i++){m.push([i*14,mp(i)*4]);a.push([i*14,ap(i)*4])}
 const stage=mp(L)>(L>1?mp(L-1):0)?'<b>increasing marginal returns</b> (MP rising)':'<b>diminishing marginal returns</b> (MP falling)';
 return{curves:[{pts:m,cls:'c1',label:'MP',lbl:[m[6][0]-4,m[6][1]-10]},{pts:a,cls:'c2',label:'AP',lbl:[a[6][0]-4,a[6][1]+9]}],pts:[dot(L*14,mp(L)*4)],xlabel:'Workers (variable input)',ylabel:'Output per worker',
 ticks:{x:[1,2,3,4,5,6,7].map(i=>[i*14,''+i]),y:[[0,'0'],[20,'5'],[40,'10'],[60,'15'],[80,'20']]},
 read:`${L} workers: TP = <b>${TP[L]}</b>, AP = <b>${f1(ap(L))}</b>, MP = <b>${mp(L)}</b>: ${stage}. ${mp(L)<ap(L)?'MP is below AP, so AP is falling.':'MP is above AP, so AP is rising.'}`}}});

add({id:'jcurve',unit:'Unit 4 · The global economy',title:'The Marshall–Lerner condition and the J-curve',hl:false,
what:'The Marshall–Lerner condition says a depreciation improves the current account only if the sum of the price elasticities of demand for exports and imports is greater than 1 (PEDx + PEDm > 1). The J-curve shows the short-run worsening before the improvement.',
meaning:'After a depreciation, import prices rise at once but quantities adjust slowly because contracts and habits take time to change. In the short run demand is inelastic, so the import bill rises more than export earnings and the current account gets worse. As demand becomes more elastic over time, volumes respond, and if PEDx + PEDm > 1 the balance improves beyond its starting point. If the sum is below 1 it never recovers.',
draw:['Draw time on the horizontal axis and the current account balance on the vertical axis, with a line at zero.','Start the curve at an existing deficit, dip below it after the depreciation, then rise through the starting level.','Label the shape a J and mark the turning point.'],
tips:['State the condition exactly: PEDx + PEDm > 1.','Explain why the short run is worse: inelastic demand and existing contracts. Explain why the long run is better: more elastic demand as consumers and firms switch.','Evaluate with inflation and other changes that can offset the gain, and with how quickly each country adjusts.'],
q:'Explain why a currency depreciation may worsen the current account in the short run.',a:'Import prices rise straight away, but the quantities of imports and exports are slow to change because of existing contracts and habits, so short-run demand is inelastic. The import bill therefore rises by more than export revenue and the balance worsens, giving the first downward part of the J-curve.',
ctrl:[sl('e','PEDx + PEDm',.4,2.4,1.75,.05),sl('t','Time since depreciation',0,100,30)],
f(p){const k=(p.e-1)*40;const fn=t=>42-22*(t/12)*Math.exp(1-t/12)+k*(1-Math.exp(-t/40));const pts=[];for(let t=0;t<=100;t+=1){const y=fn(t);if(y>=0&&y<=100)pts.push([t,y])}
 const y0=fn(p.t);const ok=p.e>1;
 return{curves:[sg([0,50],[100,50],'c3','Balance = 0',[78,50]),{pts,cls:'c1',label:'Current account',lbl:[60,Math.min(95,Math.max(5,fn(60)+8))]}],pts:[dot(p.t,Math.min(100,Math.max(0,y0)),'t','')],xlabel:'Time',ylabel:'Current account balance',
 read:'PEDx + PEDm = <b>'+f1(p.e)+'</b>: the Marshall–Lerner condition '+(ok?'<b>holds</b>':'<b>does not hold</b>')+'. '+(ok?(p.t<12?'Early on the balance is still getting worse (the downward part of the J).':'The balance is now '+(y0>42?'better than':'still below')+' its starting level.'):'Volumes do not respond enough, so the balance stays worse than before the depreciation.')}}});

add({id:'imperfect',unit:UM,hl:true,title:V('Imperfect competition: market structures','Cạnh tranh không hoàn hảo: các cấu trúc thị trường'),
what:V('Imperfect competition describes any market where firms have some control over price: monopolistic competition, oligopoly and monopoly. It sits between the two extremes of perfect competition and pure monopoly.','Cạnh tranh không hoàn hảo là mọi thị trường mà doanh nghiệp có một mức kiểm soát nhất định đối với giá: cạnh tranh độc quyền, độc quyền nhóm và độc quyền. Nó nằm giữa hai thái cực là cạnh tranh hoàn hảo và độc quyền thuần túy.'),
notes:[
{h:V('Comparing the four market structures','So sánh bốn cấu trúc thị trường'),html:tbl([V('Feature','Đặc điểm'),V('Perfect competition','Cạnh tranh hoàn hảo'),V('Monopolistic competition','Cạnh tranh độc quyền'),V('Oligopoly','Độc quyền nhóm'),V('Monopoly','Độc quyền')],[
[V('Number of firms','Số doanh nghiệp'),V('Many','Nhiều'),V('Many','Nhiều'),V('Few','Ít'),V('One','Một')],
[V('Product','Sản phẩm'),V('Identical','Giống hệt'),V('Differentiated','Khác biệt'),V('Identical or differentiated','Giống hệt hoặc khác biệt'),V('Unique','Duy nhất')],
[V('Barriers to entry','Rào cản gia nhập'),V('None','Không có'),V('Low','Thấp'),V('High','Cao'),V('Very high','Rất cao')],
[V('Control over price','Quyền kiểm soát giá'),V('Price taker','Người chấp nhận giá'),V('Some','Một phần'),V('Considerable, but interdependent','Đáng kể nhưng phụ thuộc lẫn nhau'),V('Price maker','Người định giá')],
[V('Demand curve','Đường cầu'),V('Horizontal (perfectly elastic)','Nằm ngang (hoàn toàn co giãn)'),V('Downward sloping, fairly elastic','Dốc xuống, khá co giãn'),V('Kinked in the standard model','Có điểm gãy trong mô hình chuẩn'),V('Downward sloping (market demand)','Dốc xuống (cầu thị trường)')],
[V('Long-run profit','Lợi nhuận dài hạn'),V('Normal','Bình thường'),V('Normal','Bình thường'),V('Abnormal profit possible','Có thể có lợi nhuận siêu ngạch'),V('Abnormal profit','Lợi nhuận siêu ngạch')],
[V('Efficiency','Hiệu quả'),V('Allocative and productive (long run)','Hiệu quả phân bổ và sản xuất (dài hạn)'),V('Neither: excess capacity','Cả hai đều không: có công suất dư'),V('Usually neither','Thường cả hai đều không'),V('Neither (usually)','Cả hai đều không (thường)')],
[V('Examples','Ví dụ'),V('Wheat farming','Trồng lúa mì'),V('Restaurants, hair salons','Nhà hàng, tiệm làm tóc'),V('Airlines, mobile networks, supermarkets','Hãng hàng không, mạng di động, siêu thị'),V('Patent holders, local utilities','Chủ bằng sáng chế, công ty tiện ích địa phương')]])},
{h:V('What makes competition imperfect','Điều gì làm cạnh tranh không hoàn hảo'),html:cards([
[V('Market power','Quyền lực thị trường'),V('A firm with market power can influence price. Its demand curve slopes downward, so it faces a trade-off between price and quantity.','Doanh nghiệp có quyền lực thị trường có thể tác động đến giá. Đường cầu của nó dốc xuống nên nó phải đánh đổi giữa giá và lượng.')],
[V('Barriers to entry','Rào cản gia nhập'),V('Anything that stops new firms from entering: economies of scale, patents and licences, high start-up costs, control of key resources, brand loyalty and aggressive tactics.','Mọi thứ ngăn doanh nghiệp mới gia nhập: tính kinh tế theo quy mô, bằng sáng chế và giấy phép, chi phí khởi đầu cao, kiểm soát nguồn lực then chốt, lòng trung thành thương hiệu và các chiến thuật hung hăng.')],
[V('Product differentiation','Khác biệt hóa sản phẩm'),V('Brand, quality, design or location makes products imperfect substitutes, which gives firms some pricing power.','Thương hiệu, chất lượng, thiết kế hoặc vị trí làm sản phẩm trở thành hàng thay thế không hoàn hảo, giúp doanh nghiệp có một chút quyền định giá.')],
[V('Interdependence','Phụ thuộc lẫn nhau'),V('In an oligopoly each firm\'s best choice depends on how rivals react. Firms must think strategically, and game theory models this.','Trong độc quyền nhóm, lựa chọn tốt nhất của mỗi doanh nghiệp phụ thuộc vào phản ứng của đối thủ. Doanh nghiệp phải suy nghĩ chiến lược và lý thuyết trò chơi mô hình hóa điều này.')]])},
{h:V('Evaluating imperfect competition','Đánh giá cạnh tranh không hoàn hảo'),html:'<ul><li>'+V('Possible benefits: economies of scale can lower costs, supernormal profit can fund research and innovation (dynamic efficiency), and consumers get more variety.','Lợi ích có thể có: tính kinh tế theo quy mô có thể giảm chi phí, lợi nhuận siêu ngạch có thể tài trợ nghiên cứu và đổi mới (hiệu quả động), và người tiêu dùng có nhiều lựa chọn hơn.')+'</li><li>'+V('Possible costs: higher prices and lower output than perfect competition, allocative inefficiency (P > MC), less pressure to cut costs (X-inefficiency) and a more unequal distribution of income.','Chi phí có thể có: giá cao hơn và sản lượng thấp hơn cạnh tranh hoàn hảo, phi hiệu quả phân bổ (P > MC), ít áp lực giảm chi phí (phi hiệu quả X) và phân phối thu nhập bất bình đẳng hơn.')+'</li><li>'+V('Responses: competition policy, price caps, control of mergers, nationalisation, or encouraging contestable markets.','Biện pháp: chính sách cạnh tranh, giá trần, kiểm soát sáp nhập, quốc hữu hóa, hoặc khuyến khích thị trường có thể cạnh tranh.')+'</li></ul>'}],
q:V('Distinguish between monopolistic competition and oligopoly.','Phân biệt cạnh tranh độc quyền và độc quyền nhóm.'),a:V('Monopolistic competition has many firms selling differentiated products with low barriers to entry, so firms cannot affect each other much and earn only normal profit in the long run. Oligopoly has a few large firms protected by high barriers to entry, so firms are interdependent and may earn abnormal profit in the long run.','Cạnh tranh độc quyền có nhiều doanh nghiệp bán sản phẩm khác biệt với rào cản gia nhập thấp, nên các doanh nghiệp ít ảnh hưởng đến nhau và chỉ có lợi nhuận bình thường trong dài hạn. Độc quyền nhóm có ít doanh nghiệp lớn được bảo vệ bởi rào cản gia nhập cao, nên chúng phụ thuộc lẫn nhau và có thể có lợi nhuận siêu ngạch trong dài hạn.')});

add({id:'oligopoly',unit:UM,hl:true,title:V('Oligopoly: the kinked demand curve','Độc quyền nhóm: đường cầu gãy'),
what:V('In an oligopoly a few large firms dominate the market and each reacts to the others. The kinked demand curve model explains why prices in an oligopoly tend to be stable.','Trong độc quyền nhóm, một vài doanh nghiệp lớn thống trị thị trường và mỗi doanh nghiệp phản ứng với các doanh nghiệp khác. Mô hình đường cầu gãy giải thích vì sao giá trong độc quyền nhóm thường ổn định.'),
meaning:V('Firms assume that rivals will match a price cut but ignore a price rise. So demand is elastic above the kink (a rise loses many customers) and inelastic below it (a cut gains few). This creates a vertical gap in the MR curve, so MC can change within the gap without changing price or output.','Các doanh nghiệp cho rằng đối thủ sẽ theo một đợt giảm giá nhưng bỏ qua một đợt tăng giá. Vì vậy cầu co giãn phía trên điểm gãy (tăng giá mất nhiều khách) và kém co giãn phía dưới (giảm giá được ít khách). Điều này tạo khoảng đứt thẳng đứng trong đường MR, nên MC có thể thay đổi trong khoảng đó mà giá và sản lượng không đổi.'),
draw:[V('Draw a demand curve with a kink at the current price P and quantity Q.','Vẽ đường cầu có điểm gãy tại giá hiện tại P và lượng Q.'),V('Draw the flatter (elastic) section above the kink and the steeper (inelastic) section below it.','Vẽ đoạn thoải hơn (co giãn) phía trên điểm gãy và đoạn dốc hơn (kém co giãn) phía dưới.'),V('Draw MR in two parts, one for each section, with a vertical gap at Q.','Vẽ MR thành hai phần, mỗi phần cho một đoạn, với khoảng đứt thẳng đứng tại Q.'),V('Draw MC passing through the gap. Profit is maximised at Q, where MC = MR.','Vẽ MC đi qua khoảng đứt. Lợi nhuận tối đa tại Q, nơi MC = MR.')],
tips:[V('Say why the curve is kinked: rivals follow a price cut but not a price rise.','Nêu lý do đường cầu gãy: đối thủ theo giảm giá nhưng không theo tăng giá.'),V('The model explains price stickiness but not how the first price was set, which is a key criticism.','Mô hình giải thích sự cứng nhắc của giá nhưng không giải thích mức giá ban đầu được định thế nào, đây là điểm phê bình chính.'),V('Link to non-price competition: with stable prices, firms compete through advertising, quality and branding.','Liên hệ với cạnh tranh phi giá: khi giá ổn định, doanh nghiệp cạnh tranh bằng quảng cáo, chất lượng và thương hiệu.')],
q:V('Explain why prices tend to be stable in an oligopoly.','Giải thích vì sao giá có xu hướng ổn định trong độc quyền nhóm.'),a:V('Firms believe that rivals will match a price cut but not a price rise. A price rise therefore loses many customers (elastic demand), while a price cut gains few (inelastic demand). This creates a kink in the demand curve and a gap in MR, so a change in costs within the gap leaves price and output unchanged.','Các doanh nghiệp tin rằng đối thủ sẽ theo giảm giá nhưng không theo tăng giá. Vì vậy tăng giá mất nhiều khách (cầu co giãn) còn giảm giá được ít khách (cầu kém co giãn). Điều này tạo điểm gãy trên đường cầu và khoảng đứt trong MR, nên chi phí thay đổi trong khoảng đó không làm giá và sản lượng đổi.'),
ctrl:[sl('mc',V('Marginal cost','Chi phí cận biên'),5,60,30)],
f(p){const mc=p.mc;let q,pr,gap=false;
 if(mc>=15&&mc<=45){q=30;pr=60;gap=true}else if(mc>45){q=75-mc;pr=75-.5*q}else{q=(105-mc)/3;pr=105-1.5*q}
 return{curves:[fc(D(75,.5),'c1','D',6,0,30),fc(D(105,1.5),'c1',null,null,30,70),fc(D(75,1),'c3','MR',4,0,30),fc(D(105,3),'c3',null,null,30,35),sg([30,15],[30,45],'c4'),sg([0,mc],[100,mc],'c2','MC',[90,mc])],
 pts:[dot(q,pr,f1(q),f1(pr))],texts:[{x:32,y:66,t:'Kink',c:'lbl'}],ylabel:'Price / costs',
 read:gap?'Kink at price 60, quantity 30. MR jumps from 45 down to 15 at the kink. MC = <b>'+f1(mc)+'</b> passes through the gap, so output stays <b>30</b> and price stays <b>60</b>: the price is sticky.':'Kink at price 60, quantity 30. MC = <b>'+f1(mc)+'</b> is outside the gap in MR (15 to 45), so output moves to <b>'+f1(q)+'</b> and price to <b>'+f1(pr)+'</b>.'}}});
VIREAD['Kink at price #, quantity #. MR jumps from # down to # at the kink. MC = <b>#</b> passes through the gap, so output stays <b>#</b> and price stays <b>#</b>: the price is sticky.']='Điểm gãy tại giá #, lượng #. MR nhảy từ # xuống # tại điểm gãy. MC = <b>#</b> đi qua khoảng đứt nên sản lượng vẫn là <b>#</b> và giá vẫn là <b>#</b>: giá cứng nhắc.';
VIREAD['Kink at price #, quantity #. MC = <b>#</b> is outside the gap in MR (# to #), so output moves to <b>#</b> and price to <b>#</b>.']='Điểm gãy tại giá #, lượng #. MC = <b>#</b> nằm ngoài khoảng đứt của MR (# đến #), nên sản lượng chuyển sang <b>#</b> và giá sang <b>#</b>.';
VIDICT['Kink']='Điểm gãy';

add({id:'gametheory',unit:UM,hl:true,title:V('Game theory and collusion','Lý thuyết trò chơi và thông đồng'),
what:V('Game theory studies how firms choose strategies when each firm\'s payoff depends on what the others do. It helps explain why oligopolists often collude, and why collusion tends to break down.','Lý thuyết trò chơi nghiên cứu cách doanh nghiệp chọn chiến lược khi lợi ích của mỗi doanh nghiệp phụ thuộc vào hành động của các doanh nghiệp khác. Nó giúp giải thích vì sao các doanh nghiệp độc quyền nhóm thường thông đồng và vì sao thông đồng dễ đổ vỡ.'),
notes:[
{h:V('The prisoner\'s dilemma (payoff matrix)','Thế lưỡng nan của người tù (ma trận lợi ích)'),html:tbl([V('Firm A / Firm B','Hãng A / Hãng B'),V('B keeps price high','B giữ giá cao'),V('B cuts price','B giảm giá')],[[V('A keeps price high','A giữ giá cao'),V('A: $10m, B: $10m','A: 10 triệu đô, B: 10 triệu đô'),V('A: $2m, B: $14m','A: 2 triệu đô, B: 14 triệu đô')],[V('A cuts price','A giảm giá'),V('A: $14m, B: $2m','A: 14 triệu đô, B: 2 triệu đô'),V('A: $5m, B: $5m','A: 5 triệu đô, B: 5 triệu đô')]])+'<p>'+V('Each firm\'s dominant strategy is to cut price, whatever the rival does. The Nash equilibrium is therefore that both cut price and earn $5m each, even though both would earn $10m by keeping prices high.','Chiến lược thống trị của mỗi hãng là giảm giá, dù đối thủ làm gì. Vì vậy cân bằng Nash là cả hai cùng giảm giá và mỗi hãng được 5 triệu đô, dù cả hai sẽ được 10 triệu đô nếu giữ giá cao.')+'</p>'},
{h:V('Collusion and cartels','Thông đồng và các-ten'),html:cards([
[V('Collusion','Thông đồng'),V('Firms cooperate, openly or tacitly, to restrict competition, for example by fixing prices or output.','Các doanh nghiệp hợp tác, công khai hoặc ngầm, để hạn chế cạnh tranh, ví dụ ấn định giá hoặc sản lượng.')],
[V('Cartel','Các-ten'),V('A formal agreement among firms to fix price or output. Open collusion is illegal in most countries.','Thỏa thuận chính thức giữa các doanh nghiệp để ấn định giá hoặc sản lượng. Thông đồng công khai là bất hợp pháp ở hầu hết các nước.')],
[V('Why it breaks down','Vì sao đổ vỡ'),V('Each firm has an incentive to cheat by cutting price or raising output for extra profit, and it is hard to monitor rivals.','Mỗi doanh nghiệp có động cơ gian lận bằng cách giảm giá hoặc tăng sản lượng để có thêm lợi nhuận, và khó giám sát đối thủ.')],
[V('What helps it last','Điều gì giúp duy trì'),V('Few firms, similar costs, high barriers to entry, transparent prices, repeated interaction and a credible punishment for cheating.','Ít doanh nghiệp, chi phí tương tự, rào cản gia nhập cao, giá minh bạch, tương tác lặp lại và hình phạt đáng tin cậy cho hành vi gian lận.')]])},
{h:V('Evaluating game theory','Đánh giá lý thuyết trò chơi'),html:'<ul><li>'+V('Collusion raises profit for firms but harms consumers through higher prices and less choice.','Thông đồng làm tăng lợi nhuận cho doanh nghiệp nhưng gây hại cho người tiêu dùng qua giá cao hơn và ít lựa chọn hơn.')+'</li><li>'+V('Game theory simplifies: it assumes rational firms, known payoffs and a single round.','Lý thuyết trò chơi đơn giản hóa: giả định doanh nghiệp duy lý, lợi ích đã biết và chỉ một vòng chơi.')+'</li><li>'+V('In repeated games firms may cooperate by copying each other\'s last move (tit-for-tat), so the dilemma is less severe.','Trong các trò chơi lặp lại, doanh nghiệp có thể hợp tác bằng cách lặp lại nước đi gần nhất của nhau (ăn miếng trả miếng), nên thế lưỡng nan bớt nghiêm trọng.')+'</li></ul>'}],
q:V('Using a payoff matrix, explain why firms in an oligopoly may be unable to maintain a collusive agreement.','Dùng ma trận lợi ích, giải thích vì sao các doanh nghiệp trong độc quyền nhóm có thể không duy trì được thỏa thuận thông đồng.'),a:V('Each firm earns more by cheating (cutting price) if the other keeps to the agreement, and cutting price is also the safer choice if the other cheats. So cheating is the dominant strategy, the Nash equilibrium is that both cut price, and the cartel breaks down.','Mỗi hãng được nhiều hơn khi gian lận (giảm giá) nếu hãng kia giữ thỏa thuận, và giảm giá cũng là lựa chọn an toàn hơn nếu hãng kia gian lận. Vì vậy gian lận là chiến lược thống trị, cân bằng Nash là cả hai cùng giảm giá và các-ten đổ vỡ.')});

const EXTRA={};
const E=(id,rel,en,vi)=>{EXTRA[id]={rel,en,vi}};

E('demand',['supply','equilibrium','ped','yed'],
{t:[['Demand','The quantity of a good consumers are willing and able to buy at each price in a given time period.'],['Law of demand','As price rises, quantity demanded falls, ceteris paribus (all other factors held constant).'],['Movement vs shift','A price change moves you along the curve (change in quantity demanded). A change in any other determinant shifts the whole curve (change in demand).'],['Determinants of demand','Tastes, income, prices of related goods (substitutes and complements), population, expectations, advertising.']],
ev:['Strength: the model isolates one relationship at a time, which makes cause and effect clear.','Limitation: ceteris paribus rarely holds in real life, and some goods (Veblen, Giffen) break the law of demand.','Limitation: consumers are assumed rational, but behavioural economics shows habits, framing and limited information.'],
ex:'When Hanoi raised its petrol price, many commuters switched from motorbikes to the bus and metro: a movement up the demand curve for petrol. A new phone launch that makes the older model unfashionable shifts demand for the old model left.',
q:['Distinguish between a movement along and a shift of the demand curve. [4 marks]','A movement along the curve is caused only by a change in the good\'s own price (extension or contraction in quantity demanded). A shift is caused by any other determinant such as income, tastes or the price of a substitute (increase or decrease in demand). Example: a fall in the price of tea moves along the tea demand curve; a rise in the price of coffee shifts the tea curve right, as tea is a substitute.']},
{t:[['Cầu','Lượng hàng hóa mà người tiêu dùng sẵn sàng và có khả năng mua ở mỗi mức giá trong một khoảng thời gian.'],['Luật cầu','Khi giá tăng, lượng cầu giảm, với các yếu tố khác không đổi.'],['Di chuyển và dịch chuyển','Thay đổi giá làm di chuyển dọc theo đường cầu (thay đổi lượng cầu). Thay đổi của bất kỳ yếu tố khác làm cả đường cầu dịch chuyển (thay đổi cầu).'],['Các yếu tố quyết định cầu','Thị hiếu, thu nhập, giá hàng hóa liên quan (thay thế và bổ sung), dân số, kỳ vọng, quảng cáo.']],
ev:['Ưu điểm: mô hình tách riêng từng mối quan hệ nên quan hệ nhân quả rất rõ.','Hạn chế: giả định các yếu tố khác không đổi hiếm khi đúng trong thực tế, và một số hàng hóa (Veblen, Giffen) không tuân theo luật cầu.','Hạn chế: người tiêu dùng được cho là duy lý, nhưng kinh tế học hành vi cho thấy thói quen, cách trình bày và thông tin hạn chế đều có ảnh hưởng.'],
ex:'Khi Hà Nội tăng giá xăng, nhiều người đi làm chuyển từ xe máy sang xe buýt và tàu điện: đó là di chuyển lên trên đường cầu xăng. Khi một mẫu điện thoại mới ra mắt khiến mẫu cũ lỗi thời, cầu về mẫu cũ dịch chuyển sang trái.',
q:['Phân biệt giữa di chuyển dọc theo và dịch chuyển của đường cầu. [4 điểm]','Di chuyển dọc theo đường cầu chỉ do giá của chính hàng hóa thay đổi (mở rộng hoặc thu hẹp lượng cầu). Dịch chuyển do bất kỳ yếu tố khác như thu nhập, thị hiếu hoặc giá hàng thay thế (tăng hoặc giảm cầu). Ví dụ: giá trà giảm làm di chuyển dọc theo đường cầu trà; giá cà phê tăng làm đường cầu trà dịch sang phải vì trà là hàng thay thế.']});

E('supply',['demand','equilibrium','pes','costs'],
{t:[['Supply','The quantity of a good producers are willing and able to sell at each price in a given time period.'],['Law of supply','As price rises, quantity supplied rises, because higher prices raise profit and cover rising marginal cost.'],['Determinants of supply','Costs of production (wages, raw materials), technology, number of firms, indirect taxes and subsidies, expectations, prices of other goods that firms could produce.'],['Opportunity cost link','The supply curve is the marginal cost curve: it shows the minimum price needed to cover producing one more unit.']],
ev:['Strength: simple and powerful for predicting how firms respond to price and cost changes.','Limitation: assumes profit-maximising firms, but firms may aim for sales, market share or social goals.','Limitation: in the short run supply is often fixed (inelastic), so the curve is steeper than in the long run.'],
ex:'A drought in the Mekong Delta raises the cost of growing rice and cuts harvests: the supply of rice shifts left. A new rice-planting machine lowers unit costs: supply shifts right.',
q:['Explain two factors that could shift the supply curve of smartphones to the right. [4 marks]','(1) Improved technology cuts the cost per phone, so at every price firms are willing to supply more. (2) A government subsidy to manufacturers lowers costs, again raising quantity supplied at each price. Both shift supply right (an increase in supply), unlike a change in the phone\'s own price, which only moves along the curve.']},
{t:[['Cung','Lượng hàng hóa mà nhà sản xuất sẵn sàng và có khả năng bán ở mỗi mức giá trong một khoảng thời gian.'],['Luật cung','Khi giá tăng, lượng cung tăng, vì giá cao hơn làm tăng lợi nhuận và bù đắp chi phí cận biên đang tăng.'],['Các yếu tố quyết định cung','Chi phí sản xuất (tiền lương, nguyên liệu), công nghệ, số lượng doanh nghiệp, thuế gián thu và trợ cấp, kỳ vọng, giá hàng hóa khác mà doanh nghiệp có thể sản xuất.'],['Liên hệ với chi phí cơ hội','Đường cung chính là đường chi phí cận biên: cho biết mức giá tối thiểu cần có để bù đắp việc sản xuất thêm một đơn vị.']],
ev:['Ưu điểm: đơn giản và hiệu quả để dự đoán phản ứng của doanh nghiệp trước thay đổi giá và chi phí.','Hạn chế: giả định doanh nghiệp tối đa hóa lợi nhuận, nhưng họ có thể hướng đến doanh số, thị phần hoặc mục tiêu xã hội.','Hạn chế: trong ngắn hạn cung thường cố định (kém co giãn), nên đường cung dốc hơn so với dài hạn.'],
ex:'Hạn hán ở đồng bằng sông Cửu Long làm tăng chi phí trồng lúa và giảm sản lượng: cung gạo dịch chuyển sang trái. Một máy cấy lúa mới giảm chi phí đơn vị: cung dịch chuyển sang phải.',
q:['Giải thích hai yếu tố có thể làm đường cung điện thoại thông minh dịch chuyển sang phải. [4 điểm]','(1) Công nghệ tốt hơn làm giảm chi phí mỗi chiếc, nên ở mọi mức giá các hãng sẵn sàng cung nhiều hơn. (2) Trợ cấp của chính phủ cho nhà sản xuất làm giảm chi phí, cũng làm tăng lượng cung ở mỗi mức giá. Cả hai làm cung dịch chuyển sang phải (tăng cung), khác với thay đổi giá của chính điện thoại, chỉ làm di chuyển dọc theo đường cung.']});

E('equilibrium',['demand','supply','pricemech','surplus'],
{t:[['Equilibrium price','The price at which quantity demanded equals quantity supplied; there is no tendency for the price to change.'],['Excess demand (shortage)','Quantity demanded exceeds quantity supplied at a price below equilibrium, which pushes the price up.'],['Excess supply (surplus)','Quantity supplied exceeds quantity demanded at a price above equilibrium, which pushes the price down.'],['Comparative statics','Comparing the old and the new equilibrium after a shift in demand or supply, holding everything else constant.']],
ev:['Strength: explains how markets allocate scarce resources without central planning.','Limitation: markets may not clear quickly (sticky prices, such as wages) and may not clear at all if prices are controlled.','Limitation: equilibrium says nothing about equity or about external costs, so it may not be socially optimal.'],
ex:'Before a major concert, ticket demand rises. At the original price there is excess demand, so resale prices climb until quantity demanded equals the limited number of seats.',
q:['Using a diagram, explain how an increase in demand for electric cars affects the equilibrium price and quantity. [4 marks]','Draw D shifting right from D1 to D2 with S unchanged. At the original price there is excess demand, so the price rises. As price rises, quantity supplied extends along S while quantity demanded contracts along D2, until a new equilibrium with a higher price and a higher quantity.']},
{t:[['Giá cân bằng','Mức giá mà tại đó lượng cầu bằng lượng cung; giá không có xu hướng thay đổi.'],['Dư cầu (thiếu hụt)','Lượng cầu lớn hơn lượng cung ở mức giá thấp hơn giá cân bằng, đẩy giá lên.'],['Dư cung (dư thừa)','Lượng cung lớn hơn lượng cầu ở mức giá cao hơn giá cân bằng, kéo giá xuống.'],['Phân tích tĩnh so sánh','So sánh trạng thái cân bằng cũ và mới sau khi cầu hoặc cung dịch chuyển, giữ các yếu tố khác không đổi.']],
ev:['Ưu điểm: giải thích cách thị trường phân bổ nguồn lực khan hiếm mà không cần kế hoạch hóa tập trung.','Hạn chế: thị trường có thể không cân bằng nhanh (giá cứng nhắc như tiền lương) và không cân bằng nếu giá bị kiểm soát.','Hạn chế: cân bằng không nói gì về công bằng hay chi phí ngoại tác, nên có thể không tối ưu về mặt xã hội.'],
ex:'Trước một buổi hòa nhạc lớn, cầu vé tăng. Ở mức giá ban đầu có dư cầu, nên giá bán lại tăng cho đến khi lượng cầu bằng số chỗ ngồi có hạn.',
q:['Sử dụng sơ đồ, giải thích cầu xe điện tăng ảnh hưởng thế nào đến giá và sản lượng cân bằng. [4 điểm]','Vẽ đường D dịch từ D1 sang D2 (sang phải), S không đổi. Ở mức giá ban đầu có dư cầu nên giá tăng. Khi giá tăng, lượng cung mở rộng dọc theo S còn lượng cầu thu hẹp dọc theo D2, cho đến khi đạt cân bằng mới với giá cao hơn và sản lượng cao hơn.']});

E('pricemech',['equilibrium','demand','supply','ppc'],
{t:[['Price mechanism','The system in which prices rise and fall to ration scarce goods and allocate resources through the interaction of demand and supply.'],['Rationing function','When there is a shortage, rising prices ration the good to those most willing and able to pay.'],['Signalling function','Prices signal where resources are scarce or in surplus.'],['Incentive function','Higher prices give producers an incentive to supply more, and lower prices encourage consumers to buy more.']],
ev:['Strength: allocates resources efficiently without central planning, using dispersed information.','Limitation: rationing by willingness to pay can be unfair for the poor, so essentials may need government help.','Limitation: it ignores externalities and does not provide public goods.'],
ex:'When the price of coffee beans rises after a poor harvest, farmers plant more coffee and consumers drink less or switch to tea: the price does the rationing, signalling and incentive work at once.',
q:['Explain the role of the price mechanism in allocating resources in a market economy. [4 marks]','Prices ration scarce goods to those willing and able to pay, signal changes in scarcity so producers know what to make, and create incentives: a high price encourages more production and less consumption, a low price the opposite. Together these decisions move resources to where they are valued most without a central planner.']},
{t:[['Cơ chế giá','Hệ thống trong đó giá tăng giảm để phân phối hàng hóa khan hiếm và phân bổ nguồn lực thông qua tương tác giữa cung và cầu.'],['Chức năng phân phối','Khi thiếu hụt, giá tăng phân phối hàng hóa cho những người sẵn sàng và có khả năng trả giá cao nhất.'],['Chức năng tín hiệu','Giá báo hiệu nơi nào nguồn lực khan hiếm hoặc dư thừa.'],['Chức năng khuyến khích','Giá cao khuyến khích nhà sản xuất cung nhiều hơn, giá thấp khuyến khích người tiêu dùng mua nhiều hơn.']],
ev:['Ưu điểm: phân bổ nguồn lực hiệu quả mà không cần kế hoạch hóa tập trung, dựa trên thông tin phân tán.','Hạn chế: phân phối theo khả năng chi trả có thể bất công với người nghèo, nên hàng thiết yếu cần sự hỗ trợ của chính phủ.','Hạn chế: bỏ qua ngoại tác và không cung cấp hàng hóa công cộng.'],
ex:'Khi giá hạt cà phê tăng sau vụ mùa kém, nông dân trồng thêm cà phê còn người tiêu dùng uống ít đi hoặc chuyển sang trà: giá đồng thời làm ba việc là phân phối, báo hiệu và khuyến khích.',
q:['Giải thích vai trò của cơ chế giá trong việc phân bổ nguồn lực ở nền kinh tế thị trường. [4 điểm]','Giá phân phối hàng khan hiếm cho người sẵn sàng và có khả năng trả, báo hiệu thay đổi mức khan hiếm để nhà sản xuất biết nên sản xuất gì, và tạo động lực: giá cao khuyến khích sản xuất nhiều hơn và tiêu dùng ít hơn, giá thấp thì ngược lại. Nhờ vậy nguồn lực chuyển đến nơi được đánh giá cao nhất mà không cần người lập kế hoạch trung ương.']});

E('ppc',['nine','fop','lrac'],
{t:[['Production possibility curve','Shows the maximum combinations of two goods an economy can produce with all resources fully and efficiently employed.'],['Opportunity cost','The value of the next best alternative given up; on the PPC it is the slope, the amount of one good given up to get one more of the other.'],['Productive efficiency','Producing on the curve; no extra output of one good without producing less of the other.'],['Economic growth','An outward shift of the PPC from more or better resources or technology.']],
ev:['Strength: a clear way to show scarcity, choice, opportunity cost and growth in one diagram.','Limitation: only two goods are shown, but real economies produce thousands.','Limitation: it shows what is possible, not what is desirable, so it cannot say which point is best (allocative efficiency).'],
ex:'Vietnam can use farmland for rice or for coffee. Moving land from rice to coffee gives up some rice for more coffee: that rice is the opportunity cost. Better irrigation shifts the PPC outward.',
q:['Explain, using a PPC diagram, what a point inside the curve represents. [3 marks]','A point inside the PPC means resources are unemployed or used inefficiently (for example during a recession). The economy could produce more of at least one good without producing less of the other, by moving to the curve.']},
{t:[['Đường giới hạn khả năng sản xuất','Thể hiện các kết hợp tối đa của hai hàng hóa mà nền kinh tế có thể sản xuất khi mọi nguồn lực được sử dụng đầy đủ và hiệu quả.'],['Chi phí cơ hội','Giá trị của phương án tốt nhất tiếp theo bị bỏ qua; trên PPC đó là độ dốc, lượng hàng này phải giảm để có thêm một đơn vị hàng kia.'],['Hiệu quả sản xuất','Sản xuất trên đường giới hạn; không thể tăng sản lượng hàng này mà không giảm hàng kia.'],['Tăng trưởng kinh tế','Sự dịch chuyển ra ngoài của PPC do có thêm hoặc tốt hơn về nguồn lực hay công nghệ.']],
ev:['Ưu điểm: cách trình bày rõ ràng về khan hiếm, lựa chọn, chi phí cơ hội và tăng trưởng trong cùng một sơ đồ.','Hạn chế: chỉ có hai hàng hóa, trong khi nền kinh tế thực sản xuất hàng nghìn loại.','Hạn chế: cho biết điều có thể làm, không phải điều nên làm, nên không chỉ ra điểm nào tốt nhất (hiệu quả phân bổ).'],
ex:'Việt Nam có thể dùng đất nông nghiệp để trồng lúa hoặc cà phê. Chuyển đất từ lúa sang cà phê là bỏ bớt lúa để có thêm cà phê: lượng lúa đó là chi phí cơ hội. Thủy lợi tốt hơn làm PPC dịch chuyển ra ngoài.',
q:['Giải thích, dùng sơ đồ PPC, một điểm nằm bên trong đường cong thể hiện điều gì. [3 điểm]','Điểm nằm trong PPC nghĩa là nguồn lực bị bỏ không hoặc dùng kém hiệu quả (ví dụ trong suy thoái). Nền kinh tế có thể sản xuất nhiều hơn ít nhất một hàng hóa mà không phải giảm hàng kia, bằng cách chuyển lên đường giới hạn.']});

E('ped',['tr','yed','pes','veblen'],
{t:[['PED formula','%ΔQd ÷ %ΔP. Always negative; ignore the sign and compare the size with 1.'],['Elastic and inelastic','|PED| > 1: elastic (quantity responds more than price). |PED| < 1: inelastic. |PED| = 1: unit elastic.'],['Determinants','Availability of substitutes, necessity vs luxury, share of income spent, time period, how narrowly the market is defined, addictiveness.'],['Special cases','Perfectly inelastic (PED = 0, vertical); perfectly elastic (PED = ∞, horizontal).']],
ev:['Strength: helps firms choose prices and governments predict the effect of taxes.','Limitation: PED changes along a straight-line curve, so a single number is only valid at one point.','Limitation: in practice PED is estimated from past data and varies with time, income and tastes.'],
ex:'Cigarettes and petrol have few substitutes and are habit-forming, so demand is inelastic and a tax raises a lot of revenue. Specific brands of coffee have close substitutes, so a price rise causes a large fall in sales.',
q:['A 5% price rise leads to a 15% fall in quantity demanded. Calculate PED and state what it means. [3 marks]','PED = −15% ÷ 5% = −3. The absolute value 3 is greater than 1, so demand is price elastic: quantity demanded is very responsive to price.']},
{t:[['Công thức PED','%ΔQd ÷ %ΔP. Luôn âm; bỏ dấu và so sánh độ lớn với 1.'],['Co giãn và kém co giãn','|PED| > 1: co giãn (lượng thay đổi nhiều hơn giá). |PED| < 1: kém co giãn. |PED| = 1: co giãn đơn vị.'],['Các yếu tố quyết định','Hàng thay thế sẵn có, hàng thiết yếu hay xa xỉ, tỷ trọng trong thu nhập, khoảng thời gian, thị trường được định nghĩa hẹp hay rộng, tính gây nghiện.'],['Trường hợp đặc biệt','Hoàn toàn không co giãn (PED = 0, đường thẳng đứng); hoàn toàn co giãn (PED = ∞, đường nằm ngang).']],
ev:['Ưu điểm: giúp doanh nghiệp chọn giá và chính phủ dự đoán tác động của thuế.','Hạn chế: PED thay đổi dọc theo đường cầu tuyến tính, nên một con số chỉ đúng tại một điểm.','Hạn chế: trên thực tế PED được ước tính từ dữ liệu quá khứ và thay đổi theo thời gian, thu nhập và thị hiếu.'],
ex:'Thuốc lá và xăng ít hàng thay thế và gây thói quen, nên cầu kém co giãn và đánh thuế thu được nhiều tiền. Một thương hiệu cà phê cụ thể có nhiều hàng thay thế gần gũi, nên tăng giá làm doanh số giảm mạnh.',
q:['Giá tăng 5% làm lượng cầu giảm 15%. Tính PED và nêu ý nghĩa. [3 điểm]','PED = −15% ÷ 5% = −3. Giá trị tuyệt đối 3 lớn hơn 1 nên cầu co giãn theo giá: lượng cầu rất nhạy với giá.']});

E('tr',['ped','revenue','yed'],
{t:[['Total revenue','Price × quantity sold. It is the area of the rectangle under the price on a demand diagram.'],['Elastic range','Top half of a straight demand line: cutting price raises TR.'],['Inelastic range','Bottom half: raising price raises TR.'],['Unit elastic point','The midpoint, where TR is at a maximum and PED = 1.']],
ev:['Strength: gives firms a rule for pricing and promotions.','Limitation: ignores costs. A rise in TR does not always mean a rise in profit.','Limitation: assumes a straight-line demand curve and that other factors stay constant.'],
ex:'Cinemas often cut prices on quiet weekdays (elastic demand) and keep them high at weekends (inelastic demand), which maximises revenue across the week.',
q:['Explain why a firm facing inelastic demand should not cut price to raise revenue. [3 marks]','If demand is inelastic, the percentage rise in quantity is smaller than the percentage fall in price, so total revenue falls. The firm would earn more by raising price.']},
{t:[['Tổng doanh thu','Giá × lượng bán. Là diện tích hình chữ nhật dưới mức giá trên đồ thị cầu.'],['Đoạn co giãn','Nửa trên của đường cầu thẳng: giảm giá làm tăng TR.'],['Đoạn kém co giãn','Nửa dưới: tăng giá làm tăng TR.'],['Điểm co giãn đơn vị','Điểm giữa, nơi TR đạt cực đại và PED = 1.']],
ev:['Ưu điểm: cho doanh nghiệp một quy tắc định giá và khuyến mãi.','Hạn chế: bỏ qua chi phí. TR tăng không phải lúc nào cũng làm lợi nhuận tăng.','Hạn chế: giả định đường cầu thẳng và các yếu tố khác không đổi.'],
ex:'Rạp chiếu phim thường giảm giá vào các ngày thường vắng khách (cầu co giãn) và giữ giá cao vào cuối tuần (cầu kém co giãn), nhờ đó tối đa hóa doanh thu cả tuần.',
q:['Giải thích tại sao doanh nghiệp có cầu kém co giãn không nên giảm giá để tăng doanh thu. [3 điểm]','Nếu cầu kém co giãn, phần trăm tăng của lượng nhỏ hơn phần trăm giảm của giá, nên tổng doanh thu giảm. Doanh nghiệp sẽ thu nhiều hơn nếu tăng giá.']});

E('yed',['ped','pes','demand'],
{t:[['YED formula','%ΔQd ÷ %Δincome.'],['Normal good','YED > 0: demand rises with income. Luxuries have YED > 1; necessities 0 < YED < 1.'],['Inferior good','YED < 0: demand falls as income rises (for example instant noodles).'],['Sign and size','The sign shows the type of good; the size shows how sensitive demand is to income.']],
ev:['Strength: helps firms forecast demand during growth or recession and plan product ranges.','Limitation: the category of a good can change with income level and across countries.','Limitation: assumes other determinants stay constant when income changes.'],
ex:'As incomes rise in Vietnam, demand for motorbikes and then cars grows faster than income (luxury, YED > 1) while demand for rice grows slowly or falls (necessity or inferior).',
q:['Income rises 10% and demand for restaurant meals rises 15%. Calculate YED and classify the good. [3 marks]','YED = 15 ÷ 10 = +1.5. It is positive, so a normal good, and greater than 1, so a luxury with income elastic demand.']},
{t:[['Công thức YED','%ΔQd ÷ %Δthu nhập.'],['Hàng hóa thông thường','YED > 0: cầu tăng khi thu nhập tăng. Hàng xa xỉ có YED > 1; hàng thiết yếu 0 < YED < 1.'],['Hàng hóa thứ cấp','YED < 0: cầu giảm khi thu nhập tăng (ví dụ mì gói).'],['Dấu và độ lớn','Dấu cho biết loại hàng; độ lớn cho biết cầu nhạy với thu nhập đến mức nào.']],
ev:['Ưu điểm: giúp doanh nghiệp dự báo cầu khi kinh tế tăng trưởng hoặc suy thoái và lên kế hoạch danh mục sản phẩm.','Hạn chế: phân loại hàng hóa có thể thay đổi theo mức thu nhập và giữa các quốc gia.','Hạn chế: giả định các yếu tố khác không đổi khi thu nhập thay đổi.'],
ex:'Khi thu nhập ở Việt Nam tăng, cầu xe máy rồi ô tô tăng nhanh hơn thu nhập (xa xỉ, YED > 1) còn cầu gạo tăng chậm hoặc giảm (thiết yếu hoặc thứ cấp).',
q:['Thu nhập tăng 10% và cầu bữa ăn nhà hàng tăng 15%. Tính YED và phân loại hàng hóa. [3 điểm]','YED = 15 ÷ 10 = +1,5. Dương nên là hàng hóa thông thường, và lớn hơn 1 nên là hàng xa xỉ với cầu co giãn theo thu nhập.']});

E('pes',['supply','ped','costs'],
{t:[['PES formula','%ΔQs ÷ %ΔP. Positive.'],['Determinants','Spare capacity, stocks, ease of switching production, number of firms, time period, perishability.'],['Short run vs long run','Supply is usually more inelastic in the short run because inputs are fixed; it becomes more elastic as firms adjust.'],['Special cases','Perfectly inelastic (PES = 0, vertical); perfectly elastic (PES = ∞, horizontal).']],
ev:['Strength: explains why prices of farm goods swing sharply after supply shocks.','Limitation: PES is difficult to measure and changes with the time frame.','Limitation: ignores that firms may hold unused capacity and decide not to respond.'],
ex:'Wheat has inelastic supply in the short run because crops take a season to grow; a poor harvest sends prices up sharply. A shirt factory with spare machines has elastic supply and can raise output within days.',
q:['A 20% price rise leads to a 10% rise in quantity supplied. Calculate PES and comment. [3 marks]','PES = 10 ÷ 20 = 0.5. This is less than 1, so supply is inelastic: producers cannot increase output much when the price rises.']},
{t:[['Công thức PES','%ΔQs ÷ %ΔP. Dương.'],['Các yếu tố quyết định','Công suất dư thừa, hàng tồn kho, mức dễ chuyển đổi sản xuất, số lượng doanh nghiệp, khoảng thời gian, tính dễ hỏng.'],['Ngắn hạn và dài hạn','Cung thường kém co giãn hơn trong ngắn hạn vì đầu vào cố định; trở nên co giãn hơn khi doanh nghiệp điều chỉnh.'],['Trường hợp đặc biệt','Hoàn toàn không co giãn (PES = 0, đường thẳng đứng); hoàn toàn co giãn (PES = ∞, đường nằm ngang).']],
ev:['Ưu điểm: giải thích vì sao giá nông sản dao động mạnh sau các cú sốc cung.','Hạn chế: PES khó đo và thay đổi theo khung thời gian.','Hạn chế: bỏ qua việc doanh nghiệp có thể giữ công suất dư và quyết định không phản ứng.'],
ex:'Lúa mì có cung kém co giãn trong ngắn hạn vì cây trồng cần một mùa vụ; mùa màng kém đẩy giá tăng mạnh. Một nhà máy may có máy móc dư có cung co giãn và có thể tăng sản lượng trong vài ngày.',
q:['Giá tăng 20% làm lượng cung tăng 10%. Tính PES và nhận xét. [3 điểm]','PES = 10 ÷ 20 = 0,5. Nhỏ hơn 1 nên cung kém co giãn: nhà sản xuất không thể tăng nhiều sản lượng khi giá tăng.']});

E('veblen',['demand','ped','yed'],
{t:[['Veblen good','A luxury good whose demand rises as its price rises because a high price signals status.'],['Conspicuous consumption','Buying goods to display wealth or status rather than for their usefulness.'],['Speculative demand','Demand driven by the expectation that the price will rise further (for example housing, gold, shares).'],['Giffen good','An extremely inferior staple whose demand rises with its price; very rare.']],
ev:['Strength: explains real behaviour that the standard law of demand cannot.','Limitation: Veblen effects apply only above some price range, and tastes change.','Limitation: speculative bubbles can collapse suddenly and cause market failure.'],
ex:'A luxury handbag brand that cut its prices would lose its exclusive image and sales could fall. Rising house prices attract speculators, which pushes prices up further.',
q:['Explain why the demand curve for a Veblen good may slope upward. [3 marks]','For a Veblen good, high price signals exclusivity and status. A rise in price therefore increases the satisfaction from owning it, so quantity demanded rises with price, contrary to the law of demand.']},
{t:[['Hàng hóa Veblen','Hàng xa xỉ có cầu tăng khi giá tăng vì giá cao thể hiện địa vị.'],['Tiêu dùng phô trương','Mua hàng để thể hiện sự giàu có hoặc địa vị chứ không phải vì công dụng.'],['Cầu đầu cơ','Cầu xuất phát từ kỳ vọng giá sẽ còn tăng (ví dụ nhà đất, vàng, cổ phiếu).'],['Hàng hóa Giffen','Hàng thiết yếu thứ cấp cực đoan có cầu tăng khi giá tăng; rất hiếm.']],
ev:['Ưu điểm: giải thích hành vi thực tế mà luật cầu thông thường không giải thích được.','Hạn chế: hiệu ứng Veblen chỉ có trong một khoảng giá nhất định và thị hiếu thay đổi.','Hạn chế: bong bóng đầu cơ có thể vỡ đột ngột và gây thất bại thị trường.'],
ex:'Một thương hiệu túi xách cao cấp mà giảm giá sẽ mất hình ảnh độc quyền và doanh số có thể giảm. Giá nhà tăng thu hút giới đầu cơ, càng đẩy giá lên cao hơn.',
q:['Giải thích tại sao đường cầu của hàng Veblen có thể dốc lên. [3 điểm]','Với hàng Veblen, giá cao thể hiện sự độc quyền và địa vị. Giá tăng làm tăng mức thỏa mãn khi sở hữu, nên lượng cầu tăng cùng với giá, trái với luật cầu.']});

E('surplus',['equilibrium','ceiling','floor','tax'],
{t:[['Consumer surplus','The difference between what consumers are willing to pay and what they actually pay; the area below the demand curve and above the price.'],['Producer surplus','The difference between the price producers receive and the minimum they would accept; the area above the supply curve and below the price.'],['Allocative efficiency','Achieved where marginal benefit equals marginal cost; total surplus is at a maximum at competitive equilibrium.'],['Deadweight loss','The loss of total surplus when output is not at the efficient level.']],
ev:['Strength: a common unit (money) to compare gains for consumers and producers.','Limitation: surplus is hard to measure in practice and ignores the distribution of income.','Limitation: ignores externalities, so maximum private surplus is not always maximum social welfare.'],
ex:'If you would pay $5 for a bubble tea but the price is $3, your consumer surplus is $2. A shop that would sell at $1.50 and sells at $3 earns $1.50 producer surplus.',
q:['Using a diagram, show consumer and producer surplus at the market equilibrium. [3 marks]','Draw D and S meeting at P*, Q*. Consumer surplus is the triangle between D and P* above the price; producer surplus is the triangle between P* and S below the price. Total surplus is the sum.']},
{t:[['Thặng dư tiêu dùng','Chênh lệch giữa mức người tiêu dùng sẵn sàng trả và mức họ thực trả; là diện tích dưới đường cầu và trên mức giá.'],['Thặng dư sản xuất','Chênh lệch giữa mức giá nhà sản xuất nhận được và mức tối thiểu họ chấp nhận; là diện tích trên đường cung và dưới mức giá.'],['Hiệu quả phân bổ','Đạt được khi lợi ích cận biên bằng chi phí cận biên; tổng thặng dư cực đại ở cân bằng cạnh tranh.'],['Tổn thất vô ích','Phần tổng thặng dư mất đi khi sản lượng không ở mức hiệu quả.']],
ev:['Ưu điểm: dùng một đơn vị chung (tiền) để so sánh lợi ích của người tiêu dùng và nhà sản xuất.','Hạn chế: thặng dư khó đo trên thực tế và bỏ qua phân phối thu nhập.','Hạn chế: bỏ qua ngoại tác, nên thặng dư tư nhân tối đa chưa chắc là phúc lợi xã hội tối đa.'],
ex:'Nếu bạn sẵn sàng trả 5 đô la cho ly trà sữa nhưng giá là 3 đô la, thặng dư tiêu dùng của bạn là 2 đô la. Quán sẵn sàng bán với 1,5 đô la mà bán với 3 đô la thu được thặng dư sản xuất 1,5 đô la.',
q:['Dùng sơ đồ, chỉ ra thặng dư tiêu dùng và sản xuất tại cân bằng thị trường. [3 điểm]','Vẽ D và S cắt nhau tại P*, Q*. Thặng dư tiêu dùng là tam giác giữa D và P* phía trên giá; thặng dư sản xuất là tam giác giữa P* và S phía dưới giá. Tổng thặng dư là tổng hai phần.']});

E('ceiling',['floor','surplus','equilibrium'],
{t:[['Price ceiling','A legal maximum price set below the equilibrium price to make a good more affordable.'],['Shortage','At the ceiling, quantity demanded exceeds quantity supplied.'],['Black market','An illegal market where goods trade above the ceiling price.'],['Welfare effects','Consumers who can buy gain, but total surplus falls and a deadweight loss appears.']],
ev:['Strength: makes essentials such as rent or food more affordable for low-income households.','Limitation: causes shortages, queues, lower quality and black markets.','Limitation: reduces the incentive for producers to supply, which worsens the shortage over time.'],
ex:'Rent controls in some cities keep rents low for tenants but landlords supply fewer homes and maintain them less, so waiting lists grow.',
q:['Explain two consequences of setting a price ceiling below equilibrium. [4 marks]','(1) A shortage: at the lower price quantity demanded exceeds quantity supplied. (2) A black market or non-price rationing (queues): some buyers pay more than the ceiling, which defeats the policy. There is also a deadweight loss because output falls below the efficient level.']},
{t:[['Giá trần','Mức giá tối đa theo luật, đặt thấp hơn giá cân bằng để hàng hóa dễ mua hơn.'],['Thiếu hụt','Tại giá trần, lượng cầu lớn hơn lượng cung.'],['Chợ đen','Thị trường bất hợp pháp nơi hàng được bán cao hơn giá trần.'],['Tác động đến phúc lợi','Người tiêu dùng mua được thì có lợi, nhưng tổng thặng dư giảm và xuất hiện tổn thất vô ích.']],
ev:['Ưu điểm: giúp hàng thiết yếu như tiền thuê nhà hoặc lương thực dễ mua hơn với hộ thu nhập thấp.','Hạn chế: gây thiếu hụt, xếp hàng, chất lượng thấp và chợ đen.','Hạn chế: giảm động lực cung ứng của nhà sản xuất, làm tình trạng thiếu hụt tệ hơn theo thời gian.'],
ex:'Kiểm soát giá thuê nhà ở một số thành phố giữ giá thuê thấp cho người thuê nhưng chủ nhà cung cấp ít nhà hơn và bảo trì kém hơn, nên danh sách chờ ngày càng dài.',
q:['Giải thích hai hệ quả của việc đặt giá trần thấp hơn giá cân bằng. [4 điểm]','(1) Thiếu hụt: ở mức giá thấp hơn, lượng cầu lớn hơn lượng cung. (2) Chợ đen hoặc phân phối phi giá (xếp hàng): một số người mua trả cao hơn giá trần, làm chính sách mất tác dụng. Ngoài ra có tổn thất vô ích vì sản lượng thấp hơn mức hiệu quả.']});

E('floor',['ceiling','surplus','subsidy'],
{t:[['Price floor','A legal minimum price set above the equilibrium price to protect producers or workers.'],['Surplus (excess supply)','At the floor, quantity supplied exceeds quantity demanded.'],['Buffer stock','The government buys the surplus at the floor price, stores it, and sells it when prices are high.'],['Minimum wage','A price floor in the labour market, which may cause unemployment if set above equilibrium.']],
ev:['Strength: supports farmers\' incomes and low-paid workers.','Limitation: creates surplus that must be bought, stored or destroyed, costing taxpayers.','Limitation: consumers pay a higher price and resources stay in the market longer than efficient.'],
ex:'EU farm price supports in the past produced "butter mountains" and "wine lakes": surpluses the government bought and stored.',
q:['Explain why a minimum price above equilibrium creates a surplus. [3 marks]','At a price above equilibrium, producers want to supply more while consumers want to buy less, so quantity supplied exceeds quantity demanded. The market cannot clear because the price is not allowed to fall.']},
{t:[['Giá sàn','Mức giá tối thiểu theo luật, đặt cao hơn giá cân bằng để bảo vệ nhà sản xuất hoặc người lao động.'],['Dư thừa (dư cung)','Tại giá sàn, lượng cung lớn hơn lượng cầu.'],['Kho đệm','Chính phủ mua phần dư thừa ở giá sàn, cất giữ và bán ra khi giá cao.'],['Lương tối thiểu','Giá sàn trên thị trường lao động, có thể gây thất nghiệp nếu đặt cao hơn mức cân bằng.']],
ev:['Ưu điểm: hỗ trợ thu nhập của nông dân và người lao động lương thấp.','Hạn chế: tạo ra dư thừa phải mua, cất giữ hoặc tiêu hủy, gây tốn kém cho người đóng thuế.','Hạn chế: người tiêu dùng trả giá cao hơn và nguồn lực ở lại thị trường lâu hơn mức hiệu quả.'],
ex:'Chính sách hỗ trợ giá nông sản của EU trước đây tạo ra những "núi bơ" và "hồ rượu": lượng dư thừa mà chính phủ phải mua và cất giữ.',
q:['Giải thích vì sao mức giá tối thiểu cao hơn cân bằng tạo ra dư thừa. [3 điểm]','Ở mức giá cao hơn cân bằng, nhà sản xuất muốn cung nhiều hơn còn người tiêu dùng muốn mua ít hơn, nên lượng cung vượt lượng cầu. Thị trường không thể cân bằng vì giá không được phép giảm.']});

E('tax',['advalorem','subsidy','ped','negext'],
{t:[['Indirect tax','A tax on spending (for example VAT or excise) that raises the firm\'s costs and shifts supply left by the amount of the tax.'],['Tax incidence','Who actually bears the burden: the share paid by consumers and the share paid by producers.'],['Tax revenue','Tax per unit × quantity sold after the tax.'],['Deadweight loss of tax','Surplus lost because quantity falls below the efficient level.']],
ev:['Strength: raises government revenue and can correct negative externalities (for example a carbon tax).','Limitation: if demand is inelastic, consumers bear most of the tax, which is regressive.','Limitation: may encourage tax evasion and black markets for goods like cigarettes.'],
ex:'A tax on cigarettes raises the price and reduces smoking. Because demand is inelastic the quantity falls only slightly, so revenue is high and consumers bear most of the burden.',
q:['Using a diagram, show how an indirect tax of $2 changes price and quantity. [4 marks]','Draw S1 and the parallel S2 vertically $2 above it. The new equilibrium is at a higher price and lower quantity. The price rises by less than $2; the consumer pays the rise in price, the producer bears the rest of the $2.']},
{t:[['Thuế gián thu','Thuế đánh vào chi tiêu (ví dụ VAT hoặc thuế tiêu thụ đặc biệt) làm tăng chi phí của doanh nghiệp và dịch chuyển cung sang trái đúng bằng mức thuế.'],['Gánh nặng thuế','Ai thực sự chịu thuế: phần do người tiêu dùng trả và phần do nhà sản xuất trả.'],['Thu thuế','Thuế mỗi đơn vị × lượng bán sau thuế.'],['Tổn thất vô ích do thuế','Thặng dư mất đi vì sản lượng giảm xuống dưới mức hiệu quả.']],
ev:['Ưu điểm: tăng thu ngân sách và có thể điều chỉnh ngoại tác tiêu cực (ví dụ thuế carbon).','Hạn chế: nếu cầu kém co giãn, người tiêu dùng chịu phần lớn thuế, gây tính lũy thoái.','Hạn chế: có thể khuyến khích trốn thuế và chợ đen với hàng như thuốc lá.'],
ex:'Thuế thuốc lá làm tăng giá và giảm hút thuốc. Vì cầu kém co giãn nên sản lượng chỉ giảm nhẹ, thu thuế cao và người tiêu dùng chịu phần lớn gánh nặng.',
q:['Dùng sơ đồ, chỉ ra thuế gián thu 2 đô la làm thay đổi giá và sản lượng thế nào. [4 điểm]','Vẽ S1 và S2 song song nằm cao hơn 2 đô la theo phương thẳng đứng. Cân bằng mới có giá cao hơn và sản lượng thấp hơn. Giá tăng ít hơn 2 đô la; người tiêu dùng trả phần giá tăng, nhà sản xuất chịu phần còn lại của 2 đô la.']});

E('advalorem',['tax','ped','revenue'],
{t:[['Ad valorem tax','A tax set as a percentage of the price (for example VAT at 10%).'],['Specific tax','A fixed amount per unit; shifts supply in a parallel way.'],['Pivot','An ad valorem tax makes the supply curve pivot to the left: the gap with the original curve widens as the price rises.'],['Tax per unit','Percentage × price, so the amount per unit is larger at higher prices.']],
ev:['Strength: tax revenue rises automatically with inflation and with higher prices.','Limitation: harder to compute than a fixed tax, and it hits expensive goods more heavily.','Limitation: like all indirect taxes, it can be regressive for essential goods.'],
ex:'VAT of 10% adds $1 to a $10 meal and $100 to a $1,000 laptop, so the supply curve for each pivots by the same percentage.',
q:['Compare the effect on the supply curve of a specific tax and an ad valorem tax. [4 marks]','A specific tax is a fixed amount per unit, so the supply curve shifts up in parallel. An ad valorem tax is a percentage of price, so the supply curve pivots: the vertical gap between old and new supply grows as price rises.']},
{t:[['Thuế theo giá trị','Thuế đặt theo tỷ lệ phần trăm của giá (ví dụ VAT 10%).'],['Thuế theo đơn vị','Số tiền cố định trên mỗi đơn vị; làm cung dịch chuyển song song.'],['Xoay đường cung','Thuế theo giá trị làm đường cung xoay sang trái: khoảng cách với đường ban đầu rộng ra khi giá tăng.'],['Thuế mỗi đơn vị','Tỷ lệ phần trăm × giá, nên số tiền trên mỗi đơn vị lớn hơn ở mức giá cao.']],
ev:['Ưu điểm: thu thuế tự động tăng theo lạm phát và giá cao hơn.','Hạn chế: khó tính hơn thuế cố định, và đánh nặng hơn vào hàng đắt tiền.','Hạn chế: như mọi thuế gián thu, có thể lũy thoái với hàng thiết yếu.'],
ex:'VAT 10% cộng thêm 1 đô la vào bữa ăn 10 đô la và 100 đô la vào chiếc laptop 1.000 đô la, nên đường cung của mỗi loại xoay theo cùng một tỷ lệ phần trăm.',
q:['So sánh tác động lên đường cung của thuế theo đơn vị và thuế theo giá trị. [4 điểm]','Thuế theo đơn vị là số tiền cố định mỗi đơn vị nên đường cung dịch chuyển lên song song. Thuế theo giá trị là phần trăm của giá nên đường cung xoay: khoảng cách theo chiều dọc giữa cung cũ và mới tăng khi giá tăng.']});

E('subsidy',['tax','posext','floor'],
{t:[['Subsidy','A payment from the government to producers (or consumers) that lowers costs and shifts supply right by the amount of the subsidy.'],['Subsidy cost','Subsidy per unit × quantity sold after the subsidy.'],['Incidence of a subsidy','The benefit is shared between consumers (lower price) and producers (higher price received).'],['Opportunity cost','Money spent on the subsidy cannot be spent on health, education or other priorities.']],
ev:['Strength: encourages production or consumption of merit goods and goods with positive externalities (for example solar panels, vaccines).','Limitation: costs taxpayers and has an opportunity cost.','Limitation: firms may become dependent on it, and removing it later is politically difficult.'],
ex:'Government subsidies for electric vehicles lower their price, raising sales and reducing pollution, but cost the budget a large sum.',
q:['Using a diagram, explain how a subsidy affects the market for solar panels. [4 marks]','The subsidy lowers costs so supply shifts right (S1 to S2). Price falls from P1 to P2, quantity rises from Q1 to Q2. Consumers gain from the lower price and producers receive a higher price including the subsidy. The cost to the government is the subsidy per unit × Q2.']},
{t:[['Trợ cấp','Khoản tiền chính phủ trả cho nhà sản xuất (hoặc người tiêu dùng) giúp giảm chi phí và dịch chuyển cung sang phải đúng bằng mức trợ cấp.'],['Chi phí trợ cấp','Trợ cấp mỗi đơn vị × lượng bán sau trợ cấp.'],['Phân chia lợi ích trợ cấp','Lợi ích được chia giữa người tiêu dùng (giá thấp hơn) và nhà sản xuất (giá nhận được cao hơn).'],['Chi phí cơ hội','Tiền chi cho trợ cấp không thể dùng cho y tế, giáo dục hay các ưu tiên khác.']],
ev:['Ưu điểm: khuyến khích sản xuất hoặc tiêu dùng hàng hóa khuyến dụng và hàng có ngoại tác tích cực (ví dụ tấm pin mặt trời, vắc-xin).','Hạn chế: tốn tiền người đóng thuế và có chi phí cơ hội.','Hạn chế: doanh nghiệp có thể phụ thuộc, và việc dỡ bỏ sau này khó về mặt chính trị.'],
ex:'Trợ cấp của chính phủ cho xe điện làm giảm giá, tăng doanh số và giảm ô nhiễm, nhưng tốn một khoản lớn ngân sách.',
q:['Dùng sơ đồ, giải thích trợ cấp ảnh hưởng thế nào đến thị trường tấm pin mặt trời. [4 điểm]','Trợ cấp giảm chi phí nên cung dịch sang phải (S1 sang S2). Giá giảm từ P1 xuống P2, sản lượng tăng từ Q1 lên Q2. Người tiêu dùng được lợi vì giá thấp hơn và nhà sản xuất nhận giá cao hơn khi tính cả trợ cấp. Chi phí của chính phủ là trợ cấp mỗi đơn vị × Q2.']});

E('negext',['posext','tax','goods','surplus'],
{t:[['Externality','A cost or benefit to a third party who is not part of the transaction.'],['Marginal private cost (MPC)','The cost to the producer of making one more unit.'],['Marginal social cost (MSC)','MPC plus the external cost; the full cost to society.'],['Welfare loss','Overproduction between the social optimum and the market quantity; the triangle between MSC and MSB.']],
ev:['Strength: the model shows precisely how much a tax or regulation is needed to reach the social optimum.','Limitation: external costs are very hard to measure in money terms.','Limitation: the policy chosen (tax, permits, regulation) has its own costs and may cause unemployment or evasion.'],
ex:'A factory that pollutes a river imposes costs on fishermen and nearby residents. Output is above the socially optimal level until a pollution tax raises its private cost.',
q:['Explain why negative externalities of production lead to market failure. [4 marks]','Producers consider only their private costs, so the market equilibrium is where MPC = MSB. Because MSC is above MPC, the social optimum is lower. The market overproduces, resources are misallocated, and there is a welfare loss.']},
{t:[['Ngoại tác','Chi phí hoặc lợi ích đối với bên thứ ba không tham gia giao dịch.'],['Chi phí cá nhân cận biên (MPC)','Chi phí để nhà sản xuất làm thêm một đơn vị.'],['Chi phí xã hội cận biên (MSC)','MPC cộng chi phí ngoại tác; toàn bộ chi phí đối với xã hội.'],['Tổn thất phúc lợi','Sản xuất vượt mức tối ưu xã hội so với sản lượng thị trường; tam giác giữa MSC và MSB.']],
ev:['Ưu điểm: mô hình chỉ ra chính xác mức thuế hoặc quy định cần thiết để đạt tối ưu xã hội.','Hạn chế: chi phí ngoại tác rất khó đo bằng tiền.','Hạn chế: chính sách được chọn (thuế, giấy phép, quy định) có chi phí riêng và có thể gây thất nghiệp hoặc trốn tránh.'],
ex:'Nhà máy xả nước thải xuống sông gây thiệt hại cho ngư dân và dân cư gần đó. Sản lượng cao hơn mức tối ưu xã hội cho đến khi thuế ô nhiễm làm tăng chi phí cá nhân của nhà máy.',
q:['Giải thích vì sao ngoại tác tiêu cực trong sản xuất dẫn đến thất bại thị trường. [4 điểm]','Nhà sản xuất chỉ xét chi phí cá nhân nên cân bằng thị trường ở nơi MPC = MSB. Vì MSC cao hơn MPC nên mức tối ưu xã hội thấp hơn. Thị trường sản xuất quá mức, phân bổ sai nguồn lực và có tổn thất phúc lợi.']});

E('posext',['negext','subsidy','goods'],
{t:[['Positive externality','A benefit to a third party, such as herd immunity from vaccination.'],['Marginal social benefit (MSB)','MPB plus the external benefit.'],['Under-provision','The market produces less than the social optimum because consumers ignore the external benefit.'],['Merit good link','Education and healthcare are merit goods: under-consumed because people undervalue the benefits.']],
ev:['Strength: justifies subsidies, public provision and information campaigns.','Limitation: hard to measure the size of the external benefit.','Limitation: subsidies cost taxpayers and may be captured by producers.'],
ex:'Education gives wider benefits (productivity, lower crime) beyond the student. Without support, families under-invest, so governments subsidise schools.',
q:['Explain, using a diagram, why a positive externality of consumption leads to under-consumption. [4 marks]','Consumers equate MPB with MPC and ignore the external benefit, so the market quantity is Q1. The social optimum is where MSB = MC at Q2 > Q1. The gap is the welfare loss from under-consumption.']},
{t:[['Ngoại tác tích cực','Lợi ích đối với bên thứ ba, chẳng hạn miễn dịch cộng đồng nhờ tiêm chủng.'],['Lợi ích xã hội cận biên (MSB)','MPB cộng lợi ích ngoại tác.'],['Cung ứng thiếu','Thị trường sản xuất ít hơn mức tối ưu xã hội vì người tiêu dùng bỏ qua lợi ích ngoại tác.'],['Liên hệ hàng khuyến dụng','Giáo dục và y tế là hàng khuyến dụng: bị tiêu dùng thiếu vì mọi người đánh giá thấp lợi ích.']],
ev:['Ưu điểm: biện minh cho trợ cấp, cung cấp công và các chiến dịch thông tin.','Hạn chế: khó đo quy mô lợi ích ngoại tác.','Hạn chế: trợ cấp tốn tiền người đóng thuế và có thể bị nhà sản xuất chiếm lấy.'],
ex:'Giáo dục mang lại lợi ích rộng hơn (năng suất, ít tội phạm) vượt ra ngoài học sinh. Không có hỗ trợ, các gia đình đầu tư thiếu, nên chính phủ trợ cấp trường học.',
q:['Giải thích, dùng sơ đồ, vì sao ngoại tác tích cực trong tiêu dùng dẫn đến tiêu dùng thiếu. [4 điểm]','Người tiêu dùng cân bằng MPB với MPC và bỏ qua lợi ích ngoại tác nên sản lượng thị trường là Q1. Mức tối ưu xã hội là nơi MSB = MC tại Q2 > Q1. Khoảng chênh là tổn thất phúc lợi do tiêu dùng thiếu.']});

E('goods',['posext','negext','asym','equity'],
{t:[['Public good','Non-excludable and non-rivalrous; markets under-provide it because of the free rider problem.'],['Private good','Excludable and rivalrous, such as a burger.'],['Common pool resource','Rivalrous but non-excludable (fish stocks); prone to overuse.'],['Merit and demerit goods','Merit goods are under-consumed (education); demerit goods are over-consumed (tobacco). They are value judgements.']],
ev:['Strength: the classification explains why governments provide some goods directly.','Limitation: many goods are in between, and categories change with technology (toll roads).','Limitation: merit and demerit labels are normative and depend on whose values are used.'],
ex:'Street lighting is a public good: once provided you cannot stop anyone using it, and one person using it does not reduce use by others, so firms will not supply it.',
q:['Explain why public goods are not provided by the free market. [4 marks]','Public goods are non-excludable, so people can enjoy them without paying (the free rider problem). Firms cannot make a profit so they do not produce them. As a result there is a missing market, and the government provides them from tax revenue.']},
{t:[['Hàng hóa công cộng','Không loại trừ và không cạnh tranh; thị trường cung ứng thiếu do vấn đề người ăn theo.'],['Hàng hóa tư nhân','Có thể loại trừ và có tính cạnh tranh, như một chiếc bánh mì kẹp.'],['Tài nguyên chung','Có tính cạnh tranh nhưng không loại trừ (nguồn cá); dễ bị khai thác quá mức.'],['Hàng khuyến dụng và phi khuyến dụng','Hàng khuyến dụng bị tiêu dùng thiếu (giáo dục); hàng phi khuyến dụng bị tiêu dùng quá mức (thuốc lá). Đây là các phán đoán giá trị.']],
ev:['Ưu điểm: cách phân loại giải thích vì sao chính phủ cung cấp trực tiếp một số hàng hóa.','Hạn chế: nhiều hàng hóa nằm giữa các loại, và phân loại thay đổi theo công nghệ (đường thu phí).','Hạn chế: nhãn khuyến dụng và phi khuyến dụng mang tính chuẩn tắc, phụ thuộc vào hệ giá trị được dùng.'],
ex:'Đèn đường là hàng hóa công cộng: một khi đã có, không thể ngăn ai sử dụng, và một người dùng không làm giảm phần của người khác, nên doanh nghiệp sẽ không cung cấp.',
q:['Giải thích vì sao hàng hóa công cộng không được thị trường tự do cung cấp. [4 điểm]','Hàng hóa công cộng không loại trừ được nên mọi người có thể hưởng mà không trả tiền (vấn đề người ăn theo). Doanh nghiệp không thu được lợi nhuận nên không sản xuất. Do đó thiếu thị trường và chính phủ cung cấp từ nguồn thu thuế.']});

E('asym',['goods','equity','pricemech'],
{t:[['Asymmetric information','One party in a transaction knows more than the other.'],['Adverse selection','Before a deal, hidden information leads to bad outcomes (high-risk people buy insurance).'],['Moral hazard','After a deal, behaviour changes because risk is covered by someone else.'],['Information gap remedies','Regulation, mandatory disclosure, education, signalling and warranties.']],
ev:['Strength: explains why markets for insurance, used cars and health care often fail.','Limitation: policies such as disclosure can be costly and may not reach all consumers.','Limitation: some asymmetries are partly solved by markets, for example reviews and warranties.'],
ex:'A used car seller knows the car\'s faults but the buyer does not, so buyers offer low prices, and good cars leave the market.',
q:['Explain how asymmetric information can lead to market failure. [4 marks]','If sellers know more than buyers, consumers cannot judge quality, so prices are driven down or good products leave the market. Resources are misallocated: the good is over- or under-consumed relative to the social optimum.']},
{t:[['Thông tin bất đối xứng','Một bên trong giao dịch biết nhiều hơn bên kia.'],['Lựa chọn bất lợi','Trước giao dịch, thông tin ẩn dẫn đến kết quả xấu (người rủi ro cao mua bảo hiểm).'],['Rủi ro đạo đức','Sau giao dịch, hành vi thay đổi vì rủi ro đã được bên khác gánh.'],['Biện pháp khắc phục','Quy định, bắt buộc công bố, giáo dục, tín hiệu và bảo hành.']],
ev:['Ưu điểm: giải thích vì sao thị trường bảo hiểm, xe cũ và chăm sóc sức khỏe thường thất bại.','Hạn chế: các chính sách như công bố thông tin có thể tốn kém và không đến được mọi người tiêu dùng.','Hạn chế: một số bất đối xứng được thị trường giải quyết một phần, ví dụ đánh giá và bảo hành.'],
ex:'Người bán xe cũ biết lỗi của xe còn người mua thì không, nên người mua trả giá thấp và những xe tốt rời khỏi thị trường.',
q:['Giải thích thông tin bất đối xứng có thể dẫn đến thất bại thị trường như thế nào. [4 điểm]','Nếu người bán biết nhiều hơn người mua, người tiêu dùng không đánh giá được chất lượng nên giá bị kéo xuống hoặc hàng tốt rời thị trường. Nguồn lực bị phân bổ sai: hàng hóa bị tiêu dùng quá mức hoặc thiếu so với tối ưu xã hội.']});

E('equity',['lorenz','goods','tax'],
{t:[['Equity','Fairness in the distribution of income, wealth or opportunity; a normative idea.'],['Equality','Everyone has the same outcome; not the same as equity.'],['Progressive tax','Tax rate rises with income (income tax).'],['Regressive tax','Tax takes a larger share of income from the poor (many indirect taxes).']],
ev:['Strength: redistribution through taxes and benefits can reduce poverty.','Limitation: high marginal tax rates may reduce incentives to work or invest (the equity-efficiency trade-off).','Limitation: what counts as fair is a value judgement.'],
ex:'Progressive income tax in Vietnam funds social spending; a flat sales tax takes a larger share of income from poorer households.',
q:['Discuss the view that markets cannot achieve equity. [6 marks]','Markets reward ownership and productivity, so income and wealth can be very unequal; essential goods may be unaffordable to the poor. Government can respond with progressive taxes, benefits and public services. However, redistribution can weaken incentives and is costly; equity is also a value judgement.']},
{t:[['Công bằng','Sự công bằng trong phân phối thu nhập, của cải hoặc cơ hội; là khái niệm chuẩn tắc.'],['Bình đẳng','Mọi người có cùng kết quả; không đồng nghĩa với công bằng.'],['Thuế lũy tiến','Thuế suất tăng theo thu nhập (thuế thu nhập).'],['Thuế lũy thoái','Thuế lấy phần lớn hơn thu nhập của người nghèo (nhiều loại thuế gián thu).']],
ev:['Ưu điểm: tái phân phối qua thuế và trợ cấp có thể giảm nghèo.','Hạn chế: thuế suất cận biên cao có thể giảm động lực làm việc hoặc đầu tư (đánh đổi giữa công bằng và hiệu quả).','Hạn chế: thế nào là công bằng là một phán đoán giá trị.'],
ex:'Thuế thu nhập lũy tiến ở Việt Nam tài trợ chi tiêu xã hội; thuế bán hàng đồng đều lấy phần lớn hơn thu nhập của hộ nghèo.',
q:['Thảo luận quan điểm cho rằng thị trường không thể đạt được công bằng. [6 điểm]','Thị trường thưởng cho quyền sở hữu và năng suất nên thu nhập và của cải có thể rất bất bình đẳng; hàng thiết yếu có thể quá đắt với người nghèo. Chính phủ có thể đáp lại bằng thuế lũy tiến, trợ cấp và dịch vụ công. Tuy nhiên tái phân phối có thể làm yếu động lực và tốn kém; công bằng cũng là phán đoán giá trị.']});

E('costs',['lrac','prod','revenue','perfcomp'],
{t:[['Fixed and variable costs','Fixed costs do not change with output (rent); variable costs do (materials).'],['Marginal cost (MC)','The extra cost of producing one more unit; it cuts AVC and ATC at their minimum points.'],['Average total cost (ATC)','Total cost ÷ output; U-shaped because of diminishing marginal returns.'],['Short run','A period in which at least one factor of production is fixed.']],
ev:['Strength: shows the output level where unit cost is lowest.','Limitation: assumes constant input prices and technology.','Limitation: real firms rarely know their exact cost curves.'],
ex:'A bakery with one oven has a fixed cost (oven) and variable costs (flour, staff). After a point, extra workers crowd the kitchen, so MC rises.',
q:['Explain why the MC curve cuts the ATC curve at its minimum point. [3 marks]','If MC is below ATC, producing one more unit lowers the average. If MC is above ATC, it raises the average. So ATC falls then rises, with MC equal to ATC at the lowest point.']},
{t:[['Chi phí cố định và biến đổi','Chi phí cố định không đổi theo sản lượng (tiền thuê); chi phí biến đổi thay đổi (nguyên liệu).'],['Chi phí cận biên (MC)','Chi phí tăng thêm để sản xuất thêm một đơn vị; cắt AVC và ATC tại điểm thấp nhất của chúng.'],['Chi phí trung bình (ATC)','Tổng chi phí ÷ sản lượng; hình chữ U do năng suất cận biên giảm dần.'],['Ngắn hạn','Khoảng thời gian có ít nhất một yếu tố sản xuất cố định.']],
ev:['Ưu điểm: cho biết mức sản lượng có chi phí đơn vị thấp nhất.','Hạn chế: giả định giá đầu vào và công nghệ không đổi.','Hạn chế: doanh nghiệp thực tế hiếm khi biết chính xác đường chi phí của mình.'],
ex:'Một tiệm bánh có một lò nướng có chi phí cố định (lò) và chi phí biến đổi (bột, nhân công). Sau một điểm, thêm thợ làm bếp chật chội nên MC tăng.',
q:['Giải thích vì sao đường MC cắt đường ATC tại điểm thấp nhất của ATC. [3 điểm]','Nếu MC thấp hơn ATC, sản xuất thêm một đơn vị làm giảm trung bình. Nếu MC cao hơn ATC, nó làm tăng trung bình. Vì vậy ATC giảm rồi tăng, với MC bằng ATC tại điểm thấp nhất.']});

E('lrac',['costs','prod','monopoly'],
{t:[['Long run','A period in which all factors of production are variable.'],['Economies of scale','Falling long-run average cost as output rises (specialisation, bulk buying, finance, marketing).'],['Diseconomies of scale','Rising long-run average cost at large output (poor communication, coordination).'],['Minimum efficient scale','The lowest output at which long-run average cost is at its minimum.']],
ev:['Strength: explains why some industries are natural monopolies and why big firms can undercut small ones.','Limitation: managers may fail to realise potential economies of scale.','Limitation: external economies depend on the industry, not on the firm.'],
ex:'An airline spreads fixed costs (planes, booking systems) over many passengers, lowering the cost per ticket; but a huge airline may find coordination harder.',
q:['Explain two reasons why a firm may experience economies of scale. [4 marks]','(1) Bulk-buying lets large firms get lower input prices. (2) Specialisation of labour raises productivity, lowering unit cost. Both make long-run average cost fall as output rises.']},
{t:[['Dài hạn','Khoảng thời gian trong đó mọi yếu tố sản xuất đều biến đổi.'],['Tính kinh tế theo quy mô','Chi phí trung bình dài hạn giảm khi sản lượng tăng (chuyên môn hóa, mua số lượng lớn, tài chính, tiếp thị).'],['Tính phi kinh tế theo quy mô','Chi phí trung bình dài hạn tăng ở sản lượng lớn (giao tiếp kém, khó phối hợp).'],['Quy mô hiệu quả tối thiểu','Sản lượng thấp nhất tại đó chi phí trung bình dài hạn ở mức nhỏ nhất.']],
ev:['Ưu điểm: giải thích vì sao một số ngành là độc quyền tự nhiên và doanh nghiệp lớn có thể bán rẻ hơn doanh nghiệp nhỏ.','Hạn chế: nhà quản lý có thể không tận dụng được tính kinh tế theo quy mô tiềm năng.','Hạn chế: tính kinh tế ngoại sinh phụ thuộc vào ngành, không phải vào doanh nghiệp.'],
ex:'Một hãng hàng không chia chi phí cố định (máy bay, hệ thống đặt vé) cho nhiều hành khách, giảm chi phí mỗi vé; nhưng một hãng quá lớn có thể khó phối hợp hơn.',
q:['Giải thích hai lý do một doanh nghiệp có thể đạt tính kinh tế theo quy mô. [4 điểm]','(1) Mua số lượng lớn giúp doanh nghiệp lớn có giá đầu vào thấp hơn. (2) Chuyên môn hóa lao động làm tăng năng suất, giảm chi phí đơn vị. Cả hai làm chi phí trung bình dài hạn giảm khi sản lượng tăng.']});

E('prod',['costs','lrac','revenue'],
{t:[['Total product (TP)','Total output produced with a given amount of the variable input.'],['Average product (AP)','TP ÷ number of workers.'],['Marginal product (MP)','The extra output from one more worker.'],['Diminishing marginal returns','After some point each additional worker adds less than the previous one, because fixed factors are shared among more workers.']],
ev:['Strength: explains the shape of short-run cost curves.','Limitation: assumes workers are identical and that technology does not change.','Limitation: only applies in the short run when at least one factor is fixed.'],
ex:'A café with one coffee machine: the first few staff greatly increase output, but a fifth barista just gets in the way, so marginal product falls.',
q:['Explain the law of diminishing marginal returns. [3 marks]','In the short run, with at least one fixed factor, adding more of a variable factor eventually gives smaller and smaller additions to output. Marginal product begins to fall, which is why MC eventually rises.']},
{t:[['Tổng sản phẩm (TP)','Tổng sản lượng làm ra với một lượng đầu vào biến đổi nhất định.'],['Sản phẩm trung bình (AP)','TP ÷ số lao động.'],['Sản phẩm cận biên (MP)','Sản lượng tăng thêm khi thêm một lao động.'],['Năng suất cận biên giảm dần','Sau một điểm, mỗi lao động bổ sung tạo ra ít hơn lao động trước, vì các yếu tố cố định phải chia cho nhiều lao động hơn.']],
